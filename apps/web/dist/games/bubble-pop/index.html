<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bolhas Mágicas</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #0f172a;
      overflow: hidden;
      font-family: sans-serif;
      touch-action: none; /* Impede zoom e scroll no mobile */
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #score-display {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 2rem;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      pointer-events: none;
    }
    /* Estrelas de fundo */
    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      pointer-events: none;
      animation: twinkle linear infinite;
    }
    @keyframes twinkle {
      0% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 0.8; transform: scale(1.2); }
      100% { opacity: 0.2; transform: scale(0.8); }
    }
  </style>
</head>
<body>

  <div id="score-display">🌟 0</div>
  <canvas id="gameCanvas"></canvas>

  <script>
    // Configuração Inicial e Cenário (Fundo lúdico e seguro para bebês)
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let score = 0;
    const scoreDisplay = document.getElementById('score-display');

    function resize() {
      // Usa as dimensões de client para evitar bugs de device pixel ratio no iframe
      canvas.width = document.body.clientWidth;
      canvas.height = document.body.clientHeight;
    }
    window.addEventListener('resize', resize);
    
    // Força múltiplos resizes iniciais para compensar os milissegundos que o React
    // leva para expandir a div 'fixed inset-0' com a iframe nativa
    resize();
    setTimeout(resize, 50);
    setTimeout(resize, 200);
    setTimeout(resize, 500);

    // Criar estrelinhas estáticas no fundo HTML para estimulação visual suave
    for (let i = 0; i < 30; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.width = Math.random() * 4 + 2 + 'px';
      star.style.height = star.style.width;
      star.style.left = Math.random() * 100 + 'vw';
      star.style.top = Math.random() * 100 + 'vh';
      star.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
      document.body.appendChild(star);
    }

    // Cores lúdicas pastel/brilhantes de alto conforto
    const colors = ['#f472b6', '#38bdf8', '#a78bfa', '#fbbf24', '#4ade80', '#ff8a65'];

    // Entidades do Jogo
    let bubbles = [];
    let particles = [];

    class Bubble {
      constructor() {
        this.radius = Math.random() * 30 + 40; // Bolhas grandes e fáceis de tocar (40 a 70px)
        this.x = Math.random() * (canvas.width - this.radius * 2) + this.radius;
        this.y = canvas.height + this.radius;
        this.color = colors[Math.floor(Math.random() * colors.length)];
        this.speed = Math.random() * 1.5 + 1; // Muito devagar para dar tempo de reação motora
        this.wobble = Math.random() * Math.PI * 2;
        this.wobbleSpeed = Math.random() * 0.05 + 0.02;
        this.popped = false;
      }

      update() {
        this.y -= this.speed;
        this.x += Math.sin(this.wobble) * 1.5; // Movimento suave lateral
        this.wobble += this.wobbleSpeed;
      }

      draw(ctx) {
        // Corpo da bolha
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color + '80'; // 50% transparente
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = this.color;
        ctx.stroke();

        // Reflexo de luz lúdico (Brilho da bolha)
        ctx.beginPath();
        ctx.arc(this.x - this.radius * 0.3, this.y - this.radius * 0.3, this.radius * 0.2, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffffaa';
        ctx.fill();
      }
    }

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.radius = Math.random() * 6 + 3;
        this.vx = (Math.random() - 0.5) * 8;
        this.vy = (Math.random() - 0.5) * 8;
        this.life = 1.0;
        this.decay = Math.random() * 0.03 + 0.02;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= this.decay;
      }
      draw(ctx) {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${this.life})`; // Fica branco ao sumir
        ctx.fill();
      }
    }

    // Spawn automático de bolhas baseado no tempo
    setInterval(() => {
      if (bubbles.length < 12) { // Limite máximo na tela para não gerar poluição
        bubbles.push(new Bubble());
      }
    }, 800);

    // Sistema de Interação (Toque e Clique unificados)
    function popBubble(clientX, clientY) {
      for (let i = bubbles.length - 1; i >= 0; i--) {
        const b = bubbles[i];
        const dist = Math.hypot(b.x - clientX, b.y - clientY);
        // Hitbox generosa (+20px) para dedos imprecisos de bebês
        if (dist < b.radius + 20) {
          // Estourou!
          bubbles.splice(i, 1);
          score += 1;
          scoreDisplay.innerText = '🌟 ' + score;
          
          // Gerar partículas de explosão (feedback visual de causa e efeito)
          for (let p = 0; p < 8; p++) {
            particles.push(new Particle(b.x, b.y, b.color));
          }
          
          // Efeito sonoro sintetizado suave e agradável (não assustador)
          playPopSound();
          break; // Só estoura uma por toque
        }
      }
    }

    // Gerador de áudio Web Audio API (Sino/Gota D'água)
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function playPopSound() {
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'sine'; // Som puro e suave
      osc.frequency.setValueAtTime(400 + Math.random() * 400, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
      
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    }

    window.addEventListener('mousedown', (e) => popBubble(e.clientX, e.clientY));
    window.addEventListener('touchstart', (e) => {
      e.preventDefault(); // Impede scrolls e comportamentos nativos
      for(let i=0; i<e.touches.length; i++) {
        popBubble(e.touches[i].clientX, e.touches[i].clientY);
      }
    }, { passive: false });

    // Loop Principal (60fps)
    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Atualizar e desenhar bolhas
      for (let i = bubbles.length - 1; i >= 0; i--) {
        const b = bubbles[i];
        b.update();
        b.draw(ctx);
        // Remover bolhas que saíram totalmente da tela (cima)
        if (b.y + b.radius < 0) {
          bubbles.splice(i, 1);
        }
      }

      // Atualizar e desenhar partículas (feedback de acerto)
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        if (p.life <= 0) {
          particles.splice(i, 1);
        } else {
          p.draw(ctx);
        }
      }

      requestAnimationFrame(gameLoop);
    }
    
    // Disparar evento para o portal pai saber que carregou
    window.parent.postMessage({ type: 'game_loaded', gameSlug: 'bubble-pop' }, '*');
    gameLoop();
  </script>
</body>
</html>
