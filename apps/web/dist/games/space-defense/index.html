<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyber Space Defense</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #0b0c10;
      color: #66fcf1;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    h1 {
      font-size: 1.5rem;
      text-shadow: 0 0 10px #66fcf1;
      margin-bottom: 5px;
    }
    #game-container {
      position: relative;
      background: rgba(31, 40, 51, 0.4);
      border: 4px solid #1f2833;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(102, 252, 241, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
    }
    canvas {
      background-color: #0c0d14;
      border: 2px solid #66fcf1;
      border-radius: 6px;
      display: block;
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.9);
    }
    #hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      padding: 5px 0 10px;
      font-weight: bold;
    }
    .neon-text {
      color: #66fcf1;
      text-shadow: 0 0 5px #66fcf1;
    }
    .neon-text-red {
      color: #ff007f;
      text-shadow: 0 0 5px #ff007f;
    }
    #controls {
      display: flex;
      justify-content: space-around;
      width: 100%;
      margin-top: 15px;
    }
    .btn {
      width: 60px;
      height: 50px;
      background: rgba(31, 40, 51, 0.8);
      border: 2px solid #66fcf1;
      border-radius: 8px;
      color: #66fcf1;
      font-size: 1.2rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 8px rgba(102, 252, 241, 0.1);
    }
    .btn:active {
      background: #66fcf1;
      color: #0b0c10;
      box-shadow: 0 0 15px #66fcf1;
    }
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(11, 12, 16, 0.95);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    #start-btn {
      margin-top: 15px;
      padding: 10px 25px;
      font-family: inherit;
      background: transparent;
      border: 3px solid #66fcf1;
      border-radius: 30px;
      color: #66fcf1;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 10px rgba(102, 252, 241, 0.2);
    }
    #start-btn:hover {
      background: #66fcf1;
      color: #0b0c10;
      box-shadow: 0 0 20px #66fcf1;
    }
    @media (min-width: 768px) {
      #controls {
        display: none;
      }
    }
  </style>
</head>
<body>

  <h1>CYBER SPACE DEFENSE</h1>

  <div id="game-container">
    <div id="hud">
      <div>SCORE: <span id="score" class="neon-text">0</span></div>
      <div>HP: <span id="lives" class="neon-text-red">❤❤❤</span></div>
    </div>
    
    <canvas id="canvas" width="320" height="320"></canvas>
    
    <div id="controls">
      <div class="btn" id="left">◀</div>
      <div class="btn" id="shoot">FIRE</div>
      <div class="btn" id="right">▶</div>
    </div>

    <div id="overlay">
      <h2 id="overlay-title" class="neon-text">SPACE DEFENSE</h2>
      <p id="overlay-desc" style="font-size: 0.8rem; text-align: center; padding: 10px 20px; color: #c5a1ff;">
        Mova seu caça estelar de esquerda a direita (setas do teclado ou toque) e destrua os asteroides cibernéticos antes que eles passem por você!
      </p>
      <button id="start-btn">JOGAR</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const startBtn = document.getElementById('start-btn');

    function sendEvent(type, data = {}) {
      window.parent.postMessage({ type, gameSlug: 'space-defense', ...data }, '*');
    }

    sendEvent('game_loaded');

    let player = { x: 140, y: 280, width: 30, height: 20, speed: 8 };
    let bullets = [];
    let enemies = [];
    let score = 0;
    let lives = 3;
    let isPlaying = false;
    let gameInterval = null;
    let spawnTimer = 0;

    let keys = {};

    function resetGame() {
      player.x = 140;
      bullets = [];
      enemies = [];
      score = 0;
      lives = 3;
      scoreEl.innerText = score;
      updateLivesHUD();
      spawnTimer = 0;
    }

    function updateLivesHUD() {
      livesEl.innerText = '❤'.repeat(lives);
    }

    function startGame() {
      resetGame();
      isPlaying = true;
      overlay.style.display = 'none';
      sendEvent('game_start');
      gameInterval = setInterval(gameLoop, 1000 / 60); // 60 FPS
    }

    function gameOver() {
      isPlaying = false;
      clearInterval(gameInterval);
      overlay.style.display = 'flex';
      overlayTitle.innerText = 'FIM DE MISSÃO';
      overlayTitle.className = 'neon-text-red';
      document.getElementById('overlay-desc').innerText = `Seu escudo caiu e você foi desintegrado. Pontuação de Defesa: ${score} pontos!`;
      startBtn.innerText = 'REJOGAR';
      sendEvent('game_completed', { score });
    }

    function gameLoop() {
      update();
      draw();
    }

    function update() {
      // Movimento do Jogador
      if (keys['ArrowLeft'] && player.x > 0) player.x -= player.speed;
      if (keys['ArrowRight'] && player.x < canvas.width - player.width) player.x += player.speed;

      // Movimento Balas
      bullets.forEach((bullet, bIndex) => {
        bullet.y -= bullet.speed;
        // Remover fora da tela
        if (bullet.y < 0) bullets.splice(bIndex, 1);
      });

      // Spawn de Inimigos
      spawnTimer++;
      if (spawnTimer > 40) { // mais rápido ao longo do tempo
        spawnEnemy();
        spawnTimer = 0;
      }

      // Movimento Inimigos
      enemies.forEach((enemy, eIndex) => {
        enemy.y += enemy.speed;

        // Passou pelo jogador? Escudo danificado
        if (enemy.y > canvas.height) {
          enemies.splice(eIndex, 1);
          lives--;
          updateLivesHUD();
          if (lives <= 0) gameOver();
        }

        // Colisão Bala com Inimigo
        bullets.forEach((bullet, bIndex) => {
          if (bullet.x < enemy.x + enemy.width &&
              bullet.x + bullet.width > enemy.x &&
              bullet.y < enemy.y + enemy.height &&
              bullet.y + bullet.height > enemy.y) {
            
            // Explosão / Acerto
            enemies.splice(eIndex, 1);
            bullets.splice(bIndex, 1);
            score += 25;
            scoreEl.innerText = score;
          }
        });
      });
    }

    function spawnEnemy() {
      const width = 20 + Math.random() * 20;
      const x = Math.random() * (canvas.width - width);
      enemies.push({
        x,
        y: -30,
        width,
        height: width, // quadrado / circular
        speed: 1.5 + Math.random() * 2.5 + score / 400 // mais rápido com maior score
      });
    }

    function shoot() {
      if (!isPlaying) return;
      bullets.push({
        x: player.x + player.width / 2 - 2,
        y: player.y,
        width: 4,
        height: 10,
        speed: 7
      });
    }

    function draw() {
      ctx.fillStyle = '#0c0d14';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Desenhar jogador (Nave Ciano)
      ctx.fillStyle = '#66fcf1';
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#66fcf1';
      ctx.beginPath();
      ctx.moveTo(player.x + player.width / 2, player.y);
      ctx.lineTo(player.x, player.y + player.height);
      ctx.lineTo(player.x + player.width, player.y + player.height);
      ctx.closePath();
      ctx.fill();

      // Desenhar balas (Linhas Brancas)
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#ffffff';
      bullets.forEach(b => {
        ctx.fillRect(b.x, b.y, b.width, b.height);
      });

      // Desenhar Inimigos (Meteoro Rosa/Magenta)
      ctx.fillStyle = '#ff007f';
      ctx.shadowColor = '#ff007f';
      enemies.forEach(e => {
        ctx.fillRect(e.x, e.y, e.width, e.height);
      });

      ctx.shadowBlur = 0; // reset
    }

    // Teclado
    document.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (e.key === ' ' || e.key === 'Spacebar') {
        shoot();
      }
    });
    document.addEventListener('keyup', e => {
      keys[e.key] = false;
    });

    // Touch / Toque
    document.getElementById('left').addEventListener('touchstart', () => { keys['ArrowLeft'] = true; });
    document.getElementById('left').addEventListener('touchend', () => { keys['ArrowLeft'] = false; });
    document.getElementById('right').addEventListener('touchstart', () => { keys['ArrowRight'] = true; });
    document.getElementById('right').addEventListener('touchend', () => { keys['ArrowRight'] = false; });
    document.getElementById('shoot').addEventListener('click', shoot);

    startBtn.addEventListener('click', startGame);
  </script>
</body>
</html>
