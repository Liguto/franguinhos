<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Snake Retro Arcade</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #0b0c10;
      color: #66fcf1;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    h1 {
      font-size: 1.5rem;
      text-shadow: 0 0 10px #66fcf1;
      margin-bottom: 5px;
    }
    #game-container {
      position: relative;
      background: rgba(31, 40, 51, 0.4);
      border: 4px solid #1f2833;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(102, 252, 241, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
    }
    canvas {
      background-color: #12131c;
      border: 2px solid #66fcf1;
      border-radius: 6px;
      display: block;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
    }
    #hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      padding: 5px 0 10px;
      font-weight: bold;
    }
    .neon-text {
      color: #66fcf1;
      text-shadow: 0 0 5px #66fcf1;
    }
    .neon-text-red {
      color: #ff007f;
      text-shadow: 0 0 5px #ff007f;
    }
    #controls {
      display: grid;
      grid-template-columns: repeat(3, 50px);
      grid-gap: 5px;
      margin-top: 15px;
    }
    .btn {
      width: 50px;
      height: 50px;
      background: rgba(31, 40, 51, 0.8);
      border: 2px solid #66fcf1;
      border-radius: 8px;
      color: #66fcf1;
      font-size: 1.2rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 8px rgba(102, 252, 241, 0.1);
    }
    .btn:active {
      background: #66fcf1;
      color: #0b0c10;
      box-shadow: 0 0 15px #66fcf1;
    }
    #up { grid-column: 2; }
    #left { grid-column: 1; grid-row: 2; }
    #right { grid-column: 3; grid-row: 2; }
    #down { grid-column: 2; grid-row: 3; }
    
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(11, 12, 16, 0.9);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    #start-btn {
      margin-top: 15px;
      padding: 10px 25px;
      font-family: inherit;
      background: transparent;
      border: 3px solid #66fcf1;
      border-radius: 30px;
      color: #66fcf1;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 10px rgba(102, 252, 241, 0.2);
    }
    #start-btn:hover {
      background: #66fcf1;
      color: #0b0c10;
      box-shadow: 0 0 20px #66fcf1;
    }
    /* Responsividade */
    @media (min-width: 768px) {
      #controls {
        display: none; /* Esconder controles na tela grande */
      }
    }
  </style>
</head>
<body>

  <h1>SNAKE RETRO ARCADE</h1>

  <div id="game-container">
    <div id="hud">
      <div>SCORE: <span id="score" class="neon-text">0</span></div>
      <div>HI-SCORE: <span id="high-score" class="neon-text">0</span></div>
    </div>
    
    <canvas id="canvas" width="300" height="300"></canvas>
    
    <div id="controls">
      <div class="btn" id="up">▲</div>
      <div class="btn" id="left">◀</div>
      <div class="btn" id="right">▶</div>
      <div class="btn" id="down">▼</div>
    </div>

    <div id="overlay">
      <h2 id="overlay-title" class="neon-text">SNAKE RETRO</h2>
      <p id="overlay-desc" style="font-size: 0.8rem; text-align: center; padding: 10px 20px; color: #c5a1ff;">
        Use as setas do teclado ou os botões de toque na tela para se mover e engolir as esferas de neon sem colidir!
      </p>
      <button id="start-btn">JOGAR</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('high-score');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const startBtn = document.getElementById('start-btn');

    // Avisar o portal mãe que o jogo foi carregado com sucesso
    function sendEvent(type, data = {}) {
      window.parent.postMessage({ type, gameSlug: 'snake-retro', ...data }, '*');
    }

    sendEvent('game_loaded');

    const gridSize = 15;
    const tileCount = canvas.width / gridSize;

    let snake = [];
    let food = {};
    let dx = gridSize;
    let dy = 0;
    let score = 0;
    let highScore = localStorage.getItem('snake_highscore') || 0;
    highScoreEl.innerText = highScore;
    let gameInterval = null;
    let isPlaying = false;

    function resetGame() {
      snake = [
        { x: gridSize * 5, y: gridSize * 10 },
        { x: gridSize * 4, y: gridSize * 10 },
        { x: gridSize * 3, y: gridSize * 10 }
      ];
      dx = gridSize;
      dy = 0;
      score = 0;
      scoreEl.innerText = score;
      generateFood();
    }

    function generateFood() {
      food = {
        x: Math.floor(Math.random() * tileCount) * gridSize,
        y: Math.floor(Math.random() * tileCount) * gridSize
      };
      // Impedir que surja em cima da cobra
      for (let part of snake) {
        if (part.x === food.x && part.y === food.y) {
          generateFood();
          break;
        }
      }
    }

    function startGame() {
      resetGame();
      isPlaying = true;
      overlay.style.display = 'none';
      sendEvent('game_start');
      gameInterval = setInterval(update, 120);
    }

    function gameOver() {
      isPlaying = false;
      clearInterval(gameInterval);
      overlay.style.display = 'flex';
      overlayTitle.innerText = 'FIM DE JOGO';
      overlayTitle.className = 'neon-text-red';
      
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('snake_highscore', highScore);
        highScoreEl.innerText = highScore;
      }
      sendEvent('game_completed', { score, highScore });
    }

    function update() {
      // Avançar cobra
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };
      
      // Colisão com as paredes ou com a própria cauda
      if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
        return gameOver();
      }
      for (let i = 0; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          return gameOver();
        }
      }

      snake.unshift(head);

      // Comeu a comida?
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.innerText = score;
        generateFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      // Limpar Canvas
      ctx.fillStyle = '#12131c';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Desenhar comida (Neon Magenta)
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#ff007f';
      ctx.fillStyle = '#ff007f';
      ctx.beginPath();
      ctx.arc(food.x + gridSize/2, food.y + gridSize/2, gridSize/2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // Desenhar cobra (Neon Ciano)
      ctx.shadowColor = '#66fcf1';
      ctx.fillStyle = '#66fcf1';
      for (let i = 0; i < snake.length; i++) {
        // Cabeça é levemente diferente ou mais brilhante
        if (i === 0) {
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(snake[i].x + 1, snake[i].y + 1, gridSize - 2, gridSize - 2);
          ctx.fillStyle = '#66fcf1';
        } else {
          ctx.fillRect(snake[i].x + 1, snake[i].y + 1, gridSize - 2, gridSize - 2);
        }
      }
      ctx.shadowBlur = 0; // reset
    }

    // Controles por Teclado
    document.addEventListener('keydown', (e) => {
      if (!isPlaying) return;
      if (e.key === 'ArrowUp' && dy === 0) { dx = 0; dy = -gridSize; }
      else if (e.key === 'ArrowDown' && dy === 0) { dx = 0; dy = gridSize; }
      else if (e.key === 'ArrowLeft' && dx === 0) { dx = -gridSize; dy = 0; }
      else if (e.key === 'ArrowRight' && dx === 0) { dx = gridSize; dy = 0; }
    });

    // Controles por Toque
    document.getElementById('up').addEventListener('click', () => { if (isPlaying && dy === 0) { dx = 0; dy = -gridSize; } });
    document.getElementById('down').addEventListener('click', () => { if (isPlaying && dy === 0) { dx = 0; dy = gridSize; } });
    document.getElementById('left').addEventListener('click', () => { if (isPlaying && dx === 0) { dx = -gridSize; dy = 0; } });
    document.getElementById('right').addEventListener('click', () => { if (isPlaying && dx === 0) { dx = gridSize; dy = 0; } });

    startBtn.addEventListener('click', startGame);
  </script>
</body>
</html>
