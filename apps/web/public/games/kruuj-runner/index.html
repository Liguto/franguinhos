<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>KRUUJ RUNNER: Fuga Cyberpunk</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070914;
      --cyan: #38e8ff;
      --purple: #8b5cff;
      --gold: #ffb020;
      --pink: #ff5ca8;
      --green: #10b981;
      --red: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Baloo 2', sans-serif;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* HUD Superior de Pontuação (Com recuo de 68px no mobile para não sobrepor o botão Poki) */
    .hud {
      position: fixed;
      top: 14px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
      gap: 8px;
    }

    .hud-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hud-badge {
      background: rgba(13, 18, 36, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 9999px;
      padding: 6px 16px;
      font-size: 0.95rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      white-space: nowrap;
    }

    .hud-badge span {
      color: var(--cyan);
    }

    .coin-badge span {
      color: var(--gold);
    }

    /* Barra de Power-up Ativo no HUD (Estilo Subway Surfers) */
    .powerup-tracker {
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(13, 18, 36, 0.9);
      border: 1.5px solid var(--cyan);
      box-shadow: 0 0 20px rgba(56, 232, 255, 0.4);
      border-radius: 9999px;
      padding: 4px 14px 4px 10px;
      display: none;
      align-items: center;
      gap: 8px;
      z-index: 12;
      pointer-events: none;
      animation: pulse 1s infinite alternate;
    }

    .powerup-tracker.active {
      display: flex;
    }

    .powerup-icon {
      font-size: 1.25rem;
      line-height: 1;
    }

    .powerup-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .powerup-name {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #fff;
    }

    .powerup-bar-track {
      width: 80px;
      height: 5px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
      overflow: hidden;
    }

    .powerup-bar-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, var(--cyan), var(--gold));
      border-radius: 9999px;
      transition: width 0.1s linear;
    }

    @keyframes pulse {
      0% { transform: translateX(-50%) scale(1); }
      100% { transform: translateX(-50%) scale(1.04); }
    }

    @media (max-width: 768px) {
      .hud {
        top: 10px;
        left: 68px !important;
        right: 10px !important;
      }

      .hud-badge {
        padding: 4px 10px !important;
        font-size: 0.8rem !important;
      }

      .powerup-tracker {
        top: 50px;
      }
    }

    /* Controles Touch Mobile na Tela */
    .mobile-controls {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: none;
      gap: 12px;
      z-index: 15;
    }

    .btn-touch {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: rgba(13, 18, 36, 0.85);
      border: 2px solid var(--cyan);
      color: #fff;
      font-size: 0.82rem;
      font-weight: 800;
      font-family: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(56, 232, 255, 0.3);
      cursor: pointer;
    }

    .btn-touch.crouch {
      border-color: var(--gold);
      box-shadow: 0 0 20px rgba(255, 176, 32, 0.3);
    }

    @media (max-width: 768px) {
      .mobile-controls {
        display: flex;
      }
    }

    /* Overlay de Início e Game Over */
    .game-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(13, 18, 36, 0.94) 0%, rgba(7, 9, 20, 0.98) 100%);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .game-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    h1 {
      font-size: clamp(32px, 8vw, 54px);
      font-weight: 800;
      background: linear-gradient(135deg, var(--cyan), var(--purple), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      filter: drop-shadow(0 0 20px rgba(139, 92, 246, 0.5));
    }

    p {
      font-size: clamp(14px, 4vw, 16px);
      color: var(--text-muted);
      max-width: 440px;
      line-height: 1.45;
      margin-bottom: 20px;
    }

    .stats-table {
      margin-bottom: 22px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 12px 28px;
      display: flex;
      gap: 24px;
      justify-content: space-around;
      max-width: 90vw;
    }

    .stats-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stats-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 0.06em;
    }

    .stats-val {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--cyan);
    }

    .btn-action {
      background: linear-gradient(135deg, #0284c7 0%, #8b5cff 100%);
      color: #fff;
      border: none;
      border-radius: 9999px;
      padding: 14px 44px;
      font-size: 1.18rem;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(56, 232, 255, 0.4);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .btn-action:hover {
      transform: scale(1.05);
      box-shadow: 0 0 35px rgba(139, 92, 246, 0.6);
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <!-- HUD Superior com Distância, Moedas e Recorde -->
  <div class="hud">
    <div class="hud-group">
      <div class="hud-badge">DISTÂNCIA: <span id="distVal">0m</span></div>
      <div class="hud-badge coin-badge">🪙 <span id="coinVal">0</span></div>
    </div>
    <div class="hud-badge" style="font-size: 0.92rem;">RECORDE: <span id="bestVal" style="color: var(--gold);">0m</span></div>
  </div>

  <!-- Tracker de Power-Up Ativo (Estilo Subway Surfers) -->
  <div class="powerup-tracker" id="powerupTracker">
    <span class="powerup-icon" id="powerupIcon">⚡</span>
    <div class="powerup-info">
      <span class="powerup-name" id="powerupName">SUPER PULO</span>
      <div class="powerup-bar-track">
        <div class="powerup-bar-fill" id="powerupBar"></div>
      </div>
    </div>
  </div>

  <!-- Botões Touch para Dispositivos Móveis -->
  <div class="mobile-controls">
    <button class="btn-touch crouch" id="touchCrouch">AGACHA</button>
    <button class="btn-touch" id="touchJump">PULAR</button>
  </div>

  <!-- Overlay de Início e Game Over -->
  <div class="game-overlay active" id="gameOverlay">
    <h1 id="ovTitle">KRUUJ RUNNER</h1>
    <p id="ovDesc">Corra pelos telhados da cidade cyberpunk com a Coruja KRUUJ! Colete poderes pelo caminho: <strong>👟 Super Salto</strong>, <strong>🧲 Ímã de Moedas</strong>, <strong>🛡️ Escudo</strong>, <strong>⏱️ Slow-Mo</strong> e <strong>🚀 Jetpack</strong>!</p>
    
    <div class="stats-table" id="ovStats" style="display: none;">
      <div class="stats-item">
        <span class="stats-label">Distância</span>
        <span class="stats-val" id="ovDist">0m</span>
      </div>
      <div class="stats-item">
        <span class="stats-label">Moedas</span>
        <span class="stats-val" id="ovCoins" style="color: var(--gold);">0</span>
      </div>
      <div class="stats-item">
        <span class="stats-label">Maior Corrida</span>
        <span class="stats-val" id="ovBest">0m</span>
      </div>
    </div>

    <button class="btn-action" id="btnPlay" onclick="window.runnerGame.startGame()">CORRER AGORA ⚡</button>
  </div>

  <!-- ================================================================= -->
  <!-- LÓGICA DO JOGO EM PROGRAMAÇÃO ORIENTADA A OBJETOS (POO)          -->
  <!-- ================================================================= -->
  <script>
    // ===== 1. GERENCIADOR DE ÁUDIO SINTÉTICO (WEBAUDIO) =====
    class SoundController {
      constructor() {
        this.ctx = null;
      }

      init() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            this.ctx = new AudioContextClass();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
      }

      playJump(isSuper = false) {
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = isSuper ? 'sawtooth' : 'sine';
          osc.frequency.setValueAtTime(isSuper ? 440 : 320, now);
          osc.frequency.exponentialRampToValueAtTime(isSuper ? 1100 : 750, now + 0.14);

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(isSuper ? 0.18 : 0.12, now + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.15);
        } catch(e) {}
      }

      playSlide() {
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(180, now);
          osc.frequency.exponentialRampToValueAtTime(90, now + 0.15);

          gain.gain.setValueAtTime(0.06, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.15);
        } catch(e) {}
      }

      playCoin() {
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(987.77, now); // Si
          osc.frequency.setValueAtTime(1318.51, now + 0.06); // Mi agudo

          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.14);
        } catch(e) {}
      }

      playPowerup() {
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'square';
          osc.frequency.setValueAtTime(330, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.2);

          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.24);
        } catch(e) {}
      }

      playShieldBreak() {
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(600, now);
          osc.frequency.exponentialRampToValueAtTime(150, now + 0.25);

          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.25);
        } catch(e) {}
      }

      playLaserZap() {
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(380, now);
          osc.frequency.exponentialRampToValueAtTime(40, now + 0.35);

          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.35);
        } catch(e) {}
      }
    }

    // ===== 2. SISTEMA DE CENÁRIO PARALLAX CYBERPUNK =====
    class ParallaxBackground {
      constructor(canvasWidth, canvasHeight) {
        this.width = canvasWidth;
        this.height = canvasHeight;
        this.layerFar = [];
        this.layerMid = [];
        this.initLayers();
      }

      initLayers() {
        this.layerFar = [];
        this.layerMid = [];

        for (let i = 0; i < 16; i++) {
          this.layerFar.push({
            x: i * 140,
            w: 90 + Math.random() * 60,
            h: 180 + Math.random() * 180,
            color: '#0d1124'
          });
        }

        for (let i = 0; i < 18; i++) {
          this.layerMid.push({
            x: i * 110,
            w: 70 + Math.random() * 50,
            h: 120 + Math.random() * 150,
            color: '#131936'
          });
        }
      }

      resize(w, h) {
        this.width = w;
        this.height = h;
      }

      update(baseSpeed) {
        this.layerFar.forEach(b => {
          b.x -= baseSpeed * 0.15;
          if (b.x + b.w < 0) b.x = this.width + Math.random() * 40;
        });

        this.layerMid.forEach(b => {
          b.x -= baseSpeed * 0.35;
          if (b.x + b.w < 0) b.x = this.width + Math.random() * 40;
        });
      }

      render(ctx) {
        this.layerFar.forEach(b => {
          ctx.fillStyle = b.color;
          ctx.fillRect(b.x, this.height - b.h, b.w, b.h);
        });

        this.layerMid.forEach(b => {
          ctx.fillStyle = b.color;
          ctx.fillRect(b.x, this.height - b.h, b.w, b.h);

          ctx.fillStyle = 'rgba(56, 232, 255, 0.18)';
          for (let j = 0; j < 3; j++) {
            ctx.fillRect(b.x + 10 + j * 16, this.height - b.h + 20, 8, 12);
          }
        });
      }
    }

    // ===== 3. PLATAFORMA (PRÉDIOS COM VÃOS PROGRESSIVOS) =====
    class Building {
      constructor(x, y, width, height) {
        this.x = x;
        this.y = y;
        this.width = width;
        this.height = height;
        this.color = '#181f3d';
        this.neonEdgeColor = '#38e8ff';
      }

      update(speed) {
        this.x -= speed;
      }

      isOffscreen() {
        return this.x + this.width < -50;
      }

      render(ctx) {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.width, this.height);

        ctx.save();
        ctx.fillStyle = this.neonEdgeColor;
        ctx.shadowColor = this.neonEdgeColor;
        ctx.shadowBlur = 8;
        ctx.fillRect(this.x, this.y, this.width, 4);
        ctx.restore();
      }
    }

    // ===== 4. OBSTÁCULO (BARREIRAS LASER BAIXAS E ALTAS) =====
    class Obstacle {
      constructor(x, buildingY, type) {
        this.x = x;
        this.type = type; // 'low' ou 'high'
        this.width = 16;

        if (this.type === 'low') {
          this.height = 30;
          this.y = buildingY - this.height;
        } else {
          this.height = 28;
          this.y = buildingY - 56;
        }
      }

      update(speed) {
        this.x -= speed;
      }

      isOffscreen() {
        return this.x + this.width < -50;
      }

      getHitbox() {
        return {
          x: this.x + 2,
          y: this.y,
          width: this.width - 4,
          height: this.height
        };
      }

      render(ctx) {
        ctx.save();
        ctx.fillStyle = '#1e1b4b';
        ctx.fillRect(this.x, this.y, this.width, this.height);

        ctx.fillStyle = '#ef4444';
        ctx.shadowColor = '#ef4444';
        ctx.shadowBlur = 12;
        ctx.fillRect(this.x + 4, this.y, 8, this.height);

        ctx.fillStyle = '#ffb020';
        ctx.beginPath();
        ctx.arc(this.x + 8, this.y + 4, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // ===== 5. MOEDA COLETÁVEL =====
    class Coin {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 10;
        this.angle = Math.random() * Math.PI;
        this.collected = false;
      }

      update(speed, playerPos, magnetActive) {
        this.x -= speed;
        this.angle += 0.08;

        // Efeito de sucção do Ímã
        if (magnetActive && !this.collected) {
          const dx = playerPos.x - this.x;
          const dy = playerPos.y - this.y;
          const dist = Math.hypot(dx, dy);
          if (dist < 320) {
            this.x += (dx / dist) * 12;
            this.y += (dy / dist) * 12;
          }
        }
      }

      isOffscreen() {
        return this.x < -30;
      }

      render(ctx) {
        if (this.collected) return;
        ctx.save();
        ctx.translate(this.x, this.y);

        const scaleX = Math.cos(this.angle);
        ctx.scale(scaleX, 1);

        ctx.fillStyle = '#ffb020';
        ctx.shadowColor = '#ffb020';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fde047';
        ctx.beginPath();
        ctx.arc(0, 0, this.radius * 0.65, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    // ===== 6. POWER-UP ITEM (ESTILO SUBWAY SURFERS) =====
    // Tipos: 'superjump' (👟), 'magnet' (🧲), 'shield' (🛡️), 'slowmo' (⏱️), 'jetpack' (🚀)
    class PowerUpItem {
      constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.type = type;
        this.radius = 16;
        this.time = Math.random() * 10;
        this.collected = false;

        const meta = {
          superjump: { icon: '👟', name: 'SUPER PULO', color: '#10b981' },
          magnet: { icon: '🧲', name: 'ÍMÃ DE MOEDAS', color: '#ffb020' },
          shield: { icon: '🛡️', name: 'ESCUDO', color: '#38e8ff' },
          slowmo: { icon: '⏱️', name: 'CÂMERA LENTA', color: '#c084fc' },
          jetpack: { icon: '🚀', name: 'PROPULSOR', color: '#ff5ca8' }
        };
        this.meta = meta[type] || meta.superjump;
      }

      update(speed) {
        this.x -= speed;
        this.time += 0.06;
      }

      isOffscreen() {
        return this.x < -40;
      }

      render(ctx) {
        if (this.collected) return;
        ctx.save();
        const floatY = this.y + Math.sin(this.time) * 5;
        ctx.translate(this.x, floatY);

        // Bolha de energia brilhante
        ctx.fillStyle = 'rgba(13, 18, 36, 0.85)';
        ctx.strokeStyle = this.meta.color;
        ctx.lineWidth = 2.2;
        ctx.shadowColor = this.meta.color;
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Ícone emoji central
        ctx.font = '16px "Baloo 2", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowBlur = 0;
        ctx.fillText(this.meta.icon, 0, 1);

        ctx.restore();
      }
    }

    // ===== 7. TEXTO FLUTUANTE DE RECOMPENSA =====
    class FloatingText {
      constructor(text, x, y, color = '#38e8ff') {
        this.text = text;
        this.x = x;
        this.y = y;
        this.color = color;
        this.life = 1.0;
        this.vy = -1.6;
      }

      update() {
        this.y += this.vy;
        this.life -= 0.025;
      }

      render(ctx) {
        if (this.life <= 0) return;
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.font = '800 16px "Baloo 2", sans-serif';
        ctx.fillStyle = this.color;
        ctx.textAlign = 'center';
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 8;
        ctx.fillText(this.text, this.x, this.y);
        ctx.restore();
      }
    }

    // ===== 8. PERSONAGEM (CORUJA MASCOTE KRUUJ ANIMADA) =====
    class Player {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.vy = 0;
        this.gravity = 0.62;
        this.jumpForce = -11.8;

        this.onGround = false;
        this.jumpsLeft = 2;
        this.isCrouching = false;
        this.animTime = 0;

        // Dimensões da Hitbox
        this.standWidth = 34;
        this.standHeight = 44;
        this.crouchWidth = 46;
        this.crouchHeight = 22;

        this.width = this.standWidth;
        this.height = this.standHeight;

        // Efeitos de Power-up
        this.hasShield = false;
        this.hasSuperJump = false;
        this.isJetpacking = false;
      }

      jump() {
        if (this.isJetpacking) return false;
        if (this.jumpsLeft > 0) {
          const force = this.hasSuperJump ? this.jumpForce * 1.38 : this.jumpForce;
          this.vy = force;
          this.jumpsLeft--;
          this.onGround = false;
          return true;
        }
        return false;
      }

      crouch(isDown) {
        if (this.isJetpacking) return;
        this.isCrouching = isDown;
        if (isDown) {
          this.width = this.crouchWidth;
          this.height = this.crouchHeight;
        } else {
          this.width = this.standWidth;
          this.height = this.standHeight;
        }
      }

      update() {
        this.animTime += 0.2;
        if (this.isJetpacking) {
          // Mantém voando suavemente no topo
          this.vy = (180 - this.y) * 0.08;
          this.y += this.vy;
          this.onGround = false;
        } else {
          this.vy += this.gravity;
          this.y += this.vy;
        }
      }

      getHitbox() {
        return {
          x: this.x,
          y: this.y,
          width: this.width,
          height: this.height
        };
      }

      render(ctx) {
        ctx.save();
        ctx.translate(this.x + this.width / 2, this.y + this.height / 2);

        // Se estiver agachado/deslizando
        if (this.isCrouching) {
          ctx.rotate(0.2);
        }

        // 1. Escudo Protetor Neon
        if (this.hasShield) {
          ctx.strokeStyle = '#38e8ff';
          ctx.lineWidth = 2.5;
          ctx.shadowColor = '#38e8ff';
          ctx.shadowBlur = 14;
          ctx.beginPath();
          ctx.arc(0, 0, this.width * 0.75, 0, Math.PI * 2);
          ctx.stroke();
          ctx.fillStyle = 'rgba(56, 232, 255, 0.15)';
          ctx.fill();
          ctx.shadowBlur = 0;
        }

        // 2. Chama do Jetpack se ativo
        if (this.isJetpacking) {
          ctx.fillStyle = '#ff5ca8';
          ctx.shadowColor = '#ff5ca8';
          ctx.shadowBlur = 12;
          ctx.beginPath();
          ctx.moveTo(-16, 8);
          ctx.lineTo(-28 + Math.random() * 6, 12);
          ctx.lineTo(-16, 16);
          ctx.closePath();
          ctx.fill();
          ctx.shadowBlur = 0;
        }

        // 3. Corpo da Coruja KRUUJ
        ctx.fillStyle = '#8b5cff';
        ctx.shadowColor = '#8b5cff';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.roundRect(-this.width / 2, -this.height / 2, this.width, this.height, 10);
        ctx.fill();
        ctx.shadowBlur = 0;

        // 4. Penachos de orelha da coruja
        if (!this.isCrouching) {
          ctx.fillStyle = '#6d28d9';
          ctx.beginPath();
          ctx.moveTo(-this.width / 2 + 2, -this.height / 2);
          ctx.lineTo(-this.width / 2 - 2, -this.height / 2 - 10);
          ctx.lineTo(-this.width / 2 + 8, -this.height / 2);
          ctx.closePath();
          ctx.fill();

          ctx.beginPath();
          ctx.moveTo(this.width / 2 - 8, -this.height / 2);
          ctx.lineTo(this.width / 2 + 2, -this.height / 2 - 10);
          ctx.lineTo(this.width / 2 - 2, -this.height / 2);
          ctx.closePath();
          ctx.fill();
        }

        // 5. Asas animadas (batem enquanto corre ou pula)
        const wingFlap = Math.sin(this.animTime) * 6;
        ctx.fillStyle = '#7c3aed';
        ctx.beginPath();
        ctx.ellipse(-this.width / 2 + 4, 2 + wingFlap, 6, 12, 0.2, 0, Math.PI * 2);
        ctx.fill();

        // 6. Olhos grandes da Coruja KRUUJ
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(this.width / 2 - 10, -4, 5.5, 0, Math.PI * 2);
        ctx.fill();

        // Íris dourada
        ctx.fillStyle = '#ffb020';
        ctx.beginPath();
        ctx.arc(this.width / 2 - 9, -4, 3.2, 0, Math.PI * 2);
        ctx.fill();

        // Pupila
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.arc(this.width / 2 - 8, -4, 1.6, 0, Math.PI * 2);
        ctx.fill();

        // Bico dourado
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.moveTo(this.width / 2 - 4, -2);
        ctx.lineTo(this.width / 2 + 2, 0);
        ctx.lineTo(this.width / 2 - 4, 3);
        ctx.closePath();
        ctx.fill();

        // 7. Viseira tecnológica neon KRUUJ
        ctx.strokeStyle = '#38e8ff';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.arc(this.width / 2 - 10, -4, 6.5, -Math.PI * 0.7, Math.PI * 0.2);
        ctx.stroke();

        ctx.restore();
      }
    }

    // ===== 9. CLASSE PRINCIPAL DO JOGO (ENGINE COMPLETA) =====
    class Game {
      constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');

        this.sound = new SoundController();
        this.parallax = new ParallaxBackground(window.innerWidth, window.innerHeight);

        this.state = 'menu';
        this.baseSpeed = 4.2; // Começa mais lento e amigável!
        this.currentSpeed = this.baseSpeed;
        this.distance = 0;
        this.coinsCount = 0;
        this.bestDistance = parseInt(localStorage.getItem('kruuj_runner_best') || '0', 10);

        this.player = new Player(100, 300);
        this.buildings = [];
        this.obstacles = [];
        this.coins = [];
        this.powerups = [];
        this.floatingTexts = [];

        // Estado do Power-Up ativo
        this.activePowerUp = null; // 'superjump', 'magnet', 'shield', 'slowmo', 'jetpack'
        this.powerUpTimer = 0;
        this.powerUpMaxTime = 0;

        this.init();
      }

      init() {
        this.resize();
        window.addEventListener('resize', () => this.resize());

        // Controles de Teclado
        window.addEventListener('keydown', (e) => {
          if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
            e.preventDefault();
            if (this.state === 'play') {
              if (this.player.jump()) this.sound.playJump(this.player.hasSuperJump);
            } else if (this.state === 'over' || this.state === 'menu') {
              this.startGame();
            }
          } else if (e.code === 'ArrowDown' || e.code === 'KeyS') {
            e.preventDefault();
            if (this.state === 'play') {
              this.player.crouch(true);
              this.sound.playSlide();
            }
          }
        });

        window.addEventListener('keyup', (e) => {
          if (e.code === 'ArrowDown' || e.code === 'KeyS') {
            this.player.crouch(false);
          }
        });

        // Controles Touch nos Botões Mobile
        const btnJump = document.getElementById('touchJump');
        const btnCrouch = document.getElementById('touchCrouch');

        btnJump.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          if (this.state === 'play') {
            if (this.player.jump()) this.sound.playJump(this.player.hasSuperJump);
          } else {
            this.startGame();
          }
        });

        btnCrouch.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          if (this.state === 'play') {
            this.player.crouch(true);
            this.sound.playSlide();
          }
        });

        btnCrouch.addEventListener('pointerup', () => this.player.crouch(false));
        btnCrouch.addEventListener('pointerleave', () => this.player.crouch(false));

        // Toque direto no Canvas para pular
        this.canvas.addEventListener('pointerdown', (e) => {
          if (e.target.closest('#gameOverlay') || e.target.closest('button')) return;
          if (this.state === 'play') {
            if (this.player.jump()) this.sound.playJump(this.player.hasSuperJump);
          }
        });

        document.getElementById('bestVal').textContent = `${this.bestDistance}m`;

        this.loop = this.loop.bind(this);
        requestAnimationFrame(this.loop);

        try {
          window.parent.postMessage({ type: 'game_loaded', gameSlug: 'kruuj-runner' }, '*');
        } catch(e) {}
      }

      resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
        this.parallax.resize(this.canvas.width, this.canvas.height);
      }

      startGame() {
        this.sound.init();
        this.state = 'play';
        this.baseSpeed = 4.2;
        this.currentSpeed = this.baseSpeed;
        this.distance = 0;
        this.coinsCount = 0;
        this.buildings = [];
        this.obstacles = [];
        this.coins = [];
        this.powerups = [];
        this.floatingTexts = [];

        this.clearPowerUp();

        // 1. Gera prédio inicial largo sob o jogador
        let currentX = 50;
        const initialWidth = this.canvas.width * 0.95;
        const groundY = this.canvas.height * 0.72;
        this.buildings.push(new Building(currentX, groundY, initialWidth, this.canvas.height - groundY));

        this.player.x = 110;
        this.player.y = groundY - this.player.height;
        this.player.vy = 0;
        this.player.onGround = true;
        this.player.jumpsLeft = 2;

        // 2. Gera prédios subsequentes
        currentX += initialWidth;
        for (let i = 0; i < 6; i++) {
          currentX = this.generateNextBuilding(currentX);
        }

        document.getElementById('gameOverlay').classList.remove('active');
        this.updateUI();

        try {
          window.parent.postMessage({ type: 'game_start', gameSlug: 'kruuj-runner' }, '*');
        } catch(e) {}
      }

      generateNextBuilding(startX) {
        // Vão entre prédios: começa fácil e vai aumentando conforme a distância
        const minGap = Math.min(110, 50 + this.distance * 0.04);
        const gap = minGap + Math.random() * 45;
        const nextX = startX + gap;

        const width = 230 + Math.random() * 220;
        const buildingY = Math.min(this.canvas.height * 0.78, Math.max(this.canvas.height * 0.52, this.canvas.height * 0.68 + (Math.random() * 80 - 40)));
        const height = this.canvas.height - buildingY;

        this.buildings.push(new Building(nextX, buildingY, width, height));

        // 1. Gera barreiras laser (começam apenas após 30m)
        if (this.distance > 30 && Math.random() > 0.42) {
          const type = Math.random() > 0.5 ? 'low' : 'high';
          const laserX = nextX + width * 0.5;
          this.obstacles.push(new Obstacle(laserX, buildingY, type));
        }

        // 2. Gera fileiras de Moedas Cósmicas
        const coinCount = 3 + Math.floor(Math.random() * 4);
        for (let c = 0; c < coinCount; c++) {
          this.coins.push(new Coin(nextX + 30 + c * 28, buildingY - 25));
        }

        // 3. Chance de gerar um Power-Up especial estilo Subway Surfers!
        if (Math.random() < 0.22) {
          const types = ['superjump', 'magnet', 'shield', 'slowmo', 'jetpack'];
          const chosen = types[Math.floor(Math.random() * types.length)];
          this.powerups.push(new PowerUpItem(nextX + width * 0.35, buildingY - 45, chosen));
        }

        return nextX + width;
      }

      activatePowerUp(type) {
        this.activePowerUp = type;
        this.powerUpMaxTime = type === 'shield' ? 9999 : (type === 'jetpack' ? 360 : 420); // frames (~7 segs)
        this.powerUpTimer = this.powerUpMaxTime;

        this.sound.playPowerup();

        // Reseta estados
        this.player.hasSuperJump = (type === 'superjump');
        this.player.hasShield = (type === 'shield');
        this.player.isJetpacking = (type === 'jetpack');

        // Textos Flutuantes
        const names = {
          superjump: '👟 SUPER SALTO!',
          magnet: '🧲 ÍMÃ ATIVADO!',
          shield: '🛡️ ESCUDO CÓSMICO!',
          slowmo: '⏱️ CÂMERA LENTA!',
          jetpack: '🚀 PROPULSOR JETPACK!'
        };
        const colors = {
          superjump: '#10b981',
          magnet: '#ffb020',
          shield: '#38e8ff',
          slowmo: '#c084fc',
          jetpack: '#ff5ca8'
        };
        this.floatingTexts.push(new FloatingText(names[type], this.player.x + 20, this.player.y - 30, colors[type]));

        // Atualiza UI da barra de tracker
        const tracker = document.getElementById('powerupTracker');
        const icon = document.getElementById('powerupIcon');
        const name = document.getElementById('powerupName');
        const icons = { superjump: '👟', magnet: '🧲', shield: '🛡️', slowmo: '⏱️', jetpack: '🚀' };

        icon.textContent = icons[type];
        name.textContent = names[type].replace('!', '');
        tracker.classList.add('active');
      }

      clearPowerUp() {
        this.activePowerUp = null;
        this.powerUpTimer = 0;
        this.player.hasSuperJump = false;
        this.player.hasShield = false;
        this.player.isJetpacking = false;
        document.getElementById('powerupTracker').classList.remove('active');
      }

      checkAABB(r1, r2) {
        return (
          r1.x < r2.x + r2.width &&
          r1.x + r1.width > r2.x &&
          r1.y < r2.y + r2.height &&
          r1.y + r1.height > r2.y
        );
      }

      gameOver() {
        this.state = 'over';
        this.sound.playLaserZap();
        this.clearPowerUp();

        const finalDist = Math.floor(this.distance);
        this.bestDistance = Math.max(this.bestDistance, finalDist);
        localStorage.setItem('kruuj_runner_best', String(this.bestDistance));
        document.getElementById('bestVal').textContent = `${this.bestDistance}m`;

        document.getElementById('ovDist').textContent = `${finalDist}m`;
        document.getElementById('ovCoins').textContent = this.coinsCount;
        document.getElementById('ovBest').textContent = `${this.bestDistance}m`;
        document.getElementById('ovStats').style.display = 'flex';
        document.getElementById('gameOverlay').classList.add('active');

        try {
          window.parent.postMessage({ type: 'game_over', gameSlug: 'kruuj-runner', score: finalDist, coins: this.coinsCount, bestDist: this.bestDistance }, '*');
          window.parent.postMessage({ type: 'game_save', gameSlug: 'kruuj-runner', saveData: { bestDist: this.bestDistance, coins: this.coinsCount }, score: finalDist }, '*');
        } catch(e) {}
      }

      updateUI() {
        document.getElementById('distVal').textContent = `${Math.floor(this.distance)}m`;
        document.getElementById('coinVal').textContent = this.coinsCount;
      }

      loop() {
        requestAnimationFrame(this.loop);

        // 1. Limpa o Canvas
        this.ctx.fillStyle = '#070914';
        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

        // Velocidade adaptativa com suporte ao Slow-Mo
        let effectiveSpeed = this.currentSpeed;
        if (this.activePowerUp === 'slowmo') {
          effectiveSpeed *= 0.58;
        }

        // 2. Renderiza Parallax Cyberpunk
        this.parallax.update(this.state === 'play' ? effectiveSpeed : 1.5);
        this.parallax.render(this.ctx);

        // 3. Atualização da Física e Lógica
        if (this.state === 'play') {
          this.distance += effectiveSpeed * 0.05;
          // Aceleração bem gradual e suave!
          this.currentSpeed += 0.00045;
          this.updateUI();

          // Atualiza Power-Up ativo
          if (this.activePowerUp && this.activePowerUp !== 'shield') {
            this.powerUpTimer--;
            const pct = Math.max(0, (this.powerUpTimer / this.powerUpMaxTime) * 100);
            document.getElementById('powerupBar').style.width = `${pct}%`;

            if (this.powerUpTimer <= 0) {
              this.clearPowerUp();
            }
          }

          this.player.update();
          this.player.onGround = false;

          // 3.1 Prédios
          for (let i = this.buildings.length - 1; i >= 0; i--) {
            const b = this.buildings[i];
            b.update(effectiveSpeed);

            const pHit = this.player.getHitbox();
            if (
              !this.player.isJetpacking &&
              pHit.x + pHit.width > b.x &&
              pHit.x < b.x + b.width &&
              pHit.y + pHit.height >= b.y &&
              pHit.y + pHit.height <= b.y + 20 &&
              this.player.vy >= 0
            ) {
              this.player.y = b.y - this.player.height;
              this.player.vy = 0;
              this.player.onGround = true;
              this.player.jumpsLeft = 2;
            }

            if (b.isOffscreen()) {
              this.buildings.splice(i, 1);
              const lastB = this.buildings[this.buildings.length - 1];
              this.generateNextBuilding(lastB.x + lastB.width);
            }
          }

          // 3.2 Queda no vão (se não estiver com jetpack)
          if (!this.player.isJetpacking && this.player.y > this.canvas.height + 40) {
            this.gameOver();
            return;
          }

          // 3.3 Moedas Cósmicas
          const magnetActive = (this.activePowerUp === 'magnet');
          for (let i = this.coins.length - 1; i >= 0; i--) {
            const coin = this.coins[i];
            coin.update(effectiveSpeed, { x: this.player.x + this.player.width / 2, y: this.player.y + this.player.height / 2 }, magnetActive);

            if (!coin.collected && Math.hypot(this.player.x + 16 - coin.x, this.player.y + 20 - coin.y) < 32) {
              coin.collected = true;
              this.coinsCount++;
              this.distance += 0.5; // Moedas dão bônus de corrida!
              this.sound.playCoin();
            }

            if (coin.isOffscreen() || coin.collected) {
              this.coins.splice(i, 1);
            }
          }

          // 3.4 Itens de Power-Up
          for (let i = this.powerups.length - 1; i >= 0; i--) {
            const pup = this.powerups[i];
            pup.update(effectiveSpeed);

            if (!pup.collected && Math.hypot(this.player.x + 16 - pup.x, this.player.y + 20 - pup.y) < 36) {
              pup.collected = true;
              this.activatePowerUp(pup.type);
            }

            if (pup.isOffscreen() || pup.collected) {
              this.powerups.splice(i, 1);
            }
          }

          // 3.5 Obstáculos (Lasers)
          for (let i = this.obstacles.length - 1; i >= 0; i--) {
            const ob = this.obstacles[i];
            ob.update(effectiveSpeed);

            if (this.checkAABB(this.player.getHitbox(), ob.getHitbox())) {
              // Se tiver escudo ativo, o escudo quebra e absorve o impacto!
              if (this.player.hasShield) {
                this.player.hasShield = false;
                this.sound.playShieldBreak();
                this.floatingTexts.push(new FloatingText('ESCUDO QUEBROU! 🛡️', this.player.x + 20, this.player.y - 20, '#38e8ff'));
                this.obstacles.splice(i, 1);
                document.getElementById('powerupTracker').classList.remove('active');
                continue;
              }

              // Se não estiver voando sobre tudo com Jetpack
              if (!this.player.isJetpacking) {
                this.gameOver();
                return;
              }
            }

            if (ob.isOffscreen()) {
              this.obstacles.splice(i, 1);
            }
          }

          // 3.6 Textos Flutuantes
          for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
            const ft = this.floatingTexts[i];
            ft.update();
            if (ft.life <= 0) {
              this.floatingTexts.splice(i, 1);
            }
          }
        }

        // 4. Renderização
        this.buildings.forEach(b => b.render(this.ctx));
        this.coins.forEach(c => c.render(this.ctx));
        this.powerups.forEach(p => p.render(this.ctx));
        this.obstacles.forEach(ob => ob.render(this.ctx));
        this.floatingTexts.forEach(ft => ft.render(this.ctx));

        if (this.state === 'play') {
          this.player.render(this.ctx);
        }
      }
    }

    // Instanciação Global
    window.addEventListener('DOMContentLoaded', () => {
      window.runnerGame = new Game();
    });
  </script>
