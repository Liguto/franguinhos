<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>KRUUJ Formas & Cores Mágicas – Baby Shapes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <script src="/sdk/v1/kruuj-sdk.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">

  <script>
    // Suprime KruujLoader interno se carregado dentro do Portal
    if (window.self !== window.top) {
      window.addEventListener('DOMContentLoaded', () => {
        const kl = document.getElementById('kl');
        if (kl) kl.style.display = 'none';
      });
    }

    // Suporte a i18n em PT, EN, ES
    const URL_LANG = (new URLSearchParams(window.location.search).get('lang') || 'pt').toLowerCase();
    const I18N = {
      pt: {
        title: 'Formas & Cores Mágicas',
        tagline: 'Toque nas formas fofas, veja as cores brilharem e crie magia.',
        shapesFound: 'Descobertas',

        cheer: ['Muito bem!', 'Lindo!', 'Que fofo!', 'Incrível!', 'Parabéns!'],

      },
      en: {

        tagline: 'Touch the cute shapes, watch colors glow, and create magic.',
        shapesFound: 'Discovered',
        heart: 'Pink Heart! 💕',

        circle: 'Yellow Circle! 🟡',
        moon: 'Purple Moon! 🌙',

        ]
      },
      es: {

        shapesFound: 'Descubrimientos',

  </script>

  <style>
    :root {
      --bg-top: #101c4a;
      --bg-bottom: #2b1854;
      --purple: #8338fc;
      --blue: #289afd;
      --orange: #fda41d;
      --pink: #ff65a6;
      --yellow: #ffd043;
      --green: #48e59b;
      --lav: #d8d4fd;
      --white: #ffffff;
      --navy: #151c4a;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 30%, var(--bg-top), var(--bg-bottom));
      color: var(--white);
      font-family: 'Baloo 2', system-ui, sans-serif;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    /* HUD Superior — Recuo Poki obrigatório de 68px no mobile */
    .hud {
      position: fixed;
      top: 14px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
      gap: 8px;
    }

    @media (max-width: 768px) {
      .hud {
        padding-left: 68px !important;
      }
    }

    .hud-badge {
      background: rgba(21, 28, 74, 0.88);
      border: 2px solid rgba(255, 208, 67, 0.45);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 9999px;
      padding: 7px 18px;
      font-size: 1.05rem;
      font-weight: 800;
      color: #ffd043;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      pointer-events: auto;
    }

    /* Balão de Nome da Forma */
    .shape-pill {
      position: fixed;
      top: 75px;
      left: 50%;
      transform: translateX(-50%) scale(0.6);
      background: rgba(255, 255, 255, 0.95);
      color: #3b1464;
      font-size: clamp(1.2rem, 5vw, 1.8rem);
      font-weight: 800;
      padding: 10px 28px;
      border-radius: 9999px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.3), 0 0 0 4px #ffd043;
      pointer-events: none;
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      z-index: 20;
      white-space: nowrap;
    }

    .shape-pill.show {
      opacity: 1;
      transform: translateX(-50%) scale(1.0);
    }

    /* ===== KRUUJ LOADER OFICIAL ===== */
    #kl {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: radial-gradient(ellipse at 50% 40%, #101a52 0%, var(--bg-top) 65%);
      display: grid;
      place-items: center;
      padding: env(safe-area-inset-top, 0) 24px env(safe-area-inset-bottom, 0);
      transition: opacity 0.6s ease, visibility 0.6s;
    }
    #kl.out { opacity: 0; visibility: hidden; }
    #kl .ph { grid-area: 1/1; display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 440px; transition: opacity 0.5s ease; }
    #kl .ph.off { opacity: 0; pointer-events: none; }
    .splash .owl { width: min(34vw, 150px); aspect-ratio: 1; border-radius: 50%; animation: pop 0.9s cubic-bezier(.2,1.3,.4,1) both, glow 2.4s ease-in-out 0.9s infinite; }
    .splash .logo { width: min(54vw, 240px); height: auto; margin-top: 20px; animation: rise 0.8s ease 0.7s both; }
    .splash .sub { margin: 8px 0 0; font-weight: 600; font-size: 0.85rem; letter-spacing: 0.38em; padding-left: 0.38em; color: var(--lav); animation: rise 0.8s ease 1.1s both; }
    .load { text-align: center; }
    .load h1 { margin: 0; font-weight: 800; font-size: clamp(2rem, 8vw, 3.2rem); line-height: 1.1; letter-spacing: -0.01em; color: #fff; }
    .load .tag { margin: 12px 0 0; color: var(--lav); font-size: 1.05rem; }
    .track { position: relative; width: 100%; height: 10px; margin: 48px 0 0; border-radius: 99px; background: var(--navy); }
    .fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--purple), var(--blue)); }
    .rider { position: absolute; top: 50%; left: 0; width: 48px; aspect-ratio: 1; margin: -24px 0 0 -24px; border-radius: 50%; box-shadow: 0 0 0 3px var(--bg-top), 0 0 0 5px var(--orange); }
    .pct { margin-top: 26px; font-weight: 600; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
    .tip { min-height: 1.5em; margin: 10px 0 0; color: var(--lav); opacity: 0.85; font-size: 0.95rem; transition: opacity 0.4s; }
    .brand { position: absolute; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); font-size: 0.8rem; color: var(--lav); opacity: 0.6; }
    @keyframes pop { from { transform: scale(0.4); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes glow { 0%, 100% { box-shadow: 0 0 30px 2px #8338fc55; } 50% { box-shadow: 0 0 64px 10px #8338fc99; } }
  </style>
</head>

<body>
  <!-- KruujLoader Oficial -->
  <div id="kl" role="status" aria-live="polite" aria-label="Carregando">
    <div class="ph splash">
      <img class="owl" alt="KRUUJ" src="/kruuj-avatar.png" onerror="this.src='/kruuj-mascote.png'">
      <img class="logo" alt="Kruuj" src="/kruuj-logo.png" onerror="this.style.display='none'">
      <p class="sub">STUDIO</p>
    </div>
    <div class="ph load off">
      <h1 id="kl-name">KRUUJ Formas Mágicas</h1>
      <p class="tag" id="kl-tag">Toque nas formas e veja as cores brilharem.</p>
      <div class="track">
        <div class="fill" id="kl-fill"></div>
        <img class="rider" id="kl-rider" alt="" src="/kruuj-avatar.png">
      </div>
      <div class="pct" id="kl-pct">0%</div>
      <p class="tip" id="kl-tip"></p>
    </div>
    <div class="brand" id="kl-brand">Kruuj Studio</div>
  </div>

  <!-- HUD -->
  <header class="hud">
    <div class="hud-badge">
      <span>🎨</span>
      <span>FORMAS: <strong id="scoreVal">0</strong></span>
    </div>
    <div class="hud-badge" style="border-color: rgba(255, 101, 166, 0.4); color: #ff65a6;">
      <span>⭐</span>
      <span id="starVal">0</span>
    </div>
  </header>

  <!-- Pílula com o Nome da Forma Tocada -->
  <div class="shape-pill" id="shapePill">Coração Rosa! 💕</div>

  <!-- Canvas Principal -->
  <canvas id="gameCanvas"></canvas>

  <script>
    // ==========================================
    // 1. ÁUDIO SINTÉTICO (WEBAUDIO)
    // ==========================================
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Cada forma possui uma harmonia própria doce e carinhosa
    const SHAPE_SOUNDS = {
      heart: [329.63, 440.00, 659.25],   // E4, A4, E5 (Doce e afetuoso)
      star: [392.00, 523.25, 783.99],    // G4, C5, G5 (Brilhante e cintilante)
      circle: [261.63, 392.00, 523.25],  // C4, G4, C5 (Redondo e acolhedor)
      moon: [440.00, 587.33, 880.00],    // A4, D5, A5 (Místico e suave)
      cloud: [293.66, 440.00, 587.33],   // D4, A4, D5 (Macio como algodão)
      triangle: [349.23, 440.00, 698.46] // F4, A4, F5 (Alegre e saltitante)
    };

    function playShapeSound(shapeType) {
      initAudio();
      if (!audioCtx) return;

      const freqs = SHAPE_SOUNDS[shapeType] || [440, 554, 659];
      const now = audioCtx.currentTime;

      freqs.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + idx * 0.05);

        gain.gain.setValueAtTime(0.001, now + idx * 0.05);
        gain.gain.linearRampToValueAtTime(0.32, now + idx * 0.05 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.05 + 0.7);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now + idx * 0.05);
        osc.stop(now + idx * 0.05 + 0.75);
      });
    }

    // Estouro mágico de forma (pop estelar cristalino)
    function playPopExplosionSound() {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(450, now);
      osc.frequency.exponentialRampToValueAtTime(1200, now + 0.12);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.35, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.3);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.32);
    }

    // ==========================================
    // 2. CENÁRIO E ENTIDADES
    // ==========================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let width = 0;
    let height = 0;
    let shapeCount = 0;
    let starScore = 0;

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    // Feedback Toast / Pílula
    let pillTimer = null;
    function showShapePill(text) {
      const pill = document.getElementById('shapePill');
      pill.textContent = text;
      pill.classList.add('show');
      if (pillTimer) clearTimeout(pillTimer);
      pillTimer = setTimeout(() => {
        pill.classList.remove('show');
      }, 1600);
    }

    // Partículas
    let particles = [];
    let touchTrail = [];

    class Particle {
      constructor(x, y, color, speed = 4, size = 7, shape = 'star') {
        this.x = x;
        this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const spd = Math.random() * speed + 1;
        this.vx = Math.cos(angle) * spd;
        this.vy = Math.sin(angle) * spd - 1;
        this.size = Math.random() * size + 4;
        this.life = 1.0;
        this.decay = Math.random() * 0.025 + 0.015;
        this.shape = shape;
        this.rot = Math.random() * Math.PI;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= this.decay;
        this.rot += 0.04;
      }
      draw(ctx) {
        if (this.life <= 0) return;
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rot);

        if (this.shape === 'heart') {
          drawHeart(ctx, 0, 0, this.size);
        } else if (this.shape === 'star') {
          drawStar(ctx, 0, 0, 5, this.size, this.size * 0.45);
        } else {
          ctx.beginPath();
          ctx.arc(0, 0, this.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
    }

    function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius) {
      let rot = Math.PI / 2 * 3;
      let x = cx;
      let y = cy;
      const step = Math.PI / spikes;
      ctx.beginPath();
      ctx.moveTo(cx, cy - outerRadius);
      for (let i = 0; i < spikes; i++) {
        x = cx + Math.cos(rot) * outerRadius;
        y = cy + Math.sin(rot) * outerRadius;
        ctx.lineTo(x, y);
        rot += step;
        x = cx + Math.cos(rot) * innerRadius;
        y = cy + Math.sin(rot) * innerRadius;
        ctx.lineTo(x, y);
        rot += step;
      }
      ctx.lineTo(cx, cy - outerRadius);
      ctx.closePath();
      ctx.fill();
    }

    function drawHeart(ctx, x, y, size) {
      ctx.beginPath();
      const topCurveHeight = size * 0.3;
      ctx.moveTo(x, y + topCurveHeight);
      ctx.bezierCurveTo(x, y, x - size / 2, y, x - size / 2, y + topCurveHeight);
      ctx.bezierCurveTo(x - size / 2, y + (size + topCurveHeight) / 2, x, y + (size + topCurveHeight) / 2, x, y + size);
      ctx.bezierCurveTo(x, y + (size + topCurveHeight) / 2, x + size / 2, y + (size + topCurveHeight) / 2, x + size / 2, y + topCurveHeight);
      ctx.bezierCurveTo(x + size / 2, y, x, y, x, y + topCurveHeight);
      ctx.fill();
    }

    function createBurst(x, y, color, shape = 'star', count = 16) {
      for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, color, 6, 8, shape));
      }
    }

    // ==========================================
    // 3. AS FORMAS MÁGICAS FLUTUANTES
    // ==========================================
    const SHAPE_DEFS = [
      { type: 'heart', color: '#ff65a6', glow: '#fda4af', i18nKey: 'heart' },
      { type: 'star', color: '#ffd043', glow: '#fef08a', i18nKey: 'star' },
      { type: 'circle', color: '#f59e0b', glow: '#fde68a', i18nKey: 'circle' },
      { type: 'moon', color: '#a78bfa', glow: '#ddd6fe', i18nKey: 'moon' },
      { type: 'cloud', color: '#38bdf8', glow: '#bae6fd', i18nKey: 'cloud' },
      { type: 'triangle', color: '#48e59b', glow: '#a7f3d0', i18nKey: 'triangle' }
    ];

    class MagicShape {
      constructor(def = null) {
        this.def = def || SHAPE_DEFS[Math.floor(Math.random() * SHAPE_DEFS.length)];
        this.radius = Math.random() * 20 + 55; // Formas grandes para dedinhos de bebês
        this.x = Math.random() * (width - this.radius * 2) + this.radius;
        this.y = Math.random() * (height - this.radius * 3) + this.radius + 60;
        this.vx = (Math.random() - 0.5) * 1.2;
        this.vy = (Math.random() - 0.5) * 1.2;
        this.scaleX = 1.0;
        this.scaleY = 1.0;
        this.rot = (Math.random() - 0.5) * 0.2;
        this.rotSpeed = (Math.random() - 0.5) * 0.015;
        this.taps = 0;
        this.wobble = Math.random() * Math.PI * 2;
      }
      hitTest(px, py) {
        return Math.hypot(px - this.x, py - this.y) < this.radius * 1.25;
      }
      touch() {
        this.taps++;
        playShapeSound(this.def.type);
        showShapePill(tG[this.def.i18nKey]);

        // Squash & stretch elástico
        this.scaleX = 1.45;
        this.scaleY = 0.65;
        setTimeout(() => {
          this.scaleX = 0.8;
          this.scaleY = 1.3;
          setTimeout(() => {
            this.scaleX = 1.0;
            this.scaleY = 1.0;
          }, 140);
        }, 120);

        createBurst(this.x, this.y, this.def.color, this.def.type, 12);
        shapeCount++;
        starScore += 2;
        document.getElementById('scoreVal').textContent = shapeCount;
        document.getElementById('starVal').textContent = starScore;

        // Anima Corujinha companheira
        companionOwl.celebrate();

        // Se tocar 2 vezes, a forma explode em magia e renasce!
        if (this.taps >= 2) {
          playPopExplosionSound();
          createBurst(this.x, this.y, this.def.color, this.def.type, 28);
          this.respawn();
        }
      }
      respawn() {
        this.def = SHAPE_DEFS[Math.floor(Math.random() * SHAPE_DEFS.length)];
        this.x = Math.random() * (width - this.radius * 2) + this.radius;
        this.y = height + this.radius + 30;
        this.vy = -Math.random() * 1.5 - 0.8;
        this.vx = (Math.random() - 0.5) * 1.2;
        this.taps = 0;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.rot += this.rotSpeed;
        this.wobble += 0.03;

        // Bate suave nas bordas da tela
        if (this.x < this.radius) { this.x = this.radius; this.vx *= -1; }
        if (this.x > width - this.radius) { this.x = width - this.radius; this.vx *= -1; }
        if (this.y < this.radius + 60) { this.y = this.radius + 60; this.vy *= -1; }
        if (this.y > height - this.radius - 20) { this.y = height - this.radius - 20; this.vy *= -1; }
      }
      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rot);
        ctx.scale(this.scaleX, this.scaleY);

        // Brilho exterior suave
        ctx.shadowColor = this.def.glow;
        ctx.shadowBlur = 22;

        ctx.fillStyle = this.def.color;

        const r = this.radius;

        if (this.def.type === 'circle') {
          ctx.beginPath();
          ctx.arc(0, 0, r, 0, Math.PI * 2);
          ctx.fill();
        } else if (this.def.type === 'heart') {
          drawHeart(ctx, 0, -r * 0.4, r * 1.8);
        } else if (this.def.type === 'star') {
          drawStar(ctx, 0, 0, 5, r * 1.2, r * 0.55);
        } else if (this.def.type === 'moon') {
          ctx.beginPath();
          ctx.arc(0, 0, r, 0.4 * Math.PI, 1.6 * Math.PI);
          ctx.bezierCurveTo(r * 0.4, -r * 0.4, r * 0.4, r * 0.4, 0, r * 0.98);
          ctx.fill();
        } else if (this.def.type === 'cloud') {
          ctx.beginPath();
          ctx.arc(0, 0, r * 0.7, 0, Math.PI * 2);
          ctx.arc(-r * 0.5, r * 0.1, r * 0.5, 0, Math.PI * 2);
          ctx.arc(r * 0.5, r * 0.1, r * 0.5, 0, Math.PI * 2);
          ctx.fill();
        } else if (this.def.type === 'triangle') {
          ctx.beginPath();
          ctx.moveTo(0, -r);
          ctx.lineTo(r, r * 0.85);
          ctx.lineTo(-r, r * 0.85);
          ctx.closePath();
          ctx.fill();
        }

        ctx.shadowBlur = 0;

        // Rostinho Kawaii sorridente em cada forma!
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(-14, -4, 5, 0, Math.PI * 2);
        ctx.arc(14, -4, 5, 0, Math.PI * 2);
        ctx.fill();

        // Brilho nos olhos
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-16, -6, 2, 0, Math.PI * 2);
        ctx.arc(12, -6, 2, 0, Math.PI * 2);
        ctx.fill();

        // Bochechas rosadas
        ctx.fillStyle = '#ff8cb0';
        ctx.beginPath();
        ctx.arc(-22, 4, 6, 0, Math.PI * 2);
        ctx.arc(22, 4, 6, 0, Math.PI * 2);
        ctx.fill();

        // Sorriso
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(0, 2, 8, 0.15 * Math.PI, 0.85 * Math.PI);
        ctx.stroke();

        ctx.restore();
      }
    }

    // Inicializa 5 formas na tela
    const shapes = [];
    for (let i = 0; i < 5; i++) {
      shapes.push(new MagicShape(SHAPE_DEFS[i % SHAPE_DEFS.length]));
    }

    // ==========================================
    // 4. CORUJINHA KRUUJ COMPANHEIRA
    // ==========================================
    const companionOwl = {
      scale: 1.0,
      targetScale: 1.0,
      wingAngle: 0,
      cheerTimer: 0,
      getPos() {
        return {
          x: Math.max(50, width * 0.12),
          y: Math.min(height - 65, height * 0.88)
        };
      },
      celebrate() {
        this.targetScale = 1.35;
        setTimeout(() => { this.targetScale = 1.0; }, 220);
        this.cheerTimer = 30;
      },
      update() {
        this.scale += (this.targetScale - this.scale) * 0.12;
        this.wingAngle = Math.sin(Date.now() * 0.008) * 0.3;
        if (this.cheerTimer > 0) this.cheerTimer--;
      },
      draw(ctx) {
        const pos = this.getPos();
        ctx.save();
        ctx.translate(pos.x, pos.y);
        ctx.scale(this.scale, this.scale);

        // Ninho
        ctx.fillStyle = '#ffffffcc';
        ctx.shadowColor = '#8338fc';
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.ellipse(0, 32, 44, 16, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Corpo
        ctx.fillStyle = '#8338fc';
        ctx.beginPath();
        ctx.ellipse(0, 0, 32, 36, 0, 0, Math.PI * 2);
        ctx.fill();

        // Orelhinhas
        ctx.beginPath();
        ctx.moveTo(-20, -26);
        ctx.lineTo(-28, -42);
        ctx.lineTo(-10, -32);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(10, -32);
        ctx.lineTo(28, -42);
        ctx.lineTo(20, -26);
        ctx.fill();

        // Barriguinha
        ctx.fillStyle = '#f5f3ff';
        ctx.beginPath();
        ctx.ellipse(0, 8, 22, 24, 0, 0, Math.PI * 2);
        ctx.fill();

        // Asinhas
        ctx.fillStyle = '#6d28d9';
        const flap = this.cheerTimer > 0 ? Math.sin(Date.now() * 0.02) * 0.5 : this.wingAngle;
        ctx.save();
        ctx.translate(-28, 0);
        ctx.rotate(-0.3 - flap);
        ctx.beginPath();
        ctx.ellipse(0, 0, 10, 20, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.translate(28, 0);
        ctx.rotate(0.3 + flap);
        ctx.beginPath();
        ctx.ellipse(0, 0, 10, 20, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Olhos
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-12, -8, 11, 0, Math.PI * 2);
        ctx.arc(12, -8, 11, 0, Math.PI * 2);
        ctx.fill();

        // Íris Azul
        ctx.fillStyle = '#289afd';
        ctx.beginPath();
        ctx.arc(-12, -8, 7, 0, Math.PI * 2);
        ctx.arc(12, -8, 7, 0, Math.PI * 2);
        ctx.fill();

        // Pupila
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(-12, -8, 4.5, 0, Math.PI * 2);
        ctx.arc(12, -8, 4.5, 0, Math.PI * 2);
        ctx.fill();

        // Bochechas
        ctx.fillStyle = '#ff8cb0';
        ctx.beginPath();
        ctx.arc(-18, 4, 5, 0, Math.PI * 2);
        ctx.arc(18, 4, 5, 0, Math.PI * 2);
        ctx.fill();

        // Biquinho
        ctx.fillStyle = '#fda41d';
        ctx.beginPath();
        ctx.moveTo(-5, -3);
        ctx.lineTo(5, -3);
        ctx.lineTo(0, 5);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }
    };

    // ==========================================
    // 5. INTERAÇÃO TÁTIL MULTITOUCH
    // ==========================================
    function handlePointer(px, py) {
      initAudio();

      // Testa toque nas formas
      for (const shape of shapes) {
        if (shape.hitTest(px, py)) {
          shape.touch();
          return;
        }
      }

      // Toque livre: cria estrela mágica
      createBurst(px, py, '#ffd043', 'star', 8);
      playShapeSound('star');
      starScore += 1;
      document.getElementById('starVal').textContent = starScore;
    }

    // Rastro luminoso contínuo de dedinho
    let lastDragSound = 0;
    function handleDrag(px, py) {
      touchTrail.push({
        x: px,
        y: py,
        life: 1.0,
        color: ['#ff65a6', '#ffd043', '#48e59b', '#38bdf8', '#a78bfa'][Math.floor(Math.random() * 5)]
      });

      const now = performance.now();
      if (now - lastDragSound > 140) {
        lastDragSound = now;
        playShapeSound('circle');
      }
    }

    let isDown = false;
    window.addEventListener('pointerdown', (e) => {
      isDown = true;
      handlePointer(e.clientX, e.clientY);
    });

    window.addEventListener('pointermove', (e) => {
      if (isDown) handleDrag(e.clientX, e.clientY);
    });

    window.addEventListener('pointerup', () => { isDown = false; });

    window.addEventListener('touchstart', (e) => {
      e.preventDefault();
      for (let i = 0; i < e.touches.length; i++) {
        const t = e.touches[i];
        handlePointer(t.clientX, t.clientY);
      }
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      e.preventDefault();
      for (let i = 0; i < e.touches.length; i++) {
        const t = e.touches[i];
        handleDrag(t.clientX, t.clientY);
      }
    }, { passive: false });

    // ==========================================
    // 6. LOOP DE ANIMAÇÃO
    // ==========================================
    const bgStars = [];
    for (let i = 0; i < 40; i++) {
      bgStars.push({
        x: Math.random(),
        y: Math.random(),
        size: Math.random() * 2.5 + 1.2,
        twinkle: Math.random() * Math.PI * 2
      });
    }

    function gameLoop() {
      ctx.clearRect(0, 0, width, height);

      // Fundo
      const grad = ctx.createLinearGradient(0, 0, 0, height);
      grad.addColorStop(0, '#101c4a');
      grad.addColorStop(0.5, '#1e1a52');
      grad.addColorStop(1, '#32195e');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);

      // Estrelas
      ctx.fillStyle = '#ffffff';
      for (const s of bgStars) {
        s.twinkle += 0.02;
        ctx.globalAlpha = 0.25 + Math.sin(s.twinkle) * 0.25;
        ctx.beginPath();
        ctx.arc(s.x * width, s.y * height, s.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1.0;

      // Formas
      for (const shape of shapes) {
        shape.update();
        shape.draw(ctx);
      }

      // Rastro do dedinho
      for (let i = touchTrail.length - 1; i >= 0; i--) {
        const tr = touchTrail[i];
        tr.life -= 0.04;
        if (tr.life <= 0) {
          touchTrail.splice(i, 1);
        } else {
          ctx.save();
          ctx.globalAlpha = tr.life * 0.75;
          ctx.fillStyle = tr.color;
          drawStar(ctx, tr.x, tr.y, 5, 8 * tr.life, 4 * tr.life);
          ctx.restore();
        }
      }

      // Corujinha Companheira
      companionOwl.update();
      companionOwl.draw(ctx);

      // Partículas
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        if (p.life <= 0) {
          particles.splice(i, 1);
        } else {
          p.draw(ctx);
        }
      }

      requestAnimationFrame(gameLoop);
    }
    requestAnimationFrame(gameLoop);

    // ==========================================
    // 7. KRUUJ SDK & LOADER
    // ==========================================
    const KruujLoader = (() => {
      const $ = id => document.getElementById(id);
      let target = 0, shown = 0, cfg = {}, t0 = 0, raf = null, tipTimer = null, finished = false, closing = false;
      const wait = ms => new Promise(r => setTimeout(r, ms));
      function frame() {
        if (!cfg.manual && !finished) target = Math.min(0.9, target + 0.004 * (1 - target) + 0.0015);
        shown += (target - shown) * 0.08;
        if (finished && target - shown < 0.002) shown = target;
        const pc = Math.round(shown * 100);
        if ($('kl-fill')) $('kl-fill').style.width = pc + '%';
        if ($('kl-rider')) $('kl-rider').style.left = pc + '%';
        if ($('kl-pct')) $('kl-pct').textContent = pc + '%';
        if (shown >= 1 && performance.now() - t0 >= cfg.minTime) return close();
        raf = requestAnimationFrame(frame);
      }
      async function close() {
        if (closing) return; closing = true; clearInterval(tipTimer);
        const kl = $('kl');
        if (kl) {
          kl.classList.add('out');
          await wait(650);
          kl.style.display = 'none';
        }
        if (cfg.onComplete) cfg.onComplete();
      }
      async function start(c) {
        cfg = { gameName: 'Formas & Cores Mágicas', tagline: '', tips: [], splash: 2000, minTime: 2800, manual: false, onComplete() {}, ...c };
        target = shown = 0; finished = closing = false;
        const kl = $('kl');
        if (!kl) return;
        kl.style.display = ''; kl.classList.remove('out');
        const [sp, ld] = kl.querySelectorAll('.ph');
        if (sp) sp.classList.remove('off');
        if (ld) ld.classList.add('off');
        $('kl-name').textContent = cfg.gameName;
        $('kl-tag').textContent = cfg.tagline;
        document.title = cfg.gameName + ' – Kruuj Studio';
        await wait(cfg.splash);
        if (sp) sp.classList.add('off');
        await wait(400);
        if (ld) ld.classList.remove('off');
        t0 = performance.now();
        let i = 0;
        const tip = $('kl-tip');
        const nextTip = () => {
          if (!tip) return;
          tip.style.opacity = '0';
          setTimeout(() => {
            tip.textContent = cfg.tips[i++ % cfg.tips.length] || '';
            tip.style.opacity = '0.85';
          }, 350);
        };
        if (cfg.tips.length) { nextTip(); tipTimer = setInterval(nextTip, 3000); }
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(frame);
      }
      return {
        start,
        finish() { finished = true; target = 1; }
      };
    })();

    window.addEventListener('DOMContentLoaded', () => {
      // KruujSDK
      if (window.KruujSDK) {
        window.KruujSDK.init().then(() => {
          window.KruujSDK.gameLoadingFinished();
          window.KruujSDK.gameplayStart();
        }).catch(() => {});
      }

      // Standalone KruujLoader
      if (window.self === window.top) {
        KruujLoader.start({
          gameName: tG.title,
          tagline: tG.tagline,
          tips: tG.tips,
          splash: 1800,
          minTime: 2600
        });
        setTimeout(() => KruujLoader.finish(), 2400);
      }
    });
  </script>
</body>
