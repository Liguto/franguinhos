<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>KRUUJ GUARDIANS: Defesa Cósmica</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07061a;
      --cyan: #38e8ff;
      --purple: #8b5cff;
      --gold: #ffb020;
      --pink: #ff5ca8;
      --red: #ef4444;
      --blue: #3b82f6;
      --green: #10b981;
      --yellow: #eab308;
      --text: #f3f0ff;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Baloo 2', sans-serif;
    }
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .hud {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }
    .hud-pill {
      background: rgba(13, 18, 36, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border-radius: 9999px;
      padding: 6px 14px;
      font-size: 0.95rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }
    /* Menu Inferior Estilo Bloons TD */
    .towers-dock {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      background: rgba(13, 18, 36, 0.88);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 8px 12px;
      z-index: 10;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }
    .tower-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 6px 10px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.06);
      border: 1.5px solid transparent;
      color: #fff;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
      min-width: 62px;
    }
    .tower-btn.selected {
      border-color: var(--cyan);
      background: rgba(56, 232, 255, 0.18);
      box-shadow: 0 0 15px rgba(56, 232, 255, 0.35);
      transform: translateY(-2px);
    }
    .tower-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .tower-icon {
      font-size: 1.35rem;
    }
    .tower-name {
      font-size: 0.7rem;
      font-weight: 800;
      color: #cbd5e1;
    }
    .tower-cost {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--gold);
    }
    /* Painel de Upgrade de Coruja Selecionada */
    .upgrade-card {
      position: fixed;
      bottom: 85px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(13, 18, 36, 0.92);
      border: 1.5px solid var(--cyan);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 12;
      box-shadow: 0 0 20px rgba(56, 232, 255, 0.3);
    }
    .upgrade-info {
      display: flex;
      flex-direction: column;
    }
    .upgrade-title {
      font-size: 0.85rem;
      font-weight: 800;
      color: #fff;
    }
    .upgrade-stats {
      font-size: 0.72rem;
      color: #94a3b8;
    }
    .btn-upgrade {
      background: linear-gradient(135deg, #0284c7, #8b5cff);
      color: #fff;
      border: none;
      border-radius: 9999px;
      padding: 6px 14px;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-sell {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #f87171;
      border-radius: 9999px;
      padding: 6px 10px;
      font-size: 0.75rem;
      font-weight: 800;
      cursor: pointer;
    }
    /* Overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(13, 18, 36, 0.92) 0%, rgba(7, 6, 26, 0.98) 100%);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    h1 {
      font-size: clamp(28px, 7vw, 48px);
      font-weight: 800;
      background: linear-gradient(135deg, var(--cyan), var(--purple), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    p {
      font-size: 0.95rem;
      color: #cbd5e1;
      max-width: 440px;
      line-height: 1.4;
      margin-bottom: 20px;
    }
    .btn-action {
      background: linear-gradient(135deg, #0284c7 0%, #8b5cff 100%);
      color: #fff;
      border: none;
      border-radius: 9999px;
      padding: 12px 38px;
      font-size: 1.15rem;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(56, 232, 255, 0.4);
      transition: all 0.2s;
    }
    .btn-action:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <div class="hud">
    <div class="hud-pill">ESTRELAS: <span id="energy" style="color: var(--gold);">120</span> ⭐</div>
    <div class="hud-pill">VIDAS: <span id="lives" style="color: #ff5ca8;">20</span> ❤️</div>
    <div class="hud-pill">ONDA: <span id="wave" style="color: var(--cyan);">1</span> 🎈</div>
  </div>

  <div class="upgrade-card" id="upgradeCard" style="display: none;">
    <div class="upgrade-info">
      <span class="upgrade-title" id="upgTitle">Coruja Arqueira</span>
      <span class="upgrade-stats" id="upgStats">Nível 1 • Alcance 120</span>
    </div>
    <button class="btn-upgrade" id="btnUpgradeTower" onclick="upgradeSelectedTower()">Melhorar (60 ⭐)</button>
    <button class="btn-sell" onclick="sellSelectedTower()">Vender</button>
  </div>

  <!-- Dock de Corujas Guardiãs (Estilo Bloons TD) -->
  <div class="towers-dock">
    <button class="tower-btn selected" id="btnT1" onclick="selectTowerType(0)">
      <span class="tower-icon">🦉</span>
      <span class="tower-name">Arqueira</span>
      <span class="tower-cost">75 ⭐</span>
    </button>
    <button class="tower-btn" id="btnT2" onclick="selectTowerType(1)">
      <span class="tower-icon">❄️</span>
      <span class="tower-name">Gelo</span>
      <span class="tower-cost">120 ⭐</span>
    </button>
    <button class="tower-btn" id="btnT3" onclick="selectTowerType(2)">
      <span class="tower-icon">⚡</span>
      <span class="tower-name">Raio</span>
      <span class="tower-cost">160 ⭐</span>
    </button>
    <button class="tower-btn" id="btnT4" onclick="selectTowerType(3)">
      <span class="tower-icon">✨</span>
      <span class="tower-name">Super</span>
      <span class="tower-cost">320 ⭐</span>
    </button>
  </div>

  <!-- Overlay -->
  <div class="overlay active" id="ov">
    <h1 id="ovTitle">KRUUJ GUARDIANS</h1>
    <p id="ovDesc">Inspirado nos clássicos de estourar balões! Posicione Corujas Guardiãs pelo caminho para estourar as ondas de Balões Cósmicos invasores antes que eles escapem!</p>
    <button class="btn-action" onclick="startGame()">DEFENDER NINHO 🦉</button>
  </div>

  <script>
    // ===== Telemetria e Sincronização em Nuvem KRUUJ =====
    function sendEvent(type, data = {}) {
      try {
        window.parent.postMessage({ type, gameSlug: 'kruuj-defense', ...data }, '*');
      } catch (e) {}
    }
    sendEvent('game_loaded');

    let bestWave = parseInt(localStorage.getItem('kruuj_defense_best') || '1', 10);

    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'load_cloud_save' && e.data.saveData) {
        try {
          const d = typeof e.data.saveData === 'string' ? JSON.parse(e.data.saveData) : e.data.saveData;
          if (d && d.bestWave) {
            bestWave = Math.max(bestWave, d.bestWave);
            localStorage.setItem('kruuj_defense_best', String(bestWave));
          }
        } catch(err){}
      }
    });

    // ===== Som Temático Sintético (Estilo Bloons TD + Coruja) =====
    let audioCtx = null;
    function getAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    // Som clássico e gostoso de estourar balão: "POP!"
    function playBloonPop(pitch = 1) {
      try {
        const ctx = getAudio();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        // Salto rápido de frequência que simula o estouro de borracha
        osc.type = 'triangle';
        const startFreq = (550 + Math.random() * 80) * pitch;
        osc.frequency.setValueAtTime(startFreq, now);
        osc.frequency.exponentialRampToValueAtTime(80 * pitch, now + 0.05);

        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.06);
      } catch (e) {}
    }

    // Piadinho alegre da coruja ao colocar ou melhorar torre
    function playOwlHoot() {
      try {
        const ctx = getAudio();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(560, now + 0.08);
        osc.frequency.exponentialRampToValueAtTime(400, now + 0.2);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.12, now + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.22);
      } catch(e) {}
    }

    // Disparo de pena (Feather shoot)
    function playDartShoot() {
      try {
        const ctx = getAudio();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(700, now);
        osc.frequency.exponentialRampToValueAtTime(300, now + 0.06);

        gain.gain.setValueAtTime(0.04, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.06);
      } catch(e) {}
    }

    // ===== Engine KRUUJ Guardians (Bloons TD Style) =====
    const cv = document.getElementById('c');
    const ctx = cv.getContext('2d');
    let W = cv.width = window.innerWidth;
    let H = cv.height = window.innerHeight;

    window.addEventListener('resize', () => {
      W = cv.width = window.innerWidth;
      H = cv.height = window.innerHeight;
      buildWaypoints();
    });

    let state = 'menu';
    let energy = 120;
    let lives = 20;
    let wave = 1;
    let selectedTowerIndex = 0;
    let activePlacedTower = null;

    let waypoints = [];
    let bloons = [];
    let towers = [];
    let darts = [];
    let particles = [];
    let spawnTimer = 0;
    let bloonsQueue = [];

    // Tipos de Corujas Guardiãs (Como os macacos de Bloons TD)
    const TOWER_TYPES = [
      {
        name: 'Coruja Arqueira', cost: 75, range: 120, rate: 16, damage: 1,
        color: '#8b5cff', icon: '🦉', projColor: '#ffb020', projSpeed: 10,
        upgradeCost: 60, desc: 'Atira penas afiadas velozes'
      },
      {
        name: 'Coruja Glacial', cost: 120, range: 100, rate: 30, damage: 1, slow: 0.5,
        color: '#38e8ff', icon: '❄️', projColor: '#38e8ff', projSpeed: 8,
        upgradeCost: 90, desc: 'Congela e desacelera balões'
      },
      {
        name: 'Coruja de Raio', cost: 160, range: 130, rate: 24, damage: 2, chain: 3,
        color: '#eab308', icon: '⚡', projColor: '#facc15', projSpeed: 12,
        upgradeCost: 110, desc: 'Eletrocuta múltiplos balões'
      },
      {
        name: 'Super Coruja', cost: 320, range: 155, rate: 6, damage: 1,
        color: '#ff5ca8', icon: '✨', projColor: '#ff5ca8', projSpeed: 15,
        upgradeCost: 200, desc: 'Super rajada cósmica veloz'
      }
    ];

    // Camadas de Balões (Bloons TD Layers)
    // Red (1) -> pops
    // Blue (2) -> drops Red
    // Green (3) -> drops Blue
    // Yellow (4) -> drops Green
    // Ceramic (5) -> drops Yellow
    const BLOON_LAYERS = [
      null, // index 0
      { color: '#ef4444', speed: 1.5, r: 12, points: 1 },  // 1: Red
      { color: '#3b82f6', speed: 1.8, r: 13, points: 2 },  // 2: Blue
      { color: '#10b981', speed: 2.2, r: 14, points: 3 },  // 3: Green
      { color: '#eab308', speed: 2.8, r: 15, points: 4 },  // 4: Yellow
      { color: '#a855f7', speed: 1.6, r: 16, points: 6, hp: 3 } // 5: Ceramic
    ];

    function selectTowerType(idx) {
      selectedTowerIndex = idx;
      activePlacedTower = null;
      document.getElementById('upgradeCard').style.display = 'none';
      [0, 1, 2, 3].forEach(i => {
        document.getElementById('btnT' + (i + 1)).classList.toggle('selected', i === idx);
      });
    }

    function buildWaypoints() {
      // Percurso sinuoso e divertido de Bloons TD
      waypoints = [
        { x: -20, y: H * 0.22 },
        { x: W * 0.28, y: H * 0.22 },
        { x: W * 0.28, y: H * 0.72 },
        { x: W * 0.62, y: H * 0.72 },
        { x: W * 0.62, y: H * 0.32 },
        { x: W * 0.88, y: H * 0.32 },
        { x: W * 0.88, y: H * 0.82 },
        { x: W + 30, y: H * 0.82 }
      ];
    }
    buildWaypoints();

    function startGame() {
      state = 'play';
      energy = 120;
      lives = 20;
      wave = 1;
      bloons = [];
      towers = [];
      darts = [];
      particles = [];
      activePlacedTower = null;
      document.getElementById('upgradeCard').style.display = 'none';

      prepareWave(1);
      updateHud();
      sendEvent('game_start');
      document.getElementById('ov').classList.remove('active');
    }

    function prepareWave(w) {
      bloonsQueue = [];
      spawnTimer = 0;

      // Cria fila de balões progressiva da onda
      const redCount = Math.max(0, 10 - w);
      const blueCount = Math.min(15, w * 3);
      const greenCount = w >= 2 ? Math.min(12, (w - 1) * 3) : 0;
      const yellowCount = w >= 4 ? Math.min(10, (w - 3) * 2) : 0;
      const ceramicCount = w >= 6 ? Math.min(6, (w - 5)) : 0;

      for (let i = 0; i < redCount; i++) bloonsQueue.push(1);
      for (let i = 0; i < blueCount; i++) bloonsQueue.push(2);
      for (let i = 0; i < greenCount; i++) bloonsQueue.push(3);
      for (let i = 0; i < yellowCount; i++) bloonsQueue.push(4);
      for (let i = 0; i < ceramicCount; i++) bloonsQueue.push(5);
    }

    function updateHud() {
      document.getElementById('energy').textContent = energy;
      document.getElementById('lives').textContent = lives;
      document.getElementById('wave').textContent = wave;
    }

    function showUpgradeCard(tower) {
      activePlacedTower = tower;
      const def = TOWER_TYPES[tower.type];
      const card = document.getElementById('upgradeCard');
      card.style.display = 'flex';
      document.getElementById('upgTitle').textContent = `${def.name} (Nível ${tower.level})`;
      document.getElementById('upgStats').textContent = `Dano ${def.damage + tower.level - 1} • Alcance ${Math.round(tower.range)}`;
      const cost = def.upgradeCost * tower.level;
      document.getElementById('btnUpgradeTower').textContent = `Melhorar (${cost} ⭐)`;
    }

    function upgradeSelectedTower() {
      if (!activePlacedTower) return;
      const def = TOWER_TYPES[activePlacedTower.type];
      const cost = def.upgradeCost * activePlacedTower.level;
      if (energy >= cost) {
        energy -= cost;
        activePlacedTower.level++;
        activePlacedTower.range *= 1.15;
        playOwlHoot();
        updateHud();
        showUpgradeCard(activePlacedTower);
      }
    }

    function sellSelectedTower() {
      if (!activePlacedTower) return;
      const def = TOWER_TYPES[activePlacedTower.type];
      energy += Math.floor(def.cost * 0.7);
      const idx = towers.indexOf(activePlacedTower);
      if (idx !== -1) towers.splice(idx, 1);
      activePlacedTower = null;
      document.getElementById('upgradeCard').style.display = 'none';
      updateHud();
      playBloonPop(0.8);
    }

    // Clique na tela (Colocar coruja ou selecionar)
    cv.addEventListener('pointerdown', (e) => {
      if (state !== 'play') return;
      if (e.clientY > H - 85) return; // Barra inferior

      // Checa se clicou em uma coruja existente
      for (let t of towers) {
        if (Math.hypot(t.x - e.clientX, t.y - e.clientY) < 26) {
          showUpgradeCard(t);
          return;
        }
      }

      // Se clicou fora, fecha card de upgrade
      activePlacedTower = null;
      document.getElementById('upgradeCard').style.display = 'none';

      const tDef = TOWER_TYPES[selectedTowerIndex];
      if (energy < tDef.cost) return;

      // Impede colocar em cima da rota
      for (let i = 0; i < waypoints.length - 1; i++) {
        const p1 = waypoints[i];
        const p2 = waypoints[i + 1];
        if (distToSegment({ x: e.clientX, y: e.clientY }, p1, p2) < 32) return;
      }

      // Impede sobrepor outra coruja
      for (let t of towers) {
        if (Math.hypot(t.x - e.clientX, t.y - e.clientY) < 38) return;
      }

      energy -= tDef.cost;
      updateHud();
      playOwlHoot();

      towers.push({
        x: e.clientX,
        y: e.clientY,
        type: selectedTowerIndex,
        level: 1,
        range: tDef.range,
        cooldown: 0,
        target: null
      });

      for (let i = 0; i < 10; i++) {
        particles.push({
          x: e.clientX, y: e.clientY,
          vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.5) * 5,
          r: 3, c: tDef.color, life: 1
        });
      }
    });

    function distToSegment(p, v, w) {
      const l2 = (v.x - w.x) ** 2 + (v.y - w.y) ** 2;
      if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
      let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
    }

    function spawnBloon(layer, x = waypoints[0].x, y = waypoints[0].y, wp = 1) {
      const info = BLOON_LAYERS[layer];
      bloons.push({
        x, y,
        layer,
        hp: info.hp || 1,
        speed: info.speed,
        r: info.r,
        targetWp: wp,
        slowTimer: 0
      });
    }

    // Estoura balão (Bloons TD pop logic)
    function popBloon(b, idx) {
      playBloonPop(b.layer * 0.25 + 0.8);
      energy += b.layer;
      updateHud();

      // Partículas de confete de borracha
      for (let i = 0; i < 7; i++) {
        particles.push({
          x: b.x, y: b.y,
          vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6,
          r: Math.random() * 3 + 2,
          c: BLOON_LAYERS[b.layer].color,
          life: 0.8
        });
      }

      const nextLayer = b.layer - 1;
      const bx = b.x;
      const by = b.y;
      const bWp = b.targetWp;
      bloons.splice(idx, 1);

      // Se ainda tinha camadas abaixo, gera o balão filho (ex: Azul vira Vermelho)
      if (nextLayer >= 1) {
        spawnBloon(nextLayer, bx, by, bWp);
      }
    }

    function gameOver() {
      state = 'over';
      bestWave = Math.max(bestWave, wave);
      localStorage.setItem('kruuj_defense_best', String(bestWave));

      sendEvent('game_over', { wave, bestWave });
      sendEvent('game_save', { saveData: { bestWave }, score: wave * 100 });

      document.getElementById('ovTitle').textContent = 'OVO CÓSMICO PROTEGIDO!';
      document.getElementById('ovDesc').textContent = `Você resistiu bravamente até a Onda ${wave} estourando os balões cósmicos! Melhore suas Corujas Guardiãs para ir além.`;
      document.getElementById('ov').classList.add('active');
    }

    // Loop
    function loop() {
      requestAnimationFrame(loop);

      ctx.fillStyle = '#07061a';
      ctx.fillRect(0, 0, W, H);

      // Desenha a Rota Cósmica
      ctx.strokeStyle = 'rgba(56, 232, 255, 0.18)';
      ctx.lineWidth = 42;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      waypoints.forEach((p, i) => {
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      });
      ctx.stroke();

      ctx.strokeStyle = 'rgba(139, 92, 246, 0.35)';
      ctx.lineWidth = 4;
      ctx.stroke();

      // Ninho no fim
      const endPt = waypoints[waypoints.length - 1];
      ctx.save();
      ctx.fillStyle = '#ff5ca8';
      ctx.shadowColor = '#ff5ca8';
      ctx.shadowBlur = 18;
      ctx.beginPath();
      ctx.arc(W - 25, endPt.y, 18, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Desenha círculo de alcance da coruja selecionada
      if (activePlacedTower) {
        ctx.strokeStyle = 'rgba(56, 232, 255, 0.5)';
        ctx.fillStyle = 'rgba(56, 232, 255, 0.08)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(activePlacedTower.x, activePlacedTower.y, activePlacedTower.range, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }

      if (state === 'play') {
        // Spawn de balões
        if (bloonsQueue.length > 0) {
          spawnTimer++;
          if (spawnTimer > 32) {
            spawnTimer = 0;
            const nextL = bloonsQueue.shift();
            spawnBloon(nextL);
          }
        } else if (bloons.length === 0) {
          wave++;
          energy += 50 + wave * 20;
          updateHud();
          prepareWave(wave);
        }

        // Atualiza Balões
        for (let i = bloons.length - 1; i >= 0; i--) {
          const b = bloons[i];
          const target = waypoints[b.targetWp];
          const dx = target.x - b.x;
          const dy = target.y - b.y;
          const dist = Math.hypot(dx, dy);

          const curSpeed = b.slowTimer > 0 ? b.speed * 0.5 : b.speed;
          if (b.slowTimer > 0) b.slowTimer--;

          if (dist < 5) {
            b.targetWp++;
            if (b.targetWp >= waypoints.length) {
              lives -= b.layer;
              updateHud();
              bloons.splice(i, 1);
              if (lives <= 0) {
                gameOver();
                return;
              }
              continue;
            }
          } else {
            b.x += (dx / dist) * curSpeed;
            b.y += (dy / dist) * curSpeed;
          }

          // Desenha Balão (Formato oval clássico de Bloons TD)
          const bInfo = BLOON_LAYERS[b.layer];
          ctx.save();
          ctx.translate(b.x, b.y);

          ctx.fillStyle = b.slowTimer > 0 ? '#38e8ff' : bInfo.color;
          ctx.beginPath();
          ctx.ellipse(0, 0, b.r * 0.85, b.r, 0, 0, Math.PI * 2);
          ctx.fill();

          // Nó do balão
          ctx.beginPath();
          ctx.moveTo(-3, b.r);
          ctx.lineTo(3, b.r);
          ctx.lineTo(0, b.r + 4);
          ctx.fill();

          // Brilho do balão
          ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
          ctx.beginPath();
          ctx.ellipse(-b.r * 0.3, -b.r * 0.35, 3, 5, -0.4, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();
        }

        // Atualiza Corujas
        towers.forEach(t => {
          const tDef = TOWER_TYPES[t.type];
          t.cooldown--;

          // Mira no balão mais avançado no caminho (First target rule)
          let bestTarget = null;
          let bestWpProgress = -1;

          for (let b of bloons) {
            const d = Math.hypot(b.x - t.x, b.y - t.y);
            if (d < t.range) {
              const progress = b.targetWp * 1000 - Math.hypot(waypoints[b.targetWp].x - b.x, waypoints[b.targetWp].y - b.y);
              if (progress > bestWpProgress) {
                bestWpProgress = progress;
                bestTarget = b;
              }
            }
          }

          t.target = bestTarget;

          if (t.target && t.cooldown <= 0) {
            t.cooldown = Math.max(4, tDef.rate - (t.level - 1) * 2);
            playDartShoot();

            darts.push({
              x: t.x, y: t.y,
              target: t.target,
              speed: tDef.projSpeed,
              damage: tDef.damage + (t.level - 1),
              color: tDef.projColor,
              slow: tDef.slow || 0,
              chain: tDef.chain || 0
            });
          }

          // Desenha a Coruja Guardiã com fones e bico
          ctx.save();
          ctx.translate(t.x, t.y);

          // Rotação encarando o alvo
          if (t.target) {
            const lookAngle = Math.atan2(t.target.y - t.y, t.target.x - t.x);
            ctx.rotate(lookAngle + Math.PI / 2);
          }

          // Plataforma
          ctx.fillStyle = '#1e1b4b';
          ctx.strokeStyle = tDef.color;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(0, 0, 18, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          // Corpo da Coruja
          ctx.fillStyle = tDef.color;
          ctx.beginPath();
          ctx.arc(0, 0, 14, 0, Math.PI * 2);
          ctx.fill();

          // Olhos
          ctx.fillStyle = '#fff';
          [-5, 5].forEach(ox => {
            ctx.beginPath();
            ctx.arc(ox, -3, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffb020';
            ctx.beginPath();
            ctx.arc(ox, -3, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fff';
          });

          // Bico
          ctx.fillStyle = '#f59e0b';
          ctx.beginPath();
          ctx.moveTo(-2, 2);
          ctx.lineTo(2, 2);
          ctx.lineTo(0, 7);
          ctx.fill();

          ctx.restore();
        });

        // Atualiza Dardos/Penas
        for (let i = darts.length - 1; i >= 0; i--) {
          const d = darts[i];
          const dx = d.target.x - d.x;
          const dy = d.target.y - d.y;
          const dist = Math.hypot(dx, dy);

          if (dist < 12 || !bloons.includes(d.target)) {
            // Acertou balão
            if (bloons.includes(d.target)) {
              if (d.slow) d.target.slowTimer = 45;
              d.target.hp -= d.damage;
              if (d.target.hp <= 0) {
                const idx = bloons.indexOf(d.target);
                if (idx !== -1) popBloon(d.target, idx);
              }
            }
            darts.splice(i, 1);
          } else {
            d.x += (dx / dist) * d.speed;
            d.y += (dy / dist) * d.speed;

            // Desenha pena afiada
            ctx.save();
            ctx.translate(d.x, d.y);
            ctx.rotate(Math.atan2(dy, dx));
            ctx.fillStyle = d.color;
            ctx.beginPath();
            ctx.ellipse(0, 0, 7, 3, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        }
      }

      // Partículas
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life -= 0.04;
        if (pt.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.fillStyle = pt.c;
        ctx.globalAlpha = pt.life;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.r * pt.life, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    loop();
  </script>
