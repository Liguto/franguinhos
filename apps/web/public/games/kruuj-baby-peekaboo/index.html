  <style>
    :root {
      --bg-top: #151b4d;
      --bg-bottom: #2e1a5a;
      --purple: #8338fc;
      --blue: #289afd;
      --orange: #fda41d;
      --pink: #ff65a6;
      --yellow: #ffd043;
      --green: #48e59b;
      --lav: #d8d4fd;
      --white: #ffffff;
      --navy: #151c4a;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 25%, var(--bg-top), var(--bg-bottom));
      color: var(--white);
      font-family: 'Baloo 2', system-ui, sans-serif;

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    /* HUD Superior — Recuo de 68px no mobile obrigatório */

    .splash .owl { width: min(34vw, 150px); aspect-ratio: 1; border-radius: 50%; animation: pop 0.9s cubic-bezier(.2,1.3,.4,1) both, glow 2.4s ease-in-out 0.9s infinite; }

    @keyframes glow { 0%, 100% { box-shadow: 0 0 30px 2px #8338fc55; } 50% { box-shadow: 0 0 64px 10px #8338fc99; } }

<body>
  <!-- KruujLoader Oficial -->
  <div id="kl" role="status" aria-live="polite" aria-label="Carregando">

      <p class="sub">STUDIO</p>
    </div>
    <div class="ph load off">
      <h1 id="kl-name">KRUUJ Cadê a Corujinha?</h1>
      <p class="tag" id="kl-tag">Onde a corujinha está escondida?</p>
      <div class="track">
        <div class="fill" id="kl-fill"></div>
        <img class="rider" id="kl-rider" alt="" src="/kruuj-avatar.png">
      </div>
      <div class="pct" id="kl-pct">0%</div>
      <p class="tip" id="kl-tip"></p>
    </div>
    <div class="brand" id="kl-brand">Kruuj Studio</div>
  </div>

  <!-- HUD do Jogo -->
  <header class="hud">
    <div class="hud-badge" id="roundBadge">
      <span>🎯</span>
      <span id="roundText">Fase 1</span>

    </div>

  <!-- Banner Gigante de Celebração -->
  <div class="peekaboo-banner" id="peekabooBanner">ACHOU! 🦉</div>
  <div class="toast-msg" id="toastMsg">Onde está a corujinha?</div>

  <!-- Canvas Principal -->
  <canvas id="gameCanvas"></canvas>

  <script>
    // ==========================================
    // 1. ÁUDIO SINTÉTICO (WEBAUDIO & WEBSPEECH)
    // ==========================================
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Voz Amigável via Web Speech API
    let lastSpokenTime = 0;
    function speakText(text) {
      const now = Date.now();
      if (now - lastSpokenTime < 1600) return;
      lastSpokenTime = now;

      if ('speechSynthesis' in window) {
        try {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(text);
          utter.lang = IS_PT ? 'pt-BR' : (IS_ES ? 'es-ES' : 'en-US');
          utter.rate = 0.95;
          utter.pitch = 1.25;
          window.speechSynthesis.speak(utter);
        } catch (e) {}
      }
    }

    // Fanfarra Triunfal ao Encontrar a Corujinha ("Ta-daaa!")
    function playFanfareSound() {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const notes = [523.25, 659.25, 783.99, 1046.5]; // Dó, Mi, Sol, Dó maior
      notes.forEach((freq, idx) => {
        const t = now + idx * 0.1;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, t);

        gain.gain.setValueAtTime(0.001, t);
        gain.gain.linearRampToValueAtTime(0.32, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.45);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.48);
      });
    }

    // Risadinha / Piu-piu amigável da Coruja
    function playOwlChirp() {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      [0, 0.12].forEach((offset, idx) => {
        const t = now + offset;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        const startF = idx === 0 ? 740 : 880;
        const endF = idx === 0 ? 1220 : 1480;
        osc.frequency.setValueAtTime(startF, t);
        osc.frequency.exponentialRampToValueAtTime(endF, t + 0.1);

        gain.gain.setValueAtTime(0.001, t);
        gain.gain.linearRampToValueAtTime(0.25, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.13);
      });
    }

    // Som de Mola Boing
    function playBoingSound() {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(280, now);
      osc.frequency.exponentialRampToValueAtTime(750, now + 0.18);
      osc.frequency.exponentialRampToValueAtTime(400, now + 0.32);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.24, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.36);
    }

    // Som de Shuffle / Troca de Lugar Suave
    function playShuffleSound() {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.linearRampToValueAtTime(600, now + 0.15);
      osc.frequency.linearRampToValueAtTime(350, now + 0.3);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.15, now + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.33);
    }

    // ==========================================
    // 2. CANVAS & RESPONSIVIDADE
    // ==========================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let width = 0;
    let height = 0;
    let starScore = 0;
    let currentRound = 1;

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
      updateHidingPositions();
    }
    window.addEventListener('resize', resize);

    let bannerTimeout = null;
    function showPeekabooBanner(text) {
      const banner = document.getElementById('peekabooBanner');
      banner.textContent = text;
      banner.classList.add('show');
      if (bannerTimeout) clearTimeout(bannerTimeout);
      bannerTimeout = setTimeout(() => {
        banner.classList.remove('show');
      }, 2000);
    }

    let toastTimeout = null;
    function showToast(text) {
      const toast = document.getElementById('toastMsg');
      toast.textContent = text;
      toast.classList.add('show');
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 1800);
    }

    // Partículas de Confetes e Estrelas
    let particles = [];
    class Particle {
      constructor(x, y, color, speed = 5, size = 8, shape = 'star') {
        this.x = x;
        this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const spd = Math.random() * speed + 2;
        this.vx = Math.cos(angle) * spd;
        this.vy = Math.sin(angle) * spd - 2;
        this.size = Math.random() * size + 5;
        this.life = 1.0;
        this.decay = Math.random() * 0.02 + 0.012;
        this.shape = shape;
        this.rot = Math.random() * Math.PI;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.08;
        this.life -= this.decay;
        this.rot += 0.04;
      }
      draw(ctx) {
        if (this.life <= 0) return;
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rot);

        if (this.shape === 'heart') {
          drawHeart(ctx, 0, 0, this.size);
        } else if (this.shape === 'star') {
          drawStar(ctx, 0, 0, 5, this.size, this.size * 0.45);
        } else {
          ctx.beginPath();
          ctx.arc(0, 0, this.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
    }

    function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius) {
      let rot = Math.PI / 2 * 3;
      let x = cx;
      let y = cy;
      const step = Math.PI / spikes;
      ctx.beginPath();
      ctx.moveTo(cx, cy - outerRadius);
      for (let i = 0; i < spikes; i++) {
        x = cx + Math.cos(rot) * outerRadius;
        y = cy + Math.sin(rot) * outerRadius;
        ctx.lineTo(x, y);
        rot += step;
        x = cx + Math.cos(rot) * innerRadius;
        y = cy + Math.sin(rot) * innerRadius;
        ctx.lineTo(x, y);
        rot += step;
      }
      ctx.lineTo(cx, cy - outerRadius);
      ctx.closePath();
      ctx.fill();
    }

    function drawHeart(ctx, x, y, size) {
      ctx.beginPath();
      const topCurveHeight = size * 0.3;
      ctx.moveTo(x, y + topCurveHeight);
      ctx.bezierCurveTo(x, y, x - size / 2, y, x - size / 2, y + topCurveHeight);
      ctx.bezierCurveTo(x - size / 2, y + (size + topCurveHeight) / 2, x, y + (size + topCurveHeight) / 2, x, y + size);
      ctx.bezierCurveTo(x, y + (size + topCurveHeight) / 2, x + size / 2, y + (size + topCurveHeight) / 2, x + size / 2, y + topCurveHeight);
      ctx.bezierCurveTo(x + size / 2, y, x, y, x, y + topCurveHeight);
      ctx.fill();
    }

    function createCelebration(x, y, count = 30) {
      const colors = ['#ffd043', '#ff65a6', '#289afd', '#48e59b', '#8338fc', '#ffffff'];
      for (let i = 0; i < count; i++) {
        const c = colors[Math.floor(Math.random() * colors.length)];
        const shape = Math.random() > 0.6 ? 'heart' : (Math.random() > 0.3 ? 'star' : 'circle');
        particles.push(new Particle(x, y, c, 7, 10, shape));
      }
    }

    // ==========================================
    // 3. ESCONDERIJOS COM PROGRESSÃO EM ROUNDS
    // ==========================================
    class HidingSpot {
      constructor(type, name, color, surpriseKey) {
        this.type = type; // 'cloud', 'gift', 'bush', 'planet', 'shell', 'star'
        this.name = name;
        this.color = color;
        this.surpriseKey = surpriseKey;
        this.x = 0;
        this.y = 0;
        this.targetX = 0;
        this.targetY = 0;
        this.scale = 1.0;
        this.targetScale = 1.0;
        this.wobble = Math.random() * Math.PI * 2;
      }

      hitTest(px, py) {
        return Math.hypot(px - this.x, py - this.y) < 68 * this.scale;
      }

      animateSurprise() {
        this.scale = 1.4;
        setTimeout(() => { this.scale = 1.0; }, 240);
        playBoingSound();
        createCelebration(this.x, this.y, 14);
        showToast(tG[this.surpriseKey]);
        starScore += 1;
        document.getElementById('starCount').textContent = starScore;
      }

      update() {
        this.scale += (this.targetScale - this.scale) * 0.12;
        this.x += (this.targetX - this.x) * 0.1;
        this.y += (this.targetY - this.y) * 0.1;
      }

      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.scale(this.scale, this.scale);

        if (this.type === 'cloud') {
          // Nuvem de Algodão Doce
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(0, 0, 42, 0, Math.PI * 2);
          ctx.arc(-32, 8, 30, 0, Math.PI * 2);
          ctx.arc(32, 8, 30, 0, Math.PI * 2);
          ctx.arc(-16, 20, 28, 0, Math.PI * 2);
          ctx.arc(16, 20, 28, 0, Math.PI * 2);
          ctx.fill();

          // Rostinho sorrindo
          ctx.strokeStyle = '#6366f1';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(-14, 6, 6, 0.2 * Math.PI, 0.8 * Math.PI);
          ctx.arc(14, 6, 6, 0.2 * Math.PI, 0.8 * Math.PI);
          ctx.stroke();

          ctx.fillStyle = '#f472b6';
          ctx.beginPath();
          ctx.arc(-22, 12, 5, 0, Math.PI * 2);
          ctx.arc(22, 12, 5, 0, Math.PI * 2);
          ctx.fill();

        } else if (this.type === 'gift') {
          // Presente Lilás
          ctx.fillStyle = '#a855f7';
          ctx.beginPath();
          ctx.roundRect(-42, -28, 84, 76, 14);
          ctx.fill();

          ctx.fillStyle = '#9333ea';
          ctx.beginPath();
          ctx.roundRect(-48, -42, 96, 22, 10);
          ctx.fill();

          ctx.fillStyle = '#ffd043';
          ctx.fillRect(-10, -42, 20, 90);
          ctx.fillRect(-42, 4, 84, 18);

          ctx.beginPath();
          ctx.ellipse(-14, -48, 14, 9, -0.4, 0, Math.PI * 2);
          ctx.ellipse(14, -48, 14, 9, 0.4, 0, Math.PI * 2);
          ctx.fill();

        } else if (this.type === 'bush') {
          // Arbusto Cósmico
          ctx.fillStyle = '#10b981';
          ctx.beginPath();
          ctx.arc(0, -6, 44, 0, Math.PI * 2);
          ctx.arc(-30, 10, 32, 0, Math.PI * 2);
          ctx.arc(30, 10, 32, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#ffd043';
          ctx.beginPath();
          ctx.arc(-16, -14, 8, 0, Math.PI * 2);
          ctx.arc(18, -10, 8, 0, Math.PI * 2);
          ctx.fill();

        } else if (this.type === 'planet') {
          // Planeta com Anéis
          ctx.fillStyle = '#38bdf8';
          ctx.beginPath();
          ctx.arc(0, 0, 40, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = '#ffd043';
          ctx.lineWidth = 10;
          ctx.beginPath();
          ctx.ellipse(0, 0, 68, 20, -0.3, 0, Math.PI * 2);
          ctx.stroke();

          ctx.fillStyle = '#0f172a';
          ctx.beginPath();
          ctx.arc(-12, -4, 5, 0, Math.PI * 2);
          ctx.arc(12, -4, 5, 0, Math.PI * 2);
          ctx.fill();

        } else if (this.type === 'shell') {
          // Concha do Mar Encantada
          ctx.fillStyle = '#ff65a6';
          ctx.beginPath();
          ctx.arc(0, 0, 42, Math.PI, 0);
          ctx.lineTo(0, 26);
          ctx.closePath();
          ctx.fill();

          // Pérola no centro
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(0, -4, 14, 0, Math.PI * 2);
          ctx.fill();

        } else {
          // Estrela Mágica Dourada
          ctx.fillStyle = '#ffd043';
          drawStar(ctx, 0, 0, 5, 46, 22);

          ctx.fillStyle = '#0f172a';
          ctx.beginPath();
          ctx.arc(-10, -4, 4, 0, Math.PI * 2);
          ctx.arc(10, -4, 4, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }
    }

    const allSpots = [
      new HidingSpot('cloud', 'Nuvem', '#bae6fd', 'cloudSurprise'),
      new HidingSpot('gift', 'Presente', '#c084fc', 'giftSurprise'),
      new HidingSpot('bush', 'Arbusto', '#86efac', 'bushSurprise'),
      new HidingSpot('planet', 'Planeta', '#7dd3fc', 'planetSurprise'),
      new HidingSpot('shell', 'Concha', '#fbcfe8', 'shellSurprise'),
      new HidingSpot('star', 'Estrela', '#fde047', 'starSurprise')
    ];

    // Quantidade de esconderijos por Round:
    // Round 1: 2 spots (fácil e direto)
    // Round 2: 3 spots
    // Round 3: 4 spots (com shuffle suave)
    // Round 4+: 5 a 6 spots (com rotação divertida)
    function getActiveSpotsCount() {
      if (currentRound === 1) return 2;
      if (currentRound === 2) return 3;
      if (currentRound === 3) return 4;
      if (currentRound === 4) return 5;
      return 6;
    }

    function getActiveSpots() {
      return allSpots.slice(0, getActiveSpotsCount());
    }

    function updateHidingPositions() {
      const active = getActiveSpots();
      const count = active.length;
      const isMobile = width < 768;

      if (count === 2) {
        active[0].targetX = width * 0.32; active[0].targetY = height * 0.52;
        active[1].targetX = width * 0.68; active[1].targetY = height * 0.52;
      } else if (count === 3) {
        active[0].targetX = width * 0.25; active[0].targetY = height * 0.52;
        active[1].targetX = width * 0.50; active[1].targetY = height * 0.44;
        active[2].targetX = width * 0.75; active[2].targetY = height * 0.52;
      } else if (count === 4) {
        active[0].targetX = width * 0.28; active[0].targetY = height * 0.38;
        active[1].targetX = width * 0.72; active[1].targetY = height * 0.38;
        active[2].targetX = width * 0.28; active[2].targetY = height * 0.68;
        active[3].targetX = width * 0.72; active[3].targetY = height * 0.68;
      } else {
        const cols = isMobile ? 2 : 3;
        const rows = Math.ceil(count / cols);
        active.forEach((s, i) => {
          const c = i % cols;
          const r = Math.floor(i / cols);
          s.targetX = (c + 1) * (width / (cols + 1));
          s.targetY = height * 0.32 + r * (height * 0.36);
        });
      }

      active.forEach(s => {
        if (s.x === 0 && s.y === 0) {
          s.x = s.targetX;
          s.y = s.targetY;
        }
      });
    }

    // ==========================================
    // 4. A CORUJINHA KRUUJ ESCONDIDA
    // ==========================================
    const owl = {
      spotIndex: 0,
      isRevealed: false,
      revealScale: 0.1,
      peekOffset: 0,
      peekTimer: 0,
      wobble: 0,

      hide() {
        this.isRevealed = false;
        this.revealScale = 0.1;
        const activeCount = getActiveSpotsCount();
        this.spotIndex = Math.floor(Math.random() * activeCount);
      },

      reveal() {
        this.isRevealed = true;
        this.revealScale = 0.2;
        playFanfareSound();
        playOwlChirp();

        showPeekabooBanner(tG.peekaboo);
        speakText(tG.voiceFound);
        starScore += 5;
        document.getElementById('starCount').textContent = starScore;

        const currentSpot = allSpots[this.spotIndex];
        createCelebration(currentSpot.x, currentSpot.y, 45);

        // Avança de Round após a comemoração
        setTimeout(() => {
          currentRound++;
          document.getElementById('roundText').textContent = `${tG.roundLabel} ${currentRound}`;
          showToast(`${tG.roundLabel} ${currentRound}!`);

          // Se estiver na Fase 3+, faz shuffle suave
          if (currentRound >= 3) {
            playShuffleSound();
          }

          updateHidingPositions();
          this.hide();
        }, 2200);
      },

      update() {
        this.wobble += 0.05;
        this.peekTimer += 0.04;
        // As orelhinhas espiam ritmicamente
        this.peekOffset = Math.sin(this.peekTimer) * 14;

        if (this.isRevealed && this.revealScale < 1.0) {
          this.revealScale += (1.0 - this.revealScale) * 0.18;
        }
      },

      drawBehind(ctx) {
        if (this.isRevealed) return;
        const active = getActiveSpots();
        const s = active[this.spotIndex];
        if (!s) return;

        // Orelhinhas espiando atrás do esconderijo
        ctx.save();
        ctx.translate(s.x, s.y - 40 + this.peekOffset);

        ctx.fillStyle = '#8338fc';
        ctx.beginPath();
        ctx.moveTo(-28, 0); ctx.lineTo(-18, -32); ctx.lineTo(-4, -10); ctx.closePath(); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(28, 0); ctx.lineTo(18, -32); ctx.lineTo(4, -10); ctx.closePath(); ctx.fill();

        // Olhinhos grandes espiando
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-14, -6, 12, 0, Math.PI * 2);
        ctx.arc(14, -6, 12, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(-14, -6, 5, 0, Math.PI * 2);
        ctx.arc(14, -6, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      },

      drawRevealed(ctx) {
        if (!this.isRevealed) return;
        const active = getActiveSpots();
        const s = active[this.spotIndex];
        if (!s) return;

        ctx.save();
        ctx.translate(s.x, s.y - 45);
        ctx.scale(this.revealScale, this.revealScale);

        // Corpo Roxo KRUUJ
        ctx.fillStyle = '#8338fc';
        ctx.beginPath();
        ctx.arc(0, 0, 52, 0, Math.PI * 2);
        ctx.fill();

        // Orelhas
        ctx.beginPath();
        ctx.moveTo(-44, -16); ctx.lineTo(-32, -62); ctx.lineTo(-10, -42); ctx.closePath(); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(44, -16); ctx.lineTo(32, -62); ctx.lineTo(10, -42); ctx.closePath(); ctx.fill();

        // Peito Lilás
        ctx.fillStyle = '#d8d4fd';
        ctx.beginPath();
        ctx.ellipse(0, 14, 30, 34, 0, 0, Math.PI * 2);
        ctx.fill();

        // Olhos gigantes e brilhantes
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-18, -12, 16, 0, Math.PI * 2);
        ctx.arc(18, -12, 16, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(-18, -12, 7, 0, Math.PI * 2);
        ctx.arc(18, -12, 7, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-21, -15, 3.5, 0, Math.PI * 2);
        ctx.arc(15, -15, 3.5, 0, Math.PI * 2);
        ctx.fill();

        // Bochechas rosadas
        ctx.fillStyle = '#ff8cb0';
        ctx.beginPath();
        ctx.arc(-28, 8, 8, 0, Math.PI * 2);
        ctx.arc(28, 8, 8, 0, Math.PI * 2);
        ctx.fill();

        // Bico dourado
        ctx.fillStyle = '#ffd043';
        ctx.beginPath();
        ctx.moveTo(-8, 2); ctx.lineTo(8, 2); ctx.lineTo(0, 14); ctx.closePath(); ctx.fill();

        ctx.restore();
      }
    };

    // ==========================================
    // 5. TOQUE & INTERAÇÃO
    // ==========================================
    function handlePointerHit(x, y) {
      initAudio();
      if (owl.isRevealed) return;

      const active = getActiveSpots();
      for (let i = 0; i < active.length; i++) {
        const spot = active[i];
        if (spot.hitTest(x, y)) {
          if (i === owl.spotIndex) {
            spot.scale = 1.35;
            owl.reveal();
          } else {
            spot.animateSurprise();
          }
          return;
        }
      }
    }

    window.addEventListener('pointerdown', e => {
      if (e.clientY > 60) handlePointerHit(e.clientX, e.clientY);
    });

    window.addEventListener('touchstart', e => {
      e.preventDefault();
      for (let i = 0; i < e.touches.length; i++) {
        if (e.touches[i].clientY > 60) {
          handlePointerHit(e.touches[i].clientX, e.touches[i].clientY);
        }
      }
    }, { passive: false });

    // ==========================================
    // 6. LOOP DE ANIMAÇÃO GRÁFICA
    // ==========================================
    function gameLoop() {
      ctx.clearRect(0, 0, width, height);

      // Fundo Mágico Suave
      const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
      bgGrad.addColorStop(0, '#151b4d');
      bgGrad.addColorStop(0.5, '#251b54');
      bgGrad.addColorStop(1, '#3b1c61');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, width, height);

      // 1. Corujinha espiando atrás
      owl.update();
      owl.drawBehind(ctx);

      // 2. Esconderijos
      const active = getActiveSpots();
      for (const s of active) {
        s.update();
        s.draw(ctx);
      }

      // 3. Corujinha pulando na frente quando achada
      owl.drawRevealed(ctx);

      // 4. Confetes e Estrelas
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        p.draw(ctx);
        if (p.life <= 0) particles.splice(i, 1);
      }

      requestAnimationFrame(gameLoop);
    }
    requestAnimationFrame(gameLoop);

    // ==========================================
    // 7. KRUUJ SDK & LOADER
    // ==========================================
    // KruujLoader fornecido centralmente via /sdk/v1/kruuj-loader.js

    window.addEventListener('DOMContentLoaded', () => {
      resize();
      owl.hide();

      if (window.KruujSDK) {
        window.KruujSDK.init().then(() => {
          window.KruujSDK.gameLoadingFinished();
          window.KruujSDK.gameplayStart();
        }).catch(() => {});
      }

      document.getElementById('roundText').textContent = `${tG.roundLabel} 1`;

      if (window.self === window.top) {
        KruujLoader.start({
          gameName: tG.title,
          tagline: tG.tagline,
          tips: tG.tips,
          splash: 1800,
          minTime: 2600
        });
        setTimeout(() => KruujLoader.finish(), 2400);
      }
    });
  </script>
