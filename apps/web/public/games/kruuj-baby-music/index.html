<!DOCTYPE html>

<head>

    const URL_LANG = (new URLSearchParams(window.location.search).get('lang') || 'pt').toLowerCase();

  <style>
    :root {
      --bg-top: #0a0e2a;
      --bg-bottom: #1a1642;
      --purple: #8338fc;
      --blue: #289afd;
      --orange: #fda41d;
      --pink: #ff65a6;
      --yellow: #ffd043;
      --green: #48e59b;
      --lav: #d8d4fd;
      --white: #ffffff;
      --navy: #151c4a;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 30%, var(--bg-top), var(--bg-bottom));
      color: var(--white);
      font-family: 'Baloo 2', system-ui, sans-serif;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    /* HUD Superior de Controles — Recuo de segurança Poki 68px no mobile */
    .hud {
      position: fixed;
      top: 14px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
      gap: 8px;
    }

    @media (max-width: 768px) {
      .hud {
        padding-left: 68px !important;
      }
    }

    .hud-group {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }

    .hud-btn {
      background: rgba(21, 28, 74, 0.85);
      border: 2px solid rgba(131, 56, 252, 0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: var(--white);
      font-family: 'Baloo 2', system-ui, sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 8px 16px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      transition: all 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }

    .hud-btn:hover {
      transform: scale(1.05);
      border-color: var(--yellow);
    }

    .hud-btn:active {
      transform: scale(0.95);
    }

    .hud-btn.active {
      background: linear-gradient(135deg, #8338fc, #289afd);
      border-color: #ffd043;
      box-shadow: 0 0 16px rgba(131, 56, 252, 0.6);
    }

    .hud-badge {
      background: rgba(21, 28, 74, 0.85);
      border: 2px solid rgba(255, 208, 67, 0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 9999px;
      padding: 7px 14px;
      font-size: 0.95rem;
      font-weight: 800;
      color: #ffd043;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }

    /* Pílula de Nome da Forma / Notificação */
    .shape-pill {
      position: fixed;
      top: 75px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(255, 255, 255, 0.95);
      color: #3b1464;
      font-size: 1.2rem;
      font-weight: 800;
      padding: 8px 24px;
      border-radius: 9999px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
      pointer-events: none;
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      z-index: 20;
    }

    .shape-pill.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ===== KRUUJ LOADER OFICIAL ===== */
    #kl {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: radial-gradient(ellipse at 50% 40%, #101a52 0%, var(--bg-top) 65%);
      display: grid;
      place-items: center;
      padding: env(safe-area-inset-top, 0) 24px env(safe-area-inset-bottom, 0);
      transition: opacity 0.6s ease, visibility 0.6s;
    }
    #kl.out { opacity: 0; visibility: hidden; }
    #kl .ph { grid-area: 1/1; display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 440px; transition: opacity 0.5s ease; }
    #kl .ph.off { opacity: 0; pointer-events: none; }
    .splash .owl { width: min(34vw, 150px); aspect-ratio: 1; border-radius: 50%; animation: pop 0.9s cubic-bezier(.2,1.3,.4,1) both, glow 2.4s ease-in-out 0.9s infinite; }
    .splash .logo { width: min(54vw, 240px); height: auto; margin-top: 20px; animation: rise 0.8s ease 0.7s both; }
    .splash .sub { margin: 8px 0 0; font-weight: 600; font-size: 0.85rem; letter-spacing: 0.38em; padding-left: 0.38em; color: var(--lav); animation: rise 0.8s ease 1.1s both; }
    .load { text-align: center; }
    .load h1 { margin: 0; font-weight: 800; font-size: clamp(1.8rem, 7vw, 2.8rem); line-height: 1.1; letter-spacing: -0.01em; color: #fff; }
    .load .tag { margin: 12px 0 0; color: var(--lav); font-size: 1.05rem; }
    .track { position: relative; width: 100%; height: 10px; margin: 48px 0 0; border-radius: 99px; background: var(--navy); }
    .fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--purple), var(--blue)); }
    .rider { position: absolute; top: 50%; left: 0; width: 48px; aspect-ratio: 1; margin: -24px 0 0 -24px; border-radius: 50%; box-shadow: 0 0 0 3px var(--bg-top), 0 0 0 5px var(--orange); }
    .pct { margin-top: 26px; font-weight: 600; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
    .tip { min-height: 1.5em; margin: 10px 0 0; color: var(--lav); opacity: 0.85; font-size: 0.95rem; transition: opacity 0.4s; }
    .brand { position: absolute; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); font-size: 0.8rem; color: var(--lav); opacity: 0.6; }
    @keyframes pop { from { transform: scale(0.4); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes glow { 0%, 100% { box-shadow: 0 0 30px 2px #8338fc55; } 50% { box-shadow: 0 0 64px 10px #8338fc99; } }
  </style>
</head>

<body>
  <!-- KruujLoader Oficial -->
  <div id="kl" role="status" aria-live="polite" aria-label="Carregando">
    <div class="ph splash">
      <img class="owl" alt="KRUUJ" src="/kruuj-avatar.png" onerror="this.src='/kruuj-mascote.png'">

      <p class="sub">STUDIO</p>
    </div>
    <div class="ph load off">
      <h1 id="kl-name">KRUUJ Baby Sinfonia & Formas</h1>
      <p class="tag" id="kl-tag">Toque nas formas e ouça a magia musical.</p>
      <div class="track">
        <div class="fill" id="kl-fill"></div>
        <img class="rider" id="kl-rider" alt="" src="/kruuj-avatar.png">
      </div>
      <div class="pct" id="kl-pct">0%</div>
      <p class="tip" id="kl-tip"></p>
    </div>
    <div class="brand" id="kl-brand">Kruuj Studio</div>
  </div>

  <!-- HUD do Jogo (Respeitando recuo de segurança mobile) -->
  <header class="hud">
    <div class="hud-group">
      <button class="hud-btn active" id="btnSoundMode" onclick="toggleInstrument()" title="Trocar Instrumento">
        <span id="soundLabel">Sinos 🔔</span>
      </button>
      <button class="hud-btn" id="btnLullaby" onclick="toggleLullaby()" title="Canção de Ninar Automática">
        <span id="lullabyLabel">Ninar ✨</span>
      </button>
    </div>
    <div class="hud-group">
      <div class="hud-badge" id="starBadge">
        <span>⭐</span>
        <span id="starCount">0</span>
      </div>
    </div>
  </header>

  <!-- Pílula Flutuante -->
  <div class="shape-pill" id="shapePill">Coração Rosa! 💕</div>

  <!-- Canvas Principal -->
  <canvas id="gameCanvas"></canvas>

  <script>
    // ==========================================
    // 1. ÁUDIO SINTÉTICO (WEBAUDIO PENTATÔNICO)
    // ==========================================
    const PENTATONIC_FREQS = [
      261.63, // C4
      293.66, // D4
      329.63, // E4
      392.00, // G4
      440.00, // A4
      523.25, // C5
      587.33, // D5
      659.25, // E5
      783.99, // G5
      880.00, // A5
      1046.50 // C6
    ];

    let audioCtx = null;
    let currentInstrument = 0; // 0: Sinos (Celeste), 1: Caixinha, 2: Xilofone
    const INSTRUMENTS = [
      { id: 'chimes', labelKey: 'modeChimes' },
      { id: 'box', labelKey: 'modeBox' },
      { id: 'xylo', labelKey: 'modeXylo' }
    ];

    function initAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playNote(freqIndex, durationMultiplier = 1.0) {
      initAudio();
      if (!audioCtx) return;

      const idx = Math.max(0, Math.min(PENTATONIC_FREQS.length - 1, freqIndex));
      const freq = PENTATONIC_FREQS[idx];
      const now = audioCtx.currentTime;

      if (currentInstrument === 0) {
        // --- MODO 1: SINOS CELESTIAIS (Celeste / Chimes) ---
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(freq, now);

        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(freq * 2.002, now); // Cintilante

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(0.28, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.4 * durationMultiplier);

        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(audioCtx.destination);

        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + 1.5 * durationMultiplier);
        osc2.stop(now + 1.5 * durationMultiplier);

      } else if (currentInstrument === 1) {
        // --- MODO 2: CAIXINHA DE MÚSICA (Music Box) ---
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.32, now + 0.008);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.9 * durationMultiplier);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 1.0 * durationMultiplier);

      } else {
        // --- MODO 3: XILOFONE MÁGICO (Rainbow Xylophone) ---
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.35, now + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.5 * durationMultiplier);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 0.55 * durationMultiplier);
      }
    }

    // Harmonia própria para as Formas Geométricas
    const SHAPE_SOUNDS = {
      heart: [329.63, 440.00, 659.25],   // E4, A4, E5 (Doce e afetuoso)
      star: [392.00, 523.25, 783.99],    // G4, C5, G5 (Brilhante e cintilante)
      circle: [261.63, 392.00, 523.25],  // C4, G4, C5 (Acolhedor)
      moon: [440.00, 587.33, 880.00],    // A4, D5, A5 (Místico suave)
      cloud: [293.66, 440.00, 587.33],   // D4, A4, D5 (Macio)
      triangle: [349.23, 440.00, 698.46] // F4, A4, F5 (Alegre saltitante)
    };

    function playShapeSound(shapeType) {
      initAudio();
      if (!audioCtx) return;

      const freqs = SHAPE_SOUNDS[shapeType] || [440, 554, 659];
      const now = audioCtx.currentTime;

      freqs.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = currentInstrument === 2 ? 'triangle' : 'sine';
        osc.frequency.setValueAtTime(freq, now + idx * 0.04);

        gain.gain.setValueAtTime(0.001, now + idx * 0.04);
        gain.gain.linearRampToValueAtTime(0.3, now + idx * 0.04 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.04 + 0.8);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now + idx * 0.04);
        osc.stop(now + idx * 0.04 + 0.85);
      });
    }

    // Risadinha / Piu-piu amigável da Corujinha
    function playOwlCheerSound() {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(659.25, now);
      osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.14);
      osc.frequency.exponentialRampToValueAtTime(1318.51, now + 0.26);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.3, now + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.38);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.4);
    }

    // Estouro de forma (pop estelar cristalino)
    function playPopExplosionSound() {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(450, now);
      osc.frequency.exponentialRampToValueAtTime(1250, now + 0.1);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.32, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.3);
    }

    // ==========================================
    // 2. SISTEMA DE CANÇÃO DE NINAR
    // ==========================================
    let isLullabyPlaying = false;
    let lullabyTimer = null;
    const LULLABY_SEQUENCE = [4, 5, 7, 5, 4, 2, 4, 5, 7, 8, 7, 5, 4, 2, 0, 2, 4];
    let lullabyStep = 0;

    function toggleLullaby() {
      initAudio();
      isLullabyPlaying = !isLullabyPlaying;
      const btn = document.getElementById('btnLullaby');
      const lbl = document.getElementById('lullabyLabel');

      if (isLullabyPlaying) {
        btn.classList.add('active');
        lbl.textContent = tG.lullabyOn;
        scheduleNextLullabyNote();
      } else {
        btn.classList.remove('active');
        lbl.textContent = tG.lullaby;
        if (lullabyTimer) clearTimeout(lullabyTimer);
      }
    }

    function scheduleNextLullabyNote() {
      if (!isLullabyPlaying) return;
      const noteIdx = LULLABY_SEQUENCE[lullabyStep % LULLABY_SEQUENCE.length];
      lullabyStep++;
      playNote(noteIdx, 1.4);

      // Gera pequenas estrelas mágicas no topo da tela
      createStarBurst(
        Math.random() * (width * 0.8) + width * 0.1,
        Math.random() * (height * 0.3) + 70,
        '#fef08a',
        6
      );

      const delay = 650 + Math.random() * 250;
      lullabyTimer = setTimeout(scheduleNextLullabyNote, delay);
    }

    function toggleInstrument() {
      initAudio();
      currentInstrument = (currentInstrument + 1) % INSTRUMENTS.length;
      const inst = INSTRUMENTS[currentInstrument];
      document.getElementById('soundLabel').textContent = tG[inst.labelKey];
      playNote(5, 1.2);
    }

    // ==========================================
    // 3. CENÁRIO, DESENHO E ENTIDADES
    // ==========================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let width = 0;
    let height = 0;
    let starScore = 0;

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    // Pílula com o nome da forma
    let pillTimer = null;
    function showShapePill(text) {
      const pill = document.getElementById('shapePill');
      pill.textContent = text;
      pill.classList.add('show');
      if (pillTimer) clearTimeout(pillTimer);
      pillTimer = setTimeout(() => {
        pill.classList.remove('show');
      }, 1600);
    }

    function addScore(pts = 1) {
      starScore += pts;
      document.getElementById('starCount').textContent = starScore;
    }

    // Partículas
    let particles = [];
    let touchTrail = [];
    let touchRipples = [];

    class Particle {
      constructor(x, y, color, speed = 4, size = 7, shape = 'star') {
        this.x = x;
        this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const spd = Math.random() * speed + 1;
        this.vx = Math.cos(angle) * spd;
        this.vy = Math.sin(angle) * spd - 1;
        this.size = Math.random() * size + 4;
        this.life = 1.0;
        this.decay = Math.random() * 0.025 + 0.015;
        this.shape = shape;
        this.rot = Math.random() * Math.PI;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= this.decay;
        this.rot += 0.04;
      }
      draw(ctx) {
        if (this.life <= 0) return;
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rot);

        if (this.shape === 'heart') {
          drawHeart(ctx, 0, 0, this.size);
        } else if (this.shape === 'star') {
          drawStar(ctx, 0, 0, 5, this.size, this.size * 0.45);
        } else {
          ctx.beginPath();
          ctx.arc(0, 0, this.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
    }

    function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius) {
      let rot = Math.PI / 2 * 3;
      let x = cx;
      let y = cy;
      const step = Math.PI / spikes;
      ctx.beginPath();
      ctx.moveTo(cx, cy - outerRadius);
      for (let i = 0; i < spikes; i++) {
        x = cx + Math.cos(rot) * outerRadius;
        y = cy + Math.sin(rot) * outerRadius;
        ctx.lineTo(x, y);
        rot += step;
        x = cx + Math.cos(rot) * innerRadius;
        y = cy + Math.sin(rot) * innerRadius;
        ctx.lineTo(x, y);
        rot += step;
      }
      ctx.lineTo(cx, cy - outerRadius);
      ctx.closePath();
      ctx.fill();
    }

    function drawHeart(ctx, x, y, size) {
      ctx.beginPath();
      const topCurveHeight = size * 0.3;
      ctx.moveTo(x, y + topCurveHeight);
      ctx.bezierCurveTo(x, y, x - size / 2, y, x - size / 2, y + topCurveHeight);
      ctx.bezierCurveTo(x - size / 2, y + (size + topCurveHeight) / 2, x, y + (size + topCurveHeight) / 2, x, y + size);
      ctx.bezierCurveTo(x, y + (size + topCurveHeight) / 2, x + size / 2, y + (size + topCurveHeight) / 2, x + size / 2, y + topCurveHeight);
      ctx.bezierCurveTo(x + size / 2, y, x, y, x, y + topCurveHeight);
      ctx.fill();
    }

    function createStarBurst(x, y, color, count = 14, shape = 'star') {
      for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, color, 5, 8, shape));
      }
    }

    // Ondulação luminosa quando o bebê toca
    class TouchRipple {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.radius = 10;
        this.maxRadius = Math.random() * 40 + 70;
        this.color = color;
        this.life = 1.0;
      }
      update() {
        this.radius += (this.maxRadius - this.radius) * 0.12;
        this.life -= 0.035;
      }
      draw(ctx) {
        if (this.life <= 0) return;
        ctx.save();
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.strokeStyle = this.color;
        ctx.globalAlpha = Math.max(0, this.life * 0.6);
        ctx.lineWidth = 4 * this.life;
        ctx.stroke();
        ctx.restore();
      }
    }

    // ==========================================
    // 4. FORMAS GEOMÉTRICAS MÁGICAS FLUTUANTES
    // ==========================================
    const SHAPE_DEFS = [
      { type: 'heart', color: '#ff65a6', glow: '#fda4af', i18nKey: 'heart' },
      { type: 'star', color: '#ffd043', glow: '#fef08a', i18nKey: 'star' },
      { type: 'circle', color: '#f59e0b', glow: '#fde68a', i18nKey: 'circle' },
      { type: 'moon', color: '#a78bfa', glow: '#ddd6fe', i18nKey: 'moon' },
      { type: 'cloud', color: '#38bdf8', glow: '#bae6fd', i18nKey: 'cloud' },
      { type: 'triangle', color: '#48e59b', glow: '#a7f3d0', i18nKey: 'triangle' }
    ];

    class MagicShape {
      constructor(def = null) {
        this.def = def || SHAPE_DEFS[Math.floor(Math.random() * SHAPE_DEFS.length)];
        this.radius = Math.random() * 15 + 50; // Tamanho generoso para toque de bebês
        this.x = Math.random() * (width - this.radius * 2) + this.radius;
        this.y = Math.random() * (height - this.radius * 3) + this.radius + 60;
        this.vx = (Math.random() - 0.5) * 1.1;
        this.vy = (Math.random() - 0.5) * 1.1;
        this.scaleX = 1.0;
        this.scaleY = 1.0;
        this.rot = (Math.random() - 0.5) * 0.2;
        this.rotSpeed = (Math.random() - 0.5) * 0.012;
        this.taps = 0;
        this.wobble = Math.random() * Math.PI * 2;
      }
      hitTest(px, py) {
        return Math.hypot(px - this.x, py - this.y) < this.radius * 1.3;
      }
      touch() {
        this.taps++;
        playShapeSound(this.def.type);
        showShapePill(tG[this.def.i18nKey]);

        // Squash & stretch elástico
        this.scaleX = 1.45;
        this.scaleY = 0.65;
        setTimeout(() => {
          this.scaleX = 0.8;
          this.scaleY = 1.3;
          setTimeout(() => {
            this.scaleX = 1.0;
            this.scaleY = 1.0;
          }, 140);
        }, 120);

        createStarBurst(this.x, this.y, this.def.color, 12, this.def.type);
        addScore(2);

        // Dança da Corujinha
        owl.celebrate();

        // Se tocar 2 vezes, a forma explode com som mágico e renasce!
        if (this.taps >= 2) {
          playPopExplosionSound();
          createStarBurst(this.x, this.y, this.def.color, 24, this.def.type);
          this.respawn();
        }
      }
      respawn() {
        this.def = SHAPE_DEFS[Math.floor(Math.random() * SHAPE_DEFS.length)];
        this.x = Math.random() * (width - this.radius * 2) + this.radius;
        this.y = height + this.radius + 20;
        this.vy = -Math.random() * 1.4 - 0.6;
        this.vx = (Math.random() - 0.5) * 1.1;
        this.taps = 0;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.rot += this.rotSpeed;
        this.wobble += 0.025;

        // Bate suavemente nas bordas
        if (this.x < this.radius) { this.x = this.radius; this.vx = Math.abs(this.vx); }
        if (this.x > width - this.radius) { this.x = width - this.radius; this.vx = -Math.abs(this.vx); }
        if (this.y < this.radius + 65) { this.y = this.radius + 65; this.vy = Math.abs(this.vy); }
        if (this.y > height - this.radius - 20) { this.y = height - this.radius - 20; this.vy = -Math.abs(this.vy); }
      }
      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rot);
        ctx.scale(this.scaleX, this.scaleY);

        ctx.shadowColor = this.def.glow;
        ctx.shadowBlur = 18;
        ctx.fillStyle = this.def.color;

        const r = this.radius;

        if (this.def.type === 'circle') {
          ctx.beginPath();
          ctx.arc(0, 0, r, 0, Math.PI * 2);
          ctx.fill();
        } else if (this.def.type === 'heart') {
          drawHeart(ctx, 0, -r * 0.4, r * 1.8);
        } else if (this.def.type === 'star') {
          drawStar(ctx, 0, 0, 5, r * 1.2, r * 0.55);
        } else if (this.def.type === 'moon') {
          ctx.beginPath();
          ctx.arc(0, 0, r, 0.4 * Math.PI, 1.6 * Math.PI);
          ctx.bezierCurveTo(r * 0.4, -r * 0.4, r * 0.4, r * 0.4, 0, r * 0.98);
          ctx.fill();
        } else if (this.def.type === 'cloud') {
          ctx.beginPath();
          ctx.arc(0, 0, r * 0.7, 0, Math.PI * 2);
          ctx.arc(-r * 0.5, r * 0.1, r * 0.5, 0, Math.PI * 2);
          ctx.arc(r * 0.5, r * 0.1, r * 0.5, 0, Math.PI * 2);
          ctx.fill();
        } else if (this.def.type === 'triangle') {
          ctx.beginPath();
          ctx.moveTo(0, -r);
          ctx.lineTo(r, r * 0.85);
          ctx.lineTo(-r, r * 0.85);
          ctx.closePath();
          ctx.fill();
        }

        ctx.shadowBlur = 0;

        // Rostinho Kawaii com olhinhos felizes
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(-14, -4, 5, 0, Math.PI * 2);
        ctx.arc(14, -4, 5, 0, Math.PI * 2);
        ctx.fill();

        // Brilho nos olhinhos
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-16, -6, 2, 0, Math.PI * 2);
        ctx.arc(12, -6, 2, 0, Math.PI * 2);
        ctx.fill();

        // Bochechas rosadas
        ctx.fillStyle = '#ff8cb0';
        ctx.beginPath();
        ctx.arc(-22, 4, 6, 0, Math.PI * 2);
        ctx.arc(22, 4, 6, 0, Math.PI * 2);
        ctx.fill();

        // Boquinha sorridente
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(0, 2, 8, 0.15 * Math.PI, 0.85 * Math.PI);
        ctx.stroke();

        ctx.restore();
      }
    }

    const shapes = [];
    for (let i = 0; i < 6; i++) {
      shapes.push(new MagicShape(SHAPE_DEFS[i % SHAPE_DEFS.length]));
    }

    // ==========================================
    // 5. CORUJINHA KRUUJ BEBÊ (Dançante e Fofa)
    // ==========================================
    class KruujOwlBaby {
      constructor() {
        this.wobble = 0;
        this.scale = 1.0;
        this.targetScale = 1.0;
        this.wingFlap = 0;
        this.isDancing = false;
        this.cheerTimer = 0;
        this.cheerWord = '';
      }
      getPos() {
        // Posicionada na parte inferior central/lateral com nuvem-berço
        return {
          x: width > 600 ? width * 0.18 : width * 0.5,
          y: height - 100
        };
      }
      hitTest(px, py) {
        const pos = this.getPos();
        return Math.hypot(px - pos.x, py - pos.y) < 65;
      }
      celebrate() {
        this.targetScale = 1.3;
        setTimeout(() => { this.targetScale = 1.0; }, 240);
        this.isDancing = true;
        this.wingFlap = 1.0;
        this.cheerTimer = 45;
        const cheers = tG.owlCheer || ['Piu-piu!', 'Viva!'];
        this.cheerWord = cheers[Math.floor(Math.random() * cheers.length)];
      }
      touch() {
        playOwlCheerSound();
        this.celebrate();
        const pos = this.getPos();
        createStarBurst(pos.x, pos.y - 40, '#ffd043', 16, 'star');
        createStarBurst(pos.x, pos.y - 40, '#ff65a6', 8, 'heart');
        addScore(3);
      }
      update() {
        this.wobble += 0.04;
        this.scale += (this.targetScale - this.scale) * 0.15;
        if (this.isDancing) {
          this.wingFlap = Math.sin(this.wobble * 4) * 0.4;
          if (this.cheerTimer > 0) {
            this.cheerTimer--;
          } else {
            this.isDancing = false;
            this.wingFlap = 0;
          }
        }
      }
      draw(ctx) {
        const pos = this.getPos();
        ctx.save();
        ctx.translate(pos.x, pos.y);
        ctx.scale(this.scale, this.scale);

        // Nuvens-berço sob a corujinha
        ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.shadowColor = '#8338fc';
        ctx.shadowBlur = 16;
        ctx.beginPath();
        ctx.ellipse(0, 32, 54, 18, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Balanço suave
        const bob = Math.sin(this.wobble) * 4;
        ctx.translate(0, bob);

        // Corpinho da Corujinha (Roxo KRUUJ)
        ctx.fillStyle = '#8338fc';
        ctx.beginPath();
        ctx.ellipse(0, 0, 36, 42, 0, 0, Math.PI * 2);
        ctx.fill();

        // Orelhinhas / Peninhas
        ctx.fillStyle = '#6a28d6';
        ctx.beginPath();
        ctx.moveTo(-24, -26);
        ctx.lineTo(-32, -50);
        ctx.lineTo(-12, -36);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(24, -26);
        ctx.lineTo(32, -50);
        ctx.lineTo(12, -36);
        ctx.closePath();
        ctx.fill();

        // Asinhas
        ctx.fillStyle = '#6a28d6';
        ctx.save();
        ctx.translate(-30, 2);
        ctx.rotate(-0.2 + this.wingFlap);
        ctx.beginPath();
        ctx.ellipse(0, 0, 10, 20, 0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.translate(30, 2);
        ctx.rotate(0.2 - this.wingFlap);
        ctx.beginPath();
        ctx.ellipse(0, 0, 10, 20, -0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Peito Macio (Lilás claro)
        ctx.fillStyle = '#d8d4fd';
        ctx.beginPath();
        ctx.ellipse(0, 10, 22, 26, 0, 0, Math.PI * 2);
        ctx.fill();

        // Coraçõezinhos nas penas do peito
        ctx.fillStyle = '#ff65a6';
        drawHeart(ctx, -6, 2, 8);
        drawHeart(ctx, 6, 2, 8);
        drawHeart(ctx, 0, 14, 8);

        // Olhões Grandes e Brilhantes
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-14, -10, 15, 0, Math.PI * 2);
        ctx.arc(14, -10, 15, 0, Math.PI * 2);
        ctx.fill();

        // Íris Dourada KRUUJ
        ctx.fillStyle = '#fda41d';
        ctx.beginPath();
        ctx.arc(-14, -10, 9, 0, Math.PI * 2);
        ctx.arc(14, -10, 9, 0, Math.PI * 2);
        ctx.fill();

        // Pupila
        ctx.fillStyle = '#151c4a';
        ctx.beginPath();
        ctx.arc(-14, -10, 5, 0, Math.PI * 2);
        ctx.arc(14, -10, 5, 0, Math.PI * 2);
        ctx.fill();

        // Brilho dos Olhos
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-16, -13, 3, 0, Math.PI * 2);
        ctx.arc(12, -13, 3, 0, Math.PI * 2);
        ctx.fill();

        // Bochechas rosadas
        ctx.fillStyle = 'rgba(255, 101, 166, 0.65)';
        ctx.beginPath();
        ctx.arc(-24, 4, 7, 0, Math.PI * 2);
        ctx.arc(24, 4, 7, 0, Math.PI * 2);
        ctx.fill();

        // Biquinho fofo de bebê
        ctx.fillStyle = '#ffd043';
        ctx.beginPath();
        ctx.moveTo(-5, -4);
        ctx.lineTo(5, -4);
        ctx.lineTo(0, 5);
        ctx.closePath();
        ctx.fill();

        // Balão de comemoração
        if (this.cheerTimer > 0) {
          ctx.save();
          ctx.translate(0, -64);
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.roundRect(-45, -20, 90, 30, 15);
          ctx.fill();
          ctx.fillStyle = '#8338fc';
          ctx.font = 'bold 16px "Baloo 2", sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(this.cheerWord, 0, 1);
          ctx.restore();
        }

        ctx.restore();
      }
    }
    const owl = new KruujOwlBaby();

    // ==========================================
    // 6. ESTRELAS DE FUNDO E NUVENS SUAVES
    // ==========================================
    const bgStars = [];
    for (let i = 0; i < 45; i++) {
      bgStars.push({
        x: Math.random(),
        y: Math.random(),
        size: Math.random() * 2.2 + 1,
        twinkle: Math.random() * Math.PI * 2,
        twinkleSpeed: Math.random() * 0.04 + 0.01
      });
    }

    // ==========================================
    // 7. TOQUE, ARRASTE E INTERAÇÃO
    // ==========================================
    function handlePointerHit(x, y) {
      initAudio();
      touchRipples.push(new TouchRipple(x, y, '#ffd043'));

      // 1. Testa toque na Corujinha
      if (owl.hitTest(x, y)) {
        owl.touch();
        return;
      }

      // 2. Testa toque nas Formas Geométricas
      for (let i = shapes.length - 1; i >= 0; i--) {
        const sh = shapes[i];
        if (sh.hitTest(x, y)) {
          sh.touch();
          return;
        }
      }

      // 3. Toque livre no céu: toca nota pentatônica pela altura
      const normalizedY = 1.0 - Math.max(0, Math.min(1, y / height));
      const noteIdx = Math.floor(normalizedY * PENTATONIC_FREQS.length);
      playNote(noteIdx, 1.2);

      const colors = ['#f472b6', '#38bdf8', '#a78bfa', '#fbbf24', '#4ade80'];
      const pickColor = colors[Math.floor(Math.random() * colors.length)];
      createStarBurst(x, y, pickColor, 8, 'star');
      addScore(1);
    }

    let lastDragNoteTime = 0;
    function handlePointerDrag(x, y) {
      touchTrail.push({ x, y, life: 1.0, color: '#fde047' });

      const now = performance.now();
      if (now - lastDragNoteTime > 130) {
        lastDragNoteTime = now;
        const normalizedY = 1.0 - Math.max(0, Math.min(1, y / height));
        const noteIdx = Math.floor(normalizedY * PENTATONIC_FREQS.length);
        playNote(noteIdx, 0.4);
      }
    }

    let isPointerDown = false;
    window.addEventListener('pointerdown', (e) => {
      isPointerDown = true;
      handlePointerHit(e.clientX, e.clientY);
    });

    window.addEventListener('pointermove', (e) => {
      if (isPointerDown) {
        handlePointerDrag(e.clientX, e.clientY);
      }
    });

    window.addEventListener('pointerup', () => { isPointerDown = false; });
    window.addEventListener('pointercancel', () => { isPointerDown = false; });

    // Suporte multitouch simultâneo
    window.addEventListener('touchstart', (e) => {
      e.preventDefault();
      for (let i = 0; i < e.touches.length; i++) {
        const t = e.touches[i];
        handlePointerHit(t.clientX, t.clientY);
      }
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      e.preventDefault();
      for (let i = 0; i < e.touches.length; i++) {
        const t = e.touches[i];
        handlePointerDrag(t.clientX, t.clientY);
      }
    }, { passive: false });

    // ==========================================
    // 8. LOOP DE ANIMAÇÃO
    // ==========================================
    function gameLoop() {
      ctx.clearRect(0, 0, width, height);

      // Fundo Cósmico Suave
      const grad = ctx.createLinearGradient(0, 0, 0, height);
      grad.addColorStop(0, '#0a0e2a');
      grad.addColorStop(0.5, '#14143a');
      grad.addColorStop(1, '#23184a');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);

      // Estrelas cintilantes de fundo
      ctx.fillStyle = '#ffffff';
      for (const s of bgStars) {
        s.twinkle += s.twinkleSpeed;
        const alpha = 0.3 + Math.sin(s.twinkle) * 0.35;
        ctx.globalAlpha = Math.max(0.1, alpha);
        ctx.beginPath();
        ctx.arc(s.x * width, s.y * height, s.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1.0;

      // Ondulações de Toque
      for (let i = touchRipples.length - 1; i >= 0; i--) {
        const rp = touchRipples[i];
        rp.update();
        if (rp.life <= 0) {
          touchRipples.splice(i, 1);
        } else {
          rp.draw(ctx);
        }
      }

      // Rastro do dedinho
      for (let i = touchTrail.length - 1; i >= 0; i--) {
        const tr = touchTrail[i];
        tr.life -= 0.035;
        if (tr.life <= 0) {
          touchTrail.splice(i, 1);
        } else {
          ctx.save();
          ctx.globalAlpha = tr.life * 0.8;
          ctx.fillStyle = tr.color;
          drawStar(ctx, tr.x, tr.y, 5, 10 * tr.life, 5 * tr.life);
          ctx.restore();
        }
      }

      // Formas Geométricas Flutuantes
      for (const sh of shapes) {
        sh.update();
        sh.draw(ctx);
      }

      // Corujinha KRUUJ
      owl.update();
      owl.draw(ctx);

      // Partículas
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        if (p.life <= 0) {
          particles.splice(i, 1);
        } else {
          p.draw(ctx);
        }
      }

      requestAnimationFrame(gameLoop);
    }
    requestAnimationFrame(gameLoop);

    // ==========================================
    // 9. INTEGRAÇÃO KRUUJ SDK & LOADER
    // ==========================================
    const KruujLoader = (() => {
      const $ = id => document.getElementById(id);
      let target = 0, shown = 0, cfg = {}, t0 = 0, raf = null, tipTimer = null, finished = false, closing = false;
      const wait = ms => new Promise(r => setTimeout(r, ms));
      function frame() {
        if (!cfg.manual && !finished) target = Math.min(0.9, target + 0.004 * (1 - target) + 0.0015);
        shown += (target - shown) * 0.08;
        if (finished && target - shown < 0.002) shown = target;
        const pc = Math.round(shown * 100);
        if ($('kl-fill')) $('kl-fill').style.width = pc + '%';
        if ($('kl-rider')) $('kl-rider').style.left = pc + '%';
        if ($('kl-pct')) $('kl-pct').textContent = pc + '%';
        if (shown >= 1 && performance.now() - t0 >= cfg.minTime) return close();
        raf = requestAnimationFrame(frame);
      }
      async function close() {
        if (closing) return; closing = true; clearInterval(tipTimer);
        const kl = $('kl');
        if (kl) {
          kl.classList.add('out');
          await wait(650);
          kl.style.display = 'none';
        }
        if (cfg.onComplete) cfg.onComplete();
      }
      async function start(c) {
        cfg = { gameName: 'KRUUJ Baby Sinfonia & Formas', tagline: '', tips: [], splash: 1800, minTime: 2600, manual: false, onComplete() {}, ...c };
        target = shown = 0; finished = closing = false;
        const kl = $('kl');
        if (!kl) return;
        kl.style.display = ''; kl.classList.remove('out');
        const [sp, ld] = kl.querySelectorAll('.ph');
        if (sp) sp.classList.remove('off');
        if (ld) ld.classList.add('off');
        $('kl-name').textContent = cfg.gameName;
        $('kl-tag').textContent = cfg.tagline;
        document.title = cfg.gameName + ' – Kruuj Studio';
        await wait(cfg.splash);
        if (sp) sp.classList.add('off');
        await wait(400);
        if (ld) ld.classList.remove('off');
        t0 = performance.now();
        let i = 0;
        const tip = $('kl-tip');
        const nextTip = () => {
          if (!tip) return;
          tip.style.opacity = '0';
          setTimeout(() => {
            tip.textContent = cfg.tips[i++ % cfg.tips.length] || '';
            tip.style.opacity = '0.85';
          }, 350);
        };
        if (cfg.tips.length) { nextTip(); tipTimer = setInterval(nextTip, 3000); }
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(frame);
      }
      return {
        start,
        finish() { finished = true; target = 1; }
      };
    })();

    window.addEventListener('DOMContentLoaded', () => {
      // Inicia KruujSDK
      if (window.KruujSDK) {
        window.KruujSDK.init().then(() => {
          window.KruujSDK.gameLoadingFinished();
          window.KruujSDK.gameplayStart();
        }).catch(() => {});
      }

      // Aplica textos i18n
      document.getElementById('soundLabel').textContent = tG.modeChimes;
      document.getElementById('lullabyLabel').textContent = tG.lullaby;

      // Executa loader apenas standalone
      if (window.self === window.top) {
        KruujLoader.start({
          gameName: tG.title,
          tagline: tG.tagline,
          tips: tG.tips,
          splash: 1800,
          minTime: 2600
        });
        setTimeout(() => KruujLoader.finish(), 2400);
      }
    });
  </script>
