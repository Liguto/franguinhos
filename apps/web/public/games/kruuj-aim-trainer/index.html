<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/sdk/v1/kruuj-sdk.js"></script>
  <script src="/sdk/v1/kruuj-loader.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>KRUUJ Aim Trainer</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
.ka{--v:#873CFF;--c:#18C9FF;--g:#FFB21C;--t:#F5F6FF;--m:#9EACD6;position:relative;width:100%;height:100%;min-height:480px;overflow:hidden;background:#070B20;color:var(--t);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
.ka *{box-sizing:border-box}
.ka-cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.ka-xh{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}
.ka-xh i{position:absolute;background:var(--xc)}
.ka-xh .l{width:var(--xs);height:var(--xt);right:var(--xg);top:calc(var(--xt)/-2)}.ka-xh .r{width:var(--xs);height:var(--xt);left:var(--xg);top:calc(var(--xt)/-2)}
.ka-xh .u{height:var(--xs);width:var(--xt);bottom:var(--xg);left:calc(var(--xt)/-2)}.ka-xh .d{height:var(--xs);width:var(--xt);top:var(--xg);left:calc(var(--xt)/-2)}
.ka-xh .o{width:var(--xt);height:var(--xt);left:calc(var(--xt)/-2);top:calc(var(--xt)/-2)}
.ka-xh.h i{background:#fff}.ka-xh.m i{background:#FF4D78}
.ka-hud{position:absolute;inset:0;pointer-events:none;font-weight:800;text-shadow:0 0 8px #000}
.ka-hud[hidden],.ka-ov[hidden]{display:none}
.ka-hud div{position:absolute}
.ka-tl{left:14px;top:12px}.ka-tc{left:50%;top:10px;transform:translateX(-50%);font-size:30px;color:var(--c)}.ka-tr{right:14px;top:12px;text-align:right}
.ka-bc{left:50%;bottom:16px;transform:translateX(-50%);color:var(--g);font-size:15px;white-space:nowrap}.ka-bl{left:12px;bottom:10px;font-size:11px;color:var(--m)}
.ka-cd{left:50%;top:62%;transform:translate(-50%,-50%);font-size:56px;color:var(--g)}
.ka-ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto;background:radial-gradient(100% 80% at 20% 0%,rgba(135,60,255,.3),transparent 60%),rgba(7,11,32,.93)}
.ka-card{width:min(940px,100%);margin:auto;background:#0B1230;border:1px solid rgba(24,201,255,.35);border-radius:14px;padding:18px;box-shadow:0 0 40px rgba(135,60,255,.25)}
.ka-card.s{width:min(460px,100%);text-align:center}
.ka h1{margin:0 0 10px;font-size:26px;letter-spacing:.04em;text-transform:uppercase}.ka h1 span{background:linear-gradient(90deg,var(--v),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent}
.ka h2{margin:0 0 6px;font-size:19px;color:var(--g)}.ka h3{margin:12px 0 4px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.ka p{margin:4px 0;font-size:13px;line-height:1.45;color:var(--m)}
.ka-grid{display:grid;grid-template-columns:210px 1fr;gap:16px}
@media(max-width:640px){.ka-grid{grid-template-columns:1fr}}
.ka-modes{display:grid;gap:6px;align-content:start}
.ka-b{font:inherit;font-weight:700;font-size:13px;color:var(--t);cursor:pointer;padding:9px 12px;border-radius:9px;border:1px solid rgba(24,201,255,.4);background:#121c4a;text-align:left}
.ka-b:hover{border-color:var(--c)}.ka-b:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.ka-b.on{border-color:var(--v);background:linear-gradient(90deg,#4a23a3,#121c4a)}
.ka-b.p{background:linear-gradient(180deg,#9a58ff,var(--v));border-color:#b98cff;text-align:center}
.ka-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.ka-f{display:grid;grid-template-columns:1fr 150px 46px;gap:8px;align-items:center;font-size:13px;margin:4px 0;text-align:left}
.ka-f input,.ka-f select{width:100%;accent-color:var(--v);background:#121c4a;color:var(--t);border:1px solid rgba(24,201,255,.3);border-radius:6px}
.ka-f output{font-size:12px;color:var(--c)}
.ka-st{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}
.ka-st div{background:#121c4a;border-radius:9px;padding:8px;font-size:11px;color:var(--m);text-transform:uppercase}.ka-st b{display:block;font-size:20px;color:var(--t)}
/* Tela de carregamento Kruuj Studio (escopada em #kl) */
#kl{--bg:#050b24;--purple:#8338fc;--blue:#289afd;--orange:#fda41d;--lav:#d8d4fd;--white:#f1f1f6;box-sizing:border-box;--navy:#1a214c;position:absolute;inset:0;z-index:9999;color:var(--white);font-family:'Outfit',system-ui,sans-serif;background:radial-gradient(ellipse at 50% 40%,#101a52 0%,var(--bg) 65%);display:grid;place-items:center;padding:env(safe-area-inset-top,0) 24px env(safe-area-inset-bottom,0);transition:opacity .6s ease,visibility .6s}
#kl.out{opacity:0 !important;visibility:hidden !important;pointer-events:none !important;display:none !important;}
#kl *,#kl *::before,#kl *::after{box-sizing:inherit}
#kl .ph{grid-area:1/1;display:flex;flex-direction:column;align-items:center;width:100%;max-width:440px;transition:opacity .5s ease}
#kl .ph.off{opacity:0;pointer-events:none}
#kl .splash .owl{width:min(34vw,150px);aspect-ratio:1;border-radius:50%;animation:kl-pop .9s cubic-bezier(.2,1.3,.4,1) both,kl-glow 2.4s ease-in-out .9s infinite}
#kl .splash .logo{width:min(54vw,240px);height:auto;margin-top:20px;animation:kl-rise .8s ease .7s both}
#kl .splash .sub{margin:8px 0 0;font-weight:600;font-size:.85rem;letter-spacing:.38em;padding-left:.38em;color:var(--lav);animation:kl-rise .8s ease 1.1s both}
#kl .load{text-align:center}
#kl .load h1{margin:0;font-weight:800;font-size:clamp(2.2rem,9vw,3.6rem);line-height:1.05;letter-spacing:-.01em;text-wrap:balance}
#kl .load .tag{margin:12px 0 0;color:var(--lav);font-size:1.05rem}
#kl .track{position:relative;width:100%;height:10px;margin:64px 0 0;border-radius:99px;background:var(--navy)}
#kl .fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:99px;background:linear-gradient(90deg,var(--purple),var(--blue))}
#kl .rider{position:absolute;top:50%;left:0;width:54px;aspect-ratio:1;margin:-27px 0 0 -27px;border-radius:50%;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--orange)}
#kl .pct{margin-top:30px;font-weight:600;font-size:1.1rem;font-variant-numeric:tabular-nums}
#kl .tip{min-height:1.5em;margin:10px 0 0;color:var(--lav);opacity:.85;font-size:.95rem;transition:opacity .4s}
#kl .brand{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom,0px));font-size:.8rem;color:var(--lav);opacity:.6;transition:opacity .5s}
@keyframes kl-pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes kl-rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes kl-glow{0%,100%{box-shadow:0 0 30px 2px #8338fc55}50%{box-shadow:0 0 64px 10px #8338fc99}}
@media (prefers-reduced-motion:reduce){#kl *{animation:none!important;transition:none!important}}
.ka-tb{position:absolute;inset:0;pointer-events:none}.ka-tb[hidden],.ka-rot[hidden]{display:none}
.ka-tbtn{position:absolute;transform:translate(-50%,-50%);border-radius:50%;border:2px solid rgba(24,201,255,.85);background:rgba(135,60,255,.38);color:#fff;font:800 13px "Trebuchet MS",system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;pointer-events:auto;touch-action:none;-webkit-touch-callout:none;padding:0;cursor:pointer}
.ka-tbtn.on{background:rgba(24,201,255,.55);border-color:#fff}
.ka-tb.edit{z-index:3}.ka-tb.edit .ka-tbtn{border-style:dashed;cursor:grab}.ka-tbtn.sel{box-shadow:0 0 0 3px #FFB21C,0 0 18px #FFB21C}
.ka-ov[data-o=edit]{z-index:1;background:rgba(7,11,32,.55);pointer-events:none;align-items:flex-start}.ka-ov[data-o=edit] .ka-card{pointer-events:auto}
.ka-rot{left:50%;top:26%;transform:translateX(-50%);font-size:14px;color:var(--g);background:rgba(7,11,32,.75);padding:6px 12px;border-radius:999px;white-space:nowrap}
.ka-cv{touch-action:none}
@media(max-width:640px){.ka-modes{grid-template-columns:1fr 1fr}.ka-modes .ka-f{grid-column:1/-1}.ka-card{padding:12px}}
@media(pointer:coarse){.ka-b{min-height:44px}}
@media(max-width:768px){.ka-hud{padding-left:68px !important}.ka-nav{padding-left:68px !important}}
</style>
<script>
// KruujLoader fornecido centralmente via /sdk/v1/kruuj-loader.js
window.addEventListener('DOMContentLoaded', () => {
  const isIframe = (window.self !== window.top);
  const kl = document.getElementById('kl');
  if (isIframe) {
    if (kl) {
      kl.classList.add('out');
      kl.style.display = 'none';
      kl.style.pointerEvents = 'none';
    }
    try { window.parent.postMessage({ type: 'game_loaded', gameSlug: 'kruuj-aim-trainer' }, '*'); } catch(e){}
    if (window.KruujSDK && typeof window.KruujSDK.gameLoadingFinished === 'function') {
      try { window.KruujSDK.gameLoadingFinished(); } catch(e){}
    }
  } else {
    try {
      if (typeof KruujLoader !== 'undefined') {
        KruujLoader.start({
          gameName: 'KRUUJ Aim Trainer',
          tagline: (typeof tD !== 'undefined' && tD.tagline ? tD.tagline : (typeof tG !== 'undefined' && tG.tagline ? tG.tagline : 'Prepare os fones, a coruja já está chegando.')),
          tips: (typeof tD !== 'undefined' && tD.tips ? tD.tips : (typeof tG !== 'undefined' && tG.tips ? tG.tips : ['Divirta-se com os jogos oficiais da KRUUJ Studio!'])),
          splash: 2000,
          minTime: 2400,
          onComplete: () => {
            if (kl) {
              kl.classList.add('out');
              kl.style.display = 'none';
              kl.style.pointerEvents = 'none';
            }
            try { window.parent.postMessage({ type: 'game_loaded', gameSlug: 'kruuj-aim-trainer' }, '*'); } catch(e){}
            if (window.KruujSDK && typeof window.KruujSDK.gameLoadingFinished === 'function') {
              try { window.KruujSDK.gameLoadingFinished(); } catch(e){}
            }
          }
        });
        setTimeout(() => {
          if (typeof KruujLoader !== 'undefined' && KruujLoader.finish) KruujLoader.finish();
          setTimeout(() => {
            if (kl) {
              kl.classList.add('out');
              kl.style.display = 'none';
              kl.style.pointerEvents = 'none';
            }
          }, 500);
        }, 2400);
      } else {
        if (kl) {
          kl.classList.add('out');
          kl.style.display = 'none';
          kl.style.pointerEvents = 'none';
        }
        try { window.parent.postMessage({ type: 'game_loaded', gameSlug: 'kruuj-aim-trainer' }, '*'); } catch(e){}
      }
    } catch(e) {
      if (kl) {
        kl.classList.add('out');
        kl.style.display = 'none';
        kl.style.pointerEvents = 'none';
      }
      try { window.parent.postMessage({ type: 'game_loaded', gameSlug: 'kruuj-aim-trainer' }, '*'); } catch(err){}
    }
  }
});
</script>
</body>
</html>
