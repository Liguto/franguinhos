<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>KRUUJ MATCH: A Saga das Corujas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070914;
      --bg-panel: #0d1224;
      --cyan: #38e8ff;
      --purple: #8b5cff;
      --gold: #ffb020;
      --pink: #ff5ca8;
      --red: #ef4444;
      --green: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Baloo 2', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Container Superior da Interface */
    .hud-bar {
      width: min(94vw, 440px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      padding: 0 4px;
      z-index: 10;
      gap: 6px;
    }

    .level-badge {
      font-size: 1.05rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .stats-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .stat-chip {
      background: rgba(13, 18, 36, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 9999px;
      padding: 4px 12px;
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .stat-chip span {
      color: #fff;
    }

    .moves-chip {
      border-color: rgba(255, 176, 32, 0.35);
    }

    .moves-chip span {
      color: var(--gold);
      font-size: 0.95rem;
    }

    /* Barra de Missão e Objetivo da Fase */
    .mission-bar {
      width: min(94vw, 440px);
      background: rgba(13, 18, 36, 0.85);
      border: 1px solid rgba(56, 232, 255, 0.25);
      border-radius: 12px;
      padding: 6px 14px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }

    .mission-title {
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--cyan);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mission-goal {
      font-size: 0.85rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    @media (max-width: 768px) {
      .hud-bar {
        padding-left: 68px !important; /* Desvia do botão Poki */
      }

      .stat-chip {
        padding: 3px 8px !important;
        font-size: 0.75rem !important;
      }
    }

    /* Tabuleiro 8x8 Canvas */
    #board-container {
      position: relative;
      width: min(94vw, 440px);
      height: min(94vw, 440px);
      background: rgba(13, 18, 36, 0.8);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), 0 0 25px rgba(139, 92, 246, 0.2);
      overflow: hidden;
      touch-action: none;
    }

    canvas#gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }

    canvas#gameCanvas:active {
      cursor: grabbing;
    }

    .hint-text {
      margin-top: 10px;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 700;
      text-align: center;
    }

    /* Overlay de Vitória / Fim de Jogo */
    .game-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(13, 18, 36, 0.94) 0%, rgba(7, 9, 20, 0.98) 100%);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .game-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    h1 {
      font-size: clamp(28px, 7vw, 46px);
      font-weight: 800;
      background: linear-gradient(135deg, var(--cyan), var(--purple), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    p {
      font-size: 0.92rem;
      color: var(--text-muted);
      max-width: 400px;
      line-height: 1.45;
      margin-bottom: 20px;
    }

    .stars-display {
      font-size: 2.2rem;
      margin-bottom: 14px;
      letter-spacing: 4px;
    }

    .stats-summary {
      display: flex;
      gap: 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 12px 24px;
      margin-bottom: 20px;
      justify-content: space-around;
      width: min(85vw, 360px);
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-item .label {
      font-size: 0.68rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 800;
    }

    .stat-item .val {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--cyan);
    }

    .btn-action {
      background: linear-gradient(135deg, #0284c7 0%, #8b5cff 100%);
      color: #fff;
      border: none;
      border-radius: 9999px;
      padding: 13px 40px;
      font-size: 1.15rem;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(56, 232, 255, 0.4);
      transition: all 0.2s;
    }

    .btn-action:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <!-- HUD Superior com Fase, Pontos e Movimentos -->
  <div class="hud-bar">
    <div class="level-badge" id="levelTitle">FASE 1</div>
    <div class="stats-group">
      <div class="stat-chip">PONTOS: <span id="scoreVal" style="color: var(--cyan);">0</span></div>
      <div class="stat-chip moves-chip">MOVIMENTOS: <span id="movesVal">20</span></div>
    </div>
  </div>

  <!-- Barra de Objetivo da Fase -->
  <div class="mission-bar">
    <div class="mission-title" id="missionDesc">🦉 Colete 12 Corujas Roxas</div>
    <div class="mission-goal" id="missionProgress">0 / 12</div>
  </div>

  <!-- Tabuleiro Canvas com Suporte a Arrastar (Swipe) -->
  <div id="board-container">
    <canvas id="gameCanvas"></canvas>
  </div>

  <div class="hint-text">👆 Arraste as peças com o dedo para trocar! Combine 4 para Coruja Relâmpago ⚡</div>

  <!-- Overlay de Fim de Jogo / Vitória -->
  <div class="game-overlay" id="endOverlay">
    <div class="stars-display" id="ovStars">⭐⭐⭐</div>
    <h1 id="ovTitle">FASE CONCLUÍDA!</h1>
    <p id="ovDesc">Parabéns! Você alcançou o objetivo da Fase e restaurou a relíquia do Santuário das Corujas!</p>
    
    <div class="stats-summary">
      <div class="stat-item">
        <span class="label">Pontos Finais</span>
        <span class="val" id="ovFinalScore">0</span>
      </div>
      <div class="stat-item">
        <span class="label">Movimentos Restantes</span>
        <span class="val" id="ovRemainingMoves" style="color: var(--gold);">0</span>
      </div>
    </div>

    <button class="btn-action" id="btnOverlayNext" onclick="window.matchGame.onOverlayAction()">PRÓXIMA FASE ⏩</button>
  </div>

  <script>
    // ===== 1. GERENCIADOR DE ÁUDIO SINTÉTICO (WEBAUDIO) =====
    class SoundController {
      constructor() {
        this.ctx = null;
      }

      init() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) this.ctx = new AudioContextClass();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
      }

      playSelect() {
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(540, now);
          gain.gain.setValueAtTime(0.06, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.08);
        } catch(e) {}
      }

      playMatch(combo = 1) {
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const baseFreq = 440 + Math.min(8, combo) * 65;
          [baseFreq, baseFreq * 1.25, baseFreq * 1.5].forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + i * 0.03);
            gain.gain.setValueAtTime(0.08, now + i * 0.03);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.03 + 0.22);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + i * 0.03);
            osc.stop(now + i * 0.03 + 0.22);
          });
        } catch(e) {}
      }

      playSpecialCreate() {
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(960, now + 0.25);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.28);
        } catch(e) {}
      }

      playSpecialBlast() {
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(800, now);
          osc.frequency.exponentialRampToValueAtTime(100, now + 0.35);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.35);
        } catch(e) {}
      }

      playWin() {
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + i * 0.1);
            gain.gain.setValueAtTime(0.12, now + i * 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.35);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + i * 0.1);
            osc.stop(now + i * 0.1 + 0.35);
          });
        } catch(e) {}
      }

      playInvalidSwap() {
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.exponentialRampToValueAtTime(140, now + 0.15);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.15);
        } catch(e) {}
      }
    }

    // ===== 2. SISTEMA DE PARTÍCULAS =====
    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 5;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = 1.0;
        this.radius = 2.5 + Math.random() * 2.5;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= 0.04;
      }

      render(ctx) {
        if (this.life <= 0) return;
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // ===== 3. PEÇA TEMÁTICA DA CORUJA KRUUJ E RELÍQUIAS =====
    // Tipos:
    // 0: Coruja Roxa KRUUJ (Mascote)
    // 1: Coruja Ciano (Cientista)
    // 2: Pena Dourada Sagrada
    // 3: Orbe Rubi Cósmico
    // 4: Cristal Esmeralda Astral
    // Special: null, 'line' (Match 4), 'bomb' (Match 5)
    class Piece {
      constructor(row, col, type, tileSize, special = null) {
        this.row = row;
        this.col = col;
        this.type = type;
        this.tileSize = tileSize;
        this.special = special; // null, 'line', 'bomb'

        this.x = col * tileSize;
        this.y = row * tileSize;
        this.targetX = this.x;
        this.targetY = this.y;

        this.scale = 1.0;
        this.alpha = 1.0;
        this.glowAngle = Math.random() * Math.PI;
      }

      update() {
        // Interpolação suave para animação fluida (Lerp 0.32)
        this.x += (this.targetX - this.x) * 0.32;
        this.y += (this.targetY - this.y) * 0.32;
        this.glowAngle += 0.08;
      }

      isMoving() {
        return Math.hypot(this.targetX - this.x, this.targetY - this.y) > 0.8;
      }

      setGridPosition(row, col) {
        this.row = row;
        this.col = col;
        this.targetX = col * this.tileSize;
        this.targetY = row * this.tileSize;
      }

      render(ctx, isSelected = false) {
        if (this.alpha <= 0) return;

        const cx = this.x + this.tileSize / 2;
        const cy = this.y + this.tileSize / 2;
        const r = (this.tileSize * 0.40) * this.scale;

        ctx.save();
        ctx.globalAlpha = this.alpha;

        // Borda de seleção destacada
        if (isSelected) {
          ctx.strokeStyle = '#38e8ff';
          ctx.lineWidth = 2.5;
          ctx.shadowColor = '#38e8ff';
          ctx.shadowBlur = 10;
          ctx.strokeRect(this.x + 3, this.y + 3, this.tileSize - 6, this.tileSize - 6);
          ctx.shadowBlur = 0;
        }

        // Aura especial para peças criadas em Match 4 e Match 5
        if (this.special === 'line') {
          ctx.strokeStyle = '#fde047';
          ctx.lineWidth = 2;
          ctx.setLineDash([4, 4]);
          ctx.beginPath();
          ctx.arc(cx, cy, r + 4, 0, Math.PI * 2);
          ctx.stroke();
          ctx.setLineDash([]);
        } else if (this.special === 'bomb') {
          ctx.strokeStyle = '#ff5ca8';
          ctx.lineWidth = 2.5;
          ctx.shadowColor = '#ff5ca8';
          ctx.shadowBlur = 12;
          ctx.beginPath();
          ctx.arc(cx, cy, r + 5, 0, Math.PI * 2);
          ctx.stroke();
          ctx.shadowBlur = 0;
        }

        switch (this.type) {
          case 0: // Coruja Roxa KRUUJ (Mascote Oficial)
            // Corpo
            ctx.fillStyle = '#8b5cff';
            ctx.shadowColor = '#8b5cff';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.arc(cx, cy + 2, r * 0.82, 0, Math.PI * 2);
            ctx.fill();

            // Penachos de orelha da coruja
            ctx.fillStyle = '#6d28d9';
            ctx.beginPath();
            ctx.moveTo(cx - r * 0.7, cy - r * 0.3);
            ctx.lineTo(cx - r * 0.85, cy - r * 0.95);
            ctx.lineTo(cx - r * 0.2, cy - r * 0.7);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(cx + r * 0.7, cy - r * 0.3);
            ctx.lineTo(cx + r * 0.85, cy - r * 0.95);
            ctx.lineTo(cx + r * 0.2, cy - r * 0.7);
            ctx.closePath();
            ctx.fill();

            // Olhos brancos
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(cx - r * 0.35, cy, r * 0.32, 0, Math.PI * 2);
            ctx.arc(cx + r * 0.35, cy, r * 0.32, 0, Math.PI * 2);
            ctx.fill();

            // Íris dourada
            ctx.fillStyle = '#ffb020';
            ctx.beginPath();
            ctx.arc(cx - r * 0.35, cy, r * 0.2, 0, Math.PI * 2);
            ctx.arc(cx + r * 0.35, cy, r * 0.2, 0, Math.PI * 2);
            ctx.fill();

            // Pupilas
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(cx - r * 0.35, cy, r * 0.1, 0, Math.PI * 2);
            ctx.arc(cx + r * 0.35, cy, r * 0.1, 0, Math.PI * 2);
            ctx.fill();

            // Bico dourado
            ctx.fillStyle = '#f59e0b';
            ctx.beginPath();
            ctx.moveTo(cx - r * 0.15, cy + r * 0.15);
            ctx.lineTo(cx + r * 0.15, cy + r * 0.15);
            ctx.lineTo(cx, cy + r * 0.45);
            ctx.closePath();
            ctx.fill();
            break;

          case 1: // Coruja Cientista Ciano
            ctx.fillStyle = '#06b6d4';
            ctx.shadowColor = '#06b6d4';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.arc(cx, cy + 2, r * 0.82, 0, Math.PI * 2);
            ctx.fill();

            // Penachos
            ctx.fillStyle = '#0891b2';
            ctx.beginPath();
            ctx.moveTo(cx - r * 0.7, cy - r * 0.3);
            ctx.lineTo(cx - r * 0.85, cy - r * 0.95);
            ctx.lineTo(cx - r * 0.2, cy - r * 0.7);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(cx + r * 0.7, cy - r * 0.3);
            ctx.lineTo(cx + r * 0.85, cy - r * 0.95);
            ctx.lineTo(cx + r * 0.2, cy - r * 0.7);
            ctx.closePath();
            ctx.fill();

            // Óculos neon
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.arc(cx - r * 0.35, cy, r * 0.32, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(cx + r * 0.35, cy, r * 0.32, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(cx - r * 0.1, cy);
            ctx.lineTo(cx + r * 0.1, cy);
            ctx.stroke();

            // Pupila azul
            ctx.fillStyle = '#38e8ff';
            ctx.beginPath();
            ctx.arc(cx - r * 0.35, cy, r * 0.16, 0, Math.PI * 2);
            ctx.arc(cx + r * 0.35, cy, r * 0.16, 0, Math.PI * 2);
            ctx.fill();
            break;

          case 2: // Pena Sagrada Dourada
            ctx.fillStyle = '#ffb020';
            ctx.shadowColor = '#ffb020';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.ellipse(cx, cy, r * 0.45, r * 0.88, 0.35, 0, Math.PI * 2);
            ctx.fill();

            // Eixo da pena
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.moveTo(cx - r * 0.3, cy + r * 0.8);
            ctx.lineTo(cx + r * 0.3, cy - r * 0.8);
            ctx.stroke();
            break;

          case 3: // Orbe Rubi Cósmico
            ctx.fillStyle = '#ef4444';
            ctx.shadowColor = '#ef4444';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(cx, cy, r * 0.82, 0, Math.PI * 2);
            ctx.fill();

            // Anel estrelado interno
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.arc(cx, cy, r * 0.5, 0, Math.PI * 2);
            ctx.stroke();
            break;

          case 4: // Gema Esmeralda Astral
            ctx.fillStyle = '#10b981';
            ctx.shadowColor = '#10b981';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
              const ang = (i * Math.PI) / 3;
              const px = cx + Math.cos(ang) * (r * 0.85);
              const py = cy + Math.sin(ang) * (r * 0.85);
              if (i === 0) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
            break;
        }

        // Ícone indicador sobre peça especial
        if (this.special === 'line') {
          ctx.fillStyle = '#fde047';
          ctx.font = '800 14px "Baloo 2", sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('⚡', cx, cy - r * 0.8);
        } else if (this.special === 'bomb') {
          ctx.fillStyle = '#ff5ca8';
          ctx.font = '800 14px "Baloo 2", sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('💥', cx, cy - r * 0.8);
        }

        ctx.restore();
      }
    }

    // ===== 4. TABULEIRO COM SUPORTE A SWIPE / ARRASTE =====
    class Board {
      constructor(rows, cols, tileSize) {
        this.rows = rows;
        this.cols = cols;
        this.tileSize = tileSize;
        this.typesCount = 5;
        this.grid = [];
        this.initGridWithoutMatches();
      }

      resize(tileSize) {
        this.tileSize = tileSize;
        for (let r = 0; r < this.rows; r++) {
          for (let c = 0; c < this.cols; c++) {
            if (this.grid[r][c]) {
              this.grid[r][c].tileSize = tileSize;
              this.grid[r][c].setGridPosition(r, c);
            }
          }
        }
      }

      initGridWithoutMatches() {
        this.grid = [];
        for (let r = 0; r < this.rows; r++) {
          this.grid[r] = [];
          for (let c = 0; c < this.cols; c++) {
            let type;
            do {
              type = Math.floor(Math.random() * this.typesCount);
            } while (
              (c >= 2 && this.grid[r][c - 1]?.type === type && this.grid[r][c - 2]?.type === type) ||
              (r >= 2 && this.grid[r - 1][c]?.type === type && this.grid[r - 2][c]?.type === type) ||
              (r >= 1 && c >= 1 && this.grid[r - 1][c]?.type === type && this.grid[r][c - 1]?.type === type && this.grid[r - 1][c - 1]?.type === type)
            );
            this.grid[r][c] = new Piece(r, c, type, this.tileSize);
          }
        }
      }

      getPiece(r, c) {
        if (r >= 0 && r < this.rows && c >= 0 && c < this.cols) {
          return this.grid[r][c];
        }
        return null;
      }

      isAdjacent(p1, p2) {
        const dRow = Math.abs(p1.row - p2.row);
        const dCol = Math.abs(p1.col - p2.col);
        return (dRow === 1 && dCol === 0) || (dRow === 0 && dCol === 1);
      }

      // Detecção de Match 3, 4 e 5 em Linhas, Colunas e Quadrados Perfeitos 2x2 (4 peças)
      findMatches() {
        const matches = new Set();
        const specialSpawns = []; // Posições onde surgirão peças especiais de 4 ou 5

        // 1. Horizontal
        for (let r = 0; r < this.rows; r++) {
          let c = 0;
          while (c < this.cols) {
            const p = this.grid[r][c];
            if (!p) { c++; continue; }
            let matchLen = 1;
            while (c + matchLen < this.cols && this.grid[r][c + matchLen]?.type === p.type) {
              matchLen++;
            }

            if (matchLen >= 3) {
              for (let i = 0; i < matchLen; i++) {
                matches.add(`${r},${c + i}`);
              }
              // Se for Match 4 ou 5, gera especial na posição central do grupo
              if (matchLen === 4) {
                specialSpawns.push({ row: r, col: c + 1, type: p.type, special: 'line' });
              } else if (matchLen >= 5) {
                specialSpawns.push({ row: r, col: c + 2, type: p.type, special: 'bomb' });
              }
            }
            c += matchLen;
          }
        }

        // 2. Vertical
        for (let c = 0; c < this.cols; c++) {
          let r = 0;
          while (r < this.rows) {
            const p = this.grid[r][c];
            if (!p) { r++; continue; }
            let matchLen = 1;
            while (r + matchLen < this.rows && this.grid[r + matchLen][c]?.type === p.type) {
              matchLen++;
            }

            if (matchLen >= 3) {
              for (let i = 0; i < matchLen; i++) {
                matches.add(`${r + i},${c}`);
              }
              if (matchLen === 4) {
                specialSpawns.push({ row: r + 1, col: c, type: p.type, special: 'line' });
              } else if (matchLen >= 5) {
                specialSpawns.push({ row: r + 2, col: c, type: p.type, special: 'bomb' });
              }
            }
            r += matchLen;
          }
        }

        // 3. Quadrado Perfeito 2x2 (4 peças juntas formando um bloco)
        for (let r = 0; r < this.rows - 1; r++) {
          for (let c = 0; c < this.cols - 1; c++) {
            const p00 = this.grid[r][c];
            const p01 = this.grid[r][c + 1];
            const p10 = this.grid[r + 1][c];
            const p11 = this.grid[r + 1][c + 1];

            if (p00 && p01 && p10 && p11) {
              const t = p00.type;
              if (p01.type === t && p10.type === t && p11.type === t) {
                matches.add(`${r},${c}`);
                matches.add(`${r},${c + 1}`);
                matches.add(`${r + 1},${c}`);
                matches.add(`${r + 1},${c + 1}`);

                // Gera peça especial de Coruja Relâmpago na posição do quadrado 2x2
                specialSpawns.push({ row: r, col: c, type: t, special: 'line' });
              }
            }
          }
        }

        return {
          matches: Array.from(matches).map(pos => {
            const [row, col] = pos.split(',').map(Number);
            return { row, col, piece: this.grid[row][col] };
          }),
          specialSpawns
        };
      }

      swap(p1, p2) {
        this.grid[p1.row][p1.col] = p2;
        this.grid[p2.row][p2.col] = p1;

        const r1 = p1.row, c1 = p1.col;
        p1.setGridPosition(p2.row, p2.col);
        p2.setGridPosition(r1, c1);
      }

      applyGravityAndRefill() {
        let hasFallen = false;

        for (let c = 0; c < this.cols; c++) {
          let emptyRow = this.rows - 1;

          for (let r = this.rows - 1; r >= 0; r--) {
            if (this.grid[r][c] !== null) {
              if (emptyRow !== r) {
                this.grid[emptyRow][c] = this.grid[r][c];
                this.grid[emptyRow][c].setGridPosition(emptyRow, c);
                this.grid[r][c] = null;
                hasFallen = true;
              }
              emptyRow--;
            }
          }

          for (let r = emptyRow; r >= 0; r--) {
            const newType = Math.floor(Math.random() * this.typesCount);
            const piece = new Piece(r, c, newType, this.tileSize);
            piece.y = -((emptyRow - r + 1) * this.tileSize);
            this.grid[r][c] = piece;
            hasFallen = true;
          }
        }

        return hasFallen;
      }

      isAnyPieceMoving() {
        for (let r = 0; r < this.rows; r++) {
          for (let c = 0; c < this.cols; c++) {
            if (this.grid[r][c]?.isMoving()) return true;
          }
        }
        return false;
      }

      update() {
        for (let r = 0; r < this.rows; r++) {
          for (let c = 0; c < this.cols; c++) {
            this.grid[r][c]?.update();
          }
        }
      }

      render(ctx, selectedPiece) {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
        ctx.lineWidth = 1;
        for (let i = 0; i <= this.cols; i++) {
          ctx.beginPath();
          ctx.moveTo(i * this.tileSize, 0);
          ctx.lineTo(i * this.tileSize, this.rows * this.tileSize);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(0, i * this.tileSize);
          ctx.lineTo(this.cols * this.tileSize, i * this.tileSize);
          ctx.stroke();
        }

        for (let r = 0; r < this.rows; r++) {
          for (let c = 0; c < this.cols; c++) {
            const p = this.grid[r][c];
            if (p) p.render(ctx, p === selectedPiece);
          }
        }
      }
    }

    // ===== 5. SAGA DAS CORUJAS: DEFINIÇÃO DE FASES E METAS =====
    const SAGA_LEVELS = [
      {
        level: 1,
        title: "O Despertar da Coruja",
        desc: "🦉 Colete 12 Corujas Roxas",
        moves: 20,
        targetType: 0,
        targetCount: 12,
        targetScore: 1000
      },
      {
        level: 2,
        title: "A Pena Dourada Sagrada",
        desc: "🪶 Colete 15 Penas Douradas",
        moves: 20,
        targetType: 2,
        targetCount: 15,
        targetScore: 1800
      },
      {
        level: 3,
        title: "O Enigma do Cientista",
        desc: "👓 Colete 16 Corujas Ciano",
        moves: 18,
        targetType: 1,
        targetCount: 16,
        targetScore: 2400
      },
      {
        level: 4,
        title: "O Santuário de Rubi",
        desc: "🔮 Colete 18 Orbes Cósmicos",
        moves: 22,
        targetType: 3,
        targetCount: 18,
        targetScore: 3200
      },
      {
        level: 5,
        title: "O Guardião Cósmico",
        desc: "🦉 Colete 25 Corujas Roxas",
        moves: 24,
        targetType: 0,
        targetCount: 25,
        targetScore: 5000
      }
    ];

    // ===== 6. CLASSE PRINCIPAL DO JOGO (ENGINE COMPLETA) =====
    class Game {
      constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.sound = new SoundController();

        this.rows = 8;
        this.cols = 8;
        this.tileSize = 50;

        this.board = new Board(this.rows, this.cols, this.tileSize);
        this.selectedPiece = null;
        this.isBusy = false;

        this.currentLevelIndex = parseInt(localStorage.getItem('kruuj_match_level') || '0', 10);
        if (this.currentLevelIndex >= SAGA_LEVELS.length) this.currentLevelIndex = 0;

        this.levelData = SAGA_LEVELS[this.currentLevelIndex];
        this.score = 0;
        this.movesLeft = this.levelData.moves;
        this.progressCount = 0;
        this.particles = [];

        // Controle do Arraste (Swipe)
        this.dragStart = null;

        this.init();
      }

      init() {
        this.resize();
        window.addEventListener('resize', () => this.resize());

        // Eventos de Toque e Mouse com Arraste (Drag/Swipe)
        this.canvas.addEventListener('pointerdown', (e) => this.onPointerDown(e));
        this.canvas.addEventListener('pointermove', (e) => this.onPointerMove(e));
        window.addEventListener('pointerup', () => { this.dragStart = null; });
        window.addEventListener('pointercancel', () => { this.dragStart = null; });

        this.loadLevel(this.currentLevelIndex);
        this.loop = this.loop.bind(this);
        requestAnimationFrame(this.loop);

        try {
          window.parent.postMessage({ type: 'game_loaded', gameSlug: 'kruuj-match' }, '*');
        } catch(e) {}
      }

      resize() {
        const container = document.getElementById('board-container');
        const size = container.clientWidth;
        this.canvas.width = size;
        this.canvas.height = size;
        this.tileSize = size / this.cols;
        this.board.resize(this.tileSize);
      }

      loadLevel(index) {
        this.currentLevelIndex = index;
        localStorage.setItem('kruuj_match_level', String(index));
        this.levelData = SAGA_LEVELS[index % SAGA_LEVELS.length];

        this.score = 0;
        this.movesLeft = this.levelData.moves;
        this.progressCount = 0;
        this.selectedPiece = null;
        this.isBusy = false;
        this.particles = [];

        this.board.initGridWithoutMatches();
        document.getElementById('endOverlay').classList.remove('active');
        this.updateUI();
      }

      onPointerDown(e) {
        if (this.isBusy || this.movesLeft <= 0) return;
        this.sound.init();

        const rect = this.canvas.getBoundingClientRect();
        const col = Math.floor((e.clientX - rect.left) / this.tileSize);
        const row = Math.floor((e.clientY - rect.top) / this.tileSize);

        const piece = this.board.getPiece(row, col);
        if (!piece) return;

        // Registra ponto inicial do arraste
        this.dragStart = {
          row,
          col,
          clientX: e.clientX,
          clientY: e.clientY,
          piece
        };

        // Suporte alternativo a clique
        if (!this.selectedPiece) {
          this.selectedPiece = piece;
          this.sound.playSelect();
        } else if (this.selectedPiece === piece) {
          this.selectedPiece = null;
        } else if (this.board.isAdjacent(this.selectedPiece, piece)) {
          const pA = this.selectedPiece;
          const pB = piece;
          this.selectedPiece = null;
          this.dragStart = null;
          this.attemptSwap(pA, pB);
        } else {
          this.selectedPiece = piece;
          this.sound.playSelect();
        }
      }

      onPointerMove(e) {
        // Se estiver arrastando e moveu mais de 16px, calcula direção cardinal do swipe
        if (!this.dragStart || this.isBusy || this.movesLeft <= 0) return;

        const dx = e.clientX - this.dragStart.clientX;
        const dy = e.clientY - this.dragStart.clientY;
        const dist = Math.hypot(dx, dy);

        if (dist > 18) {
          let targetRow = this.dragStart.row;
          let targetCol = this.dragStart.col;

          if (Math.abs(dx) > Math.abs(dy)) {
            targetCol += (dx > 0 ? 1 : -1);
          } else {
            targetRow += (dy > 0 ? 1 : -1);
          }

          const targetPiece = this.board.getPiece(targetRow, targetCol);
          const startPiece = this.dragStart.piece;

          this.dragStart = null;
          this.selectedPiece = null;

          if (targetPiece) {
            this.attemptSwap(startPiece, targetPiece);
          }
        }
      }

      async attemptSwap(p1, p2) {
        this.isBusy = true;

        this.board.swap(p1, p2);
        await this.waitForBoardMovement();

        const { matches } = this.board.findMatches();

        if (matches.length > 0) {
          this.movesLeft--;
          this.updateUI();
          await this.processBoardCascades();
        } else {
          this.sound.playInvalidSwap();
          await new Promise(r => setTimeout(r, 110));

          this.board.swap(p1, p2);
          await this.waitForBoardMovement();
        }

        // Verifica vitória da fase ou fim de movimentos
        this.checkLevelStatus();

        this.isBusy = false;
      }

      async waitForBoardMovement() {
        while (this.board.isAnyPieceMoving()) {
          await new Promise(r => setTimeout(r, 16));
        }
      }

      async processBoardCascades() {
        let matchResult = this.board.findMatches();
        let comboCount = 0;

        while (matchResult.matches.length > 0) {
          comboCount++;

          const specialSpawns = matchResult.specialSpawns;
          if (specialSpawns.length > 0) {
            this.sound.playSpecialCreate();
          } else {
            this.sound.playMatch(comboCount);
          }

          // Computa pontuação e objetivos
          matchResult.matches.forEach(m => {
            const piece = m.piece;
            if (piece) {
              if (piece.type === this.levelData.targetType) {
                this.progressCount++;
              }
              const colors = ['#8b5cff', '#06b6d4', '#ffb020', '#ef4444', '#10b981'];
              this.spawnExplosion(piece.x + this.tileSize / 2, piece.y + this.tileSize / 2, colors[piece.type]);

              // Se a peça era especial, detona raio ou explosão
              if (piece.special === 'line') {
                this.sound.playSpecialBlast();
                this.clearRowAndColumn(m.row, m.col);
              } else if (piece.special === 'bomb') {
                this.sound.playSpecialBlast();
                this.clearArea(m.row, m.col);
              }

              this.board.grid[m.row][m.col] = null;
            }
          });

          this.score += matchResult.matches.length * 20 * comboCount;
          this.updateUI();

          // Cria novas peças especiais nos pontos de Match 4 e Match 5
          specialSpawns.forEach(sp => {
            if (this.board.grid[sp.row][sp.col] === null) {
              this.board.grid[sp.row][sp.col] = new Piece(sp.row, sp.col, sp.type, this.tileSize, sp.special);
            }
          });

          await new Promise(r => setTimeout(r, 130));

          this.board.applyGravityAndRefill();
          await this.waitForBoardMovement();

          await new Promise(r => setTimeout(r, 90));
          matchResult = this.board.findMatches();
        }
      }

      clearRowAndColumn(row, col) {
        for (let c = 0; c < this.cols; c++) {
          if (this.board.grid[row][c]) {
            this.spawnExplosion(this.board.grid[row][c].x + this.tileSize / 2, this.board.grid[row][c].y + this.tileSize / 2, '#fde047');
            this.board.grid[row][c] = null;
          }
        }
        for (let r = 0; r < this.rows; r++) {
          if (this.board.grid[r][col]) {
            this.spawnExplosion(this.board.grid[r][col].x + this.tileSize / 2, this.board.grid[r][col].y + this.tileSize / 2, '#fde047');
            this.board.grid[r][col] = null;
          }
        }
      }

      clearArea(centerRow, centerCol) {
        for (let r = centerRow - 1; r <= centerRow + 1; r++) {
          for (let c = centerCol - 1; c <= centerCol + 1; c++) {
            if (r >= 0 && r < this.rows && c >= 0 && c < this.cols && this.board.grid[r][c]) {
              this.spawnExplosion(this.board.grid[r][c].x + this.tileSize / 2, this.board.grid[r][c].y + this.tileSize / 2, '#ff5ca8');
              this.board.grid[r][c] = null;
            }
          }
        }
      }

      spawnExplosion(x, y, color) {
        for (let i = 0; i < 8; i++) {
          this.particles.push(new Particle(x, y, color));
        }
      }

      checkLevelStatus() {
        const isGoalMet = this.progressCount >= this.levelData.targetCount;

        if (isGoalMet) {
          // Vitória da Fase!
          this.sound.playWin();
          const stars = this.movesLeft >= 6 ? '⭐⭐⭐' : (this.movesLeft >= 2 ? '⭐⭐' : '⭐');

          document.getElementById('ovStars').textContent = stars;
          document.getElementById('ovTitle').textContent = 'FASE CONCLUÍDA!';
          document.getElementById('ovDesc').textContent = `Excelente trabalho! Você concluiu a ${this.levelData.title} e restaurou o Santuário!`;
          document.getElementById('ovFinalScore').textContent = this.score;
          document.getElementById('ovRemainingMoves').textContent = this.movesLeft;
          document.getElementById('btnOverlayNext').textContent = 'PRÓXIMA FASE ⏩';
          document.getElementById('btnOverlayNext').onclick = () => this.nextLevel();

          document.getElementById('endOverlay').classList.add('active');

          try {
            window.parent.postMessage({ type: 'game_save', gameSlug: 'kruuj-match', saveData: { level: this.currentLevelIndex + 1 }, score: this.score }, '*');
          } catch(e) {}
        } else if (this.movesLeft <= 0) {
          // Derrota (Movimentos esgotados)
          document.getElementById('ovStars').textContent = '❌';
          document.getElementById('ovTitle').textContent = 'MOVIMENTOS ESGOTADOS!';
          document.getElementById('ovDesc').textContent = `Você não conseguiu atingir a meta da ${this.levelData.title}. Tente novamente!`;
          document.getElementById('ovFinalScore').textContent = this.score;
          document.getElementById('ovRemainingMoves').textContent = '0';
          document.getElementById('btnOverlayNext').textContent = 'TENTAR NOVAMENTE 🔄';
          document.getElementById('btnOverlayNext').onclick = () => this.restartLevel();

          document.getElementById('endOverlay').classList.add('active');
        }
      }

      nextLevel() {
        this.loadLevel((this.currentLevelIndex + 1) % SAGA_LEVELS.length);
      }

      restartLevel() {
        this.loadLevel(this.currentLevelIndex);
      }

      onOverlayAction() {
        if (this.progressCount >= this.levelData.targetCount) {
          this.nextLevel();
        } else {
          this.restartLevel();
        }
      }

      updateUI() {
        document.getElementById('levelTitle').textContent = `FASE ${this.levelData.level}: ${this.levelData.title}`;
        document.getElementById('scoreVal').textContent = this.score;
        document.getElementById('movesVal').textContent = this.movesLeft;
        document.getElementById('missionDesc').textContent = this.levelData.desc;
        document.getElementById('missionProgress').textContent = `${Math.min(this.levelData.targetCount, this.progressCount)} / ${this.levelData.targetCount}`;
      }

      loop() {
        requestAnimationFrame(this.loop);

        this.ctx.fillStyle = '#0a0d1f';
        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

        this.board.update();
        this.board.render(this.ctx, this.selectedPiece);

        for (let i = this.particles.length - 1; i >= 0; i--) {
          const pt = this.particles[i];
          pt.update();
          if (pt.life <= 0) {
            this.particles.splice(i, 1);
          } else {
            pt.render(this.ctx);
          }
        }
      }
    }

    // Instanciação Global
    window.addEventListener('DOMContentLoaded', () => {
      window.matchGame = new Game();
    });
  </script>
