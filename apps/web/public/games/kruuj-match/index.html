<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>KRUUJ MATCH: Alquimia Estelar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070914;
      --bg-panel: #0d1224;
      --cyan: #38e8ff;
      --purple: #8b5cff;
      --gold: #ffb020;
      --red: #ef4444;
      --green: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Baloo 2', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Container Superior da Interface */
    .hud-bar {
      width: min(92vw, 440px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding: 0 4px;
      z-index: 10;
    }

    .game-logo {
      font-size: 1.3rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--cyan), var(--purple), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.01em;
    }

    .stats-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .stat-chip {
      background: rgba(13, 18, 36, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      border-radius: 9999px;
      padding: 4px 14px;
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--text-muted);
    }

    .stat-chip span {
      color: #fff;
    }

    .btn-reset {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #cbd5e1;
      border-radius: 9999px;
      padding: 4px 12px;
      font-size: 0.8rem;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-reset:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: #ef4444;
      color: #f87171;
    }

    /* Tabuleiro 8x8 Canvas */
    #board-container {
      position: relative;
      width: min(92vw, 440px);
      height: min(92vw, 440px);
      background: rgba(13, 18, 36, 0.75);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), 0 0 25px rgba(139, 92, 246, 0.15);
      overflow: hidden;
    }

    canvas#gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: pointer;
    }

    .hint-text {
      margin-top: 12px;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 700;
      text-align: center;
    }

    /* Overlay de Fim de Jogo */
    .game-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(13, 18, 36, 0.94) 0%, rgba(7, 9, 20, 0.98) 100%);
      backdrop-filter: blur(14px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .game-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    h1 {
      font-size: clamp(30px, 7vw, 48px);
      font-weight: 800;
      background: linear-gradient(135deg, var(--cyan), var(--purple), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    p {
      font-size: 0.95rem;
      color: var(--text-muted);
      max-width: 400px;
      line-height: 1.4;
      margin-bottom: 22px;
    }

    .stats-summary {
      display: flex;
      gap: 24px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 12px 28px;
      margin-bottom: 24px;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-item .label {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 800;
    }

    .stat-item .val {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--cyan);
    }

    .btn-action {
      background: linear-gradient(135deg, #0284c7 0%, #8b5cff 100%);
      color: #fff;
      border: none;
      border-radius: 9999px;
      padding: 12px 40px;
      font-size: 1.15rem;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(56, 232, 255, 0.4);
      transition: all 0.2s;
    }

    .btn-action:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <!-- HUD Superior -->
  <div class="hud-bar">
    <div class="game-logo">KRUUJ MATCH</div>
    <div class="stats-group">
      <div class="stat-chip">PONTOS: <span id="scoreVal" style="color: var(--cyan);">0</span></div>
      <div class="stat-chip">MOVIMENTOS: <span id="movesVal" style="color: var(--gold);">30</span></div>
      <button class="btn-reset" onclick="window.matchGame.resetGame()">Reset</button>
    </div>
  </div>

  <!-- Tabuleiro Canvas -->
  <div id="board-container">
    <canvas id="gameCanvas"></canvas>
  </div>

  <div class="hint-text">Toque em uma peça e depois em uma vizinha para trocar!</div>

  <!-- Overlay de Fim de Jogo -->
  <div class="game-overlay" id="endOverlay">
    <h1 id="ovTitle">MOVIMENTOS ESGOTADOS!</h1>
    <p id="ovDesc">Você utilizou todos os 30 movimentos na Alquimia Estelar. Veja sua pontuação final e tente bater seu recorde!</p>
    <div class="stats-summary">
      <div class="stat-item">
        <span class="label">Pontos Finais</span>
        <span class="val" id="ovFinalScore">0</span>
      </div>
      <div class="stat-item">
        <span class="label">Melhor Score</span>
        <span class="val" id="ovBestScore" style="color: var(--gold);">0</span>
      </div>
    </div>
    <button class="btn-action" onclick="window.matchGame.resetGame()">JOGAR NOVAMENTE 🔮</button>
  </div>

  <!-- ================================================================= -->
  <!-- LÓGICA DO MATCH-3 EM PROGRAMAÇÃO ORIENTADA A OBJETOS (POO)        -->
  <!-- ================================================================= -->
  <script>
    // ===== 1. GERENCIADOR DE ÁUDIO SINTÉTICO (WEBAUDIO) =====
    class SoundController {
      constructor() {
        this.ctx = null;
      }

      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      // Som de clique/seleção
      playSelect() {
        try {
          this.init();
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(540, now);
          gain.gain.setValueAtTime(0.06, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.08);
        } catch(e) {}
      }

      // Som de Match / Explosão de cristais (Acorde cristalino harmônico)
      playMatch(combo = 1) {
        try {
          this.init();
          const now = this.ctx.currentTime;
          const baseFreq = 440 + Math.min(8, combo) * 65;
          [baseFreq, baseFreq * 1.25, baseFreq * 1.5].forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + i * 0.03);
            gain.gain.setValueAtTime(0.08, now + i * 0.03);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.03 + 0.25);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + i * 0.03);
            osc.stop(now + i * 0.03 + 0.25);
          });
        } catch(e) {}
      }

      // Som de troca inválida (Vai e volta)
      playInvalidSwap() {
        try {
          this.init();
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.exponentialRampToValueAtTime(140, now + 0.15);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.15);
        } catch(e) {}
      }
    }

    // ===== 2. SISTEMA DE PARTÍCULAS (POEIRA ESTELAR MÁGICA) =====
    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 4.5;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = 1.0;
        this.radius = 2.5 + Math.random() * 2.5;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= 0.04;
      }

      render(ctx) {
        if (this.life <= 0) return;
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // ===== 3. PEÇA / CRISTAL RÚNICO =====
    class Piece {
      constructor(row, col, type, tileSize) {
        this.row = row;
        this.col = col;
        this.type = type;
        this.tileSize = tileSize;

        // Posição visual na tela (em pixels) para animação suave
        this.x = col * tileSize;
        this.y = row * tileSize;
        this.targetX = this.x;
        this.targetY = this.y;

        this.scale = 1.0;
        this.alpha = 1.0;
      }

      // Atualiza interpolação suave da posição (Lerp)
      update() {
        this.x += (this.targetX - this.x) * 0.28;
        this.y += (this.targetY - this.y) * 0.28;
      }

      isMoving() {
        return Math.hypot(this.targetX - this.x, this.targetY - this.y) > 0.8;
      }

      setGridPosition(row, col) {
        this.row = row;
        this.col = col;
        this.targetX = col * this.tileSize;
        this.targetY = row * this.tileSize;
      }

      // Renderiza as 5 Formas Geométricas Simples no Canvas (Pronto para sprites)
      render(ctx, isSelected = false) {
        if (this.alpha <= 0) return;

        const cx = this.x + this.tileSize / 2;
        const cy = this.y + this.tileSize / 2;
        const r = (this.tileSize * 0.38) * this.scale;

        ctx.save();
        ctx.globalAlpha = this.alpha;

        // Borda de seleção destacada
        if (isSelected) {
          ctx.strokeStyle = '#38e8ff';
          ctx.lineWidth = 2.5;
          ctx.strokeRect(this.x + 4, this.y + 4, this.tileSize - 8, this.tileSize - 8);
        }

        // As 5 formas/cores geométricas solicitadas:
        // 0: Diamante Ciano (◆)
        // 1: Ametista Roxa (▲)
        // 2: Estrela Dourada (★)
        // 3: Rubi Vermelho (●)
        // 4: Esmeralda Verde (✦)
        switch (this.type) {
          case 0: // Diamante Ciano
            ctx.fillStyle = '#38e8ff';
            ctx.shadowColor = '#38e8ff';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.moveTo(cx, cy - r);
            ctx.lineTo(cx + r, cy);
            ctx.lineTo(cx, cy + r);
            ctx.lineTo(cx - r, cy);
            ctx.closePath();
            ctx.fill();
            break;

          case 1: // Ametista Roxa (Triângulo)
            ctx.fillStyle = '#8b5cff';
            ctx.shadowColor = '#8b5cff';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.moveTo(cx, cy - r);
            ctx.lineTo(cx + r, cy + r * 0.85);
            ctx.lineTo(cx - r, cy + r * 0.85);
            ctx.closePath();
            ctx.fill();
            break;

          case 2: // Estrela Dourada (Estrela de 4 pontas geométrica)
            ctx.fillStyle = '#ffb020';
            ctx.shadowColor = '#ffb020';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            for (let i = 0; i < 8; i++) {
              const rad = (i * Math.PI) / 4;
              const len = i % 2 === 0 ? r : r * 0.45;
              const px = cx + Math.cos(rad) * len;
              const py = cy + Math.sin(rad) * len;
              if (i === 0) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
            break;

          case 3: // Rubi Vermelho (Círculo)
            ctx.fillStyle = '#ef4444';
            ctx.shadowColor = '#ef4444';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fill();
            break;

          case 4: // Esmeralda Verde (Quadrado Chanfrado)
            ctx.fillStyle = '#10b981';
            ctx.shadowColor = '#10b981';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.roundRect(cx - r * 0.85, cy - r * 0.85, r * 1.7, r * 1.7, 6);
            ctx.fill();
            break;
        }

        // Brilho facetado interno
        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.beginPath();
        ctx.arc(cx - r * 0.25, cy - r * 0.25, r * 0.25, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    // ===== 4. TABULEIRO 8x8 (MATRIZ BIDIMENSIONAL) =====
    class Board {
      constructor(rows, cols, tileSize) {
        this.rows = rows;
        this.cols = cols;
        this.tileSize = tileSize;
        this.typesCount = 5; // 5 tipos de cristais
        this.grid = []; // Matriz 2D
        this.initGridWithoutMatches();
      }

      resize(tileSize) {
        this.tileSize = tileSize;
        for (let r = 0; r < this.rows; r++) {
          for (let c = 0; c < this.cols; c++) {
            if (this.grid[r][c]) {
              this.grid[r][c].tileSize = tileSize;
              this.grid[r][c].setGridPosition(r, c);
            }
          }
        }
      }

      // Garante que o tabuleiro comece SEM combinações de 3 peças já prontas
      initGridWithoutMatches() {
        this.grid = [];
        for (let r = 0; r < this.rows; r++) {
          this.grid[r] = [];
          for (let c = 0; c < this.cols; c++) {
            let type;
            do {
              type = Math.floor(Math.random() * this.typesCount);
            } while (
              (c >= 2 && this.grid[r][c - 1]?.type === type && this.grid[r][c - 2]?.type === type) ||
              (r >= 2 && this.grid[r - 1][c]?.type === type && this.grid[r - 2][c]?.type === type)
            );
            this.grid[r][c] = new Piece(r, c, type, this.tileSize);
          }
        }
      }

      getPiece(r, c) {
        if (r >= 0 && r < this.rows && c >= 0 && c < this.cols) {
          return this.grid[r][c];
        }
        return null;
      }

      // Verifica se duas posições são vizinhas ortogonais (acima, abaixo, esquerda ou direita)
      isAdjacent(p1, p2) {
        const dRow = Math.abs(p1.row - p2.row);
        const dCol = Math.abs(p1.col - p2.col);
        return (dRow === 1 && dCol === 0) || (dRow === 0 && dCol === 1);
      }

      // Identifica todas as combinações de 3 ou mais peças na horizontal e vertical
      findMatches() {
        const matches = new Set();

        // 1. Horizontal
        for (let r = 0; r < this.rows; r++) {
          for (let c = 0; c < this.cols - 2; c++) {
            const p = this.grid[r][c];
            if (!p) continue;
            const t = p.type;
            if (t === this.grid[r][c + 1]?.type && t === this.grid[r][c + 2]?.type) {
              matches.add(`${r},${c}`);
              matches.add(`${r},${c + 1}`);
              matches.add(`${r},${c + 2}`);
              // Se tiver 4 ou 5 em linha
              if (t === this.grid[r][c + 3]?.type) matches.add(`${r},${c + 3}`);
              if (t === this.grid[r][c + 4]?.type) matches.add(`${r},${c + 4}`);
            }
          }
        }

        // 2. Vertical
        for (let c = 0; c < this.cols; c++) {
          for (let r = 0; r < this.rows - 2; r++) {
            const p = this.grid[r][c];
            if (!p) continue;
            const t = p.type;
            if (t === this.grid[r + 1][c]?.type && t === this.grid[r + 2][c]?.type) {
              matches.add(`${r},${c}`);
              matches.add(`${r + 1},${c}`);
              matches.add(`${r + 2},${c}`);
              if (t === this.grid[r + 3]?.[c]?.type) matches.add(`${r + 3},${c}`);
              if (t === this.grid[r + 4]?.[c]?.type) matches.add(`${r + 4},${c}`);
            }
          }
        }

        return Array.from(matches).map(pos => {
          const [row, col] = pos.split(',').map(Number);
          return { row, col, piece: this.grid[row][col] };
        });
      }

      // Troca duas peças na matriz
      swap(p1, p2) {
        this.grid[p1.row][p1.col] = p2;
        this.grid[p2.row][p2.col] = p1;

        const r1 = p1.row, c1 = p1.col;
        p1.setGridPosition(p2.row, p2.col);
        p2.setGridPosition(r1, c1);
      }

      // Aplica gravidade e preenche o topo (Refill/Cascade)
      applyGravityAndRefill() {
        let hasFallen = false;

        for (let c = 0; c < this.cols; c++) {
          let emptyRow = this.rows - 1;

          // Desce peças existentes
          for (let r = this.rows - 1; r >= 0; r--) {
            if (this.grid[r][c] !== null) {
              if (emptyRow !== r) {
                this.grid[emptyRow][c] = this.grid[r][c];
                this.grid[emptyRow][c].setGridPosition(emptyRow, c);
                this.grid[r][c] = null;
                hasFallen = true;
              }
              emptyRow--;
            }
          }

          // Spawna novas peças no topo
          for (let r = emptyRow; r >= 0; r--) {
            const newType = Math.floor(Math.random() * this.typesCount);
            const piece = new Piece(r, c, newType, this.tileSize);
            piece.y = -((emptyRow - r + 1) * this.tileSize); // Começa acima da tela
            this.grid[r][c] = piece;
            hasFallen = true;
          }
        }

        return hasFallen;
      }

      isAnyPieceMoving() {
        for (let r = 0; r < this.rows; r++) {
          for (let c = 0; c < this.cols; c++) {
            if (this.grid[r][c]?.isMoving()) return true;
          }
        }
        return false;
      }

      update() {
        for (let r = 0; r < this.rows; r++) {
          for (let c = 0; c < this.cols; c++) {
            this.grid[r][c]?.update();
          }
        }
      }

      render(ctx, selectedPiece) {
        // Grade sutil de fundo
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
        ctx.lineWidth = 1;
        for (let i = 0; i <= this.cols; i++) {
          ctx.beginPath();
          ctx.moveTo(i * this.tileSize, 0);
          ctx.lineTo(i * this.tileSize, this.rows * this.tileSize);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(0, i * this.tileSize);
          ctx.lineTo(this.cols * this.tileSize, i * this.tileSize);
          ctx.stroke();
        }

        // Renderiza peças
        for (let r = 0; r < this.rows; r++) {
          for (let c = 0; c < this.cols; c++) {
            const p = this.grid[r][c];
            if (p) p.render(ctx, p === selectedPiece);
          }
        }
      }
    }

    // ===== 5. CLASSE PRINCIPAL DO JOGO (ENGINE COMPLETA) =====
    class Game {
      constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.sound = new SoundController();

        this.rows = 8;
        this.cols = 8;
        this.tileSize = 50;

        this.board = new Board(this.rows, this.cols, this.tileSize);
        this.selectedPiece = null;
        this.isBusy = false; // Trava de clique enquanto anima

        this.score = 0;
        this.movesLeft = 30; // Limite de 30 movimentos especificado
        this.bestScore = parseInt(localStorage.getItem('kruuj_match_best') || '0', 10);
        this.particles = [];

        this.init();
      }

      init() {
        this.resize();
        window.addEventListener('resize', () => this.resize());

        this.canvas.addEventListener('pointerdown', (e) => this.onPointerDown(e));

        this.updateUI();
        this.loop = this.loop.bind(this);
        requestAnimationFrame(this.loop);

        try {
          window.parent.postMessage({ type: 'game_loaded', gameSlug: 'kruuj-match' }, '*');
        } catch(e) {}
      }

      resize() {
        const container = document.getElementById('board-container');
        const size = container.clientWidth;
        this.canvas.width = size;
        this.canvas.height = size;
        this.tileSize = size / this.cols;
        this.board.resize(this.tileSize);
      }

      async onPointerDown(e) {
        // Bloqueio de cliques durante animação de queda ou explosão
        if (this.isBusy || this.movesLeft <= 0) return;

        this.sound.init();
        const rect = this.canvas.getBoundingClientRect();
        const col = Math.floor((e.clientX - rect.left) / this.tileSize);
        const row = Math.floor((e.clientY - rect.top) / this.tileSize);

        const clicked = this.board.getPiece(row, col);
        if (!clicked) return;

        // 1. Primeiro clique: Seleciona a peça
        if (!this.selectedPiece) {
          this.selectedPiece = clicked;
          this.sound.playSelect();
          return;
        }

        // Se clicou na mesma peça: Desmarca
        if (this.selectedPiece === clicked) {
          this.selectedPiece = null;
          return;
        }

        // 2. Segundo clique: Verifica se é vizinha ortogonal
        if (this.board.isAdjacent(this.selectedPiece, clicked)) {
          const pieceA = this.selectedPiece;
          const pieceB = clicked;
          this.selectedPiece = null;

          await this.attemptSwap(pieceA, pieceB);
        } else {
          // Se clicou em uma peça distante, muda a seleção para ela
          this.selectedPiece = clicked;
          this.sound.playSelect();
        }
      }

      // Executa a lógica de troca com validação e "vai e volta" se inválida
      async attemptSwap(p1, p2) {
        this.isBusy = true; // Trava o clique do jogador

        // 1. Faz a troca visual
        this.board.swap(p1, p2);
        await this.waitForBoardMovement();

        // 2. Verifica se a troca resultou em match
        const matches = this.board.findMatches();

        if (matches.length > 0) {
          // Troca válida!
          this.movesLeft--;
          this.updateUI();
          await this.processBoardCascades();
        } else {
          // Troca INVÁLIDA: Animação rápida de "vai e volta" (Desfaz a troca)
          this.sound.playInvalidSwap();
          await new Promise(r => setTimeout(r, 120));

          this.board.swap(p1, p2);
          await this.waitForBoardMovement();
        }

        // Checa se os movimentos acabaram
        if (this.movesLeft <= 0) {
          this.gameOver();
        }

        this.isBusy = false; // Libera o clique do jogador
      }

      // Aguarda as peças terminarem o deslocamento visual suave
      async waitForBoardMovement() {
        while (this.board.isAnyPieceMoving()) {
          await new Promise(r => setTimeout(r, 16));
        }
      }

      // Processa a destruição, cascata e novos combos em cadeia
      async processBoardCascades() {
        let matches = this.board.findMatches();
        let comboCount = 0;

        while (matches.length > 0) {
          comboCount++;
          this.sound.playMatch(comboCount);

          // Pontuação por combo
          this.score += matches.length * 15 * comboCount;
          this.updateUI();

          // Destrói peças combinadas e gera explosão de poeira estelar
          matches.forEach(m => {
            const piece = this.board.grid[m.row][m.col];
            if (piece) {
              const colors = ['#38e8ff', '#8b5cff', '#ffb020', '#ef4444', '#10b981'];
              this.spawnExplosion(piece.x + this.tileSize / 2, piece.y + this.tileSize / 2, colors[piece.type]);
              this.board.grid[m.row][m.col] = null;
            }
          });

          await new Promise(r => setTimeout(r, 140));

          // Queda de peças e novos cristais no topo (Cascade/Refill)
          this.board.applyGravityAndRefill();
          await this.waitForBoardMovement();

          // Aguarda um instante e re-checa se surgiram novos combos
          await new Promise(r => setTimeout(r, 100));
          matches = this.board.findMatches();
        }
      }

      spawnExplosion(x, y, color) {
        for (let i = 0; i < 9; i++) {
          this.particles.push(new Particle(x, y, color));
        }
      }

      resetGame() {
        this.score = 0;
        this.movesLeft = 30;
        this.selectedPiece = null;
        this.isBusy = false;
        this.particles = [];
        this.board.initGridWithoutMatches();
        document.getElementById('endOverlay').classList.remove('active');
        this.updateUI();
      }

      gameOver() {
        this.bestScore = Math.max(this.bestScore, this.score);
        localStorage.setItem('kruuj_match_best', String(this.bestScore));

        document.getElementById('ovFinalScore').textContent = this.score;
        document.getElementById('ovBestScore').textContent = this.bestScore;
        document.getElementById('endOverlay').classList.add('active');

        try {
          window.parent.postMessage({ type: 'game_over', gameSlug: 'kruuj-match', score: this.score, bestScore: this.bestScore }, '*');
          window.parent.postMessage({ type: 'game_save', gameSlug: 'kruuj-match', saveData: { bestScore: this.bestScore }, score: this.score }, '*');
        } catch(e) {}
      }

      updateUI() {
        document.getElementById('scoreVal').textContent = this.score;
        document.getElementById('movesVal').textContent = this.movesLeft;
      }

      loop() {
        requestAnimationFrame(this.loop);

        // 1. Limpa o Canvas
        this.ctx.fillStyle = '#0a0d1f';
        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

        // 2. Atualiza e Renderiza o Tabuleiro
        this.board.update();
        this.board.render(this.ctx, this.selectedPiece);

        // 3. Atualiza e Renderiza Partículas de Explosão
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const pt = this.particles[i];
          pt.update();
          if (pt.life <= 0) {
            this.particles.splice(i, 1);
          } else {
            pt.render(this.ctx);
          }
        }
      }
    }

    // Instanciação Global
    window.addEventListener('DOMContentLoaded', () => {
      window.matchGame = new Game();
    });
  </script>
