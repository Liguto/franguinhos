 {n:'Quadrado',f:()=>true},{n:'Círculo',f:(u,v)=>u*u+v*v<=1},{n:'Losango',f:(u,v)=>Math.abs(u)+Math.abs(v)<=1},

 {n:'Forma livre',f:(u,v)=>{const a=Math.atan2(v,u);return Math.hypot(u,v)<=.68+.14*Math.sin(3*a+PH[0])+.09*Math.sin(5*a+PH[1])+.05*Math.sin(2*a+PH[2])}}];
const pickShape=()=>{let k;do{k=ri(0,SHAPES.length-1)}while(k===shapeIdx);return k};
