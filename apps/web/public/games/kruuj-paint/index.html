<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Kruuj • Pintar</title>
<style>
:root{--ink:#2b1a5e;--roxo:#7c3aed;--verde:#22c55e;box-sizing:border-box;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0}
body{background:#ece6d3;font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;color:var(--ink);overflow:hidden;touch-action:none}
#app{height:100%;display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto 1fr auto;gap:6px 8px;padding:8px}
#top{grid-column:1/4;display:flex;align-items:center;justify-content:space-between;gap:8px}
#top .g{display:flex;gap:6px}
#pill{background:#fff;border:2px solid #bbb;border-radius:22px;padding:2px 16px;font-weight:800;font-size:clamp(14px,4vw,22px);color:#666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
button{font:inherit;border:0;cursor:pointer;color:#fff;padding:0}
.rb{width:clamp(40px,7vw,56px);aspect-ratio:1;border-radius:50%;background:radial-gradient(#7fbbea,#4d93d3);border:3px solid #cfe6f7;box-shadow:0 3px 0 #2f6faa;font-size:clamp(22px,4vw,32px);font-weight:900}
.rb:active{transform:translateY(2px)}
.col{display:flex;flex-direction:column;justify-content:center;gap:8px;align-items:center}
.sq{width:clamp(34px,5.5vw,46px);aspect-ratio:1;border-radius:12px;background:linear-gradient(#f6f6f6,#cfcfcf);border:2px solid #fff;box-shadow:0 2px 3px #0004;font-size:clamp(18px,3vw,26px);display:grid;place-items:center}
.sq i{display:block;width:70%;background:#222;border-radius:4px}
.sq.on{box-shadow:0 0 0 4px #f5a623}
#stage{min-width:0;min-height:0;display:grid;place-items:center;overflow:hidden}
#cv{outline:4px solid #fff;background:#fff;border-radius:6px;touch-action:none}
#pal{grid-column:1/4;display:grid;grid-template-columns:repeat(20,1fr);gap:6px 4px;max-width:1000px;width:100%;margin:0 auto;padding:10px 6px 4px}
@media(orientation:portrait){#app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto auto auto;padding:6px;gap:6px}#top,#stage,#pal,.col{grid-column:1}#top{grid-row:1}#stage{grid-row:2}#left{grid-row:3}#right{grid-row:4}#pal{grid-row:5}.col{flex-direction:row;justify-content:center;gap:12px}.sq{width:clamp(40px,12vw,54px)}}
@media(max-width:640px){#pal{grid-template-columns:repeat(10,1fr)}}
.c{position:relative;aspect-ratio:1;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 3px #0006;transition:transform .15s}
.c svg{display:none}
.c.on{background:transparent!important;border:0;box-shadow:none;transform:scale(1.25);z-index:3;animation:splat .35s cubic-bezier(.3,1.9,.5,1)}
.c.on svg{display:block;width:100%;height:100%;overflow:visible}
@keyframes splat{from{transform:scale(1) translateY(0)}}
.big{min-width:64px;height:64px;border-radius:32px;font-size:34px;font-weight:800;padding:0 28px;background:var(--verde);box-shadow:0 5px 0 #15803d}
.owl{width:52px;height:52px;border-radius:50%;background:var(--roxo);display:grid;place-items:center;font-size:30px;border:3px solid #a78bfa}
#win,#gv,#zoom,#cat{position:fixed;inset:0;background:#0b0b1eee;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:5;text-align:center;color:#fff}
#win.show,#gv.show,#zoom.show,#cat.show{display:flex}
#fx{position:fixed;inset:0;pointer-events:none;z-index:6;width:100vw;height:100vh}
.big-owl{font-size:clamp(60px,16vw,84px);animation:hop .8s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-24px) rotate(-6deg)}}
.stars{font-size:clamp(24px,7vw,38px);letter-spacing:4px}
.stars span{display:inline-block;animation:pop .5s backwards cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{from{transform:scale(0) rotate(-90deg)}}
#win .score{font-size:clamp(24px,7vw,34px);font-weight:900;background:#fbab18;color:#2b1a5e;border-radius:22px;padding:2px 22px;animation:pop .5s .8s backwards cubic-bezier(.3,1.8,.5,1)}
#win h1{margin:0;font-size:clamp(24px,6vw,34px)}
#gv,#zoom,#cat{z-index:7;touch-action:pan-y;justify-content:flex-start;background:#1c1448}
#zoom{z-index:8;justify-content:center;background:#1c1448f5}
#gv header,#cat header{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px}
#gv h2,#cat h2{margin:0;font-size:clamp(20px,5.5vw,28px);flex:1;text-align:left}
#grid,#cgrid{overflow:auto;flex:1;width:100%;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;padding:12px;align-content:start}
.th{background:none;font-size:18px}
.rnd{aspect-ratio:1;border-radius:20px;border:4px solid var(--roxo);background:linear-gradient(#a78bfa,#7c3aed);display:grid;place-items:center;font-size:56px}
.th img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:20px;border:4px solid var(--roxo);display:block;background:#fff}
.empty{grid-column:1/-1;font-size:22px;padding:40px 12px}.empty b{display:block;font-size:80px}
#zimg{width:min(92vw,calc(100dvh - 180px));aspect-ratio:1;border-radius:28px;border:6px solid var(--roxo);background:#fff}
#zoom .row{display:flex;gap:16px}#del.arm{background:#ef4444}
@media (prefers-reduced-motion:reduce){.big-owl,.stars span,.c.on{animation:none}}

@media (max-width: 768px) {
  #top {
    padding-left: 68px !important;
  }
}
</style></head>

 for(let s=0;s<N;s++){if(!ok(s))continue;n++;let sp=0,c=0;st[sp++]=s;lab[s]=n;
  while(sp){const i=st[--sp],x=i%W;c++;
   if(x>0&&ok(i-1)){lab[i-1]=n;st[sp++]=i-1}if(x<W-1&&ok(i+1)){lab[i+1]=n;st[sp++]=i+1}
   if(i>=W&&ok(i-W)){lab[i-W]=n;st[sp++]=i-W}if(i<N-W&&ok(i+W)){lab[i+W]=n;st[sp++]=i+W}}
  if(c>bc){bc=c;best=n}}
 bg=best;render();if(pend){const im=new Image(),u=pend;pend=null;im.onload=()=>{pc.drawImage(im,0,0,W,W);render()};im.src=u}}
function setMask(id){mid=id;const m=mc.createImageData(W,W),u=new Uint32Array(m.data.buffer);for(let i=0;i<u.length;i++)if(lab[i]===id)u[i]=0xFFFFFFFF;mc.putImageData(m,0,0)}
function rid(x,y){x|=0;y|=0;for(const r of[0,3,6,10])for(const[a,b]of[[0,0],[r,0],[-r,0],[0,r],[0,-r]]){const X=x+a,Y=y+b;if(X>=0&&Y>=0&&X<W&&Y<W&&lab[Y*W+X])return lab[Y*W+X]}return 0}
function put(erase){if(erase){pc.globalCompositeOperation='destination-out';pc.drawImage(T,0,0);pc.globalCompositeOperation='source-over'}else{tc.globalCompositeOperation='destination-in';tc.drawImage(MK,0,0);tc.globalCompositeOperation='source-over';pc.drawImage(T,0,0)}}
function seg(a,b){tc.clearRect(0,0,W,W);tc.lineCap=tc.lineJoin='round';tc.lineWidth=size;tc.strokeStyle='#000';tc.beginPath();tc.moveTo(a[0],a[1]);tc.lineTo(b[0]+.01,b[1]);tc.stroke();
 if(tool!=='erase'){tc.globalCompositeOperation='source-in';tc.fillStyle=color;tc.fillRect(0,0,W,W);tc.globalCompositeOperation='source-over'}put(tool==='erase')}
function snap(){hist.push(pc.getImageData(0,0,W,W));if(hist.length>8)hist.shift();redo=[]}
function pos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*W]}
cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);const p=pos(e),id=rid(p[0],p[1]);snap();
 if(tool==='bucket'){if(id){setMask(id);tc.clearRect(0,0,W,W);tc.fillStyle=color;tc.fillRect(0,0,W,W);put(false);render();snd(440,.2)}return}
 drawing=true;last=p;setMask(id||-1);seg(p,p);render();snd(tool==='erase'?200:300+Math.random()*300,.08)});
cv.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const p=pos(e),x=p[0]|0,y=p[1]|0;
 if(x>=0&&y>=0&&x<W&&y<W){const id=lab[y*W+x];if(id&&id!==mid)setMask(id)}seg(last,p);last=p;render()});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,()=>drawing=false));
$('pal').onclick=e=>{const b=e.target.closest('.c');if(!b)return;document.querySelectorAll('.c').forEach(x=>x.classList.remove('on'));b.classList.add('on');color=b.dataset.c;if(tool==='erase')setTool('brush');snd(500,.15)};
function setTool(t){tool=t;document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t));if(t==='brush')document.querySelectorAll('[data-s]').forEach(b=>b.classList.toggle('on',+b.dataset.s===size))}
$('left').onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;size=+b.dataset.s;document.querySelectorAll('[data-s]').forEach(x=>x.classList.remove('on'));b.classList.add('on');setTool('brush');document.querySelectorAll('[data-t]').forEach(x=>x.classList.remove('on'));snd(420,.1)};
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const t=tool===b.dataset.t?'brush':b.dataset.t;if(t==='brush')document.querySelectorAll('[data-t]').forEach(x=>x.classList.remove('on'));else{document.querySelectorAll('[data-s]').forEach(x=>x.classList.remove('on'));setTool(t)}tool=t;snd(420,.1)});
$('undo').onclick=()=>{if(!hist.length)return;redo.push(pc.getImageData(0,0,W,W));pc.putImageData(hist.pop(),0,0);render()};
$('redo').onclick=()=>{if(!redo.length)return;hist.push(pc.getImageData(0,0,W,W));pc.putImageData(redo.pop(),0,0);render()};
$('skip').onclick=()=>{let d;do d=pick();while(d===cur&&DR.length>1&&Math.random()<.9);load(d)};
function cover(){const d=pc.getImageData(0,0,W,W).data;let t=0,n=0;for(let y=6;y<W;y+=10)for(let x=6;x<W;x+=10){const l=lab[y*W+x];if(l&&l!==bg){t++;if(d[(y*W+x)*4+3]>0)n++}}return t?n/t:0}
function persist(k,v){for(let i=0;i<6;i++){try{localStorage.setItem(k,JSON.stringify(v));return}catch(e){if(k==='kruuj_gal')v.shift();else return}}}
const fmt=g=>g.toFixed(2).replace('.',',');
// nota de 5,00 a 10: sempre generosa (raiz da cobertura) e 'quebrada'; só chega perto de 10 se pintou quase tudo
function grade(c){let g=5+5*Math.sqrt(c)+(Math.random()-.5)*.5;g=Math.min(g,c>.95?10:9.97);g=Math.max(g,5);g=Math.round(g*100)/100;if(g%1===0&&g<10)g+=.03;return g}
function saveG(n,g){render();const o=mk();o.width=o.height=480;const x=o.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,480,480);x.drawImage(cv,0,0,480,480);const q=mk();q.width=q.height=450;q.getContext('2d').drawImage(P,0,0,450,450);const it={n:cur.n,s:n,g,i:o.toDataURL('image/jpeg',.82),p:q.toDataURL('image/png')};if(editIdx!=null&&G[editIdx])G[editIdx]=it;else G.push(it);while(G.length>40)G.shift();persist('kruuj_gal',G)}
$('done').onclick=()=>{const c=cover(),g=grade(c),n=g>=9?5:g>=7.5?4:3; // nunca menos de 3 estrelas
 saveG(n,g);$('sc').textContent='Nota '+fmt(g);if(!done.includes(cur.id))done.push(cur.id);persist('kruuj_done2',done);
 $('wt').textContent=n===3?'Que lindo!':n===4?'Muito bem!':'Uau, incrível!';
 $('st').innerHTML=Array.from({length:5},(_,i)=>`<span style="animation-delay:${i*.15}s;${i<n?'':'filter:grayscale(1) opacity(.25)'}">⭐</span>`).join('');
 $('win').classList.add('show');confetti();[523,659,784,1047].forEach((f,i)=>setTimeout(()=>snd(f,.3,'triangle'),i*140))};
$('next').onclick=()=>{$('win').classList.remove('show');load(pick());snd(600,.15)};
function openGal(){$('grid').innerHTML=G.length?G.map((p,i)=>`<button class="th" data-i="${i}" aria-label="${p.n}"><img src="${p.i}" alt="${p.n}"><span>⭐ ${p.g?fmt(p.g):p.s}</span></button>`).reverse().join(''):'<div class="empty"><b>🦉</b>Pinte um desenho e ele aparece aqui!</div>';$('gv').classList.add('show')}
$('gal').onclick=$('gal2').onclick=openGal;$('gclose').onclick=()=>$('gv').classList.remove('show');
$('grid').onclick=e=>{const b=e.target.closest('.th');if(!b)return;zi=+b.dataset.i;$('zimg').src=G[zi].i;resetDel();$('zoom').classList.add('show')};
$('zclose').onclick=()=>$('zoom').classList.remove('show');
function resetDel(){clearTimeout(armT);$('del').classList.remove('arm');$('del').dataset.a=''}
$('del').onclick=()=>{const d=$('del');if(d.dataset.a){G.splice(zi,1);persist('kruuj_gal',G);$('zoom').classList.remove('show');resetDel();openGal()}else{d.dataset.a='1';d.classList.add('arm');armT=setTimeout(resetDel,3000)}};
$('zedit').onclick=()=>{const g=G[zi],d=DR.find(x=>x.n===g.n);if(!d)return;const go=pn=>{$('zoom').classList.remove('show');$('gv').classList.remove('show');load(d,pn,zi);snd(600,.15)};
 if(g.p)return go(g.p); // desenho salvo antes da camada de pintura: recupera as cores a partir da imagem (tira branco e traço)
 const im=new Image();im.onload=()=>{const t=mk(),x=t.getContext('2d');x.drawImage(im,0,0,W,W);const id=x.getImageData(0,0,W,W),q=id.data;for(let k=0;k<q.length;k+=4){const r=q[k],gg=q[k+1],bb=q[k+2];if((r>238&&gg>238&&bb>238)||Math.hypot(r-43,gg-26,bb-94)<45)q[k+3]=0}x.putImageData(id,0,0);go(t.toDataURL())};im.src=g.i};
function thumb(d){if(d.src)return d.src;if(d.t)return d.t;const c=document.createElement('canvas');c.width=c.height=240;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,240,240);x.scale(.4,.4);x.lineJoin=x.lineCap='round';x.strokeStyle='#2b1a5e';x.lineWidth=9;d.p.forEach(s=>x.stroke(new Path2D(s)));
 if(d.m){d.m.forEach(s=>x.stroke(new Path2D(s)));x.translate(600,0);x.scale(-1,1);d.m.forEach(s=>x.stroke(new Path2D(s)))}return d.t=c.toDataURL()}
// catálogo pequeno que muda a cada abertura: sorteia 6, mostrando primeiro os ainda não pintados
function openCat(){const a=DR.filter(d=>d!==cur).map(d=>[Math.random(),d]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]).sort((x,y)=>done.includes(x.id)-done.includes(y.id)).slice(0,5);
 $('cgrid').innerHTML='<button class="th" data-i="r" aria-label="Surpresa"><div class="rnd">🎲</div><span>Surpresa!</span></button>'+a.map(d=>`<button class="th" data-i="${d.id}" aria-label="${d.n}"><img src="${thumb(d)}" alt="${d.n}"><span>${done.includes(d.id)?'✅ ':LV[d.l]+' '}${d.n}</span></button>`).join('');$('cat').classList.add('show');snd(520,.12)}
$('catb').onclick=$('catre').onclick=openCat;$('catx').onclick=()=>$('cat').classList.remove('show');
$('cgrid').onclick=e=>{const b=e.target.closest('.th');if(!b)return;$('cat').classList.remove('show');load(b.dataset.i==='r'?pick():DR[+b.dataset.i]);snd(600,.15)};
function confetti(){const f=$('fx'),x=f.getContext('2d'),K=['#ef4444','#fb923c','#facc15','#22c55e','#2e90fa','#7c3aed','#ec4899','#a16207'];f.width=innerWidth;f.height=innerHeight;
 const Q=Array.from({length:120},()=>({x:Math.random()*f.width,y:-Math.random()*f.height*.5,v:2+Math.random()*4,r:5+Math.random()*7,c:K[Math.random()*8|0],w:Math.random()*6}));
 let k=0;(function A(){x.clearRect(0,0,f.width,f.height);Q.forEach(p=>{p.y+=p.v;p.x+=Math.sin(p.w+=.05)*2;x.fillStyle=p.c;x.fillRect(p.x,p.y,p.r,p.r*1.4)});if(++k<260)requestAnimationFrame(A);else x.clearRect(0,0,f.width,f.height)})()}
fit();load(pick());
