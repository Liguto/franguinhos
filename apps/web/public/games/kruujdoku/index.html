<html lang="pt-BR"><head><meta charset="utf-8">

<title>KruujDoku</title>
<style>

html{scroll-padding-top:env(safe-area-inset-top,0px);overflow:hidden}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;height:100vh;height:100dvh;justify-content:center;overflow:hidden;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none}
#stage{position:relative;flex:none}
.wrap{width:424px;display:flex;flex-direction:column;align-items:center;transform-origin:0 0}
.brand{font-weight:900;font-size:1.15rem;letter-spacing:.5px;margin-top:6px;background:linear-gradient(90deg,var(--pu),var(--bl),var(--or));-webkit-background-clip:text;background-clip:text;color:transparent}
.top{display:grid;grid-template-columns:88px 1fr 88px;align-items:center;width:100%;margin-top:4px;text-align:center}
.top small{display:block;font-size:.92rem;color:var(--soft)}.top b{font-size:1.7rem;line-height:1.1}
.mid{display:flex;justify-content:center;gap:34px}.lt{display:flex;gap:6px;justify-content:flex-start}.rt{display:flex;gap:6px;justify-content:flex-end}
.ib{all:unset;cursor:pointer;width:38px;height:38px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:1.1rem;border:2px solid #2f376e}
.lives{display:flex;gap:6px;background:var(--card);border-radius:30px;padding:5px 14px;margin:8px 0}
.lives svg{width:26px;height:26px}.lives .off{opacity:.25;filter:grayscale(1)}
.rules{display:flex;gap:8px;background:var(--card);border-radius:16px;padding:8px;width:100%;box-sizing:border-box}
.rl{flex:1;display:flex;gap:6px;align-items:center;background:#1c2250;border-radius:12px;padding:5px;font-size:.64rem;line-height:1.15;color:var(--soft)}
.mini{display:grid;grid-template-columns:repeat(3,11px);gap:2px;flex:none}
.mini i{width:11px;height:11px;border-radius:3px;background:#2f376e;font-style:normal;font-size:9px;line-height:11px;text-align:center;color:#fff}
.mini i.x{background:var(--pu)}.mini i.o{background:var(--or)}
.tabs{display:flex;gap:4px;justify-content:center;background:var(--board);border-radius:16px 16px 0 0;padding:5px 9px 0;margin-top:12px}
.tabs svg{width:24px;height:24px;opacity:.4}.tabs svg.on{opacity:1}
#grid{touch-action:none;display:grid;width:100%;aspect-ratio:1;box-sizing:border-box;padding:6px;gap:4px;background:var(--board);border-radius:16px}
.c{all:unset;box-sizing:border-box;position:relative;width:100%;height:100%;border-radius:9px;cursor:pointer;overflow:hidden}
.c svg{position:absolute;inset:8%;width:84%;height:84%}.c .xx{inset:10%;width:80%;height:80%}
.c.bad{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.tools{display:flex;gap:22px;margin:16px 0 22px}
.tb{all:unset;position:relative;width:56px;height:56px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:1.5rem;cursor:pointer;border:2px solid #2f376e}
.tb em{position:absolute;top:-4px;right:-4px;background:var(--or);color:#050a24;font:700 .8rem system-ui;border-radius:12px;min-width:20px;height:20px;line-height:20px;text-align:center}
.ov{position:fixed;inset:0;background:rgba(5,10,36,.82);display:none;align-items:center;justify-content:center;z-index:40}
.ov>div{background:var(--card);padding:22px 26px;border-radius:20px;text-align:center;max-width:90vw}
.ov h2{margin:0 0 8px}
.pb{all:unset;cursor:pointer;background:var(--pu);padding:10px 20px;border-radius:24px;font-weight:700;margin-top:10px;display:inline-block}
#lg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));width:min(80vw,330px);gap:8px;max-height:60vh;overflow-y:auto;padding:4px;justify-content:center}
#lg button{all:unset;box-sizing:border-box;height:56px;border-radius:14px;background:#1c2250;display:flex;align-items:center;justify-content:center;font-weight:800;cursor:pointer;position:relative}
#lg button.done{background:var(--bl)}#lg button.cur{background:var(--or);color:#050a24}#lg button.lock{opacity:.3;cursor:default}
#lg button i{position:absolute;right:4px;top:1px;font-size:.6rem;font-style:normal}
.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(0) translateY(14px);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes wave{0%{transform:scale(1)}35%{transform:scale(1.14) rotate(-4deg)}65%{transform:scale(.95) rotate(3deg)}100%{transform:scale(1)}}
.fx{position:fixed;pointer-events:none;z-index:60}
#nice{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);opacity:0;pointer-events:none;z-index:70;font:900 clamp(2.6rem,14vw,4.2rem) system-ui,sans-serif;color:#fff;white-space:nowrap;text-shadow:0 0 12px var(--pu),0 0 30px var(--bl),0 5px 0 var(--or)}
.hl{box-shadow:inset 0 0 0 4px #fff,0 0 0 2px var(--or);z-index:1;animation:glow .9s ease-in-out infinite alternate}
@keyframes glow{to{filter:brightness(1.25)}}
.hx{box-shadow:inset 0 0 0 4px var(--or);animation:glow .6s ease-in-out infinite alternate}
.hx::after{content:"✕";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.7rem;font-weight:900;color:#fff;opacity:.85;text-shadow:0 0 3px rgba(0,0,0,.35)}
#hb{display:none;position:fixed;z-index:35;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(94vw,440px);gap:10px;align-items:flex-end;filter:drop-shadow(0 6px 18px rgba(0,0,0,.5))}
#hbo{flex:none;animation:bob 1.4s ease-in-out infinite alternate}#hbo svg{width:50px;height:50px;display:block}
@keyframes bob{to{transform:translateY(-4px)}}
.bub{position:relative;flex:1;background:var(--board);color:#0b1030;border-radius:16px;padding:12px 14px;font-size:.85rem;line-height:1.35}
.bub::before{content:"";position:absolute;left:-8px;bottom:20px;border:8px solid transparent;border-left:0;border-right-color:var(--board)}
.sm{padding:6px 12px!important;font-size:.8rem;margin:8px 6px 0 0!important}
.c.lk{pointer-events:none;cursor:default}
.cap{font-size:.7rem;color:var(--soft);opacity:.8;margin-top:8px;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--card);border:2px solid var(--pu);padding:10px 16px;border-radius:14px;font-size:.85rem;z-index:80;display:none;max-width:86vw;text-align:center}
#lg button.inf{grid-column:1/-1;height:48px;background:linear-gradient(90deg,var(--pu),var(--bl))}
@media (orientation:landscape) and (max-height:560px){
.wrap{width:870px;display:grid;grid-template-columns:424px 424px;grid-template-rows:repeat(9,auto);column-gap:22px;align-items:start;justify-items:center}
.brand{grid-area:1/2}.top{grid-area:2/2}.lives{grid-area:3/2}.rules{grid-area:4/2}.tools{grid-area:5/2;margin:12px 0}
.tabs{grid-area:1/1;margin-top:6px}#grid{grid-area:2/1/9/2}.cap{grid-area:9/1}
#hb{left:auto;right:2vw;transform:none;width:min(48vw,440px)}}

hoot(){tone(430,0,.16,'sine',.22,380);tone(860,0,.16,'sine',.04,760);tone(350,.2,.38,'sine',.22,270);tone(700,.2,.38,'sine',.04,540)},
nice(){[659,784,988,1319].forEach((f,i)=>tone(f,i*.07,.28,'triangle',.13));tone(2093,.3,.3,'sine',.05)},
bad(){tone(170,0,.28,'sawtooth',.11,80);tone(120,.12,.25,'square',.06,70)},
win(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i*.12,.3,'triangle',.15))},
lose(){[392,330,262,196].forEach((f,i)=>tone(f,i*.18,.35,'sawtooth',.08))}};
// ---- progresso ----
let level=1,score=0,max=1,done={},P,st,hearts,over,na,nh,streak=0,HS=null,dr=null,LC;
try{const d=JSON.parse(localStorage.getItem('kruujdoku')||'{}');max=d.max||1;score=d.score||0;done=d.done||{};level=max}catch(e){}
const save=()=>{
  try{
    localStorage.setItem('kruujdoku',JSON.stringify({max,score,done}));
    sendEvent('game_save', { saveData: { max, score, done }, score });
  }catch(e){}
};

window.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'load_cloud_save' && e.data.saveData) {
    try {
      const d = typeof e.data.saveData === 'string' ? JSON.parse(e.data.saveData) : e.data.saveData;
      if (d && (d.max !== undefined || d.score !== undefined)) {
        max = Math.max(max, d.max || 1);
        score = Math.max(score, d.score || 0);
        done = Object.assign({}, done, d.done || {});
        level = max;
        try { localStorage.setItem('kruujdoku', JSON.stringify({max, score, done})); } catch(err){}
        startLevel(level);
      }
    } catch (err) {}
  }
});
const pre={};let tk=0;
function build(l){if(l<=100){const n=sizeFor(l),z=LV[l-1],g=[];for(let r=0;r<n;r++)g.push([...z.slice(r*n,r*n+n)].map(Number));return Promise.resolve({n,g,sol:sols(n,g)[0]})}
return pre[l]||(pre[l]=genA(sizeFor(l),l*7919+13))}
async function startLevel(l){const my=++tk;level=l;const wait=l>100&&!pre[l];
sendEvent('game_start', { level: l });
if(wait){over=true;$('ov').style.display='none';$('lo').style.display='none';toast('Gerando a fase '+l+'…',60000)}
const p=await build(l);if(my!==tk)return;if(wait)$('toast').style.display='none';
P={n:p.n,g:p.g,sol:p.sol};buildLC();reset();if(l>=100)build(l+1);delete pre[l-2]}
function reset(){st=Array.from({length:P.n},()=>Array(P.n).fill(0));hearts=3;over=false;streak=0;na=3;nh=5;HS=null;dr=null;$('hb').style.display='none';$('ov').style.display='none';$('lo').style.display='none';draw()}
function draw(){const n=P.n,G=$('grid');G.style.gridTemplateColumns=`repeat(${n},minmax(0,1fr))`;G.style.gridTemplateRows=`repeat(${n},minmax(0,1fr))`;G.innerHTML='';
$('lv').textContent=level;$('sc').textContent=score;$('na').textContent=na;$('nh').textContent=nh;
$('hp').innerHTML=[0,1,2].map(i=>`<span class="${i<hearts?'':'off'}">${owl()}</span>`).join('');
$('tabs').innerHTML=P.sol.map((c,r)=>`<span class="${st[r][c]==2?'on':''}">${owl(COL[r])}</span>`).join('');
for(let r=0;r<n;r++)for(let c=0;c<n;c++){const k=P.g[r][c],b=document.createElement('button');b.className='c'+(st[r][c]==2?' lk':'');b.style.background=COL[k];
b.innerHTML=st[r][c]==2?owl():st[r][c]==1?XS('#fff'):'';b.dataset.r=r;b.dataset.c=c;if(HS){if(HS.hl.some(p=>p[0]==r&&p[1]==c))b.classList.add('hl');if((HS.x||[]).some(p=>p[0]==r&&p[1]==c))b.classList.add('hx')}G.appendChild(b)}}
function place(r,c,hint){clearHint();st[r][c]=2;if(!hint){streak++;score+=10*Math.min(streak,5)}draw();fx(r,c);sfx.hoot();setTimeout(sfx.nice,300);setTimeout(()=>nice(streak>=5?'Awesome!':streak>=3?'Great!':'Nice!'),150);
if(st.every((row,i)=>row[P.sol[i]]==2)){over=true;setTimeout(()=>end(true),1500)}}
let lt={t:0,r:-1,c:-1};
function tap(r,c){ac();if(over)return;const v=st[r][c];if(v==2)return;
const now=performance.now(),dbl=lt.r==r&&lt.c==c&&now-lt.t<320;
if(!dbl){lt={t:now,r,c};if(HS){clearHint();draw()}setX(r,c,v?0:1);return}
lt={t:0,r:-1,c:-1};clearHint();
if(P.sol[r]==c)place(r,c);
else{hearts--;streak=0;st[r][c]=1;sfx.bad();draw();$('grid').children[r*P.n+c].classList.add('bad');if(!hearts){over=true;setTimeout(()=>end(false),500)}}}
$('auto').onclick=()=>{ac();if(over||!na)return;const r=P.sol.findIndex((c,i)=>st[i][c]!=2);if(r<0)return;na--;place(r,P.sol[r],true)};
$('hint').onclick=()=>{ac();if(over||!nh)return;clearHint();const h=nextHint();nh--;h.x=h.x||[];HS=h;$('hbt').textContent=h.text;$('hbx').style.display=h.x.length?'inline-block':'none';$('hb').style.display='flex';sfx.hint();draw()};
$('hbx').onclick=()=>{if(!HS)return;HS.x.forEach(([r,c])=>{if(st[r][c]==0)st[r][c]=1});sfx.tick();clearHint();draw()};
$('hbc').onclick=()=>{clearHint();draw()};
$('hbo').innerHTML=owl();
$('rs').onclick=()=>{ac();reset()};
$('snd').onclick=()=>{muted=!muted;$('snd').textContent=muted?'🔇':'🔊';if(!muted){ac();sfx.tick()}};
function end(win){over=true;if(win){score+=P.n*20;done[level]=1;max=Math.max(max,level+1);save()}draw();
sendEvent(win ? 'game_completed' : 'game_over', { score, level });
if(win){confetti();sfx.win()}else sfx.lose();
const fim=win&&level==100;
$('ot').textContent=fim?'🏆 100 fases concluídas!':win?'🦉 Parabéns!':'Sem corações 💔';
$('om').textContent=fim?'Agora começa o modo infinito: as fases não acabam mais.':win?'Todas as corujinhas estão no ninho.':'Tente a mesma fase de novo.';
$('ob').textContent=fim?'Entrar no infinito ∞':win?'Próxima fase':'Tentar de novo';
$('ob').onclick=()=>{if(win)startLevel(level+1);else reset()};$('ov').style.display='flex'}
//HINT
function clearHint(){HS=null;$('hb').style.display='none'}
function buildLC(){const n=P.n;LC={R:[],C:[],G:[]};for(let i=0;i<n;i++){LC.R.push([]);LC.C.push([]);LC.G.push([])}for(let r=0;r<n;r++)for(let c=0;c<n;c++){LC.R[r].push([r,c]);LC.C[c].push([r,c]);LC.G[P.g[r][c]].push([r,c])}}
const CN=['roxa','azul','laranja','verde','vermelha','rosa','turquesa','cinza','oliva'];
const PR=[['G','R'],['G','C'],['R','G'],['C','G'],['R','C'],['C','R']];
const lo=(t,r,c)=>t=='R'?r:t=='C'?c:P.g[r][c];
function nm(t,ix){const j=a=>a.length>1?a.slice(0,-1).join(', ')+' e '+a[a.length-1]:a[0],p=ix.length>1;return t=='R'?(p?'as linhas ':'a linha ')+j(ix.map(i=>i+1)):t=='C'?(p?'as colunas ':'a coluna ')+j(ix.map(i=>i+1)):(p?'as cores ':'a cor ')+j(ix.map(i=>CN[i]))}
const em=s=>s.replace(/^as /,'nas ').replace(/^a /,'na '),de=s=>s.replace(/^as /,'das ').replace(/^a /,'da '),cap=s=>s[0].toUpperCase()+s.slice(1);
function comb(a,k){const o=[];(function f(s,c){if(c.length==k){o.push(c.slice());return}for(let i=s;i<a.length;i++){c.push(a[i]);f(i+1,c);c.pop()}})(0,[]);return o}
function nextHint(){const n=P.n,V=Array.from({length:n},()=>Array(n).fill(true)),dn={R:Array(n).fill(0),C:Array(n).fill(0),G:Array(n).fill(0)};
for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(st[r][c]==2){dn.R[r]=dn.C[c]=dn.G[P.g[r][c]]=1;for(let a=0;a<n;a++)for(let b=0;b<n;b++)if(a==r||b==c||P.g[a][b]==P.g[r][c]||(Math.abs(a-r)<2&&Math.abs(b-c)<2))V[a][b]=false}
const live=t=>[...Array(n).keys()].filter(i=>!dn[t][i]),cand=(t,i)=>LC[t][i].filter(([r,c])=>V[r][c]);
const find=()=>{
for(const t of 'RCG')for(const i of live(t)){const cs=cand(t,i);if(cs.length==1)return{single:1,hl:cs,text:`Só sobrou uma casa possível para ${nm(t,[i])}: linha ${cs[0][0]+1}, coluna ${cs[0][1]+1}. Coloque a coruja ali!`}}
for(const t of 'RCG')for(const i of live(t)){const cs=cand(t,i);if(cs.length<2||cs.length>4)continue;const el=[];for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(V[r][c]&&lo(t,r,c)!=i&&cs.every(([a,b])=>Math.abs(a-r)<2&&Math.abs(b-c)<2))el.push([r,c]);
if(el.length)return{hl:cs,elim:el,text:`${cap(nm(t,[i]))} só pode ter coruja nas casas brilhantes. ${el.length>1?'As casas que pulsam encostam':'A casa que pulsa encosta'} em todas elas, então ${el.length>1?'recebem':'recebe'} ✕.`}}
for(let k=1;k<=3;k++)for(const[a,b]of PR)for(const A of comb(live(a),k)){const cs=A.flatMap(i=>cand(a,i));if(!cs.length)continue;const B=[...new Set(cs.map(([r,c])=>lo(b,r,c)))];if(B.length!=k)continue;
const el=B.flatMap(j=>cand(b,j)).filter(([r,c])=>!A.includes(lo(a,r,c)));
if(el.length)return{hl:cs,elim:el,text:`${cap(nm(a,A))} só ${k>1?'podem':'pode'} ter ${k>1?'suas corujas':'a coruja'} ${em(nm(b,B))}. Então o resto ${de(nm(b,B))} fica sem espaço para outras corujas: marque ✕ nas casas que pulsam.`}}
return null};
for(let it=0;it<300;it++){const h=find();if(!h)break;if(h.single)return h;const x=h.elim.filter(([r,c])=>st[r][c]==0);if(x.length)return{...h,x};h.elim.forEach(([r,c])=>V[r][c]=false)}
const g=live('G').sort((p,q)=>cand('G',p).length-cand('G',q).length)[0];
if(g===undefined)return{hl:[],text:'Está tudo certo por aqui!'};
const row=P.sol.findIndex((c,r)=>P.g[r][c]==g);
return{hl:cand('G',g),text:`Sem jogada óbvia agora. A cor ${CN[g]} tem poucas casas, e a coruja dela está na linha ${row+1}.`}}
//ENDHINT
// ---- arrastar para marcar ✕ ----
const GR=$('grid');
function setX(r,c,v){const cur=st[r][c];if(cur==2||cur==v)return;st[r][c]=v;const b=GR.children[r*P.n+c];b.innerHTML=v==1?XS('#fff'):'';v?sfx.tick():sfx.untick()}
GR.addEventListener('pointerdown',e=>{const b=e.target.closest('.c');if(!b||over)return;ac();const r=+b.dataset.r,c=+b.dataset.c;dr={r,c,mode:st[r][c]==0?1:st[r][c]==1?0:null,moved:false,last:b}});
GR.addEventListener('pointermove',e=>{if(!dr||dr.mode===null)return;const el=document.elementFromPoint(e.clientX,e.clientY),b=el&&el.closest&&el.closest('.c');if(!b||b===dr.last||!GR.contains(b))return;dr.last=b;
if(!dr.moved){dr.moved=true;if(HS){clearHint();draw()}setX(dr.r,dr.c,dr.mode)}setX(+b.dataset.r,+b.dataset.c,dr.mode)});
function endDrag(){if(!dr)return;const d=dr;dr=null;if(over)return;if(d.moved)draw();else tap(d.r,d.c)}
window.addEventListener('pointerup',endDrag);
window.addEventListener('pointercancel',()=>{if(dr){const m=dr.moved;dr=null;if(m)draw()}});
function toast(t,ms){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',ms||3200)}
// ---- seletor de fases ----
function openLevels(){const g=$('lg');g.innerHTML='';if(max>100){const b=document.createElement('button');b.className='inf';b.textContent='∞ Modo infinito · fase '+max;b.onclick=()=>startLevel(max);g.appendChild(b)}for(let l=1;l<=100;l++){const b=document.createElement('button');b.textContent=l;if(done[l]){b.className='done';b.innerHTML+='<i>✓</i>'}if(l==level)b.className='cur';if(l>max)b.className='lock';if(l<=max)b.onclick=()=>{startLevel(l)};g.appendChild(b)}
$('lo').style.display='flex';const cur=g.querySelector('.cur');if(cur)cur.scrollIntoView({block:'center'})}
$('menu').onclick=()=>{ac();openLevels()};$('ol').onclick=openLevels;$('lc').onclick=()=>{$('lo').style.display='none'};
// ---- efeitos visuais ----
const PC=['#8b45ff','#2196ff','#ffa31a','#d9d4ff','#f2f2f8'];
function spark(x,y,dx,dy,o){const d=document.createElement('div');d.className='fx';d.style.left=x+'px';d.style.top=y+'px';
if(o.owl){d.innerHTML=owl(PC[rn(4)]);d.style.width=o.s+'px'}else{d.style.width=d.style.height=o.s+'px';d.style.borderRadius=o.sq?'2px':'50%';d.style.background=PC[rn(PC.length)]}
document.body.appendChild(d);const a=d.animate([{transform:'translate(0,0) rotate(0) scale(1)',opacity:1},{transform:`translate(${dx}px,${dy}px) rotate(${o.rot||0}deg) scale(${o.end??.2})`,opacity:0}],{duration:o.t,delay:o.delay||0,easing:'cubic-bezier(.2,.7,.4,1)',fill:'both'});a.onfinish=()=>d.remove()}
function ring(x,y){const d=document.createElement('div');d.className='fx';Object.assign(d.style,{left:x-15+'px',top:y-15+'px',width:'30px',height:'30px',border:'4px solid #ffa31a',borderRadius:'50%',boxSizing:'border-box'});document.body.appendChild(d);d.animate([{transform:'scale(1)',opacity:.9},{transform:'scale(11)',opacity:0}],{duration:600,easing:'ease-out'}).onfinish=()=>d.remove()}
function burst(el){const q=el.getBoundingClientRect(),x=q.left+q.width/2,y=q.top+q.height/2;
for(let i=0;i<16;i++){const a=Math.PI*2*i/16+Math.random()*.4,v=34+Math.random()*44;spark(x-4,y-4,Math.cos(a)*v,Math.sin(a)*v,{s:6+rn(6),t:550+rn(250)})}
for(let i=0;i<3;i++)spark(x-13+(rn(40)-20),y-13,rn(50)-25,-70-rn(50),{owl:1,s:26,t:900+rn(300),delay:i*90,end:.6,rot:rn(60)-30})}
function nice(txt){const e=$('nice');e.textContent=txt;e.animate([{transform:'translate(-50%,-50%) scale(.3) rotate(-8deg)',opacity:0},{transform:'translate(-50%,-50%) scale(1.25) rotate(3deg)',opacity:1,offset:.3},{transform:'translate(-50%,-58%) scale(1)',opacity:1,offset:.7},{transform:'translate(-50%,-90%) scale(.9)',opacity:0}],{duration:1100,easing:'ease-out'});
const x=innerWidth/2,y=innerHeight*.42;ring(x,y);for(let i=0;i<24;i++){const a=Math.PI*2*i/24,v=90+rn(110);spark(x-4,y-4,Math.cos(a)*v,Math.sin(a)*v,{s:6+rn(7),t:700+rn(400)})}
$('grid').animate([{transform:'translateX(0)'},{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}],{duration:240})}
function fx(r,c){const n=P.n,cells=$('grid').children,k=P.g[r][c];
const pe=cells[r*n+c].querySelector('svg');if(pe)pe.classList.add('pop');
for(let a=0;a<n;a++)for(let b=0;b<n;b++)if(a==r||b==c||P.g[a][b]==k)cells[a*n+b].style.animation=`wave .55s ${(Math.abs(a-r)+Math.abs(b-c))*45}ms`;
const t=$('tabs').children[k];if(t)t.animate([{transform:'scale(1)'},{transform:'scale(1.6) rotate(-14deg)'},{transform:'scale(1)'}],{duration:500});
burst(cells[r*n+c]);try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}}
function confetti(){const W=innerWidth,H=innerHeight;for(let i=0;i<70;i++)spark(rn(W),-20,rn(120)-60,H+40,{s:6+rn(8),sq:i%2,t:1800+rn(1400),delay:rn(500),end:1,rot:rn(720)});
for(let i=0;i<8;i++)spark(rn(W),H,rn(80)-40,-(H*.6+rn(200)),{owl:1,s:34,t:1800+rn(800),delay:rn(600),end:.8,rot:rn(60)-30})}
const ST=$('stage'),WR=document.querySelector('.wrap');
function fit(){const b=getComputedStyle(document.body),h=getComputedStyle(document.documentElement),f=parseFloat;
const vw=document.documentElement.clientWidth-f(b.paddingLeft)-f(b.paddingRight)-10,
vh=(window.visualViewport?visualViewport.height:innerHeight)-f(h.paddingTop)-f(h.paddingBottom)-10;
const W=WR.offsetWidth,H=WR.offsetHeight,k=Math.min(vw/W,vh/H,1.2);
WR.style.transform='scale('+k+')';ST.style.width=W*k+'px';ST.style.height=H*k+'px'}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));
if(window.visualViewport)visualViewport.addEventListener('resize',fit);
if(window.ResizeObserver)new ResizeObserver(fit).observe(WR);
fit();
startLevel(level);
</script></body></html>
