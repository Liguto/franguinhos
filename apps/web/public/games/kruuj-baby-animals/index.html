<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>KRUUJ Baby Animals – Amiguinhos & Sons</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <script src="/sdk/v1/kruuj-sdk.js"></script>
  <script src="/sdk/v1/kruuj-loader.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">

  <script>
// KruujLoader fornecido centralmente via /sdk/v1/kruuj-loader.js
window.addEventListener('DOMContentLoaded', () => {
  const isIframe = (window.self !== window.top);
  const kl = document.getElementById('kl');
  if (isIframe) {
    if (kl) {
      kl.classList.add('out');
      kl.style.display = 'none';
      kl.style.pointerEvents = 'none';
    }
    try { window.parent.postMessage({ type: 'game_loaded', gameSlug: 'kruuj-baby-animals' }, '*'); } catch(e){}
    if (window.KruujSDK && typeof window.KruujSDK.gameLoadingFinished === 'function') {
      try { window.KruujSDK.gameLoadingFinished(); } catch(e){}
    }
  } else {
    try {
      if (typeof KruujLoader !== 'undefined') {
        KruujLoader.start({
          gameName: 'kruuj-baby-animals',
          tagline: (typeof tD !== 'undefined' && tD.tagline ? tD.tagline : (typeof tG !== 'undefined' && tG.tagline ? tG.tagline : 'Prepare os fones, a coruja já está chegando.')),
          tips: (typeof tD !== 'undefined' && tD.tips ? tD.tips : (typeof tG !== 'undefined' && tG.tips ? tG.tips : ['Divirta-se com os jogos oficiais da KRUUJ Studio!'])),
          splash: 2000,
          minTime: 2400,
          onComplete: () => {
            if (kl) {
              kl.classList.add('out');
              kl.style.display = 'none';
              kl.style.pointerEvents = 'none';
            }
            try { window.parent.postMessage({ type: 'game_loaded', gameSlug: 'kruuj-baby-animals' }, '*'); } catch(e){}
            if (window.KruujSDK && typeof window.KruujSDK.gameLoadingFinished === 'function') {
              try { window.KruujSDK.gameLoadingFinished(); } catch(e){}
            }
          }
        });
        setTimeout(() => {
          if (typeof KruujLoader !== 'undefined' && KruujLoader.finish) KruujLoader.finish();
          setTimeout(() => {
            if (kl) {
              kl.classList.add('out');
              kl.style.display = 'none';
              kl.style.pointerEvents = 'none';
            }
          }, 500);
        }, 2400);
      } else {
        if (kl) {
          kl.classList.add('out');
          kl.style.display = 'none';
          kl.style.pointerEvents = 'none';
        }
        try { window.parent.postMessage({ type: 'game_loaded', gameSlug: 'kruuj-baby-animals' }, '*'); } catch(e){}
      }
    } catch(e) {
      if (kl) {
        kl.classList.add('out');
        kl.style.display = 'none';
        kl.style.pointerEvents = 'none';
      }
      try { window.parent.postMessage({ type: 'game_loaded', gameSlug: 'kruuj-baby-animals' }, '*'); } catch(err){}
    }
  }
});
</script>

<script>
/* KRUUJ-PROC-001 SDK Lifecycle Bridge */
window.addEventListener('DOMContentLoaded', () => {
  if (window.KruujSDK) {
    window.KruujSDK.init().then(() => {
      window.KruujSDK.gameLoadingFinished();
    });
  }
});
window.addEventListener('pointerdown', () => {
  if (window.KruujSDK) window.KruujSDK.gameplayStart();
}, { once: true });
window.addEventListener('beforeunload', () => {
  if (window.KruujSDK) window.KruujSDK.gameplayStop();
});
function kruujOnGameOver() {
  if (window.KruujSDK) window.KruujSDK.gameplayStop();
}
</script>

</body>
</html>
