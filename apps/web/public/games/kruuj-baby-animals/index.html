  <style>
    :root {
      --bg-top: #0a173b;
      --bg-bottom: #1d2a57;
      --purple: #8338fc;
      --blue: #289afd;
      --orange: #fda41d;
      --pink: #ff65a6;
      --yellow: #ffd043;
      --green: #4ade80;
      --lav: #d8d4fd;
      --white: #ffffff;
      --navy: #151c4a;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 30%, var(--bg-top), var(--bg-bottom));

      font-family: 'Baloo 2', system-ui, sans-serif;

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;

    /* HUD Superior — Desvio Poki obrigatório de 68px no mobile */

      position: fixed;
      top: 14px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
      gap: 8px;
    }

    @media (max-width: 768px) {
      .hud {

      }
    }

    .hud-group {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }

    .hud-btn {
      background: rgba(21, 28, 74, 0.9);
      border: 2px solid rgba(131, 56, 252, 0.5);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: var(--white);
      font-family: 'Baloo 2', system-ui, sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 8px 18px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      transition: all 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }

    .hud-btn:hover {
      transform: scale(1.05);
      border-color: var(--yellow);
    }

    .hud-btn:active {
      transform: scale(0.95);
    }

      border: 2px solid rgba(255, 208, 67, 0.5);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 9999px;
      padding: 7px 16px;
      font-size: 0.95rem;
      font-weight: 800;
      color: #ffd043;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }

      position: fixed;
      top: 75px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(255, 255, 255, 0.96);
      color: #3b1464;
      font-size: 1.2rem;
      font-weight: 800;
      padding: 8px 24px;
      border-radius: 9999px;

      opacity: 0;
      transition: all 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28);

      z-index: 9999;

    #kl .ph.off { opacity: 0; pointer-events: none; }
    .splash .owl { width: min(34vw, 150px); aspect-ratio: 1; border-radius: 50%; animation: pop 0.9s cubic-bezier(.2,1.3,.4,1) both, glow 2.4s ease-in-out 0.9s infinite; }
    .splash .logo { width: min(54vw, 240px); height: auto; margin-top: 20px; animation: rise 0.8s ease 0.7s both; }
    .splash .sub { margin: 8px 0 0; font-weight: 600; font-size: 0.85rem; letter-spacing: 0.38em; padding-left: 0.38em; color: var(--lav); animation: rise 0.8s ease 1.1s both; }
    .load { text-align: center; }
    .load h1 { margin: 0; font-weight: 800; font-size: clamp(1.8rem, 7vw, 2.8rem); line-height: 1.1; letter-spacing: -0.01em; color: #fff; }
    .load .tag { margin: 12px 0 0; color: var(--lav); font-size: 1.05rem; }
    .track { position: relative; width: 100%; height: 10px; margin: 48px 0 0; border-radius: 99px; background: var(--navy); }
    .fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--purple), var(--blue)); }
    .rider { position: absolute; top: 50%; left: 0; width: 48px; aspect-ratio: 1; margin: -24px 0 0 -24px; border-radius: 50%; box-shadow: 0 0 0 3px var(--bg-top), 0 0 0 5px var(--orange); }
    .pct { margin-top: 26px; font-weight: 600; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
    .tip { min-height: 1.5em; margin: 10px 0 0; color: var(--lav); opacity: 0.85; font-size: 0.95rem; transition: opacity 0.4s; }
    .brand { position: absolute; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); font-size: 0.8rem; color: var(--lav); opacity: 0.6; }
    @keyframes pop { from { transform: scale(0.4); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes glow { 0%, 100% { box-shadow: 0 0 30px 2px #8338fc55; } 50% { box-shadow: 0 0 64px 10px #8338fc99; } }
  </style>
</head>

  <script>
    // ==========================================
    // 1. ÁUDIO SINTÉTICO (WEBAUDIO & WEBSPEECH)
    // ==========================================
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Voz Amigável via Web Speech API
    let lastSpokenTime = 0;
    function speakText(text) {
      const now = Date.now();
      if (now - lastSpokenTime < 1600) return;
      lastSpokenTime = now;

      if ('speechSynthesis' in window) {
        try {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(text);
          utter.lang = IS_PT ? 'pt-BR' : (IS_ES ? 'es-ES' : 'en-US');
          utter.rate = 0.95;
          utter.pitch = 1.25;
          window.speechSynthesis.speak(utter);
        } catch (e) {}
      }
    }

    // Som de Mastigação Crocante ("Chomp / Crunch")
    function playChompSound() {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      [0, 0.1, 0.2].forEach((offset) => {
        const t = now + offset;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(320 + Math.random() * 80, t);
        osc.frequency.exponentialRampToValueAtTime(140, t + 0.08);

        gain.gain.setValueAtTime(0.001, t);
        gain.gain.linearRampToValueAtTime(0.24, t + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.09);
      });
    }

    // Ronronar Doce de Carinho ("Purrr")
    function playPurrSound() {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      const osc = audioCtx.createOscillator();
      const lfo = audioCtx.createOscillator();
      const lfoGain = audioCtx.createGain();
      const gain = audioCtx.createGain();

      lfo.frequency.setValueAtTime(18, now);
      lfoGain.gain.setValueAtTime(35, now);
      lfo.connect(osc.frequency);

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(120, now);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.2, now + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

      lfo.start(now);
      lfo.stop(now + 0.42);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.42);
    }

    // Sons dos Animais
    function playDuckQuack() {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      [0, 0.16].forEach((offset) => {
        const t = now + offset;
        const osc = audioCtx.createOscillator();
        const filter = audioCtx.createBiquadFilter();
        const gain = audioCtx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(380, t);
        osc.frequency.exponentialRampToValueAtTime(260, t + 0.12);
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(950, t);
        filter.Q.setValueAtTime(3.5, t);

        gain.gain.setValueAtTime(0.001, t);
        gain.gain.linearRampToValueAtTime(0.24, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.14);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.15);
      });
    }

    function playCatMeow() {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.exponentialRampToValueAtTime(740, now + 0.18);
      osc.frequency.exponentialRampToValueAtTime(520, now + 0.42);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.26, now + 0.06);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.48);
    }

    function playDogBark() {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      [0, 0.18].forEach((offset) => {
        const t = now + offset;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(320, t);
        osc.frequency.exponentialRampToValueAtTime(560, t + 0.04);
        osc.frequency.exponentialRampToValueAtTime(280, t + 0.12);

        gain.gain.setValueAtTime(0.001, t);
        gain.gain.linearRampToValueAtTime(0.28, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.13);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.14);
      });
    }

    function playFrogCroak() {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const filter = audioCtx.createBiquadFilter();
      const gain = audioCtx.createGain();

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(140, now);
      osc.frequency.exponentialRampToValueAtTime(260, now + 0.08);
      osc.frequency.exponentialRampToValueAtTime(120, now + 0.22);

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(450, now);
      filter.Q.setValueAtTime(5.0, now);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.3, now + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.25);
    }

    function playSheepBaa() {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const lfo = audioCtx.createOscillator();
      const lfoGain = audioCtx.createGain();
      const gain = audioCtx.createGain();

      lfo.frequency.setValueAtTime(7, now);
      lfoGain.gain.setValueAtTime(18, now);
      lfo.connect(osc.frequency);

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(330, now);
      osc.frequency.linearRampToValueAtTime(350, now + 0.1);
      osc.frequency.linearRampToValueAtTime(310, now + 0.45);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.24, now + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.48);

      lfo.start(now);
      lfo.stop(now + 0.5);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.5);
    }

    function playOwlChirp() {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      [0, 0.15].forEach((offset, idx) => {
        const t = now + offset;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        const startF = idx === 0 ? 680 : 820;
        const endF = idx === 0 ? 1180 : 1380;
        osc.frequency.setValueAtTime(startF, t);
        osc.frequency.exponentialRampToValueAtTime(endF, t + 0.11);

        gain.gain.setValueAtTime(0.001, t);
        gain.gain.linearRampToValueAtTime(0.28, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.13);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.14);
      });
    }

    // Estouro de Balão com Xilofone
    const XILO_NOTES = [523.25, 659.25, 783.99, 1046.5, 1318.51];
    function playBalloonPopSound() {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const freq = XILO_NOTES[Math.floor(Math.random() * XILO_NOTES.length)];

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now);
      osc.frequency.exponentialRampToValueAtTime(freq * 0.95, now + 0.3);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.32, now + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.36);
    }

    // ==========================================

    const canvas = document.getElementById('gameCanvas');

    function resize() {

    let toastTimer = null;

    // ==========================================
    // 3. PARTÍCULAS E BALÕES FLUTUANTES
    // ==========================================
    let particles = [];
    let balloons = [];

    class Particle {
      constructor(x, y, color, type = 'heart') {
        this.x = x;
        this.y = y;
        this.color = color;
        this.type = type;
        const angle = Math.random() * Math.PI * 2;
        const spd = Math.random() * 4 + 1.5;
        this.vx = Math.cos(angle) * spd;
        this.vy = Math.sin(angle) * spd - 2;
        this.size = Math.random() * 10 + 6;
        this.life = 1.0;
        this.decay = Math.random() * 0.02 + 0.012;
        this.rot = Math.random() * Math.PI;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= this.decay;
        this.rot += 0.03;
      }
      draw(ctx) {
        if (this.life <= 0) return;
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rot);

        if (this.type === 'heart') {
          drawHeart(ctx, 0, 0, this.size);
        } else if (this.type === 'note') {
          ctx.font = `${Math.round(this.size * 1.5)}px sans-serif`;
          ctx.fillText('🎵', -this.size * 0.5, this.size * 0.5);
        } else {
          drawStar(ctx, 0, 0, 5, this.size, this.size * 0.45);
        }
        ctx.restore();
      }
    }

    class FloatingBalloon {
      constructor(x, y) {
        this.x = x || Math.random() * width;
        this.y = y || height + 40;
        this.radius = Math.random() * 16 + 22;
        this.vy = -Math.random() * 1.2 - 0.8;
        this.wobble = Math.random() * Math.PI * 2;
        this.color = ['#ff65a6', '#ffd043', '#38bdf8', '#8338fc', '#4ade80'][Math.floor(Math.random() * 5)];
      }
      hitTest(px, py) {
        return Math.hypot(px - this.x, py - this.y) < this.radius * 1.35;
      }
      pop() {
        playBalloonPopSound();
        addCuddle(1);
        showToast(tG.balloonPop);
        for (let i = 0; i < 10; i++) {
          particles.push(new Particle(this.x, this.y, this.color, 'star'));
        }
      }
      update() {
        this.y += this.vy;
        this.wobble += 0.04;
        this.x += Math.sin(this.wobble) * 0.6;
      }
      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);

        // Cordão do balão
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, this.radius);
        ctx.quadraticCurveTo(Math.sin(this.wobble) * 8, this.radius + 18, 0, this.radius + 36);
        ctx.stroke();

        // Balão
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.ellipse(0, 0, this.radius, this.radius * 1.2, 0, 0, Math.PI * 2);
        ctx.fill();

        // Nó do balão
        ctx.beginPath();
        ctx.moveTo(-4, this.radius * 1.18);
        ctx.lineTo(4, this.radius * 1.18);
        ctx.lineTo(0, this.radius * 1.25);
        ctx.closePath();
        ctx.fill();

        // Brilho de reflexo
        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.beginPath();
        ctx.ellipse(-this.radius * 0.35, -this.radius * 0.45, this.radius * 0.22, this.radius * 0.12, -0.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    function drawHeart(ctx, x, y, size) {
      ctx.beginPath();
      const topCurveHeight = size * 0.3;
      ctx.moveTo(x, y + topCurveHeight);
      ctx.bezierCurveTo(x, y, x - size / 2, y, x - size / 2, y + topCurveHeight);
      ctx.bezierCurveTo(x - size / 2, y + (size + topCurveHeight) / 2, x, y + (size + topCurveHeight) / 2, x, y + size);
      ctx.bezierCurveTo(x, y + (size + topCurveHeight) / 2, x + size / 2, y + (size + topCurveHeight) / 2, x + size / 2, y + topCurveHeight);
      ctx.bezierCurveTo(x + size / 2, y, x, y, x, y + topCurveHeight);
      ctx.fill();
    }

    function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius) {
      let rot = Math.PI / 2 * 3;
      let x = cx;
      let y = cy;
      const step = Math.PI / spikes;
      ctx.beginPath();
      ctx.moveTo(cx, cy - outerRadius);
      for (let i = 0; i < spikes; i++) {
        x = cx + Math.cos(rot) * outerRadius;
        y = cy + Math.sin(rot) * outerRadius;
        ctx.lineTo(x, y);
        rot += step;
        x = cx + Math.cos(rot) * innerRadius;
        y = cy + Math.sin(rot) * innerRadius;
        ctx.lineTo(x, y);
        rot += step;
      }
      ctx.lineTo(cx, cy - outerRadius);
      ctx.closePath();
      ctx.fill();
    }

    function createBurst(x, y, color, count = 12, type = 'heart') {
      for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, color, type));
      }
    }

    // ==========================================
    // 4. MODELAGEM DOS 6 AMIGUINHOS BEBÊS
    // ==========================================
    class BabyAnimal {
      constructor(type, soundFn, pillKey, primaryColor, favFood) {
        this.type = type;
        this.soundFn = soundFn;
        this.pillKey = pillKey;
        this.primaryColor = primaryColor;
        this.favFood = favFood;
        this.x = 0;
        this.y = 0;
        this.radius = 48;
        this.scaleX = 1.0;
        this.scaleY = 1.0;
        this.jumpOffset = 0;
        this.isChewing = false;
        this.chewTimer = 0;
        this.wobble = Math.random() * Math.PI * 2;
        this.blinkTimer = Math.floor(Math.random() * 120 + 80);
        this.isBlinking = false;
        this.isDancing = false;
        this.purrCount = 0;
      }

      hitTest(px, py) {
        return Math.hypot(px - this.x, py - (this.y - this.jumpOffset)) < this.radius * 1.35;
      }

      interact(isPet = false) {
        if (isPet) {
          playPurrSound();
          showToast(tG.pet);
          speakText(tG.voicePet);
          addCuddle(1);
        } else {
          this.soundFn();
          showToast(tG[this.pillKey]);
          addCuddle(2);
        }

        // Squash & stretch elástico
        this.scaleX = 1.35;
        this.scaleY = 0.72;
        this.jumpOffset = 26;

        setTimeout(() => {
          this.scaleX = 0.85;
          this.scaleY = 1.25;
          setTimeout(() => {
            this.scaleX = 1.0;
            this.scaleY = 1.0;
            this.jumpOffset = 0;
          }, 160);
        }, 120);

        createBurst(this.x, this.y - 30, this.primaryColor, isPet ? 8 : 16, isPet ? 'heart' : 'note');
      }

      feed(foodType) {
        playChompSound();
        this.isChewing = true;
        this.chewTimer = 40;
        this.jumpOffset = 36;
        this.scaleX = 1.4;
        this.scaleY = 0.8;

        showToast(tG.yum);
        speakText(tG.voiceYum);
        addCuddle(5);

        createBurst(this.x, this.y - 20, '#ffd043', 18, 'heart');
        setTimeout(() => {
          this.soundFn();
          this.scaleX = 1.0;
          this.scaleY = 1.0;
          this.jumpOffset = 0;
        }, 300);
      }

      update() {
        this.wobble += 0.04;
        if (this.blinkTimer > 0) {
          this.blinkTimer--;
        } else {
          this.isBlinking = true;
          if (this.blinkTimer < -6) {
            this.isBlinking = false;
            this.blinkTimer = Math.floor(Math.random() * 180 + 100);
          } else {
            this.blinkTimer--;
          }
        }

        if (this.isChewing) {
          this.chewTimer--;
          if (this.chewTimer <= 0) this.isChewing = false;
        }

        if (this.isDancing) {
          this.jumpOffset = Math.abs(Math.sin(this.wobble * 3)) * 22;
          this.scaleX = 1.0 + Math.sin(this.wobble * 3) * 0.12;
          this.scaleY = 1.0 - Math.sin(this.wobble * 3) * 0.12;
        }
      }

      draw(ctx) {
        ctx.save();
        const renderY = this.y - this.jumpOffset;
        ctx.translate(this.x, renderY);
        ctx.scale(this.scaleX, this.scaleY);

        // Sombra suave no chão
        ctx.fillStyle = 'rgba(10, 16, 45, 0.45)';
        ctx.beginPath();
        ctx.ellipse(0, 48 + this.jumpOffset * 0.6, 42 * (1 - this.jumpOffset * 0.015), 14, 0, 0, Math.PI * 2);
        ctx.fill();

        switch (this.type) {
          case 'duck': this.drawDuck(ctx); break;
          case 'cat': this.drawCat(ctx); break;
          case 'dog': this.drawDog(ctx); break;
          case 'frog': this.drawFrog(ctx); break;
          case 'sheep': this.drawSheep(ctx); break;
          case 'owl': this.drawOwl(ctx); break;
        }

        ctx.restore();
      }

      drawEyes(ctx, x1, y1, x2, y2) {
        if (this.isBlinking) {
          ctx.strokeStyle = '#0f172a';
          ctx.lineWidth = 3.5;
          ctx.beginPath();
          ctx.arc(x1, y1 + 3, 7, 0.2 * Math.PI, 0.8 * Math.PI);
          ctx.arc(x2, y2 + 3, 7, 0.2 * Math.PI, 0.8 * Math.PI);
          ctx.stroke();
        } else {
          ctx.fillStyle = '#0f172a';
          ctx.beginPath();
          ctx.arc(x1, y1, 6, 0, Math.PI * 2);
          ctx.arc(x2, y2, 6, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(x1 - 2, y1 - 2, 2.5, 0, Math.PI * 2);
          ctx.arc(x2 - 2, y2 - 2, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      drawDuck(ctx) {
        ctx.fillStyle = '#facc15';
        ctx.beginPath();
        ctx.arc(0, 4, 38, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#eab308';
        ctx.beginPath();
        ctx.ellipse(-34, 10, 10, 18, -0.2, 0, Math.PI * 2);
        ctx.ellipse(34, 10, 10, 18, 0.2, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ff8cb0';
        ctx.beginPath();
        ctx.arc(-22, 10, 7, 0, Math.PI * 2);
        ctx.arc(22, 10, 7, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fb923c';
        ctx.beginPath();
        const beakHeight = this.isChewing ? 14 : 9;
        ctx.ellipse(0, 12, 16, beakHeight, 0, 0, Math.PI * 2);
        ctx.fill();

        this.drawEyes(ctx, -14, -6, 14, -6);
      }

      drawCat(ctx) {
        ctx.fillStyle = '#e0e7ff';
        ctx.beginPath();
        ctx.moveTo(-34, -20); ctx.lineTo(-24, -50); ctx.lineTo(-6, -34); ctx.closePath(); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(34, -20); ctx.lineTo(24, -50); ctx.lineTo(6, -34); ctx.closePath(); ctx.fill();

        ctx.fillStyle = '#ff8cb0';
        ctx.beginPath();
        ctx.moveTo(-28, -24); ctx.lineTo(-24, -42); ctx.lineTo(-12, -32); ctx.closePath(); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(28, -24); ctx.lineTo(24, -42); ctx.lineTo(12, -32); ctx.closePath(); ctx.fill();

        ctx.fillStyle = '#e0e7ff';
        ctx.beginPath();
        ctx.arc(0, 4, 38, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ff8cb0';
        ctx.beginPath();
        ctx.arc(-22, 12, 7, 0, Math.PI * 2);
        ctx.arc(22, 12, 7, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ff65a6';
        ctx.beginPath();
        ctx.ellipse(0, 8, 5, 4, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#475569';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-16, 8); ctx.lineTo(-38, 4);
        ctx.moveTo(-16, 12); ctx.lineTo(-36, 16);
        ctx.moveTo(16, 8); ctx.lineTo(38, 4);
        ctx.moveTo(16, 12); ctx.lineTo(36, 16);
        ctx.stroke();

        this.drawEyes(ctx, -14, -8, 14, -8);
      }

      drawDog(ctx) {
        ctx.fillStyle = '#d97706';
        ctx.beginPath();
        ctx.ellipse(-36, -4, 12, 26, 0.4, 0, Math.PI * 2);
        ctx.ellipse(36, -4, 12, 26, -0.4, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.arc(0, 4, 38, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.ellipse(14, -6, 16, 14, 0.2, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fef3c7';
        ctx.beginPath();
        ctx.ellipse(0, 14, 18, 13, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.ellipse(0, 7, 7, 5, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ff65a6';
        ctx.beginPath();
        ctx.ellipse(4, 21, 6, this.isChewing ? 12 : 8, 0.1, 0, Math.PI * 2);
        ctx.fill();

        this.drawEyes(ctx, -14, -6, 14, -6);
      }

      drawFrog(ctx) {
        ctx.fillStyle = '#4ade80';
        ctx.beginPath();
        ctx.arc(-22, -18, 18, 0, Math.PI * 2);
        ctx.arc(22, -18, 18, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.ellipse(0, 8, 42, 34, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#bbf7d0';
        ctx.beginPath();
        ctx.ellipse(0, 18, 26, 20, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ff8cb0';
        ctx.beginPath();
        ctx.arc(-24, 12, 7, 0, Math.PI * 2);
        ctx.arc(24, 12, 7, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#15803d';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.arc(0, 10, this.isChewing ? 16 : 10, 0.1 * Math.PI, 0.9 * Math.PI);
        ctx.stroke();

        this.drawEyes(ctx, -22, -18, 22, -18);
      }

      drawSheep(ctx) {
        ctx.fillStyle = '#f8fafc';
        const curls = [-30, -15, 0, 15, 30];
        for (let i = 0; i < curls.length; i++) {
          ctx.beginPath();
          ctx.arc(curls[i], -12, 18, 0, Math.PI * 2);
          ctx.arc(curls[i], 12, 18, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = '#fbcfe8';
        ctx.beginPath();
        ctx.ellipse(-38, 4, 10, 6, -0.3, 0, Math.PI * 2);
        ctx.ellipse(38, 4, 10, 6, 0.3, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fed7aa';
        ctx.beginPath();
        ctx.ellipse(0, 6, 26, 22, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ff8cb0';
        ctx.beginPath();
        ctx.arc(-16, 10, 5, 0, Math.PI * 2);
        ctx.arc(16, 10, 5, 0, Math.PI * 2);
        ctx.fill();

        this.drawEyes(ctx, -10, 0, 10, 0);
      }

      drawOwl(ctx) {
        ctx.fillStyle = '#8338fc';
        ctx.beginPath();
        ctx.moveTo(-32, -10); ctx.lineTo(-24, -44); ctx.lineTo(-8, -26); ctx.closePath(); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(32, -10); ctx.lineTo(24, -44); ctx.lineTo(8, -26); ctx.closePath(); ctx.fill();

        ctx.beginPath();
        ctx.arc(0, 4, 38, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#d8d4fd';
        ctx.beginPath();
        ctx.ellipse(0, 14, 24, 26, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ff8cb0';
        ctx.beginPath();
        ctx.arc(-22, 10, 7, 0, Math.PI * 2);
        ctx.arc(22, 10, 7, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffd043';
        ctx.beginPath();
        ctx.moveTo(-7, 2); ctx.lineTo(7, 2); ctx.lineTo(0, 12); ctx.closePath(); ctx.fill();

        this.drawEyes(ctx, -14, -8, 14, -8);
      }
    }

    const animals = [
      new BabyAnimal('duck', playDuckQuack, 'duck', '#facc15', 'corn'),

    ];

    function repositionAnimals() {
      const isMobile = width < 768;
      const cols = isMobile ? 2 : 3;
      const rows = isMobile ? 3 : 2;

      const startY = height * 0.24;
      const endY = height * 0.72;
      const rowGap = (endY - startY) / (rows - 1);

      animals.forEach((a, idx) => {
        const c = idx % cols;
        const r = Math.floor(idx / cols);

        const colGap = width / (cols + 1);
        a.x = (c + 1) * colGap;
        a.y = startY + r * rowGap;
      });
    }

    // ==========================================
    // 5. SISTEMA DE ARRASTE DE COMIDINHAS
    // ==========================================
    let draggedFood = null;

    function startDragFood(e, type, emoji, targetAnimal) {
      e.preventDefault();
      initAudio();
      draggedFood = {
        type: type,
        emoji: emoji,
        targetAnimal: targetAnimal,
        x: e.clientX,
        y: e.clientY
      };
    }

    window.addEventListener('pointermove', e => {
      if (draggedFood) {
        draggedFood.x = e.clientX;
        draggedFood.y = e.clientY;
      }
    });

    window.addEventListener('pointerup', e => {
      if (draggedFood) {
        // Checa se soltou perto de algum bichinho
        for (const a of animals) {
          if (a.hitTest(draggedFood.x, draggedFood.y)) {
            a.feed(draggedFood.type);
            break;
          }
        }
        draggedFood = null;
      }
    });

    // ==========================================
    // 6. TOQUE & CARINHO
    // ==========================================
    let isParty = false;
    let partyInterval = null;

    function toggleAnimalParty() {
      initAudio();
      isParty = !isParty;
      const btn = document.getElementById('btnParty');
      if (isParty) {
        btn.classList.add('active');
        speakText(tG.voiceParty);
        animals.forEach(a => a.isDancing = true);
        partyInterval = setInterval(() => {
          const rand = animals[Math.floor(Math.random() * animals.length)];
          rand.interact(false);
        }, 800);
      } else {
        btn.classList.remove('active');
        animals.forEach(a => a.isDancing = false);
        if (partyInterval) clearInterval(partyInterval);
      }
    }

    function handlePointerHit(x, y) {
      initAudio();

      // Checa toque nos balões
      for (let i = balloons.length - 1; i >= 0; i--) {
        const b = balloons[i];
        if (b.hitTest(x, y)) {
          b.pop();
          balloons.splice(i, 1);
          return;
        }
      }

      // Checa toque nos animaizinhos
      for (const a of animals) {
        if (a.hitTest(x, y)) {
          a.interact(false);
          return;
        }
      }

      // Toque livre gera balão
      if (balloons.length < 12) {
        balloons.push(new FloatingBalloon(x, y));
      }
    }

    function handlePointerPet(x, y) {
      for (const a of animals) {
        if (a.hitTest(x, y)) {
          a.purrCount++;
          if (a.purrCount % 12 === 0) {
            a.interact(true);
          }
        }
      }
    }

    window.addEventListener('pointerdown', e => {
      if (!draggedFood && e.clientY < height - 80) {
        handlePointerHit(e.clientX, e.clientY);
      }
    });

    window.addEventListener('pointermove', e => {
      if (!draggedFood && e.buttons === 1) {
        handlePointerPet(e.clientX, e.clientY);
      }
    });

    window.addEventListener('touchstart', e => {
      e.preventDefault();
      if (!draggedFood) {
        for (let i = 0; i < e.touches.length; i++) {
          if (e.touches[i].clientY < height - 80) {
            handlePointerHit(e.touches[i].clientX, e.touches[i].clientY);
          }
        }
      }
    }, { passive: false });

    window.addEventListener('touchmove', e => {
      e.preventDefault();
      if (!draggedFood) {
        for (let i = 0; i < e.touches.length; i++) {
          handlePointerPet(e.touches[i].clientX, e.touches[i].clientY);
        }
      }
    }, { passive: false });

    // ==========================================
    // 7. LOOP DE ANIMAÇÃO GRÁFICA
    // ==========================================
    let balloonTimer = 0;

    function gameLoop() {
      ctx.clearRect(0, 0, width, height);

      // Fundo Cósmico Suave
      const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
      bgGrad.addColorStop(0, '#0a173b');
      bgGrad.addColorStop(0.5, '#152454');
      bgGrad.addColorStop(1, '#1e336d');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, width, height);

      // Balões Flutuantes
      balloonTimer++;
      if (balloonTimer % 120 === 0 && balloons.length < 8) {
        balloons.push(new FloatingBalloon());
      }

      for (let i = balloons.length - 1; i >= 0; i--) {
        const b = balloons[i];
        b.update();
        b.draw(ctx);
        if (b.y + b.radius < -30) balloons.splice(i, 1);
      }

      // Desenha e atualiza os 6 animaizinhos
      for (const a of animals) {
        a.update();
        a.draw(ctx);
      }

      // Partículas de Corações e Estrelas
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        p.draw(ctx);
        if (p.life <= 0) particles.splice(i, 1);
      }

      // Desenha comidinha sendo arrastada
      if (draggedFood) {
        ctx.save();
        ctx.translate(draggedFood.x, draggedFood.y);
        ctx.font = '48px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(draggedFood.emoji, 0, 0);

        // Halo brilhante
        ctx.strokeStyle = '#ffd043';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, 32, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      requestAnimationFrame(gameLoop);
    }
    requestAnimationFrame(gameLoop);

    // ==========================================
    // 8. KRUUJ SDK & LOADER
    // ==========================================
    // KruujLoader fornecido centralmente via /sdk/v1/kruuj-loader.js

    window.addEventListener('DOMContentLoaded', () => {
      resize();

      if (window.KruujSDK) {
        window.KruujSDK.init().then(() => {
          window.KruujSDK.gameLoadingFinished();
          window.KruujSDK.gameplayStart();
        }).catch(() => {});
      }

      document.getElementById('partyLabel').textContent = tG.btnParty;

      if (window.self === window.top) {
        KruujLoader.start({
          gameName: tG.title,
          tagline: tG.tagline,
          tips: tG.tips,
          splash: 1800,
          minTime: 2600
        });
        setTimeout(() => KruujLoader.finish(), 2400);
      }
    });
  </script>
