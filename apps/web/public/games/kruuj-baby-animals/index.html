    * {

  <script>
    // ==========================================
    // 1. ÁUDIO SINTÉTICO (SONS DOS BICHINHOS VIA WEBAUDIO)
    // ==========================================
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Patinho: Quack carinhoso com formantes nasais
    function playDuckQuack() {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      [0, 0.16].forEach((offset) => {
        const t = now + offset;
        const osc = audioCtx.createOscillator();
        const filter = audioCtx.createBiquadFilter();
        const gain = audioCtx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(380, t);
        osc.frequency.exponentialRampToValueAtTime(260, t + 0.12);

        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(950, t);
        filter.Q.setValueAtTime(3.5, t);

        gain.gain.setValueAtTime(0.001, t);
        gain.gain.linearRampToValueAtTime(0.24, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.14);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(t);
        osc.stop(t + 0.15);
      });
    }

    // Gatinho: Miau doce com glissando macio
    function playCatMeow() {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.exponentialRampToValueAtTime(740, now + 0.18);
      osc.frequency.exponentialRampToValueAtTime(520, now + 0.42);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.26, now + 0.06);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.48);
    }

    // Cachorrinho: Au-au alegre de filhotinho
    function playDogBark() {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      [0, 0.18].forEach((offset) => {
        const t = now + offset;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(320, t);
        osc.frequency.exponentialRampToValueAtTime(560, t + 0.04);
        osc.frequency.exponentialRampToValueAtTime(280, t + 0.12);

        gain.gain.setValueAtTime(0.001, t);
        gain.gain.linearRampToValueAtTime(0.28, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.13);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(t);
        osc.stop(t + 0.14);
      });
    }

    // Sapinho: Coac borbulhante e divertido
    function playFrogCroak() {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      const osc = audioCtx.createOscillator();
      const filter = audioCtx.createBiquadFilter();
      const gain = audioCtx.createGain();

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(140, now);
      osc.frequency.exponentialRampToValueAtTime(260, now + 0.08);
      osc.frequency.exponentialRampToValueAtTime(120, now + 0.22);

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(450, now);
      filter.Q.setValueAtTime(5.0, now);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.3, now + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.25);
    }

    // Ovelhinha: Bééé fofo e com vibrato suave
    function playSheepBaa() {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      const osc = audioCtx.createOscillator();
      const lfo = audioCtx.createOscillator();
      const lfoGain = audioCtx.createGain();
      const gain = audioCtx.createGain();

      lfo.frequency.setValueAtTime(7, now); // vibrato a 7Hz
      lfoGain.gain.setValueAtTime(18, now);

      lfo.connect(osc.frequency);

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(330, now);
      osc.frequency.linearRampToValueAtTime(350, now + 0.1);
      osc.frequency.linearRampToValueAtTime(310, now + 0.45);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.24, now + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.48);

      lfo.start(now);
      lfo.stop(now + 0.5);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.5);
    }

    // Corujinha KRUUJ: Piu-piu amigável de filhotinho
    function playOwlChirp() {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      [0, 0.15].forEach((offset, idx) => {
        const t = now + offset;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        const startF = idx === 0 ? 680 : 820;
        const endF = idx === 0 ? 1180 : 1380;
        osc.frequency.setValueAtTime(startF, t);
        osc.frequency.exponentialRampToValueAtTime(endF, t + 0.11);

        gain.gain.setValueAtTime(0.001, t);
        gain.gain.linearRampToValueAtTime(0.28, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.13);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(t);
        osc.stop(t + 0.14);
      });
    }

    // ==========================================
    // 2. CANVAS & RESPONSIVIDADE
    // ==========================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let width = 0;
    let height = 0;
    let cuddleScore = 0;

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
      repositionAnimals();
    }
    window.addEventListener('resize', resize);

    // Toast de carinho
    let toastTimer = null;
    function showToast(text) {
      const toast = document.getElementById('toastPill');
      toast.textContent = text;
      toast.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 1500);
    }

    function addCuddle(pts = 1) {
      cuddleScore += pts;
      document.getElementById('cuddleCount').textContent = cuddleScore;
    }

    // Partículas (Corações, estrelas e notas musicais)
    let particles = [];
    class Particle {
      constructor(x, y, color, type = 'heart') {
        this.x = x;
        this.y = y;
        this.color = color;
        this.type = type;
        const angle = Math.random() * Math.PI * 2;
        const spd = Math.random() * 4 + 1.5;
        this.vx = Math.cos(angle) * spd;
        this.vy = Math.sin(angle) * spd - 2;
        this.size = Math.random() * 9 + 6;
        this.life = 1.0;
        this.decay = Math.random() * 0.02 + 0.012;
        this.rot = Math.random() * Math.PI;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= this.decay;
        this.rot += 0.03;
      }
      draw(ctx) {
        if (this.life <= 0) return;
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rot);

        if (this.type === 'heart') {
          drawHeart(ctx, 0, 0, this.size);
        } else if (this.type === 'note') {
          ctx.font = `${Math.round(this.size * 1.5)}px sans-serif`;
          ctx.fillText('🎵', -this.size * 0.5, this.size * 0.5);
        } else {
          drawStar(ctx, 0, 0, 5, this.size, this.size * 0.45);
        }
        ctx.restore();
      }
    }

    function drawHeart(ctx, x, y, size) {
      ctx.beginPath();
      const topCurveHeight = size * 0.3;
      ctx.moveTo(x, y + topCurveHeight);
      ctx.bezierCurveTo(x, y, x - size / 2, y, x - size / 2, y + topCurveHeight);
      ctx.bezierCurveTo(x - size / 2, y + (size + topCurveHeight) / 2, x, y + (size + topCurveHeight) / 2, x, y + size);
      ctx.bezierCurveTo(x, y + (size + topCurveHeight) / 2, x + size / 2, y + (size + topCurveHeight) / 2, x + size / 2, y + topCurveHeight);
      ctx.bezierCurveTo(x + size / 2, y, x, y, x, y + topCurveHeight);
      ctx.fill();
    }

    function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius) {
      let rot = Math.PI / 2 * 3;
      let x = cx;
      let y = cy;
      const step = Math.PI / spikes;
      ctx.beginPath();
      ctx.moveTo(cx, cy - outerRadius);
      for (let i = 0; i < spikes; i++) {
        x = cx + Math.cos(rot) * outerRadius;
        y = cy + Math.sin(rot) * outerRadius;
        ctx.lineTo(x, y);
        rot += step;
        x = cx + Math.cos(rot) * innerRadius;
        y = cy + Math.sin(rot) * innerRadius;
        ctx.lineTo(x, y);
        rot += step;
      }
      ctx.lineTo(cx, cy - outerRadius);
      ctx.closePath();
      ctx.fill();
    }

    function createBurst(x, y, color, count = 12, type = 'heart') {
      for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, color, type));
      }
    }

    // ==========================================
    // 3. MODELAGEM DOS 6 AMIGUINHOS BEBÊS
    // ==========================================
    class BabyAnimal {
      constructor(type, soundFn, pillKey, primaryColor) {
        this.type = type; // 'duck', 'cat', 'dog', 'frog', 'sheep', 'owl'
        this.soundFn = soundFn;
        this.pillKey = pillKey;
        this.primaryColor = primaryColor;
        this.x = 0;
        this.y = 0;
        this.baseY = 0;
        this.radius = 48;
        this.scaleX = 1.0;
        this.scaleY = 1.0;
        this.jumpOffset = 0;
        this.isJumping = false;
        this.wobble = Math.random() * Math.PI * 2;
        this.blinkTimer = Math.floor(Math.random() * 120 + 80);
        this.isBlinking = false;
        this.isDancing = false;
        this.cheerTimer = 0;
      }

      hitTest(px, py) {
        return Math.hypot(px - this.x, py - (this.y - this.jumpOffset)) < this.radius * 1.35;
      }

      interact(isPet = false) {
        this.soundFn();
        showToast(tG[this.pillKey]);
        addCuddle(isPet ? 1 : 2);

        // Squash & stretch elástico
        this.scaleX = 1.35;
        this.scaleY = 0.72;
        this.jumpOffset = 28;

        setTimeout(() => {
          this.scaleX = 0.85;
          this.scaleY = 1.25;
          setTimeout(() => {
            this.scaleX = 1.0;
            this.scaleY = 1.0;
            this.jumpOffset = 0;
          }, 160);
        }, 120);

        createBurst(this.x, this.y - 30, this.primaryColor, isPet ? 8 : 16, isPet ? 'heart' : 'note');
      }

      update() {
        this.wobble += 0.04;
        if (this.blinkTimer > 0) {
          this.blinkTimer--;
        } else {
          this.isBlinking = true;
          if (this.blinkTimer < -6) {
            this.isBlinking = false;
            this.blinkTimer = Math.floor(Math.random() * 180 + 100);
          } else {
            this.blinkTimer--;
          }
        }

        if (this.isDancing) {
          this.jumpOffset = Math.abs(Math.sin(this.wobble * 3)) * 22;
          this.scaleX = 1.0 + Math.sin(this.wobble * 3) * 0.12;
          this.scaleY = 1.0 - Math.sin(this.wobble * 3) * 0.12;
        }
      }

      draw(ctx) {
        ctx.save();
        const renderY = this.y - this.jumpOffset;
        ctx.translate(this.x, renderY);
        ctx.scale(this.scaleX, this.scaleY);

        // Sombra suave no chão
        ctx.fillStyle = 'rgba(10, 16, 45, 0.45)';
        ctx.beginPath();
        ctx.ellipse(0, 48 + this.jumpOffset * 0.6, 42 * (1 - this.jumpOffset * 0.015), 14, 0, 0, Math.PI * 2);
        ctx.fill();

        // Desenha o bichinho específico
        switch (this.type) {
          case 'duck': this.drawDuck(ctx); break;
          case 'cat': this.drawCat(ctx); break;
          case 'dog': this.drawDog(ctx); break;
          case 'frog': this.drawFrog(ctx); break;
          case 'sheep': this.drawSheep(ctx); break;
          case 'owl': this.drawOwl(ctx); break;
        }

        ctx.restore();
      }

      // 1. PATINHO AMARELO
      drawDuck(ctx) {
        // Corpo e Cabeça
        ctx.fillStyle = '#facc15';
        ctx.beginPath();
        ctx.arc(0, 4, 38, 0, Math.PI * 2);
        ctx.fill();

        // Asinhas
        ctx.fillStyle = '#eab308';
        ctx.beginPath();
        ctx.ellipse(-34, 10, 10, 18, -0.2, 0, Math.PI * 2);
        ctx.ellipse(34, 10, 10, 18, 0.2, 0, Math.PI * 2);
        ctx.fill();

        // Peninha na cabeça
        ctx.beginPath();
        ctx.ellipse(0, -36, 6, 12, 0.1, 0, Math.PI * 2);
        ctx.fill();

        // Bochechas rosadas
        ctx.fillStyle = '#ff8cb0';
        ctx.beginPath();
        ctx.arc(-22, 10, 7, 0, Math.PI * 2);
        ctx.arc(22, 10, 7, 0, Math.PI * 2);
        ctx.fill();

        // Biquinho fofo laranja
        ctx.fillStyle = '#fb923c';
        ctx.beginPath();
        ctx.ellipse(0, 12, 16, 9, 0, 0, Math.PI * 2);
        ctx.fill();

        // Olhinhos
        this.drawEyes(ctx, -14, -6, 14, -6);
      }

      // 2. GATINHO FOFO
      drawCat(ctx) {
        // Orelhinhas
        ctx.fillStyle = '#e0e7ff';
        ctx.beginPath();
        ctx.moveTo(-34, -20);
        ctx.lineTo(-24, -50);
        ctx.lineTo(-6, -34);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(34, -20);
        ctx.lineTo(24, -50);
        ctx.lineTo(6, -34);
        ctx.closePath();
        ctx.fill();

        // Miolo da orelha rosa
        ctx.fillStyle = '#ff8cb0';
        ctx.beginPath();
        ctx.moveTo(-28, -24);
        ctx.lineTo(-24, -42);
        ctx.lineTo(-12, -32);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(28, -24);
        ctx.lineTo(24, -42);
        ctx.lineTo(12, -32);
        ctx.closePath();
        ctx.fill();

        // Cabeça
        ctx.fillStyle = '#e0e7ff';
        ctx.beginPath();
        ctx.arc(0, 4, 38, 0, Math.PI * 2);
        ctx.fill();

        // Bochechas rosadas
        ctx.fillStyle = '#ff8cb0';
        ctx.beginPath();
        ctx.arc(-22, 12, 7, 0, Math.PI * 2);
        ctx.arc(22, 12, 7, 0, Math.PI * 2);
        ctx.fill();

        // Focinho e Bigodes
        ctx.fillStyle = '#ff65a6';
        ctx.beginPath();
        ctx.ellipse(0, 8, 5, 4, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#475569';
        ctx.lineWidth = 2;
        // Bigodes esquerda
        ctx.beginPath();
        ctx.moveTo(-16, 8); ctx.lineTo(-38, 4);
        ctx.moveTo(-16, 12); ctx.lineTo(-36, 16);
        // Bigodes direita
        ctx.moveTo(16, 8); ctx.lineTo(38, 4);
        ctx.moveTo(16, 12); ctx.lineTo(36, 16);
        ctx.stroke();

        // Olhinhos
        this.drawEyes(ctx, -14, -8, 14, -8);
      }

      // 3. CACHORRINHO ALEGRE
      drawDog(ctx) {
        // Orelhas caídas fofas de filhotinho
        ctx.fillStyle = '#d97706';
        ctx.beginPath();
        ctx.ellipse(-36, -4, 12, 26, 0.4, 0, Math.PI * 2);
        ctx.ellipse(36, -4, 12, 26, -0.4, 0, Math.PI * 2);
        ctx.fill();

        // Cabeça
        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.arc(0, 4, 38, 0, Math.PI * 2);
        ctx.fill();

        // Mancha de cor no olho
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.ellipse(14, -6, 16, 14, 0.2, 0, Math.PI * 2);
        ctx.fill();

        // Focinho fofo
        ctx.fillStyle = '#fef3c7';
        ctx.beginPath();
        ctx.ellipse(0, 14, 18, 13, 0, 0, Math.PI * 2);
        ctx.fill();

        // Narizinho preto
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.ellipse(0, 7, 7, 5, 0, 0, Math.PI * 2);
        ctx.fill();

        // Língua para fora de felicidade!
        ctx.fillStyle = '#ff65a6';
        ctx.beginPath();
        ctx.ellipse(4, 21, 6, 8, 0.1, 0, Math.PI * 2);
        ctx.fill();

        // Olhinhos
        this.drawEyes(ctx, -14, -8, 14, -8);
      }

      // 4. SAPINHO CURIOSO
      drawFrog(ctx) {
        // Globos oculares proeminentes no topo
        ctx.fillStyle = '#4ade80';
        ctx.beginPath();
        ctx.arc(-20, -24, 17, 0, Math.PI * 2);
        ctx.arc(20, -24, 17, 0, Math.PI * 2);
        ctx.fill();

        // Cabeça redonda
        ctx.fillStyle = '#4ade80';
        ctx.beginPath();
        ctx.ellipse(0, 8, 44, 34, 0, 0, Math.PI * 2);
        ctx.fill();

        // Bochechas rosadas
        ctx.fillStyle = '#ff8cb0';
        ctx.beginPath();
        ctx.arc(-26, 10, 8, 0, Math.PI * 2);
        ctx.arc(26, 10, 8, 0, Math.PI * 2);
        ctx.fill();

        // Boca sorridente bem larga
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(0, 8, 22, 0.15 * Math.PI, 0.85 * Math.PI);
        ctx.stroke();

        // Olhinhos grandes no topo
        this.drawEyes(ctx, -20, -24, 20, -24, 10);
      }

      // 5. OVELHINHA MACIA
      drawSheep(ctx) {
        // Nuvens de lã fofinha
        ctx.fillStyle = '#f8fafc';
        const puffOffsets = [
          [-28, -18], [0, -32], [28, -18],
          [-34, 8], [34, 8], [-20, 28], [20, 28]
        ];
        puffOffsets.forEach(([px, py]) => {
          ctx.beginPath();
          ctx.arc(px, py, 18, 0, Math.PI * 2);
          ctx.fill();
        });

        // Orelhinhas caídas
        ctx.fillStyle = '#cbd5e1';
        ctx.beginPath();
        ctx.ellipse(-38, 0, 10, 18, 0.6, 0, Math.PI * 2);
        ctx.ellipse(38, 0, 10, 18, -0.6, 0, Math.PI * 2);
        ctx.fill();

        // Rosto central meigo
        ctx.fillStyle = '#fed7aa';
        ctx.beginPath();
        ctx.ellipse(0, 4, 26, 28, 0, 0, Math.PI * 2);
        ctx.fill();

        // Bochechas rosadas
        ctx.fillStyle = '#ff8cb0';
        ctx.beginPath();
        ctx.arc(-16, 12, 6, 0, Math.PI * 2);
        ctx.arc(16, 12, 6, 0, Math.PI * 2);
        ctx.fill();

        // Narizinho
        ctx.fillStyle = '#fb7185';
        ctx.beginPath();
        ctx.ellipse(0, 8, 4, 3, 0, 0, Math.PI * 2);
        ctx.fill();

        // Olhinhos
        this.drawEyes(ctx, -10, -4, 10, -4, 6);
      }

      // 6. CORUJINHA KRUUJ BEBÊ
      drawOwl(ctx) {
        // Orelhinhas / Topetes roxos
        ctx.fillStyle = '#6a28d6';
        ctx.beginPath();
        ctx.moveTo(-24, -20);
        ctx.lineTo(-30, -46);
        ctx.lineTo(-10, -32);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(24, -20);
        ctx.lineTo(30, -46);
        ctx.lineTo(10, -32);
        ctx.closePath();
        ctx.fill();

        // Corpo Roxo KRUUJ
        ctx.fillStyle = '#8338fc';
        ctx.beginPath();
        ctx.arc(0, 4, 38, 0, Math.PI * 2);
        ctx.fill();

        // Asinhas
        ctx.fillStyle = '#6a28d6';
        ctx.beginPath();
        ctx.ellipse(-34, 10, 9, 18, 0.2, 0, Math.PI * 2);
        ctx.ellipse(34, 10, 9, 18, -0.2, 0, Math.PI * 2);
        ctx.fill();

        // Peito Lilás
        ctx.fillStyle = '#d8d4fd';
        ctx.beginPath();
        ctx.ellipse(0, 14, 20, 22, 0, 0, Math.PI * 2);
        ctx.fill();

        // Bochechas rosadas
        ctx.fillStyle = '#ff8cb0';
        ctx.beginPath();
        ctx.arc(-22, 8, 7, 0, Math.PI * 2);
        ctx.arc(22, 8, 7, 0, Math.PI * 2);
        ctx.fill();

        // Biquinho dourado
        ctx.fillStyle = '#ffd043';
        ctx.beginPath();
        ctx.moveTo(-5, 4);
        ctx.lineTo(5, 4);
        ctx.lineTo(0, 12);
        ctx.closePath();
        ctx.fill();

        // Olhões KRUUJ (Dourados e Cintilantes)
        this.drawEyes(ctx, -14, -8, 14, -8, 8, '#fda41d');
      }

      // Helper para desenhar olhinhos expressivos com reflexos
      drawEyes(ctx, x1, y1, x2, y2, r = 7, irisColor = null) {
        if (this.isBlinking) {
          ctx.strokeStyle = '#0f172a';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(x1, y1, r, 0.2 * Math.PI, 0.8 * Math.PI);
          ctx.arc(x2, y2, r, 0.2 * Math.PI, 0.8 * Math.PI);
          ctx.stroke();
          return;
        }

        // Esclera branca
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(x1, y1, r + 4, 0, Math.PI * 2);
        ctx.arc(x2, y2, r + 4, 0, Math.PI * 2);
        ctx.fill();

        // Íris (se fornecida)
        if (irisColor) {
          ctx.fillStyle = irisColor;
          ctx.beginPath();
          ctx.arc(x1, y1, r + 1, 0, Math.PI * 2);
          ctx.arc(x2, y2, r + 1, 0, Math.PI * 2);
          ctx.fill();
        }

        // Pupila preta
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(x1, y1, r - 1, 0, Math.PI * 2);
        ctx.arc(x2, y2, r - 1, 0, Math.PI * 2);
        ctx.fill();

        // Reflexos de luz
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(x1 - 2, y1 - 2, 2.8, 0, Math.PI * 2);
        ctx.arc(x2 - 2, y2 - 2, 2.8, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Instanciação dos 6 bichinhos
    const animals = [
      new BabyAnimal('duck', playDuckQuack, 'duck', '#facc15'),
      new BabyAnimal('cat', playCatMeow, 'cat', '#f472b6'),
      new BabyAnimal('dog', playDogBark, 'dog', '#fbbf24'),
      new BabyAnimal('frog', playFrogCroak, 'frog', '#4ade80'),
      new BabyAnimal('sheep', playSheepBaa, 'sheep', '#cbd5e1'),
      new BabyAnimal('owl', playOwlChirp, 'owl', '#8338fc')
    ];

    // Posicionamento inteligente (Portrait ou Landscape)
    function repositionAnimals() {
      const isPortrait = height > width;

      if (isPortrait) {
        // Grade 2 colunas x 3 linhas
        const colW = width / 2;
        const startY = height * 0.24;
        const rowH = (height * 0.65) / 3;

        animals.forEach((a, i) => {
          const col = i % 2;
          const row = Math.floor(i / 2);
          a.x = col === 0 ? colW * 0.52 : colW * 1.48;
          a.y = startY + row * rowH;
        });
      } else {
        // Landscape: 6 amiguinhos distribuídos harmonicamente pelo campo
        const spacing = width / 7;
        const baseCenterY = height * 0.62;
        animals.forEach((a, i) => {
          a.x = spacing * (i + 1);
          // Leve arco suave para profundidade
          const arc = Math.sin(((i + 0.5) / 6) * Math.PI) * 35;
          a.y = baseCenterY - arc;
        });
      }
    }
    resize();

    // ==========================================
    // 4. FESTA DOS BICHOS (CORAL MUSICAL)
    // ==========================================
    let isPartyActive = false;
    let partyStep = 0;
    let partyInterval = null;

    function toggleAnimalParty() {
      initAudio();
      isPartyActive = !isPartyActive;
      const btn = document.getElementById('btnParty');

      if (isPartyActive) {
        btn.classList.add('active');
        animals.forEach(a => a.isDancing = true);
        runPartyBeat();
      } else {
        btn.classList.remove('active');
        animals.forEach(a => a.isDancing = false);
        if (partyInterval) clearTimeout(partyInterval);
      }
    }

    function runPartyBeat() {
      if (!isPartyActive) return;
      const targetAnimal = animals[partyStep % animals.length];
      targetAnimal.interact(false);
      partyStep++;

      partyInterval = setTimeout(runPartyBeat, 500);
    }

    // ==========================================
    // 5. TOQUE & CARINHO
    // ==========================================
    let isDragging = false;
    let lastPetAnimal = null;

    function handlePointerDown(x, y) {
      initAudio();
      isDragging = true;
      let hit = false;
      for (const a of animals) {
        if (a.hitTest(x, y)) {
          a.interact(false);
          lastPetAnimal = a;
          hit = true;
          break;
        }
      }
      if (!hit) {
        // Tocou na grama ou céu: cria estrelinhas
        createBurst(x, y, '#fde047', 6, 'star');
        addCuddle(1);
      }
    }

    function handlePointerMove(x, y) {
      if (!isDragging) return;
      for (const a of animals) {
        if (a.hitTest(x, y)) {
          if (lastPetAnimal !== a) {
            a.interact(true); // Carinho!
            lastPetAnimal = a;
          }
          break;
        }
      }
    }

    window.addEventListener('pointerdown', e => handlePointerDown(e.clientX, e.clientY));
    window.addEventListener('pointermove', e => handlePointerMove(e.clientX, e.clientY));
    window.addEventListener('pointerup', () => { isDragging = false; lastPetAnimal = null; });
    window.addEventListener('pointercancel', () => { isDragging = false; lastPetAnimal = null; });

    // Multitouch nativo para bebês
    window.addEventListener('touchstart', e => {
      e.preventDefault();
      for (let i = 0; i < e.touches.length; i++) {
        const t = e.touches[i];
        handlePointerDown(t.clientX, t.clientY);
      }
    }, { passive: false });

    window.addEventListener('touchmove', e => {
      e.preventDefault();
      for (let i = 0; i < e.touches.length; i++) {
        const t = e.touches[i];
        handlePointerMove(t.clientX, t.clientY);
      }
    }, { passive: false });

    // ==========================================
    // 6. LOOP DE ANIMAÇÃO GRÁFICA
    // ==========================================
    let cloudX = 0;
    function gameLoop() {
      ctx.clearRect(0, 0, width, height);

      // Céu Cósmico Pastel
      const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
      skyGrad.addColorStop(0, '#0c163b');
      skyGrad.addColorStop(0.5, '#1e245a');
      skyGrad.addColorStop(1, '#2c1e60');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, width, height);

      // Nuvens suaves ao fundo
      cloudX += 0.3;
      if (cloudX > width + 200) cloudX = -200;
      ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
      ctx.beginPath();
      ctx.arc(cloudX, height * 0.15, 60, 0, Math.PI * 2);
      ctx.arc(cloudX + 45, height * 0.13, 50, 0, Math.PI * 2);
      ctx.arc(cloudX - 45, height * 0.17, 45, 0, Math.PI * 2);
      ctx.fill();

      // Colina Suave da Fazendinha
      ctx.fillStyle = '#1e3a5f';
      ctx.beginPath();
      ctx.moveTo(0, height * 0.55);
      ctx.bezierCurveTo(width * 0.3, height * 0.48, width * 0.7, height * 0.62, width, height * 0.52);
      ctx.lineTo(width, height);
      ctx.lineTo(0, height);
      ctx.closePath();
      ctx.fill();

      // Colina Frontal Mais Clara
      ctx.fillStyle = '#142a4a';
      ctx.beginPath();
      ctx.moveTo(0, height * 0.68);
      ctx.bezierCurveTo(width * 0.4, height * 0.75, width * 0.6, height * 0.64, width, height * 0.7);
      ctx.lineTo(width, height);
      ctx.lineTo(0, height);
      ctx.closePath();
      ctx.fill();

      // Desenha e atualiza cada bichinho
      for (const a of animals) {
        a.update();
        a.draw(ctx);
      }

      // Partículas
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        if (p.life <= 0) {
          particles.splice(i, 1);
        } else {
          p.draw(ctx);
        }
      }

      requestAnimationFrame(gameLoop);
    }
    requestAnimationFrame(gameLoop);

    // ==========================================
    // 7. KRUUJ SDK & LOADER
    // ==========================================
    const KruujLoader = (() => {
      const $ = id => document.getElementById(id);
      let target = 0, shown = 0, cfg = {}, t0 = 0, raf = null, tipTimer = null, finished = false, closing = false;
      const wait = ms => new Promise(r => setTimeout(r, ms));
      function frame() {
        if (!cfg.manual && !finished) target = Math.min(0.9, target + 0.004 * (1 - target) + 0.0015);
        shown += (target - shown) * 0.08;
        if (finished && target - shown < 0.002) shown = target;
        const pc = Math.round(shown * 100);
        if ($('kl-fill')) $('kl-fill').style.width = pc + '%';
        if ($('kl-rider')) $('kl-rider').style.left = pc + '%';
        if ($('kl-pct')) $('kl-pct').textContent = pc + '%';
        if (shown >= 1 && performance.now() - t0 >= cfg.minTime) return close();
        raf = requestAnimationFrame(frame);
      }
      async function close() {
        if (closing) return; closing = true; clearInterval(tipTimer);
        const kl = $('kl');
        if (kl) {
          kl.classList.add('out');
          await wait(650);
          kl.style.display = 'none';
        }
        if (cfg.onComplete) cfg.onComplete();
      }
      async function start(c) {
        cfg = { gameName: 'KRUUJ Amiguinhos & Sons', tagline: '', tips: [], splash: 1800, minTime: 2600, manual: false, onComplete() {}, ...c };
        target = shown = 0; finished = closing = false;
        const kl = $('kl');
        if (!kl) return;
        kl.style.display = ''; kl.classList.remove('out');
        const [sp, ld] = kl.querySelectorAll('.ph');
        if (sp) sp.classList.remove('off');
        if (ld) ld.classList.add('off');
        $('kl-name').textContent = cfg.gameName;
        $('kl-tag').textContent = cfg.tagline;
        document.title = cfg.gameName + ' – Kruuj Studio';
        await wait(cfg.splash);
        if (sp) sp.classList.add('off');
        await wait(400);
        if (ld) ld.classList.remove('off');
        t0 = performance.now();
        let i = 0;
        const tip = $('kl-tip');
        const nextTip = () => {
          if (!tip) return;
          tip.style.opacity = '0';
          setTimeout(() => {
            tip.textContent = cfg.tips[i++ % cfg.tips.length] || '';
            tip.style.opacity = '0.85';
          }, 350);
        };
        if (cfg.tips.length) { nextTip(); tipTimer = setInterval(nextTip, 3000); }
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(frame);
      }
      return {
        start,
        finish() { finished = true; target = 1; }
      };
    })();

    window.addEventListener('DOMContentLoaded', () => {
      // Inicia KruujSDK
      if (window.KruujSDK) {
        window.KruujSDK.init().then(() => {
          window.KruujSDK.gameLoadingFinished();
          window.KruujSDK.gameplayStart();
        }).catch(() => {});
      }

      // Aplica i18n
      document.getElementById('partyLabel').textContent = tG.btnParty;

      // Executa loader apenas standalone
      if (window.self === window.top) {
        KruujLoader.start({
          gameName: tG.title,
          tagline: tG.tagline,
          tips: tG.tips,
          splash: 1800,
          minTime: 2600
        });
        setTimeout(() => KruujLoader.finish(), 2400);
      }
    });
  </script>
