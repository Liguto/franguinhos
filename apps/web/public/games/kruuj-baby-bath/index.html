<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>KRUUJ Banho da Corujinha – Baby Bath</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <script src="/sdk/v1/kruuj-sdk.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">

  <script>
    // Suprime KruujLoader interno se carregado dentro do Portal iframe
    if (window.self !== window.top) {
      window.addEventListener('DOMContentLoaded', () => {
        const kl = document.getElementById('kl');
        if (kl) kl.style.display = 'none';
      });
    }

    // Suporte a i18n em PT, EN, ES
    const URL_LANG = (new URLSearchParams(window.location.search).get('lang') || 'pt').toLowerCase();
    const I18N = {
      pt: {
        title: 'KRUUJ Banho da Corujinha',
        tagline: 'Hora do banho quentinho! Faça espuma, aperte o patinho e estoure bolhas.',
        btnShower: 'Chuveirinho 🚿',
        btnShowerOn: 'Chuvinha: Ligada 💧',
        btnSponge: 'Esponja 🧽',
        duckSqueak: 'Quack! Patinho feliz! 🦆',
        bubblePop: 'Plop! Bolha mágica! ✨',
        soapyOwl: 'Que espuminha gostosa! 🧼',
        cleanOwl: 'Corujinha limpinha e cheirosa! 🌸',
        cheers: ['Gostoso!', 'Que fofo!', 'Plop!', 'Tão cheirosa!', 'Viva! 💕'],
        tips: [
          'Esfregue o dedinho na corujinha para ensaboá-la.',
          'Toque no patinho amarelo para ouvi-lo fazer quack!',
          'Ligue o chuveirinho para enxaguar as espumas com água morna.',
          'Toque nas bolhas de sabão para estourar!'
        ]
      },
      en: {
        title: 'KRUUJ Baby Bath',
        tagline: 'Cozy bath time! Make foam, squeeze the rubber duck and pop bubbly wonders.',
        btnShower: 'Shower 🚿',
        btnShowerOn: 'Shower: On 💧',
        btnSponge: 'Sponge 🧽',
        duckSqueak: 'Quack! Happy ducky! 🦆',
        bubblePop: 'Plop! Magic bubble! ✨',
        soapyOwl: 'So much bubbly foam! 🧼',
        cleanOwl: 'All clean and smelling sweet! 🌸',
        cheers: ['So sweet!', 'Splash!', 'Plop!', 'Nice and warm!', 'Yay! 💕'],
        tips: [
          'Rub your finger on the owl to make bubbly foam.',
          'Tap the yellow duck to hear it squeak!',
          'Turn on the shower to wash away the foam with warm water.',
          'Tap the floating bubbles to pop them!'
        ]
      },
      es: {
        title: 'KRUUJ El Baño del Búho',
        tagline: '¡Hora del baño tibio! Haz espuma, aprieta el patito y explota burbujas.',
        btnShower: 'Duchita 🚿',
        btnShowerOn: 'Ducha: Activa 💧',
        btnSponge: 'Esponja 🧽',
        duckSqueak: '¡Cuac! ¡Patito feliz! 🦆',
        bubblePop: '¡Plop! ¡Burbuja mágica! ✨',
        soapyOwl: '¡Cuánta espuma suave! 🧼',
        cleanOwl: '¡Búho limpio y perfumado! 🌸',
        cheers: ['¡Qué rico!', '¡Qué tierno!', '¡Plop!', '¡Limpito!', '¡Bravo! 💕'],
        tips: [
          'Frota el dedito en el búho para llenarlo de espuma.',
          '¡Toca el patito amarillo para escucharlo chillar cuac!',
          'Abre la duchita para limpiar la espuma con agua tibia.',
          '¡Toca las burbujas para explotarlas!'
        ]
      }
    };
    const tG = I18N[URL_LANG] || I18N.pt;
  </script>

  <style>
    :root {
      --bg-top: #0a2540;
      --bg-bottom: #163660;
      --water-top: #38bdf8;
      --water-bottom: #0284c7;
      --purple: #8338fc;
      --blue: #289afd;
      --orange: #fda41d;
      --pink: #ff65a6;
      --yellow: #ffd043;
      --green: #4ade80;
      --lav: #d8d4fd;
      --white: #ffffff;
      --navy: #151c4a;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 25%, var(--bg-top), var(--bg-bottom));
      color: var(--white);
      font-family: 'Baloo 2', system-ui, sans-serif;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    /* HUD Superior de Controles — Recuo Poki de 68px no mobile */
    .hud {
      position: fixed;
      top: 14px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
      gap: 8px;
    }

    @media (max-width: 768px) {
      .hud {
        padding-left: 68px !important;
      }
    }

    .hud-group {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }

    .hud-btn {
      background: rgba(14, 43, 79, 0.88);
      border: 2px solid rgba(56, 189, 248, 0.45);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: var(--white);
      font-family: 'Baloo 2', system-ui, sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 8px 18px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      transition: all 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }

    .hud-btn:hover {
      transform: scale(1.05);
      border-color: var(--water-top);
    }

    .hud-btn:active {
      transform: scale(0.95);
    }

    .hud-btn.active {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      border-color: #ffd043;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.7);
    }

    .hud-badge {
      background: rgba(14, 43, 79, 0.88);
      border: 2px solid rgba(255, 208, 67, 0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 9999px;
      padding: 7px 16px;
      font-size: 0.95rem;
      font-weight: 800;
      color: #ffd043;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }

    /* Pílula de Afeto / Toast */
    .toast-pill {
      position: fixed;
      top: 75px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(255, 255, 255, 0.95);
      color: #0369a1;
      font-size: 1.2rem;
      font-weight: 800;
      padding: 8px 24px;
      border-radius: 9999px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
      pointer-events: none;
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      z-index: 20;
    }

    .toast-pill.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ===== KRUUJ LOADER OFICIAL ===== */
    #kl {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: radial-gradient(ellipse at 50% 40%, #101a52 0%, var(--bg-top) 65%);
      display: grid;
      place-items: center;
      padding: env(safe-area-inset-top, 0) 24px env(safe-area-inset-bottom, 0);
      transition: opacity 0.6s ease, visibility 0.6s;
    }
    #kl.out { opacity: 0; visibility: hidden; }
    #kl .ph { grid-area: 1/1; display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 440px; transition: opacity 0.5s ease; }
    #kl .ph.off { opacity: 0; pointer-events: none; }
    .splash .owl { width: min(34vw, 150px); aspect-ratio: 1; border-radius: 50%; animation: pop 0.9s cubic-bezier(.2,1.3,.4,1) both, glow 2.4s ease-in-out 0.9s infinite; }
    .splash .logo { width: min(54vw, 240px); height: auto; margin-top: 20px; animation: rise 0.8s ease 0.7s both; }
    .splash .sub { margin: 8px 0 0; font-weight: 600; font-size: 0.85rem; letter-spacing: 0.38em; padding-left: 0.38em; color: var(--lav); animation: rise 0.8s ease 1.1s both; }
    .load { text-align: center; }
    .load h1 { margin: 0; font-weight: 800; font-size: clamp(1.8rem, 7vw, 2.8rem); line-height: 1.1; letter-spacing: -0.01em; color: #fff; }
    .load .tag { margin: 12px 0 0; color: var(--lav); font-size: 1.05rem; }
    .track { position: relative; width: 100%; height: 10px; margin: 48px 0 0; border-radius: 99px; background: var(--navy); }
    .fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--water-top), var(--purple)); }
    .rider { position: absolute; top: 50%; left: 0; width: 48px; aspect-ratio: 1; margin: -24px 0 0 -24px; border-radius: 50%; box-shadow: 0 0 0 3px var(--bg-top), 0 0 0 5px var(--orange); }
    .pct { margin-top: 26px; font-weight: 600; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
    .tip { min-height: 1.5em; margin: 10px 0 0; color: var(--lav); opacity: 0.85; font-size: 0.95rem; transition: opacity 0.4s; }
    .brand { position: absolute; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); font-size: 0.8rem; color: var(--lav); opacity: 0.6; }
    @keyframes pop { from { transform: scale(0.4); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes glow { 0%, 100% { box-shadow: 0 0 30px 2px #38bdf855; } 50% { box-shadow: 0 0 64px 10px #38bdf899; } }
  </style>
</head>

<body>
  <!-- KruujLoader Oficial -->
  <div id="kl" role="status" aria-live="polite" aria-label="Carregando">
    <div class="ph splash">
      <img class="owl" alt="KRUUJ" src="/kruuj-avatar.png" onerror="this.src='/kruuj-mascote.png'">
      <img class="logo" alt="Kruuj" src="/kruuj-logo.png" onerror="this.style.display='none'">
      <p class="sub">STUDIO</p>
    </div>
    <div class="ph load off">
      <h1 id="kl-name">KRUUJ Banho da Corujinha</h1>
      <p class="tag" id="kl-tag">Hora do banho quentinho com espuma e bolhas.</p>
      <div class="track">
        <div class="fill" id="kl-fill"></div>
        <img class="rider" id="kl-rider" alt="" src="/kruuj-avatar.png">
      </div>
      <div class="pct" id="kl-pct">0%</div>
      <p class="tip" id="kl-tip"></p>
    </div>
    <div class="brand" id="kl-brand">Kruuj Studio</div>
  </div>

  <!-- HUD do Jogo -->
  <header class="hud">
    <div class="hud-group">
      <button class="hud-btn" id="btnShower" onclick="toggleShower()">
        <span id="showerLabel">Chuveirinho 🚿</span>
      </button>
    </div>
    <div class="hud-group">
      <div class="hud-badge" id="bubbleBadge">
        <span>🫧</span>
        <span id="bubbleCount">0</span>
      </div>
    </div>
  </header>

  <!-- Pílula Flutuante -->
  <div class="toast-pill" id="toastPill">Quack! Patinho feliz! 🦆</div>

  <!-- Canvas Principal -->
  <canvas id="gameCanvas"></canvas>

  <script>
    // ==========================================
    // 1. ÁUDIO SINTÉTICO (WEBAUDIO)
    // ==========================================
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Estouro de Bolha de Sabão ("Plop!" crocante e musical)
    const BUBBLE_NOTES = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];
    function playBubblePopSound() {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const freq = BUBBLE_NOTES[Math.floor(Math.random() * BUBBLE_NOTES.length)];

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq * 0.7, now);
      osc.frequency.exponentialRampToValueAtTime(freq * 1.5, now + 0.05);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.28, now + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.2);
    }

    // Patinho de Borracha: "Squeak! Quack!" estridente e hilário
    function playRubberDuckSound() {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      // Squeak agudo inicial
      const osc1 = audioCtx.createOscillator();
      const gain1 = audioCtx.createGain();
      osc1.type = 'triangle';
      osc1.frequency.setValueAtTime(1400, now);
      osc1.frequency.linearRampToValueAtTime(2200, now + 0.08);

      gain1.gain.setValueAtTime(0.001, now);
      gain1.gain.linearRampToValueAtTime(0.3, now + 0.02);
      gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.1);

      osc1.connect(gain1);
      gain1.connect(audioCtx.destination);
      osc1.start(now);
      osc1.stop(now + 0.11);

      // Quack doce descendente
      const osc2 = audioCtx.createOscillator();
      const filter = audioCtx.createBiquadFilter();
      const gain2 = audioCtx.createGain();

      osc2.type = 'sawtooth';
      osc2.frequency.setValueAtTime(420, now + 0.07);
      osc2.frequency.exponentialRampToValueAtTime(280, now + 0.22);

      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(1100, now + 0.07);
      filter.Q.setValueAtTime(4.0, now + 0.07);

      gain2.gain.setValueAtTime(0.001, now + 0.07);
      gain2.gain.linearRampToValueAtTime(0.26, now + 0.09);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.24);

      osc2.connect(filter);
      filter.connect(gain2);
      gain2.connect(audioCtx.destination);

      osc2.start(now + 0.07);
      osc2.stop(now + 0.25);
    }

    // Fricção de Espuma / Esponja ("shh-pop-pop")
    let lastFoamSoundTime = 0;
    function playFoamScrubSound() {
      initAudio();
      if (!audioCtx) return;
      const now = performance.now();
      if (now - lastFoamSoundTime < 140) return;
      lastFoamSoundTime = now;

      const actxNow = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(600 + Math.random() * 400, actxNow);
      osc.frequency.exponentialRampToValueAtTime(1200 + Math.random() * 300, actxNow + 0.06);

      gain.gain.setValueAtTime(0.001, actxNow);
      gain.gain.linearRampToValueAtTime(0.18, actxNow + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, actxNow + 0.08);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(actxNow);
      osc.stop(actxNow + 0.09);
    }

    // Piu-piu amigável de satisfação da corujinha
    function playOwlHappySound() {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(783.99, now); // G5
      osc.frequency.exponentialRampToValueAtTime(1318.51, now + 0.16); // E6

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.25, now + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.32);
    }

    // ==========================================
    // 2. CANVAS & RESPONSIVIDADE
    // ==========================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let width = 0;
    let height = 0;
    let bubbleScore = 0;

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    let toastTimer = null;
    function showToast(text) {
      const toast = document.getElementById('toastPill');
      toast.textContent = text;
      toast.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 1500);
    }

    function addScore(pts = 1) {
      bubbleScore += pts;
      document.getElementById('bubbleCount').textContent = bubbleScore;
    }

    // ==========================================
    // 3. ENTIDADES: BOLHAS, ESPUMAS & CHUVEIRO
    // ==========================================
    let bubbles = [];
    let foams = [];
    let waterDrops = [];
    let isShowerActive = false;
    let showerInterval = null;

    class SoapBubble {
      constructor(x, y, radius = null) {
        this.x = x || Math.random() * width;
        this.y = y || height + 20;
        this.radius = radius || Math.random() * 22 + 20;
        this.vx = (Math.random() - 0.5) * 1.0;
        this.vy = -Math.random() * 1.6 - 0.8;
        this.wobble = Math.random() * Math.PI * 2;
        this.hue = Math.random() * 360;
      }
      hitTest(px, py) {
        return Math.hypot(px - this.x, py - this.y) < this.radius * 1.25;
      }
      pop() {
        playBubblePopSound();
        addScore(1);
        showToast(tG.bubblePop);
        // Partículas brilhantes
        for (let i = 0; i < 8; i++) {
          waterDrops.push(new WaterSplash(this.x, this.y, '#38bdf8'));
        }
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.wobble += 0.04;
        this.x += Math.sin(this.wobble) * 0.5;
      }
      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);

        // Bolha translúcida irisada
        const grad = ctx.createRadialGradient(-this.radius * 0.3, -this.radius * 0.3, this.radius * 0.1, 0, 0, this.radius);
        grad.addColorStop(0, 'rgba(255, 255, 255, 0.7)');
        grad.addColorStop(0.6, 'rgba(56, 189, 248, 0.25)');
        grad.addColorStop(0.9, 'rgba(255, 101, 166, 0.35)');
        grad.addColorStop(1, 'rgba(255, 255, 255, 0.8)');

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();

        // Brilho de reflexo branco
        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.beginPath();
        ctx.ellipse(-this.radius * 0.38, -this.radius * 0.38, this.radius * 0.26, this.radius * 0.14, -0.6, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    // Espuma cremosa na corujinha e na banheira
    class FoamCluster {
      constructor(x, y, radius = 18) {
        this.x = x;
        this.y = y;
        this.radius = radius;
        this.scale = 0.2;
        this.targetScale = 1.0;
        this.color = Math.random() > 0.3 ? '#ffffff' : '#fbcfe8';
        this.life = 1.0;
      }
      wash() {
        this.life -= 0.05;
      }
      update() {
        this.scale += (this.targetScale - this.scale) * 0.18;
      }
      draw(ctx) {
        if (this.life <= 0) return;
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.translate(this.x, this.y);
        ctx.scale(this.scale, this.scale);

        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();

        // Ponto de brilho
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-this.radius * 0.3, -this.radius * 0.3, this.radius * 0.25, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    // Pingos de água do chuveiro
    class WaterSplash {
      constructor(x, y, color = '#38bdf8') {
        this.x = x;
        this.y = y;
        this.color = color;
        this.vx = (Math.random() - 0.5) * 3;
        this.vy = Math.random() * 4 - 2;
        this.radius = Math.random() * 4 + 2;
        this.life = 1.0;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.2;
        this.life -= 0.035;
      }
      draw(ctx) {
        if (this.life <= 0) return;
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // ==========================================
    // 4. CORUJINHA KRUUJ NA BANHEIRA
    // ==========================================
    const bathOwl = {
      wobble: 0,
      scaleX: 1.0,
      scaleY: 1.0,
      isHappy: false,
      isClean: false,
      foamCovered: 0,
      getPos() {
        return {
          x: width * 0.48,
          y: height * 0.56
        };
      },
      hitTest(px, py) {
        const p = this.getPos();
        return Math.hypot(px - p.x, py - p.y) < 70;
      },
      scrub(x, y) {
        playFoamScrubSound();
        this.foamCovered = Math.min(100, this.foamCovered + 4);
        if (foams.length < 45) {
          foams.push(new FoamCluster(x + (Math.random() - 0.5) * 20, y + (Math.random() - 0.5) * 20, Math.random() * 12 + 14));
        }
        this.scaleX = 1.15;
        this.scaleY = 0.9;
        setTimeout(() => { this.scaleX = 1.0; this.scaleY = 1.0; }, 120);
        showToast(tG.soapyOwl);
        addScore(1);
      },
      touch() {
        playOwlHappySound();
        this.scaleX = 1.25;
        this.scaleY = 0.8;
        setTimeout(() => { this.scaleX = 0.9; this.scaleY = 1.2; setTimeout(() => { this.scaleX = 1.0; this.scaleY = 1.0; }, 140); }, 120);
        showToast(tG.soapyOwl);
        addScore(2);
      },
      washClean() {
        if (this.foamCovered > 0) {
          this.foamCovered = Math.max(0, this.foamCovered - 3);
          if (this.foamCovered === 0) {
            showToast(tG.cleanOwl);
            playOwlHappySound();
          }
        }
      },
      update() {
        this.wobble += 0.035;
      },
      draw(ctx) {
        const p = this.getPos();
        const bob = Math.sin(this.wobble) * 4;

        ctx.save();
        ctx.translate(p.x, p.y + bob);
        ctx.scale(this.scaleX, this.scaleY);

        // Corpo Roxo KRUUJ
        ctx.fillStyle = '#8338fc';
        ctx.beginPath();
        ctx.arc(0, 0, 48, 0, Math.PI * 2);
        ctx.fill();

        // Peito Lilás Suave
        ctx.fillStyle = '#d8d4fd';
        ctx.beginPath();
        ctx.ellipse(0, 14, 26, 30, 0, 0, Math.PI * 2);
        ctx.fill();

        // Touquinha de Banho Amarela com bolinhas
        ctx.fillStyle = '#ffd043';
        ctx.beginPath();
        ctx.ellipse(0, -38, 38, 22, 0, Math.PI, Math.PI * 2);
        ctx.fill();

        // Babado da touquinha
        ctx.fillStyle = '#fbbf24';
        for (let i = -36; i <= 36; i += 12) {
          ctx.beginPath();
          ctx.arc(i, -38, 6, 0, Math.PI * 2);
          ctx.fill();
        }

        // Bochechas rosadas
        ctx.fillStyle = '#ff8cb0';
        ctx.beginPath();
        ctx.arc(-26, 8, 9, 0, Math.PI * 2);
        ctx.arc(26, 8, 9, 0, Math.PI * 2);
        ctx.fill();

        // Olhos da Corujinha (Fechados de prazer no banho quentinho)
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.arc(-16, -6, 10, 0.2 * Math.PI, 0.8 * Math.PI);
        ctx.arc(16, -6, 10, 0.2 * Math.PI, 0.8 * Math.PI);
        ctx.stroke();

        // Biquinho dourado
        ctx.fillStyle = '#fda41d';
        ctx.beginPath();
        ctx.moveTo(-6, 2);
        ctx.lineTo(6, 2);
        ctx.lineTo(0, 12);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }
    };

    // ==========================================
    // 5. PATINHO DE BORRACHA BOIANDO
    // ==========================================
    const rubberDuck = {
      wobble: 0,
      scaleX: 1.0,
      scaleY: 1.0,
      dipOffset: 0,
      getPos() {
        return {
          x: width * 0.72,
          y: height * 0.62
        };
      },
      hitTest(px, py) {
        const p = this.getPos();
        return Math.hypot(px - p.x, py - (p.y + this.dipOffset)) < 40;
      },
      squeeze() {
        playRubberDuckSound();
        showToast(tG.duckSqueak);
        addScore(2);

        // Mergulho e espremer
        this.scaleX = 1.35;
        this.scaleY = 0.68;
        this.dipOffset = 18;

        // Ondinhas de água
        for (let i = 0; i < 8; i++) {
          waterDrops.push(new WaterSplash(this.getPos().x, this.getPos().y + 14, '#38bdf8'));
        }

        setTimeout(() => {
          this.scaleX = 0.88;
          this.scaleY = 1.2;
          setTimeout(() => {
            this.scaleX = 1.0;
            this.scaleY = 1.0;
            this.dipOffset = 0;
          }, 150);
        }, 120);
      },
      update() {
        this.wobble += 0.04;
      },
      draw(ctx) {
        const p = this.getPos();
        const bob = Math.sin(this.wobble) * 3;

        ctx.save();
        ctx.translate(p.x, p.y + bob + this.dipOffset);
        ctx.scale(this.scaleX, this.scaleY);

        // Corpo do patinho
        ctx.fillStyle = '#facc15';
        ctx.beginPath();
        ctx.ellipse(0, 6, 26, 18, 0, 0, Math.PI * 2);
        ctx.fill();

        // Cabeça
        ctx.beginPath();
        ctx.arc(-14, -10, 16, 0, Math.PI * 2);
        ctx.fill();

        // Bico laranja
        ctx.fillStyle = '#fb923c';
        ctx.beginPath();
        ctx.ellipse(-28, -8, 9, 5, 0, 0, Math.PI * 2);
        ctx.fill();

        // Olhinho brilhante
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(-18, -14, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-19, -15, 1.2, 0, Math.PI * 2);
        ctx.fill();

        // Rabinho levantado
        ctx.fillStyle = '#eab308';
        ctx.beginPath();
        ctx.moveTo(18, 2);
        ctx.lineTo(28, -6);
        ctx.lineTo(22, 10);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }
    };

    // ==========================================
    // 6. CHUVEIRINHO DE ÁGUA DAS ESTRELAS
    // ==========================================
    function toggleShower() {
      initAudio();
      isShowerActive = !isShowerActive;
      const btn = document.getElementById('btnShower');
      const lbl = document.getElementById('showerLabel');

      if (isShowerActive) {
        btn.classList.add('active');
        lbl.textContent = tG.btnShowerOn;
        runShowerCycle();
      } else {
        btn.classList.remove('active');
        lbl.textContent = tG.btnShower;
        if (showerInterval) clearTimeout(showerInterval);
      }
    }

    function runShowerCycle() {
      if (!isShowerActive) return;
      const owlPos = bathOwl.getPos();

      // Gotas de água caindo do topo em cascata
      for (let i = 0; i < 6; i++) {
        waterDrops.push(new WaterSplash(owlPos.x + (Math.random() - 0.5) * 90, height * 0.18 + Math.random() * 20, '#67e8f9'));
      }

      // Limpa as espumas gradualmente
      foams.forEach(f => f.wash());
      foams = foams.filter(f => f.life > 0);
      bathOwl.washClean();

      showerInterval = setTimeout(runShowerCycle, 80);
    }

    // ==========================================
    // 7. TOQUE & ARRASTE
    // ==========================================
    let isPointerDown = false;

    function handlePointerHit(x, y) {
      initAudio();

      // 1. Tocou no patinho
      if (rubberDuck.hitTest(x, y)) {
        rubberDuck.squeeze();
        return;
      }

      // 2. Tocou na corujinha
      if (bathOwl.hitTest(x, y)) {
        bathOwl.scrub(x, y);
        return;
      }

      // 3. Tocou nas bolhas de sabão
      for (let i = bubbles.length - 1; i >= 0; i--) {
        const b = bubbles[i];
        if (b.hitTest(x, y)) {
          b.pop();
          bubbles.splice(i, 1);
          return;
        }
      }

      // 4. Tocou na água ou ar: cria bolhas
      bubbles.push(new SoapBubble(x, y, Math.random() * 16 + 22));
      playBubblePopSound();
    }

    function handlePointerDrag(x, y) {
      // Se esfregar perto da corujinha, ensaboa!
      if (bathOwl.hitTest(x, y)) {
        bathOwl.scrub(x, y);
      } else {
        // Gera bolhas flutuantes com o dedo
        if (Math.random() > 0.6) {
          bubbles.push(new SoapBubble(x, y, Math.random() * 12 + 18));
        }
      }
    }

    window.addEventListener('pointerdown', e => { isPointerDown = true; handlePointerHit(e.clientX, e.clientY); });
    window.addEventListener('pointermove', e => { if (isPointerDown) handlePointerDrag(e.clientX, e.clientY); });
    window.addEventListener('pointerup', () => { isPointerDown = false; });
    window.addEventListener('pointercancel', () => { isPointerDown = false; });

    // Multitouch nativo
    window.addEventListener('touchstart', e => {
      e.preventDefault();
      for (let i = 0; i < e.touches.length; i++) {
        handlePointerHit(e.touches[i].clientX, e.touches[i].clientY);
      }
    }, { passive: false });

    window.addEventListener('touchmove', e => {
      e.preventDefault();
      for (let i = 0; i < e.touches.length; i++) {
        handlePointerDrag(e.touches[i].clientX, e.touches[i].clientY);
      }
    }, { passive: false });

    // ==========================================
    // 8. LOOP DE ANIMAÇÃO GRÁFICA
    // ==========================================
    let bubbleSpawnTimer = 0;

    function gameLoop() {
      ctx.clearRect(0, 0, width, height);

      // Fundo Banheiro Encantado
      const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
      bgGrad.addColorStop(0, '#0a2540');
      bgGrad.addColorStop(0.5, '#133966');
      bgGrad.addColorStop(1, '#1b4d8a');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, width, height);

      // Chuveiro no topo
      const owlPos = bathOwl.getPos();
      ctx.fillStyle = '#94a3b8';
      ctx.fillRect(owlPos.x - 4, 0, 8, height * 0.18);
      // Cabeça do chuveiro
      ctx.fillStyle = '#cbd5e1';
      ctx.beginPath();
      ctx.ellipse(owlPos.x, height * 0.18, 38, 14, 0, 0, Math.PI * 2);
      ctx.fill();

      // Banheira Branca com Pezinhos
      const tubX = width * 0.5;
      const tubY = height * 0.68;
      const tubW = Math.min(width * 0.88, 520);
      const tubH = 120;

      // Pezinhos dourados da banheira
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.arc(tubX - tubW * 0.38, tubY + tubH * 0.45, 14, 0, Math.PI * 2);
      ctx.arc(tubX + tubW * 0.38, tubY + tubH * 0.45, 14, 0, Math.PI * 2);
      ctx.fill();

      // Corpo da Banheira (Atrás da água)
      ctx.fillStyle = '#e2e8f0';
      ctx.beginPath();
      ctx.ellipse(tubX, tubY, tubW * 0.5, tubH * 0.55, 0, 0, Math.PI);
      ctx.fill();

      // Corujinha na Banheira
      bathOwl.update();
      bathOwl.draw(ctx);

      // Patinho de borracha
      rubberDuck.update();
      rubberDuck.draw(ctx);

      // Água com reflexos quentinhos
      const waterGrad = ctx.createLinearGradient(0, tubY - 20, 0, tubY + tubH * 0.35);
      waterGrad.addColorStop(0, 'rgba(56, 189, 248, 0.7)');
      waterGrad.addColorStop(1, 'rgba(2, 132, 199, 0.85)');
      ctx.fillStyle = waterGrad;
      ctx.beginPath();
      ctx.ellipse(tubX, tubY - 10, tubW * 0.46, tubH * 0.35, 0, 0, Math.PI);
      ctx.fill();

      // Borda frontal da banheira
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 14;
      ctx.beginPath();
      ctx.ellipse(tubX, tubY - 15, tubW * 0.48, tubH * 0.25, 0, 0, Math.PI * 2);
      ctx.stroke();

      // Desenha e atualiza as espumas
      for (const f of foams) {
        f.update();
        f.draw(ctx);
      }

      // Gotas do chuveiro
      for (let i = waterDrops.length - 1; i >= 0; i--) {
        const d = waterDrops[i];
        d.update();
        if (d.life <= 0) {
          waterDrops.splice(i, 1);
        } else {
          d.draw(ctx);
        }
      }

      // Bolhas de sabão subindo
      bubbleSpawnTimer++;
      if (bubbleSpawnTimer % 45 === 0 && bubbles.length < 24) {
        bubbles.push(new SoapBubble());
      }

      for (let i = bubbles.length - 1; i >= 0; i--) {
        const b = bubbles[i];
        b.update();
        b.draw(ctx);
        if (b.y + b.radius < -20) {
          bubbles.splice(i, 1);
        }
      }

      requestAnimationFrame(gameLoop);
    }
    requestAnimationFrame(gameLoop);

    // ==========================================
    // 9. KRUUJ SDK & LOADER
    // ==========================================
    const KruujLoader = (() => {
      const $ = id => document.getElementById(id);
      let target = 0, shown = 0, cfg = {}, t0 = 0, raf = null, tipTimer = null, finished = false, closing = false;
      const wait = ms => new Promise(r => setTimeout(r, ms));
      function frame() {
        if (!cfg.manual && !finished) target = Math.min(0.9, target + 0.004 * (1 - target) + 0.0015);
        shown += (target - shown) * 0.08;
        if (finished && target - shown < 0.002) shown = target;
        const pc = Math.round(shown * 100);
        if ($('kl-fill')) $('kl-fill').style.width = pc + '%';
        if ($('kl-rider')) $('kl-rider').style.left = pc + '%';
        if ($('kl-pct')) $('kl-pct').textContent = pc + '%';
        if (shown >= 1 && performance.now() - t0 >= cfg.minTime) return close();
        raf = requestAnimationFrame(frame);
      }
      async function close() {
        if (closing) return; closing = true; clearInterval(tipTimer);
        const kl = $('kl');
        if (kl) {
          kl.classList.add('out');
          await wait(650);
          kl.style.display = 'none';
        }
        if (cfg.onComplete) cfg.onComplete();
      }
      async function start(c) {
        cfg = { gameName: 'KRUUJ Banho da Corujinha', tagline: '', tips: [], splash: 1800, minTime: 2600, manual: false, onComplete() {}, ...c };
        target = shown = 0; finished = closing = false;
        const kl = $('kl');
        if (!kl) return;
        kl.style.display = ''; kl.classList.remove('out');
        const [sp, ld] = kl.querySelectorAll('.ph');
        if (sp) sp.classList.remove('off');
        if (ld) ld.classList.add('off');
        $('kl-name').textContent = cfg.gameName;
        $('kl-tag').textContent = cfg.tagline;
        document.title = cfg.gameName + ' – Kruuj Studio';
        await wait(cfg.splash);
        if (sp) sp.classList.add('off');
        await wait(400);
        if (ld) ld.classList.remove('off');
        t0 = performance.now();
        let i = 0;
        const tip = $('kl-tip');
        const nextTip = () => {
          if (!tip) return;
          tip.style.opacity = '0';
          setTimeout(() => {
            tip.textContent = cfg.tips[i++ % cfg.tips.length] || '';
            tip.style.opacity = '0.85';
          }, 350);
        };
        if (cfg.tips.length) { nextTip(); tipTimer = setInterval(nextTip, 3000); }
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(frame);
      }
      return {
        start,
        finish() { finished = true; target = 1; }
      };
    })();

    window.addEventListener('DOMContentLoaded', () => {
      // Inicia KruujSDK
      if (window.KruujSDK) {
        window.KruujSDK.init().then(() => {
          window.KruujSDK.gameLoadingFinished();
          window.KruujSDK.gameplayStart();
        }).catch(() => {});
      }

      // Aplica i18n
      document.getElementById('showerLabel').textContent = tG.btnShower;

      // Executa loader apenas standalone
      if (window.self === window.top) {
        KruujLoader.start({
          gameName: tG.title,
          tagline: tG.tagline,
          tips: tG.tips,
          splash: 1800,
          minTime: 2600
        });
        setTimeout(() => KruujLoader.finish(), 2400);
      }
    });
  </script>
