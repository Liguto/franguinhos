    if (kl) {
      kl.classList.add('out');
      kl.style.display = 'none';
      kl.style.pointerEvents = 'none';
    }

      try { window.KruujSDK.gameLoadingFinished(); } catch(e){}
    }
  } else {
    try {
      if (typeof KruujLoader !== 'undefined') {
        KruujLoader.start({
          gameName: 'KRUUJ OVERDRIVE',
          tagline: (typeof tD !== 'undefined' && tD.tagline ? tD.tagline : (typeof tG !== 'undefined' && tG.tagline ? tG.tagline : 'Prepare os fones, a coruja já está chegando.')),

          splash: 2000,
          minTime: 2400,
          onComplete: () => {
            if (kl) {
              kl.classList.add('out');
              kl.style.display = 'none';
              kl.style.pointerEvents = 'none';
            }
            try { window.parent.postMessage({ type: 'game_loaded', gameSlug: 'kruuj-overdrive' }, '*'); } catch(e){}
            if (window.KruujSDK && typeof window.KruujSDK.gameLoadingFinished === 'function') {
              try { window.KruujSDK.gameLoadingFinished(); } catch(e){}
            }
          }
        });
        setTimeout(() => {
          if (typeof KruujLoader !== 'undefined' && KruujLoader.finish) KruujLoader.finish();
          setTimeout(() => {
            if (kl) {
              kl.classList.add('out');
              kl.style.display = 'none';
              kl.style.pointerEvents = 'none';
            }
          }, 500);
        }, 2400);
      } else {
        if (kl) {
          kl.classList.add('out');
          kl.style.display = 'none';
          kl.style.pointerEvents = 'none';
        }
        try { window.parent.postMessage({ type: 'game_loaded', gameSlug: 'kruuj-overdrive' }, '*'); } catch(e){}
      }
    } catch(e) {
      if (kl) {
        kl.classList.add('out');
        kl.style.display = 'none';
        kl.style.pointerEvents = 'none';
      }
      try { window.parent.postMessage({ type: 'game_loaded', gameSlug: 'kruuj-overdrive' }, '*'); } catch(err){}
    }
  }
});

function inst(geo,mat,list){const m=new THREE.InstancedMesh(geo,mat,list.length),d=new THREE.Object3D();m.frustumCulled=false;
  list.forEach((e,i)=>{d.position.set(e[0],e[1],e[2]);d.rotation.set(0,e[3],0);d.scale.set(e[4],e[5],e[6]);d.updateMatrix();m.setMatrixAt(i,d.matrix);});trackG.add(m);return m;}
const LM=(c,o)=>new THREE.MeshLambertMaterial(Object.assign({color:c},o||{})),BM=c=>new THREE.MeshBasicMaterial({color:c});
function ribbon(a,b,y,colorFn){
  const pos=[],col=[];
  for(let i=0;i<S;i++){const j=(i+1)%S,c=colorFn(i);if(!c)continue;
    const A=P[i],B=P[j],ra=R[i],rb=R[j];
    for(const [p,r,o] of [[A,ra,a],[A,ra,b],[B,rb,a],[B,rb,a],[A,ra,b],[B,rb,b]]){pos.push(p.x+r.x*o,p.y+y,p.z+r.z*o);col.push(c[0],c[1],c[2]);}}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.DoubleSide}));trackG.add(m);return m;}

  const tl=[];sideSpots(7,3,3,4).forEach(q=>{const sc=0.75+Math.random()*0.35,r=Math.random()*6.28;tl.push([q[1],q[3],q[2],r,sc,sc,sc]);TREES.push([q[1],q[2],r,sc]);});
  inst(trunkG,LM(0x9a5a1c),tl);inst(merge(fr),LM(0x3d8f2c,{side:THREE.DoubleSide}),tl);}

  for(let i=0;i<46;i++){const a=Math.random()*6.28,r=700+Math.random()*500,h=18+Math.random()*60,w=14+Math.random()*20,x=Math.cos(a)*r,z=Math.sin(a)*r*0.9;if(th.ocean&&z>380)continue;bl.push([x,0,z,0,w,h,w]);}
  inst(bg,LM(0xb98a78),bl);}
function addCity(c){
  const bg=new THREE.BoxGeometry(1,1,1);bg.translate(0,0.5,0);
  const B=c.cols.map(()=>[]),N=c.neon.map(()=>[]);
  for(let i=2;i<S;i+=5)for(const sd of[-1,1]){const o=sd*(HW+CW+32+Math.random()*50),x=P[i].x+R[i].x*o,z=P[i].z+R[i].z*o,w=14+Math.random()*18,h=25+Math.random()*85;
    B[(Math.random()*4)|0].push([x,P[i].y*0,z,ANG[i],w,h,w]);
    const ph=3+Math.random()*5;N[(Math.random()*4)|0].push([x-R[i].x*sd*(w/2+0.2),h*(0.25+Math.random()*0.5),z-R[i].z*sd*(w/2+0.2),ANG[i],0.4,ph,w*0.8]);}
  B.forEach((l,k)=>l.length&&inst(bg,LM(c.cols[k]),l));N.forEach((l,k)=>l.length&&inst(bg,BM(c.neon[k]),l));
  const pg=new THREE.CylinderGeometry(0.15,0.2,9,5);pg.translate(0,4.5,0);const hg=new THREE.BoxGeometry(1.6,0.4,0.6);hg.translate(0,9.2,0);
  const ll=[];for(let i=3;i<S;i+=10)for(const sd of[-1,1]){const o=sd*(HW+CW+2.5);ll.push([P[i].x+R[i].x*o,P[i].y,P[i].z+R[i].z*o,ANG[i],1,1,1]);TREES.push([P[i].x+R[i].x*o,P[i].z+R[i].z*o,0,0.45]);}
  inst(pg,LM(0x555a78),ll);inst(hg,BM(c.lamp),ll);}
function addPines(){
  const tg=new THREE.CylinderGeometry(0.3,0.4,5,5);tg.translate(0,2.5,0);
  const c1=new THREE.ConeGeometry(3.2,7,7);c1.translate(0,8.5,0);const c2=new THREE.ConeGeometry(2.4,6,7);c2.translate(0,12.8,0);

  inst(tg,LM(0x6a4a2a),pl);inst(merge([c1,c2]),LM(0x2d6a3a,{flatShading:true}),pl);}
function addMountains(){
  const mg=new THREE.ConeGeometry(1,1,7);mg.translate(0,0.5,0);const ml=[],cl=[];
  for(let i=0;i<14;i++){const a=Math.random()*6.28,r=650+Math.random()*700,rad=120+Math.random()*140,h=150+Math.random()*190,x=Math.cos(a)*r,z=Math.sin(a)*r;
