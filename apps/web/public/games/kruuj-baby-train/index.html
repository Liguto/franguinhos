<!DOCTYPE html>

  <script>
    // Suprime KruujLoader interno se carregado dentro do Portal iframe

    // Suporte a i18n em PT, EN, ES (Default em inglês, com adaptação completa para PT se lang=pt)
    const URL_LANG = (new URLSearchParams(window.location.search).get('lang') || 'en').toLowerCase();

    const I18N = {

    const tG = IS_PT ? I18N.pt : (IS_ES ? I18N.es : I18N.en);

  <style>
    :root {
      --bg-top: #0a133b;
      --bg-bottom: #1e1d52;
      --purple: #8338fc;
      --blue: #289afd;
      --orange: #fda41d;
      --pink: #ff65a6;
      --yellow: #ffd043;
      --green: #4ade80;
      --lav: #d8d4fd;
      --white: #ffffff;
      --navy: #151c4a;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 30%, var(--bg-top), var(--bg-bottom));
      color: var(--white);
      font-family: 'Baloo 2', system-ui, sans-serif;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    /* HUD Superior — Desvio Poki de 68px no mobile obrigatório */
    .hud {
      position: fixed;
      top: 14px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
      gap: 8px;
    }

    @media (max-width: 768px) {
      .hud {
        padding-left: 68px !important;
      }
    }

    .hud-group {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }

    .hud-btn {
      background: rgba(21, 28, 74, 0.9);
      border: 2px solid rgba(131, 56, 252, 0.5);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: var(--white);
      font-family: 'Baloo 2', system-ui, sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 8px 18px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      transition: all 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }

    .hud-btn:hover {
      transform: scale(1.05);
      border-color: var(--yellow);
    }

    .hud-btn:active {
      transform: scale(0.95);
    }

    .hud-badge {
      background: rgba(21, 28, 74, 0.9);
      border: 2px solid rgba(255, 208, 67, 0.5);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 9999px;
      padding: 7px 16px;
      font-size: 0.95rem;
      font-weight: 800;
      color: #ffd043;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }

    /* Pílula de Afeto / Toast */
    .toast-pill {
      position: fixed;
      top: 75px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(255, 255, 255, 0.96);
      color: #3b1464;
      font-size: 1.2rem;
      font-weight: 800;
      padding: 8px 24px;
      border-radius: 9999px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
      pointer-events: none;
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      z-index: 20;
    }

    .toast-pill.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ===== KRUUJ LOADER OFICIAL ===== */
    #kl {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: radial-gradient(ellipse at 50% 40%, #101a52 0%, var(--bg-top) 65%);
      display: grid;
      place-items: center;
      padding: env(safe-area-inset-top, 0) 24px env(safe-area-inset-bottom, 0);
      transition: opacity 0.6s ease, visibility 0.6s;
    }
    #kl.out { opacity: 0; visibility: hidden; }
    #kl .ph { grid-area: 1/1; display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 440px; transition: opacity 0.5s ease; }
    #kl .ph.off { opacity: 0; pointer-events: none; }
    .splash .owl { width: min(34vw, 150px); aspect-ratio: 1; border-radius: 50%; animation: pop 0.9s cubic-bezier(.2,1.3,.4,1) both, glow 2.4s ease-in-out 0.9s infinite; }
    .splash .logo { width: min(54vw, 240px); height: auto; margin-top: 20px; animation: rise 0.8s ease 0.7s both; }
    .splash .sub { margin: 8px 0 0; font-weight: 600; font-size: 0.85rem; letter-spacing: 0.38em; padding-left: 0.38em; color: var(--lav); animation: rise 0.8s ease 1.1s both; }
    .load { text-align: center; }
    .load h1 { margin: 0; font-weight: 800; font-size: clamp(1.8rem, 7vw, 2.8rem); line-height: 1.1; letter-spacing: -0.01em; color: #fff; }
    .load .tag { margin: 12px 0 0; color: var(--lav); font-size: 1.05rem; }
    .track { position: relative; width: 100%; height: 10px; margin: 48px 0 0; border-radius: 99px; background: var(--navy); }
    .fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--purple), var(--blue)); }
    .rider { position: absolute; top: 50%; left: 0; width: 48px; aspect-ratio: 1; margin: -24px 0 0 -24px; border-radius: 50%; box-shadow: 0 0 0 3px var(--bg-top), 0 0 0 5px var(--orange); }
    .pct { margin-top: 26px; font-weight: 600; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
    .tip { min-height: 1.5em; margin: 10px 0 0; color: var(--lav); opacity: 0.85; font-size: 0.95rem; transition: opacity 0.4s; }
    .brand { position: absolute; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); font-size: 0.8rem; color: var(--lav); opacity: 0.6; }
    @keyframes pop { from { transform: scale(0.4); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes glow { 0%, 100% { box-shadow: 0 0 30px 2px #8338fc55; } 50% { box-shadow: 0 0 64px 10px #8338fc99; } }
  </style>
</head>

<body>
  <!-- KruujLoader Oficial -->
  <div id="kl" role="status" aria-live="polite" aria-label="Carregando">
    <div class="ph splash">
      <img class="owl" alt="KRUUJ" src="/kruuj-avatar.png" onerror="this.src='/kruuj-mascote.png'">
      <img class="logo" alt="Kruuj" src="/kruuj-logo.png" onerror="this.style.display='none'">
      <p class="sub">STUDIO</p>
    </div>
    <div class="ph load off">
      <h1 id="kl-name">KRUUJ Trenzinho das Estrelas</h1>
      <p class="tag" id="kl-tag">Passeio mágico de trem com bichinhos e balões.</p>
      <div class="track">
        <div class="fill" id="kl-fill"></div>
        <img class="rider" id="kl-rider" alt="" src="/kruuj-avatar.png">
      </div>
      <div class="pct" id="kl-pct">0%</div>
      <p class="tip" id="kl-tip"></p>
    </div>
    <div class="brand" id="kl-brand">Kruuj Studio</div>
  </div>

  <!-- HUD do Jogo -->
  <header class="hud">
    <div class="hud-group">
      <button class="hud-btn" id="btnWhistle" onclick="blowWhistle()">
        <span id="whistleLabel">Apito 🚂</span>
      </button>
      <button class="hud-btn" id="btnTrack" onclick="toggleTrainAltitude()">
        <span id="trackLabel">Subir ao Céu ✨</span>
      </button>
    </div>
    <div class="hud-group">
      <div class="hud-badge" id="starBadge">
        <span>⭐</span>
        <span id="starScore">0</span>
      </div>
    </div>
  </header>

  <!-- Pílula Flutuante -->
  <div class="toast-pill" id="toastPill">Piuííí! Choo-choo! 🚂</div>

  <!-- Canvas Principal -->
  <canvas id="gameCanvas"></canvas>

  <script>
    // ==========================================
    // 1. ÁUDIO SINTÉTICO (WEBAUDIO & WEBSPEECH)
    // ==========================================
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Voz Amigável via Web Speech API
    let lastSpokenTime = 0;
    function speakText(text) {
      const now = Date.now();
      if (now - lastSpokenTime < 1600) return;
      lastSpokenTime = now;

      if ('speechSynthesis' in window) {
        try {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(text);
          utter.lang = IS_PT ? 'pt-BR' : (IS_ES ? 'es-ES' : 'en-US');
          utter.rate = 0.95;
          utter.pitch = 1.25;
          window.speechSynthesis.speak(utter);
        } catch (e) {}
      }
    }

    // Apito do Trem Realista ("Toot-toot!")
    function playTrainWhistle() {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      [0, 0.22].forEach(offset => {
        const t = now + offset;
        [440, 554.37, 659.25].forEach(freq => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, t);
          osc.frequency.linearRampToValueAtTime(freq * 1.02, t + 0.12);

          gain.gain.setValueAtTime(0.001, t);
          gain.gain.linearRampToValueAtTime(0.12, t + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.21);
        });
      });
    }

    // Tambor do Ursinho
    function playDrumSound() {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(160, now);
      osc.frequency.exponentialRampToValueAtTime(50, now + 0.18);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.35, now + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.22);
    }

    // Sino Pentatônico Cristalino (Sapinho / Estrelas)
    const BELL_FREQS = [523.25, 659.25, 783.99, 1046.5, 1174.66, 1318.51];
    function playBellSound(idx = null) {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const freq = idx !== null ? BELL_FREQS[idx % BELL_FREQS.length] : BELL_FREQS[Math.floor(Math.random() * BELL_FREQS.length)];

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.3, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.46);
    }

    // Chocalho do Coelhinho ("Shhk-shhk")
    function playShakerSound() {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      [0, 0.08].forEach(offset => {
        const t = now + offset;
        const osc = audioCtx.createOscillator();
        const filter = audioCtx.createBiquadFilter();
        const gain = audioCtx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(2400 + Math.random() * 400, t);
        filter.type = 'highpass';
        filter.frequency.setValueAtTime(2000, t);

        gain.gain.setValueAtTime(0.001, t);
        gain.gain.linearRampToValueAtTime(0.18, t + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.06);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.07);
      });
    }

    // Som de Chugga-Chugga do Trem em Movimento
    let lastChug = 0;
    function playChugSound() {
      initAudio();
      if (!audioCtx) return;
      const now = performance.now();
      if (now - lastChug < 380) return;
      lastChug = now;

      const actxNow = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(110, actxNow);
      osc.frequency.exponentialRampToValueAtTime(55, actxNow + 0.08);

      gain.gain.setValueAtTime(0.001, actxNow);
      gain.gain.linearRampToValueAtTime(0.08, actxNow + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, actxNow + 0.09);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(actxNow);
      osc.stop(actxNow + 0.1);
    }

    // Harpa de Flores Brotandono Chão
    function playFlowerBloomSound() {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      [0, 0.05, 0.1].forEach((offset, idx) => {
        const t = now + offset;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33 * (1 + idx * 0.25), t);

        gain.gain.setValueAtTime(0.001, t);
        gain.gain.linearRampToValueAtTime(0.2, t + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.2);
      });
    }

    // ==========================================
    // 2. CANVAS & RESPONSIVIDADE
    // ==========================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let width = 0;
    let height = 0;
    let starScore = 0;

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    let toastTimer = null;
    function showToast(text) {
      const toast = document.getElementById('toastPill');
      toast.textContent = text;
      toast.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 1600);
    }

    function addScore(pts = 1) {
      starScore += pts;
      document.getElementById('starScore').textContent = starScore;
    }

    // ==========================================
    // 3. ENTIDADES DINÂMICAS
    // ==========================================
    let smokePuffs = [];
    let balloons = [];
    let flowers = [];
    let stars = [];

    class SmokePuff {
      constructor(x, y, shape = 'heart') {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 1.5 - 1.2;
        this.vy = -Math.random() * 2.5 - 1.5;
        this.size = Math.random() * 12 + 14;
        this.color = ['#ff65a6', '#ffd043', '#38bdf8', '#c084fc', '#ffffff'][Math.floor(Math.random() * 5)];
        this.shape = shape;
        this.life = 1.0;
        this.decay = Math.random() * 0.02 + 0.015;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.size += 0.4;
        this.life -= this.decay;
      }
      draw(ctx) {
        if (this.life <= 0) return;
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life * 0.85);
        ctx.fillStyle = this.color;
        ctx.translate(this.x, this.y);

        if (this.shape === 'heart') {
          drawHeart(ctx, 0, 0, this.size);
        } else {
          ctx.beginPath();
          ctx.arc(0, 0, this.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
    }

    class FloatingBalloon {
      constructor(x, y) {
        this.x = x || Math.random() * width;
        this.y = y || height + 30;
        this.radius = Math.random() * 16 + 22;
        this.vy = -Math.random() * 1.2 - 0.9;
        this.wobble = Math.random() * Math.PI * 2;
        this.color = ['#ff65a6', '#ffd043', '#38bdf8', '#8338fc', '#4ade80'][Math.floor(Math.random() * 5)];
      }
      hitTest(px, py) {
        return Math.hypot(px - this.x, py - this.y) < this.radius * 1.35;
      }
      pop() {
        playBellSound();
        addScore(1);
        showToast(tG.balloonPop);
        for (let i = 0; i < 8; i++) {
          smokePuffs.push(new SmokePuff(this.x, this.y, 'heart'));
        }
      }
      update() {
        this.y += this.vy;
        this.wobble += 0.04;
        this.x += Math.sin(this.wobble) * 0.5;
      }
      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);

        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, this.radius);
        ctx.quadraticCurveTo(Math.sin(this.wobble) * 6, this.radius + 18, 0, this.radius + 32);
        ctx.stroke();

        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.ellipse(0, 0, this.radius, this.radius * 1.2, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
        ctx.beginPath();
        ctx.ellipse(-this.radius * 0.35, -this.radius * 0.45, this.radius * 0.22, this.radius * 0.12, -0.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    class SproutFlower {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.scale = 0.1;
        this.targetScale = 1.0;
        this.color = ['#ff65a6', '#ffd043', '#a78bfa', '#38bdf8', '#fb923c'][Math.floor(Math.random() * 5)];
        this.life = 1.0;
      }
      update() {
        this.scale += (this.targetScale - this.scale) * 0.15;
      }
      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.scale(this.scale, this.scale);

        // Pétalas
        ctx.fillStyle = this.color;
        for (let i = 0; i < 5; i++) {
          const a = (i / 5) * Math.PI * 2;
          ctx.beginPath();
          ctx.arc(Math.cos(a) * 11, Math.sin(a) * 11, 7, 0, Math.PI * 2);
          ctx.fill();
        }

        // Miolo sorridente
        ctx.fillStyle = '#ffd043';
        ctx.beginPath();
        ctx.arc(0, 0, 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    function drawHeart(ctx, x, y, size) {
      ctx.beginPath();
      const topCurveHeight = size * 0.3;
      ctx.moveTo(x, y + topCurveHeight);
      ctx.bezierCurveTo(x, y, x - size / 2, y, x - size / 2, y + topCurveHeight);
      ctx.bezierCurveTo(x - size / 2, y + (size + topCurveHeight) / 2, x, y + (size + topCurveHeight) / 2, x, y + size);
      ctx.bezierCurveTo(x, y + (size + topCurveHeight) / 2, x + size / 2, y + (size + topCurveHeight) / 2, x + size / 2, y + topCurveHeight);
      ctx.bezierCurveTo(x + size / 2, y, x, y, x, y + topCurveHeight);
      ctx.fill();
    }

    // ==========================================
    // 4. TREM DAS ESTRELAS COM ALTITUDE DINÂMICA
    // ==========================================
    class BabyStarTrain {
      constructor() {
        this.x = 80;
        this.speed = 1.8;
        this.wheelRot = 0;
        this.wobble = 0;

        // Altitude Dinâmica: pode subir para o céu ou descer para a terra
        this.targetAltitude = 0.70; // 0.30 = Céu das estrelas, 0.70 = Colinas
        this.currentAltitude = 0.70;

        // Vagões com bichinhos e instrumentos musicais
        this.cars = [
          { type: 'bear', label: 'bearHello', voice: 'voiceBear', soundFn: playDrumSound, jump: 0 },
          { type: 'bunny', label: 'bunnyHop', voice: 'voiceBunny', soundFn: playShakerSound, jump: 0 },
          { type: 'frog', label: 'frogCroak', voice: null, soundFn: () => playBellSound(3), jump: 0 },
          { type: 'gift', label: 'giftSurprise', voice: null, soundFn: () => playBellSound(0), jump: 0 }
        ];
      }

      setAltitude(ratio) {
        this.targetAltitude = ratio;
        if (ratio < 0.45) {
          showToast(tG.skyTrack);
          speakText(tG.voiceSky);
          document.getElementById('trackLabel').textContent = tG.btnTrackGround;
        } else {
          showToast(tG.groundTrack);
          speakText(tG.voiceGround);
          document.getElementById('trackLabel').textContent = tG.btnTrack;
        }
      }

      whistle() {
        playTrainWhistle();
        showToast(tG.whistleToast);
        speakText(tG.voiceWhistle);
        addScore(3);

        for (let i = 0; i < 7; i++) {
          setTimeout(() => {
            const chimneyX = (this.x + 220) % (width + 600) - 100;
            const chimneyY = this.getY(chimneyX) - 88;
            smokePuffs.push(new SmokePuff(chimneyX, chimneyY, Math.random() > 0.4 ? 'heart' : 'circle'));
          }, i * 80);
        }
      }

      tapCar(idx) {
        const car = this.cars[idx];
        car.soundFn();
        showToast(tG[car.label]);
        if (car.voice) speakText(tG[car.voice]);
        addScore(2);

        car.jump = 28;
        setTimeout(() => { car.jump = 0; }, 260);

        const carX = (this.x + 220 - (idx + 1) * 115) % (width + 600) - 100;
        const carY = this.getY(carX);
        for (let i = 0; i < 6; i++) {
          smokePuffs.push(new SmokePuff(carX, carY - 40, 'heart'));
        }
      }

      getY(trainX) {
        // Traçado suave sobre colina ou arco-íris
        const baseY = height * this.currentAltitude;
        return baseY + Math.sin(trainX * 0.005) * 16;
      }

      update() {
        this.x += this.speed;
        this.wheelRot += this.speed * 0.06;
        this.wobble += 0.08;

        // Deslocamento suave de altitude
        this.currentAltitude += (this.targetAltitude - this.currentAltitude) * 0.03;

        playChugSound();

        // Fumaça periódica
        if (Math.random() < 0.1) {
          const chimneyX = (this.x + 220) % (width + 600) - 100;
          const chimneyY = this.getY(chimneyX) - 88;
          smokePuffs.push(new SmokePuff(chimneyX, chimneyY, 'circle'));
        }
      }

      hitTest(px, py) {
        // Locomotiva
        const locoX = (this.x + 220) % (width + 600) - 100;
        const locoY = this.getY(locoX);
        if (Math.hypot(px - locoX, py - (locoY - 40)) < 70) {
          this.whistle();
          return true;
        }

        // Vagões
        for (let i = 0; i < this.cars.length; i++) {
          const carX = (this.x + 220 - (i + 1) * 115) % (width + 600) - 100;
          const carY = this.getY(carX);
          if (Math.hypot(px - carX, py - (carY - 30)) < 50) {
            this.tapCar(i);
            return true;
          }
        }
        return false;
      }

      draw(ctx) {
        // Desenha os trilhos mágicos
        this.drawTracks(ctx);

        // Vagões
        for (let i = this.cars.length - 1; i >= 0; i--) {
          const car = this.cars[i];
          const carX = (this.x + 220 - (i + 1) * 115) % (width + 600) - 100;
          const carY = this.getY(carX);
          this.drawCar(ctx, carX, carY, car, i);
        }

        // Locomotiva com a Corujinha Maquinista
        const locoX = (this.x + 220) % (width + 600) - 100;
        const locoY = this.getY(locoX);
        this.drawLocomotive(ctx, locoX, locoY);
      }

      drawTracks(ctx) {
        ctx.save();
        const isSky = this.currentAltitude < 0.5;

        // Linha dos trilhos
        ctx.strokeStyle = isSky ? 'rgba(56, 189, 248, 0.8)' : '#fbbf24';
        ctx.lineWidth = 6;
        ctx.beginPath();
        for (let x = 0; x <= width; x += 30) {
          const y = this.getY(x) + 16;
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();

        // Travessas de madeira / estrelas
        ctx.strokeStyle = isSky ? '#ffd043' : '#b45309';
        ctx.lineWidth = 4;
        for (let x = 0; x <= width; x += 38) {
          const y = this.getY(x) + 16;
          ctx.beginPath();
          ctx.moveTo(x, y - 8);
          ctx.lineTo(x, y + 8);
          ctx.stroke();
        }
        ctx.restore();
      }

      drawLocomotive(ctx, x, y) {
        ctx.save();
        ctx.translate(x, y);

        // Corpo
        ctx.fillStyle = '#8338fc';
        ctx.beginPath();
        ctx.roundRect(-45, -60, 90, 50, 10);
        ctx.fill();

        // Chaminé com anel dourado
        ctx.fillStyle = '#ffd043';
        ctx.fillRect(-35, -88, 20, 28);
        ctx.beginPath();
        ctx.ellipse(-25, -88, 14, 5, 0, 0, Math.PI * 2);
        ctx.fill();

        // Cabine do Maquinista
        ctx.fillStyle = '#6a28d6';
        ctx.beginPath();
        ctx.roundRect(5, -80, 50, 70, 8);
        ctx.fill();

        // Janelinha
        ctx.fillStyle = '#fef08a';
        ctx.beginPath();
        ctx.roundRect(14, -72, 32, 28, 6);
        ctx.fill();

        // Corujinha Maquinista KRUUJ
        ctx.fillStyle = '#8338fc';
        ctx.beginPath();
        ctx.arc(30, -56, 12, 0, Math.PI * 2);
        ctx.fill();

        // Chapéu azul
        ctx.fillStyle = '#289afd';
        ctx.fillRect(20, -70, 20, 6);
        ctx.beginPath();
        ctx.arc(30, -70, 7, Math.PI, Math.PI * 2);
        ctx.fill();

        // Biquinho
        ctx.fillStyle = '#ffd043';
        ctx.beginPath();
        ctx.moveTo(28, -54); ctx.lineTo(32, -54); ctx.lineTo(30, -50); ctx.fill();

        // Farol brilhante
        ctx.fillStyle = '#fef08a';
        ctx.beginPath();
        ctx.arc(-45, -35, 10, 0, Math.PI * 2);
        ctx.fill();

        // Rodas
        this.drawWheel(ctx, -26, 4, 18);
        this.drawWheel(ctx, 24, 4, 22);

        ctx.restore();
      }

      drawCar(ctx, x, y, car, idx) {
        ctx.save();
        ctx.translate(x, y);

        const colors = ['#289afd', '#ff65a6', '#4ade80', '#fb923c'];
        const carColor = colors[idx % colors.length];
        const jumpY = -car.jump;

        if (car.type === 'bear') {
          // Ursinho com Tambor
          ctx.fillStyle = '#b45309';
          ctx.beginPath();
          ctx.arc(0, -42 + jumpY, 16, 0, Math.PI * 2);
          ctx.arc(-14, -54 + jumpY, 6, 0, Math.PI * 2);
          ctx.arc(14, -54 + jumpY, 6, 0, Math.PI * 2);
          ctx.fill();

          // Tamborzinho na frente
          ctx.fillStyle = '#ef4444';
          ctx.fillRect(-12, -32 + jumpY, 24, 14);
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.ellipse(0, -32 + jumpY, 12, 4, 0, 0, Math.PI * 2);
          ctx.fill();

        } else if (car.type === 'bunny') {
          // Coelhinho com Chocalho
          ctx.fillStyle = '#f8fafc';
          ctx.beginPath();
          ctx.arc(0, -40 + jumpY, 15, 0, Math.PI * 2);
          ctx.ellipse(-6, -58 + jumpY, 4, 14, -0.15, 0, Math.PI * 2);
          ctx.ellipse(6, -58 + jumpY, 4, 14, 0.15, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#ffd043';
          ctx.beginPath();
          ctx.arc(14, -42 + jumpY, 6, 0, Math.PI * 2); // Chocalho
          ctx.fill();

        } else if (car.type === 'frog') {
          // Sapinho com Sino
          ctx.fillStyle = '#4ade80';
          ctx.beginPath();
          ctx.arc(-10, -50 + jumpY, 8, 0, Math.PI * 2);
          ctx.arc(10, -50 + jumpY, 8, 0, Math.PI * 2);
          ctx.arc(0, -38 + jumpY, 15, 0, Math.PI * 2);
          ctx.fill();

          // Sininho dourado
          ctx.fillStyle = '#ffd043';
          ctx.beginPath();
          ctx.arc(0, -30 + jumpY, 7, 0, Math.PI);
          ctx.fill();

        } else {
          // Caixa de presente
          ctx.fillStyle = '#ffd043';
          ctx.fillRect(-16, -52 + jumpY, 32, 28);
          ctx.fillStyle = '#ff65a6';
          ctx.fillRect(-4, -52 + jumpY, 8, 28);
          ctx.beginPath();
          ctx.arc(-6, -56 + jumpY, 6, 0, Math.PI * 2);
          ctx.arc(6, -56 + jumpY, 6, 0, Math.PI * 2);
          ctx.fill();
        }

        // Corpo do vagão
        ctx.fillStyle = carColor;
        ctx.beginPath();
        ctx.roundRect(-40, -32, 80, 36, 8);
        ctx.fill();

        // Rodas do vagão
        this.drawWheel(ctx, -24, 6, 14);
        this.drawWheel(ctx, 24, 6, 14);

        // Engate
        ctx.fillStyle = '#94a3b8';
        ctx.fillRect(40, -14, 25, 6);

        ctx.restore();
      }

      drawWheel(ctx, cx, cy, r) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(this.wheelRot);

        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, r - 3, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = '#ffd043';
        ctx.beginPath();
        ctx.arc(0, 0, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    const train = new BabyStarTrain();

    // ==========================================
    // 5. TOQUE & INTERAÇÃO DO JOGO
    // ==========================================
    function blowWhistle() {
      train.whistle();
    }

    function toggleTrainAltitude() {
      if (train.targetAltitude > 0.5) {
        train.setAltitude(0.32); // Sobe ao céu
      } else {
        train.setAltitude(0.70); // Desce à terra
      }
    }

    function handlePointerHit(x, y) {
      initAudio();

      // 1. Tocou no trem ou vagões?
      if (train.hitTest(x, y)) {
        return;
      }

      // 2. Tocou em balão flutuante?
      for (let i = balloons.length - 1; i >= 0; i--) {
        const b = balloons[i];
        if (b.hitTest(x, y)) {
          b.pop();
          balloons.splice(i, 1);
          return;
        }
      }

      // 3. Tocou no topo/céu -> Muda o trem para o céu e cria estrela/balão
      if (y < height * 0.45) {
        train.setAltitude(0.32);
        balloons.push(new FloatingBalloon(x, y));
        playBellSound();
      } else {
        // 4. Tocou embaixo/terra -> Muda o trem para a colina e brota florzinha mágica!
        train.setAltitude(0.70);
        flowers.push(new SproutFlower(x, y));
        playFlowerBloomSound();
        addScore(1);
      }
    }

    window.addEventListener('pointerdown', e => {
      if (e.clientY > 60) handlePointerHit(e.clientX, e.clientY);
    });

    window.addEventListener('touchstart', e => {
      e.preventDefault();
      for (let i = 0; i < e.touches.length; i++) {
        if (e.touches[i].clientY > 60) {
          handlePointerHit(e.touches[i].clientX, e.touches[i].clientY);
        }
      }
    }, { passive: false });

    // ==========================================
    // 6. LOOP DE ANIMAÇÃO GRÁFICA
    // ==========================================
    let balloonTimer = 0;

    function gameLoop() {
      ctx.clearRect(0, 0, width, height);

      // Fundo Gradiente Cósmico
      const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
      bgGrad.addColorStop(0, '#0a133b');
      bgGrad.addColorStop(0.45, '#1e1d52');
      bgGrad.addColorStop(1, '#1b3b2b');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, width, height);

      // Colina Verde Suave no Chão
      ctx.fillStyle = '#15803d';
      ctx.beginPath();
      ctx.ellipse(width * 0.5, height + 80, width * 0.7, height * 0.35, 0, 0, Math.PI * 2);
      ctx.fill();

      // Flores brotadas
      for (const fl of flowers) {
        fl.update();
        fl.draw(ctx);
      }

      // Balões no céu
      balloonTimer++;
      if (balloonTimer % 110 === 0 && balloons.length < 9) {
        balloons.push(new FloatingBalloon());
      }
      for (let i = balloons.length - 1; i >= 0; i--) {
        const b = balloons[i];
        b.update();
        b.draw(ctx);
        if (b.y + b.radius < -30) balloons.splice(i, 1);
      }

      // O Trem das Estrelas
      train.update();
      train.draw(ctx);

      // Fumaça do apito
      for (let i = smokePuffs.length - 1; i >= 0; i--) {
        const s = smokePuffs[i];
        s.update();
        s.draw(ctx);
        if (s.life <= 0) smokePuffs.splice(i, 1);
      }

      requestAnimationFrame(gameLoop);
    }
    requestAnimationFrame(gameLoop);

    // ==========================================
    // 7. KRUUJ SDK & LOADER
    // ==========================================
    const KruujLoader = (() => {
      const $ = id => document.getElementById(id);
      let target = 0, shown = 0, cfg = {}, t0 = 0, raf = null, tipTimer = null, finished = false, closing = false;
      const wait = ms => new Promise(r => setTimeout(r, ms));
      function frame() {
        if (!cfg.manual && !finished) target = Math.min(0.9, target + 0.004 * (1 - target) + 0.0015);
        shown += (target - shown) * 0.08;
        if (finished && target - shown < 0.002) shown = target;
        const pc = Math.round(shown * 100);
        if ($('kl-fill')) $('kl-fill').style.width = pc + '%';
        if ($('kl-rider')) $('kl-rider').style.left = pc + '%';
        if ($('kl-pct')) $('kl-pct').textContent = pc + '%';
        if (shown >= 1 && performance.now() - t0 >= cfg.minTime) return close();
        raf = requestAnimationFrame(frame);
      }
      async function close() {
        if (closing) return; closing = true; clearInterval(tipTimer);
        const kl = $('kl');
        if (kl) {
          kl.classList.add('out');
          await wait(650);
          kl.style.display = 'none';
        }
        if (cfg.onComplete) cfg.onComplete();
      }
      async function start(c) {
        cfg = { gameName: tG.title, tagline: tG.tagline, tips: tG.tips, splash: 1800, minTime: 2600, manual: false, onComplete() {}, ...c };
        target = shown = 0; finished = closing = false;
        const kl = $('kl');
        if (!kl) return;
        kl.style.display = ''; kl.classList.remove('out');
        const [sp, ld] = kl.querySelectorAll('.ph');
        if (sp) sp.classList.remove('off');
        if (ld) ld.classList.add('off');
        $('kl-name').textContent = cfg.gameName;
        $('kl-tag').textContent = cfg.tagline;
        document.title = cfg.gameName + ' – Kruuj Studio';
        await wait(cfg.splash);
        if (sp) sp.classList.add('off');
        await wait(400);
        if (ld) ld.classList.remove('off');
        t0 = performance.now();
        let i = 0;
        const tip = $('kl-tip');
        const nextTip = () => {
          if (!tip) return;
          tip.style.opacity = '0';
          setTimeout(() => {
            tip.textContent = cfg.tips[i++ % cfg.tips.length] || '';
            tip.style.opacity = '0.85';
          }, 350);
        };
        if (cfg.tips.length) { nextTip(); tipTimer = setInterval(nextTip, 3000); }
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(frame);
      }
      return {
        start,
        finish() { finished = true; target = 1; }
      };
    })();

    window.addEventListener('DOMContentLoaded', () => {
      resize();

      if (window.KruujSDK) {
        window.KruujSDK.init().then(() => {
          window.KruujSDK.gameLoadingFinished();
          window.KruujSDK.gameplayStart();
        }).catch(() => {});
      }

      document.getElementById('whistleLabel').textContent = tG.btnWhistle;
      document.getElementById('trackLabel').textContent = tG.btnTrack;

      if (window.self === window.top) {
        KruujLoader.start({
          gameName: tG.title,
          tagline: tG.tagline,
          tips: tG.tips,
          splash: 1800,
          minTime: 2600
        });
        setTimeout(() => KruujLoader.finish(), 2400);
      }
    });
  </script>
