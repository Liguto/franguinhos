<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>KRUUJ Trenzinho das Estrelas – Baby Train</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <script src="/sdk/v1/kruuj-sdk.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">

  <script>
    // Suprime KruujLoader interno se carregado dentro do Portal iframe
    if (window.self !== window.top) {
      window.addEventListener('DOMContentLoaded', () => {
        const kl = document.getElementById('kl');
        if (kl) kl.style.display = 'none';
      });
    }

    // Suporte a i18n em PT, EN, ES
    const URL_LANG = (new URLSearchParams(window.location.search).get('lang') || 'pt').toLowerCase();
    const I18N = {
      pt: {
        title: 'KRUUJ Trenzinho das Estrelas',
        tagline: 'Passeio mágico de trem! Toque no apito, nos vagões e estoure balões coloridos.',
        btnWhistle: 'Apito 🚂',
        btnSpeed: 'Acelerar ⚡',
        whistleToast: 'Piuííí! Choo-choo! 🚂',
        balloonPop: 'Plop! Balão estourou! 🎈',
        bearHello: 'Ursinho: Olá amiguinho! 🧸',
        giftSurprise: 'Presente Mágico! 🎁',
        bunnyHop: 'Coelhinho saltou! 🐰',
        cheers: ['Muito rápido!', 'Que divertido!', 'Lindo trem!', 'Viva!', 'Tchu-tchu! 💕'],
        tips: [
          'Toque na locomotiva para tocar o apito do trem.',
          'Toque nos vagões para ver passageiros surpresa!',
          'Toque nos balões que sobem no céu para ouvir notas musicais.',
          'Toque no chão para plantar florzinhas mágicas!'
        ]
      },
      en: {
        title: 'KRUUJ Star Train',
        tagline: 'Magical train ride! Blow the whistle, tap cars and pop colorful balloons.',
        btnWhistle: 'Whistle 🚂',
        btnSpeed: 'Faster ⚡',
        whistleToast: 'Toot-toot! Choo-choo! 🚂',
        balloonPop: 'Plop! Balloon pop! 🎈',
        bearHello: 'Teddy Bear: Hello! 🧸',
        giftSurprise: 'Surprise Gift! 🎁',
        bunnyHop: 'Bunny hop! 🐰',
        cheers: ['So fast!', 'So fun!', 'Pretty train!', 'Yay!', 'Choo-choo! 💕'],
        tips: [
          'Tap the locomotive to blow the cheerful whistle.',
          'Tap the carriages to meet surprise passengers!',
          'Tap floating balloons to pop them and hear xylophone notes.',
          'Tap the ground to sprout magical blooming flowers!'
        ]
      },
      es: {
        title: 'KRUUJ Trencito de las Estrellas',
        tagline: '¡Paseo mágico en tren! Toca el silbato, los vagones y explota globos de colores.',
        btnWhistle: 'Silbato 🚂',
        btnSpeed: 'Acelerar ⚡',
        whistleToast: '¡Pi-pííí! ¡Chu-chu! 🚂',
        balloonPop: '¡Plop! ¡Globo explotó! 🎈',
        bearHello: '¡Osito: Hola amiguito! 🧸',
        giftSurprise: '¡Regalo Mágico! 🎁',
        bunnyHop: '¡El conejito saltó! 🐰',
        cheers: ['¡Qué rápido!', '¡Qué divertido!', '¡Lindo tren!', '¡Viva!', '¡Chu-chu! 💕'],
        tips: [
          'Toca la locomotora para hacer sonar el silbato.',
          '¡Toca los vagones para descubrir pasajeros sorpresa!',
          'Toca los globos del cielo para escuchar notas musicales.',
          '¡Toca el pasto para que broten flores brillantes!'
        ]
      }
    };
    const tG = I18N[URL_LANG] || I18N.pt;
  </script>

  <style>
    :root {
      --bg-top: #0a133b;
      --bg-bottom: #1e1d52;
      --purple: #8338fc;
      --blue: #289afd;
      --orange: #fda41d;
      --pink: #ff65a6;
      --yellow: #ffd043;
      --green: #4ade80;
      --lav: #d8d4fd;
      --white: #ffffff;
      --navy: #151c4a;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 30%, var(--bg-top), var(--bg-bottom));
      color: var(--white);
      font-family: 'Baloo 2', system-ui, sans-serif;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    /* HUD Superior de Controles — Recuo Poki obrigatório de 68px no mobile */
    .hud {
      position: fixed;
      top: 14px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
      gap: 8px;
    }

    @media (max-width: 768px) {
      .hud {
        padding-left: 68px !important;
      }
    }

    .hud-group {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }

    .hud-btn {
      background: rgba(21, 28, 74, 0.85);
      border: 2px solid rgba(131, 56, 252, 0.45);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: var(--white);
      font-family: 'Baloo 2', system-ui, sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 8px 18px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      transition: all 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }

    .hud-btn:hover {
      transform: scale(1.05);
      border-color: var(--yellow);
    }

    .hud-btn:active {
      transform: scale(0.95);
    }

    .hud-badge {
      background: rgba(21, 28, 74, 0.85);
      border: 2px solid rgba(255, 208, 67, 0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 9999px;
      padding: 7px 16px;
      font-size: 0.95rem;
      font-weight: 800;
      color: #ffd043;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }

    /* Pílula de Afeto / Toast */
    .toast-pill {
      position: fixed;
      top: 75px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(255, 255, 255, 0.95);
      color: #3b1464;
      font-size: 1.2rem;
      font-weight: 800;
      padding: 8px 24px;
      border-radius: 9999px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
      pointer-events: none;
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      z-index: 20;
    }

    .toast-pill.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ===== KRUUJ LOADER OFICIAL ===== */
    #kl {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: radial-gradient(ellipse at 50% 40%, #101a52 0%, var(--bg-top) 65%);
      display: grid;
      place-items: center;
      padding: env(safe-area-inset-top, 0) 24px env(safe-area-inset-bottom, 0);
      transition: opacity 0.6s ease, visibility 0.6s;
    }
    #kl.out { opacity: 0; visibility: hidden; }
    #kl .ph { grid-area: 1/1; display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 440px; transition: opacity 0.5s ease; }
    #kl .ph.off { opacity: 0; pointer-events: none; }
    .splash .owl { width: min(34vw, 150px); aspect-ratio: 1; border-radius: 50%; animation: pop 0.9s cubic-bezier(.2,1.3,.4,1) both, glow 2.4s ease-in-out 0.9s infinite; }
    .splash .logo { width: min(54vw, 240px); height: auto; margin-top: 20px; animation: rise 0.8s ease 0.7s both; }
    .splash .sub { margin: 8px 0 0; font-weight: 600; font-size: 0.85rem; letter-spacing: 0.38em; padding-left: 0.38em; color: var(--lav); animation: rise 0.8s ease 1.1s both; }
    .load { text-align: center; }
    .load h1 { margin: 0; font-weight: 800; font-size: clamp(1.8rem, 7vw, 2.8rem); line-height: 1.1; letter-spacing: -0.01em; color: #fff; }
    .load .tag { margin: 12px 0 0; color: var(--lav); font-size: 1.05rem; }
    .track { position: relative; width: 100%; height: 10px; margin: 48px 0 0; border-radius: 99px; background: var(--navy); }
    .fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--purple), var(--blue)); }
    .rider { position: absolute; top: 50%; left: 0; width: 48px; aspect-ratio: 1; margin: -24px 0 0 -24px; border-radius: 50%; box-shadow: 0 0 0 3px var(--bg-top), 0 0 0 5px var(--orange); }
    .pct { margin-top: 26px; font-weight: 600; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
    .tip { min-height: 1.5em; margin: 10px 0 0; color: var(--lav); opacity: 0.85; font-size: 0.95rem; transition: opacity 0.4s; }
    .brand { position: absolute; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); font-size: 0.8rem; color: var(--lav); opacity: 0.6; }
    @keyframes pop { from { transform: scale(0.4); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes glow { 0%, 100% { box-shadow: 0 0 30px 2px #8338fc55; } 50% { box-shadow: 0 0 64px 10px #8338fc99; } }
  </style>
</head>

<body>
  <!-- KruujLoader Oficial -->
  <div id="kl" role="status" aria-live="polite" aria-label="Carregando">
    <div class="ph splash">
      <img class="owl" alt="KRUUJ" src="/kruuj-avatar.png" onerror="this.src='/kruuj-mascote.png'">
      <img class="logo" alt="Kruuj" src="/kruuj-logo.png" onerror="this.style.display='none'">
      <p class="sub">STUDIO</p>
    </div>
    <div class="ph load off">
      <h1 id="kl-name">KRUUJ Trenzinho das Estrelas</h1>
      <p class="tag" id="kl-tag">Passeio mágico com a corujinha maquinista.</p>
      <div class="track">
        <div class="fill" id="kl-fill"></div>
        <img class="rider" id="kl-rider" alt="" src="/kruuj-avatar.png">
      </div>
      <div class="pct" id="kl-pct">0%</div>
      <p class="tip" id="kl-tip"></p>
    </div>
    <div class="brand" id="kl-brand">Kruuj Studio</div>
  </div>

  <!-- HUD do Jogo -->
  <header class="hud">
    <div class="hud-group">
      <button class="hud-btn" id="btnWhistle" onclick="triggerWhistle()">
        <span id="whistleLabel">Apito 🚂</span>
      </button>
      <button class="hud-btn" id="btnSpeed" onclick="boostSpeed()">
        <span id="speedLabel">Acelerar ⚡</span>
      </button>
    </div>
    <div class="hud-group">
      <div class="hud-badge" id="starBadge">
        <span>⭐</span>
        <span id="starCount">0</span>
      </div>
    </div>
  </header>

  <!-- Pílula Flutuante -->
  <div class="toast-pill" id="toastPill">Piuííí! Choo-choo! 🚂</div>

  <!-- Canvas Principal -->
  <canvas id="gameCanvas"></canvas>

  <script>
    // ==========================================
    // 1. ÁUDIO SINTÉTICO (WEBAUDIO)
    // ==========================================
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Apito do Trenzinho: Dois tons afinados em harmonia (F5 + A5)
    function playTrainWhistle() {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      const freqs = [698.46, 880.00]; // F5 e A5 (acorde maior doce)
      freqs.forEach(f => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(f, now);
        osc.frequency.linearRampToValueAtTime(f * 1.02, now + 0.15);
        osc.frequency.linearRampToValueAtTime(f, now + 0.45);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.22, now + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 0.6);
      });
    }

    // Estouro de Balão com Nota de Xilofone Pentatônica
    const XYLO_FREQS = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];
    function playBalloonPopSound() {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      // Pop agudo
      const osc1 = audioCtx.createOscillator();
      const gain1 = audioCtx.createGain();
      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(450, now);
      osc1.frequency.exponentialRampToValueAtTime(1400, now + 0.06);

      gain1.gain.setValueAtTime(0.001, now);
      gain1.gain.linearRampToValueAtTime(0.28, now + 0.02);
      gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

      osc1.connect(gain1);
      gain1.connect(audioCtx.destination);
      osc1.start(now);
      osc1.stop(now + 0.2);

      // Ressonância de Xilofone
      const freq = XYLO_FREQS[Math.floor(Math.random() * XYLO_FREQS.length)];
      const osc2 = audioCtx.createOscillator();
      const gain2 = audioCtx.createGain();
      osc2.type = 'triangle';
      osc2.frequency.setValueAtTime(freq, now + 0.02);

      gain2.gain.setValueAtTime(0.001, now + 0.02);
      gain2.gain.linearRampToValueAtTime(0.25, now + 0.04);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

      osc2.connect(gain2);
      gain2.connect(audioCtx.destination);
      osc2.start(now + 0.02);
      osc2.stop(now + 0.65);
    }

    // Chugga-chugga rítmico do trem nos trilhos
    let lastChugTime = 0;
    function playChugSound() {
      initAudio();
      if (!audioCtx) return;
      const now = performance.now();
      if (now - lastChugTime < 240) return;
      lastChugTime = now;

      const actxNow = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(160, actxNow);
      osc.frequency.exponentialRampToValueAtTime(80, actxNow + 0.04);

      gain.gain.setValueAtTime(0.001, actxNow);
      gain.gain.linearRampToValueAtTime(0.12, actxNow + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, actxNow + 0.06);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(actxNow);
      osc.stop(actxNow + 0.07);
    }

    // Pulo fofo dos passageiros surpresa
    function playBoingSound() {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.exponentialRampToValueAtTime(840, now + 0.16);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.28, now + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.38);
    }

    // ==========================================
    // 2. CANVAS & RESPONSIVIDADE
    // ==========================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let width = 0;
    let height = 0;
    let starScore = 0;

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    let toastTimer = null;
    function showToast(text) {
      const toast = document.getElementById('toastPill');
      toast.textContent = text;
      toast.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 1500);
    }

    function addScore(pts = 1) {
      starScore += pts;
      document.getElementById('starCount').textContent = starScore;
    }

    // ==========================================
    // 3. FUMAÇA DO APITO & BALÕES
    // ==========================================
    let smokePuffs = [];
    let balloons = [];
    let flowers = [];
    let confetti = [];

    class SmokePuff {
      constructor(x, y, shape = 'heart') {
        this.x = x;
        this.y = y;
        this.shape = shape;
        this.vx = -1.2 + (Math.random() - 0.5) * 0.8;
        this.vy = -Math.random() * 2 - 1.2;
        this.size = Math.random() * 12 + 16;
        this.color = Math.random() > 0.4 ? 'rgba(255, 255, 255, 0.9)' : 'rgba(255, 101, 166, 0.85)';
        this.life = 1.0;
        this.rot = Math.random() * Math.PI;
      }
      hitTest(px, py) {
        return Math.hypot(px - this.x, py - this.y) < this.size * 1.5;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.size += 0.25;
        this.life -= 0.015;
      }
      draw(ctx) {
        if (this.life <= 0) return;
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life * 0.8);
        ctx.fillStyle = this.color;
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rot);

        if (this.shape === 'heart') {
          drawHeart(ctx, 0, 0, this.size);
        } else {
          ctx.beginPath();
          ctx.arc(0, 0, this.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
    }

    class Balloon {
      constructor(x = null, y = null) {
        this.x = x || Math.random() * width;
        this.y = y || height + 40;
        this.radius = Math.random() * 16 + 22;
        const colors = ['#ff65a6', '#ffd043', '#38bdf8', '#4ade80', '#a78bfa', '#fb923c'];
        this.color = colors[Math.floor(Math.random() * colors.length)];
        this.vx = (Math.random() - 0.5) * 0.8;
        this.vy = -Math.random() * 1.5 - 1.0;
        this.wobble = Math.random() * Math.PI * 2;
      }
      hitTest(px, py) {
        return Math.hypot(px - this.x, py - this.y) < this.radius * 1.3;
      }
      pop() {
        playBalloonPopSound();
        showToast(tG.balloonPop);
        addScore(2);
        // Confetes
        for (let i = 0; i < 16; i++) {
          confetti.push(new ConfettiPiece(this.x, this.y, this.color));
        }
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.wobble += 0.035;
        this.x += Math.sin(this.wobble) * 0.4;
      }
      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);

        // Cordão do balão
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(0, this.radius);
        ctx.bezierCurveTo(4, this.radius + 12, -4, this.radius + 24, 2, this.radius + 36);
        ctx.stroke();

        // Balão
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.ellipse(0, 0, this.radius * 0.85, this.radius, 0, 0, Math.PI * 2);
        ctx.fill();

        // Nó do balão
        ctx.beginPath();
        ctx.moveTo(-4, this.radius);
        ctx.lineTo(4, this.radius);
        ctx.lineTo(0, this.radius + 5);
        ctx.closePath();
        ctx.fill();

        // Brilho do balão
        ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
        ctx.beginPath();
        ctx.ellipse(-this.radius * 0.35, -this.radius * 0.35, this.radius * 0.22, this.radius * 0.12, -0.6, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    class ConfettiPiece {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const spd = Math.random() * 5 + 2;
        this.vx = Math.cos(angle) * spd;
        this.vy = Math.sin(angle) * spd - 2;
        this.size = Math.random() * 6 + 4;
        this.life = 1.0;
        this.decay = Math.random() * 0.02 + 0.015;
        this.rot = Math.random() * Math.PI;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.15;
        this.life -= this.decay;
        this.rot += 0.08;
      }
      draw(ctx) {
        if (this.life <= 0) return;
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rot);
        ctx.fillRect(-this.size * 0.5, -this.size * 0.5, this.size, this.size * 1.5);
        ctx.restore();
      }
    }

    class SproutFlower {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.scale = 0.1;
        this.targetScale = 1.0;
        this.color = ['#ff65a6', '#ffd043', '#a78bfa', '#38bdf8'][Math.floor(Math.random() * 4)];
        this.life = 1.0;
      }
      update() {
        this.scale += (this.targetScale - this.scale) * 0.15;
      }
      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.scale(this.scale, this.scale);

        // Pétalas
        ctx.fillStyle = this.color;
        for (let i = 0; i < 5; i++) {
          const a = (i / 5) * Math.PI * 2;
          ctx.beginPath();
          ctx.arc(Math.cos(a) * 10, Math.sin(a) * 10, 6, 0, Math.PI * 2);
          ctx.fill();
        }

        // Miolo
        ctx.fillStyle = '#ffd043';
        ctx.beginPath();
        ctx.arc(0, 0, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    function drawHeart(ctx, x, y, size) {
      ctx.beginPath();
      const topCurveHeight = size * 0.3;
      ctx.moveTo(x, y + topCurveHeight);
      ctx.bezierCurveTo(x, y, x - size / 2, y, x - size / 2, y + topCurveHeight);
      ctx.bezierCurveTo(x - size / 2, y + (size + topCurveHeight) / 2, x, y + (size + topCurveHeight) / 2, x, y + size);
      ctx.bezierCurveTo(x, y + (size + topCurveHeight) / 2, x + size / 2, y + (size + topCurveHeight) / 2, x + size / 2, y + topCurveHeight);
      ctx.bezierCurveTo(x + size / 2, y, x, y, x, y + topCurveHeight);
      ctx.fill();
    }

    // ==========================================
    // 4. O TREM DAS ESTRELAS (LOCOMOTIVA + VAGÕES)
    // ==========================================
    class BabyStarTrain {
      constructor() {
        this.x = 80;
        this.speed = 1.6;
        this.baseSpeed = 1.6;
        this.wobble = 0;
        this.wheelRot = 0;

        // Passageiros dos 3 vagões
        this.cars = [
          { type: 'bear', label: 'bearHello', jump: 0 },
          { type: 'gift', label: 'giftSurprise', jump: 0 },
          { type: 'bunny', label: 'bunnyHop', jump: 0 }
        ];
      }

      whistle() {
        playTrainWhistle();
        showToast(tG.whistleToast);
        addScore(2);

        // Solta nuvens de fumaça em coração
        for (let i = 0; i < 5; i++) {
          setTimeout(() => {
            const chimneyX = (this.x + 220) % (width + 500) - 100;
            const chimneyY = this.getY(chimneyX) - 88;
            smokePuffs.push(new SmokePuff(chimneyX, chimneyY, Math.random() > 0.4 ? 'heart' : 'circle'));
          }, i * 90);
        }
      }

      tapCar(idx) {
        playBoingSound();
        const car = this.cars[idx];
        showToast(tG[car.label]);
        addScore(1);

        car.jump = 24;
        setTimeout(() => { car.jump = 0; }, 260);
      }

      getY(trainX) {
        // Trilhos sobre a colina
        return height * 0.72 + Math.sin(trainX * 0.005) * 18;
      }

      update() {
        this.x += this.speed;
        this.wheelRot += this.speed * 0.06;
        this.wobble += 0.08;

        // Ritmo do chugga-chugga
        playChugSound();

        // Desacelera suavemente para baseSpeed se acelerado
        if (this.speed > this.baseSpeed) {
          this.speed -= 0.01;
        }

        // Fumaça periódica suave
        if (Math.random() < 0.08) {
          const chimneyX = (this.x + 220) % (width + 500) - 100;
          const chimneyY = this.getY(chimneyX) - 88;
          smokePuffs.push(new SmokePuff(chimneyX, chimneyY, 'circle'));
        }
      }

      hitTest(px, py) {
        // Testa se tocou na locomotiva
        const locoX = (this.x + 220) % (width + 500) - 100;
        const locoY = this.getY(locoX);
        if (Math.hypot(px - locoX, py - (locoY - 40)) < 65) {
          this.whistle();
          return true;
        }

        // Testa toque nos vagões
        for (let i = 0; i < this.cars.length; i++) {
          const carX = (this.x + 220 - (i + 1) * 110) % (width + 500) - 100;
          const carY = this.getY(carX);
          if (Math.hypot(px - carX, py - (carY - 30)) < 45) {
            this.tapCar(i);
            return true;
          }
        }
        return false;
      }

      draw(ctx) {
        // 1. Desenha os 3 vagões
        for (let i = this.cars.length - 1; i >= 0; i--) {
          const car = this.cars[i];
          const carX = (this.x + 220 - (i + 1) * 110) % (width + 500) - 100;
          const carY = this.getY(carX);
          this.drawCar(ctx, carX, carY, car, i);
        }

        // 2. Desenha a Locomotiva com a Corujinha Maquinista
        const locoX = (this.x + 220) % (width + 500) - 100;
        const locoY = this.getY(locoX);
        this.drawLocomotive(ctx, locoX, locoY);
      }

      drawLocomotive(ctx, x, y) {
        ctx.save();
        ctx.translate(x, y);

        // Corpo da locomotiva
        ctx.fillStyle = '#8338fc';
        ctx.beginPath();
        ctx.roundRect(-45, -60, 90, 50, 10);
        ctx.fill();

        // Chaminé com anel dourado
        ctx.fillStyle = '#ffd043';
        ctx.fillRect(-35, -88, 20, 28);
        ctx.beginPath();
        ctx.ellipse(-25, -88, 14, 5, 0, 0, Math.PI * 2);
        ctx.fill();

        // Cabine do Maquinista
        ctx.fillStyle = '#6a28d6';
        ctx.beginPath();
        ctx.roundRect(5, -80, 50, 70, 8);
        ctx.fill();

        // Janelinha da cabine
        ctx.fillStyle = '#fef08a';
        ctx.beginPath();
        ctx.roundRect(14, -72, 32, 28, 6);
        ctx.fill();

        // Corujinha Maquinista KRUUJ na janelinha
        ctx.fillStyle = '#8338fc';
        ctx.beginPath();
        ctx.arc(30, -56, 12, 0, Math.PI * 2);
        ctx.fill();
        // Chapeuzinho de maquinista azul
        ctx.fillStyle = '#289afd';
        ctx.fillRect(20, -70, 20, 6);
        ctx.beginPath();
        ctx.arc(30, -70, 7, Math.PI, Math.PI * 2);
        ctx.fill();
        // Biquinho
        ctx.fillStyle = '#ffd043';
        ctx.beginPath();
        ctx.moveTo(28, -54); ctx.lineTo(32, -54); ctx.lineTo(30, -50); ctx.fill();

        // Farol brilhante na frente
        ctx.fillStyle = '#fef08a';
        ctx.beginPath();
        ctx.arc(-45, -35, 10, 0, Math.PI * 2);
        ctx.fill();

        // Rodas da locomotiva
        this.drawWheel(ctx, -26, 4, 18);
        this.drawWheel(ctx, 24, 4, 22);

        ctx.restore();
      }

      drawCar(ctx, x, y, car, idx) {
        ctx.save();
        ctx.translate(x, y);

        const colors = ['#289afd', '#ff65a6', '#4ade80'];
        const carColor = colors[idx % colors.length];

        // Passageiro pulando
        const jumpY = -car.jump;

        if (car.type === 'bear') {
          // Ursinho
          ctx.fillStyle = '#b45309';
          ctx.beginPath();
          ctx.arc(0, -42 + jumpY, 16, 0, Math.PI * 2); // Cabeça
          ctx.arc(-14, -54 + jumpY, 6, 0, Math.PI * 2); // Orelha esq
          ctx.arc(14, -54 + jumpY, 6, 0, Math.PI * 2); // Orelha dir
          ctx.fill();
          // Focinho
          ctx.fillStyle = '#fde68a';
          ctx.beginPath();
          ctx.arc(0, -38 + jumpY, 7, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#0f172a';
          ctx.beginPath();
          ctx.arc(0, -40 + jumpY, 2.5, 0, Math.PI * 2);
          ctx.fill();
        } else if (car.type === 'gift') {
          // Caixa de presente
          ctx.fillStyle = '#ffd043';
          ctx.fillRect(-16, -52 + jumpY, 32, 28);
          ctx.fillStyle = '#ff65a6';
          ctx.fillRect(-4, -52 + jumpY, 8, 28);
          // Laço de fita
          ctx.beginPath();
          ctx.arc(-6, -56 + jumpY, 6, 0, Math.PI * 2);
          ctx.arc(6, -56 + jumpY, 6, 0, Math.PI * 2);
          ctx.fill();
        } else {
          // Coelhinho
          ctx.fillStyle = '#f8fafc';
          ctx.beginPath();
          ctx.arc(0, -40 + jumpY, 15, 0, Math.PI * 2); // Cabeça
          ctx.ellipse(-6, -58 + jumpY, 4, 14, -0.15, 0, Math.PI * 2); // Orelha esq
          ctx.ellipse(6, -58 + jumpY, 4, 14, 0.15, 0, Math.PI * 2); // Orelha dir
          ctx.fill();
          // Miolo rosa
          ctx.fillStyle = '#ff8cb0';
          ctx.beginPath();
          ctx.ellipse(-6, -58 + jumpY, 2, 9, -0.15, 0, Math.PI * 2);
          ctx.ellipse(6, -58 + jumpY, 2, 9, 0.15, 0, Math.PI * 2);
          ctx.fill();
          // Olhinhos e focinho
          ctx.fillStyle = '#0f172a';
          ctx.beginPath();
          ctx.arc(-4, -40 + jumpY, 2, 0, Math.PI * 2);
          ctx.arc(4, -40 + jumpY, 2, 0, Math.PI * 2);
          ctx.fill();
        }

        // Vagão de madeira colorida
        ctx.fillStyle = carColor;
        ctx.beginPath();
        ctx.roundRect(-40, -32, 80, 36, 8);
        ctx.fill();

        // Rodas do vagão
        this.drawWheel(ctx, -24, 6, 14);
        this.drawWheel(ctx, 24, 6, 14);

        // Engate metálico
        ctx.fillStyle = '#94a3b8';
        ctx.fillRect(40, -14, 25, 6);

        ctx.restore();
      }

      drawWheel(ctx, wx, wy, radius) {
        ctx.save();
        ctx.translate(wx, wy);
        ctx.rotate(this.wheelRot);

        // Aro de borracha
        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.fill();

        // Centro metálico
        ctx.fillStyle = '#ffd043';
        ctx.beginPath();
        ctx.arc(0, 0, radius * 0.55, 0, Math.PI * 2);
        ctx.fill();

        // Raios
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(-radius * 0.55, 0); ctx.lineTo(radius * 0.55, 0);
        ctx.moveTo(0, -radius * 0.55); ctx.lineTo(0, radius * 0.55);
        ctx.stroke();

        ctx.restore();
      }
    }

    const train = new BabyStarTrain();

    function triggerWhistle() {
      initAudio();
      train.whistle();
    }

    function boostSpeed() {
      initAudio();
      train.speed = Math.min(4.0, train.speed + 1.2);
      showToast(tG.cheers[0]);
    }

    // ==========================================
    // 5. TOQUE & INTERAÇÃO
    // ==========================================
    function handlePointerHit(x, y) {
      initAudio();

      // 1. Testa se tocou no trem (locomotiva ou vagões)
      if (train.hitTest(x, y)) {
        return;
      }

      // 2. Testa se tocou em algum balão
      for (let i = balloons.length - 1; i >= 0; i--) {
        const b = balloons[i];
        if (b.hitTest(x, y)) {
          b.pop();
          balloons.splice(i, 1);
          return;
        }
      }

      // 3. Testa se tocou em alguma fumaça de coração
      for (let i = smokePuffs.length - 1; i >= 0; i--) {
        const sp = smokePuffs[i];
        if (sp.hitTest(x, y)) {
          playBalloonPopSound();
          addScore(1);
          smokePuffs.splice(i, 1);
          return;
        }
      }

      // 4. Tocou no chão/grama: brota florzinha mágica!
      if (y > height * 0.6) {
        flowers.push(new SproutFlower(x, y));
        playBalloonPopSound();
        addScore(1);
      } else {
        // Tocou no céu: cria balão
        balloons.push(new Balloon(x, y));
        playBalloonPopSound();
      }
    }

    window.addEventListener('pointerdown', e => handlePointerHit(e.clientX, e.clientY));

    // Multitouch nativo
    window.addEventListener('touchstart', e => {
      e.preventDefault();
      for (let i = 0; i < e.touches.length; i++) {
        handlePointerHit(e.touches[i].clientX, e.touches[i].clientY);
      }
    }, { passive: false });

    // ==========================================
    // 6. LOOP DE ANIMAÇÃO
    // ==========================================
    let balloonSpawnTimer = 0;

    function gameLoop() {
      ctx.clearRect(0, 0, width, height);

      // Céu Cósmico Pastel
      const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
      skyGrad.addColorStop(0, '#0a133b');
      skyGrad.addColorStop(0.5, '#1e1d52');
      skyGrad.addColorStop(1, '#2f1a60');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, width, height);

      // Solzinho Sorridente no céu
      ctx.save();
      ctx.translate(width * 0.18, height * 0.2);
      ctx.fillStyle = '#ffd043';
      ctx.beginPath();
      ctx.arc(0, 0, 36, 0, Math.PI * 2);
      ctx.fill();
      // Raios do sol
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2 + performance.now() * 0.001;
        ctx.beginPath();
        ctx.arc(Math.cos(a) * 48, Math.sin(a) * 48, 5, 0, Math.PI * 2);
        ctx.fill();
      }
      // Rostinho feliz do Sol
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(-10, -6, 4, 0, Math.PI * 2);
      ctx.arc(10, -6, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ff8cb0';
      ctx.beginPath();
      ctx.arc(-16, 4, 5, 0, Math.PI * 2);
      ctx.arc(16, 4, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(0, 2, 8, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();
      ctx.restore();

      // Colina Suave Arco-Íris ao Fundo
      ctx.fillStyle = '#26336a';
      ctx.beginPath();
      ctx.moveTo(0, height * 0.6);
      ctx.bezierCurveTo(width * 0.35, height * 0.52, width * 0.65, height * 0.68, width, height * 0.58);
      ctx.lineTo(width, height);
      ctx.lineTo(0, height);
      ctx.closePath();
      ctx.fill();

      // Colina da Frente com os Trilhos
      ctx.fillStyle = '#172554';
      ctx.beginPath();
      ctx.moveTo(0, height * 0.72);
      for (let x = 0; x <= width; x += 20) {
        ctx.lineTo(x, train.getY(x));
      }
      ctx.lineTo(width, height);
      ctx.lineTo(0, height);
      ctx.closePath();
      ctx.fill();

      // Trilhos de Trem (Travessas de madeira e linha dourada)
      ctx.strokeStyle = '#ffd043';
      ctx.lineWidth = 4;
      ctx.beginPath();
      for (let x = 0; x <= width; x += 10) {
        const y = train.getY(x) + 16;
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();

      // Travessas do trilho
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 3;
      for (let x = 10; x <= width; x += 32) {
        const y = train.getY(x) + 16;
        ctx.beginPath();
        ctx.moveTo(x, y - 6);
        ctx.lineTo(x, y + 6);
        ctx.stroke();
      }

      // Florzinhas brotadas
      for (const fl of flowers) {
        fl.update();
        fl.draw(ctx);
      }

      // Atualiza e desenha o trem
      train.update();
      train.draw(ctx);

      // Fumaça do apito
      for (let i = smokePuffs.length - 1; i >= 0; i--) {
        const sp = smokePuffs[i];
        sp.update();
        if (sp.life <= 0) {
          smokePuffs.splice(i, 1);
        } else {
          sp.draw(ctx);
        }
      }

      // Balões de ar flutuando
      balloonSpawnTimer++;
      if (balloonSpawnTimer % 80 === 0 && balloons.length < 10) {
        balloons.push(new Balloon());
      }

      for (let i = balloons.length - 1; i >= 0; i--) {
        const b = balloons[i];
        b.update();
        b.draw(ctx);
        if (b.y + b.radius < -30) {
          balloons.splice(i, 1);
        }
      }

      // Confetes
      for (let i = confetti.length - 1; i >= 0; i--) {
        const c = confetti[i];
        c.update();
        if (c.life <= 0) {
          confetti.splice(i, 1);
        } else {
          c.draw(ctx);
        }
      }

      requestAnimationFrame(gameLoop);
    }
    requestAnimationFrame(gameLoop);

    // ==========================================
    // 7. KRUUJ SDK & LOADER
    // ==========================================
    const KruujLoader = (() => {
      const $ = id => document.getElementById(id);
      let target = 0, shown = 0, cfg = {}, t0 = 0, raf = null, tipTimer = null, finished = false, closing = false;
      const wait = ms => new Promise(r => setTimeout(r, ms));
      function frame() {
        if (!cfg.manual && !finished) target = Math.min(0.9, target + 0.004 * (1 - target) + 0.0015);
        shown += (target - shown) * 0.08;
        if (finished && target - shown < 0.002) shown = target;
        const pc = Math.round(shown * 100);
        if ($('kl-fill')) $('kl-fill').style.width = pc + '%';
        if ($('kl-rider')) $('kl-rider').style.left = pc + '%';
        if ($('kl-pct')) $('kl-pct').textContent = pc + '%';
        if (shown >= 1 && performance.now() - t0 >= cfg.minTime) return close();
        raf = requestAnimationFrame(frame);
      }
      async function close() {
        if (closing) return; closing = true; clearInterval(tipTimer);
        const kl = $('kl');
        if (kl) {
          kl.classList.add('out');
          await wait(650);
          kl.style.display = 'none';
        }
        if (cfg.onComplete) cfg.onComplete();
      }
      async function start(c) {
        cfg = { gameName: 'KRUUJ Trenzinho das Estrelas', tagline: '', tips: [], splash: 1800, minTime: 2600, manual: false, onComplete() {}, ...c };
        target = shown = 0; finished = closing = false;
        const kl = $('kl');
        if (!kl) return;
        kl.style.display = ''; kl.classList.remove('out');
        const [sp, ld] = kl.querySelectorAll('.ph');
        if (sp) sp.classList.remove('off');
        if (ld) ld.classList.add('off');
        $('kl-name').textContent = cfg.gameName;
        $('kl-tag').textContent = cfg.tagline;
        document.title = cfg.gameName + ' – Kruuj Studio';
        await wait(cfg.splash);
        if (sp) sp.classList.add('off');
        await wait(400);
        if (ld) ld.classList.remove('off');
        t0 = performance.now();
        let i = 0;
        const tip = $('kl-tip');
        const nextTip = () => {
          if (!tip) return;
          tip.style.opacity = '0';
          setTimeout(() => {
            tip.textContent = cfg.tips[i++ % cfg.tips.length] || '';
            tip.style.opacity = '0.85';
          }, 350);
        };
        if (cfg.tips.length) { nextTip(); tipTimer = setInterval(nextTip, 3000); }
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(frame);
      }
      return {
        start,
        finish() { finished = true; target = 1; }
      };
    })();

    window.addEventListener('DOMContentLoaded', () => {
      // Inicia KruujSDK
      if (window.KruujSDK) {
        window.KruujSDK.init().then(() => {
          window.KruujSDK.gameLoadingFinished();
          window.KruujSDK.gameplayStart();
        }).catch(() => {});
      }

      // Aplica i18n
      document.getElementById('whistleLabel').textContent = tG.btnWhistle;
      document.getElementById('speedLabel').textContent = tG.btnSpeed;

      // Executa loader apenas standalone
      if (window.self === window.top) {
        KruujLoader.start({
          gameName: tG.title,
          tagline: tG.tagline,
          tips: tG.tips,
          splash: 1800,
          minTime: 2600
        });
        setTimeout(() => KruujLoader.finish(), 2400);
      }
    });
  </script>
