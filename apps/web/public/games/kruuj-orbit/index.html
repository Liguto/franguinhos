<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>KRUUJ ORBIT: Salto Gravitacional</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070914;
      --cyan: #38e8ff;
      --purple: #8b5cff;
      --gold: #ffb020;
      --pink: #ff5ca8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Baloo 2', sans-serif;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Interface Superior (HUD Sobreposto ao Canvas) */
    .hud {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }

    .hud-badge {
      background: rgba(13, 18, 36, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      border-radius: 9999px;
      padding: 6px 18px;
      font-size: 1.05rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .hud-badge span {
      color: var(--cyan);
    }

    .hint-bar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(13, 18, 36, 0.85);
      border: 1px solid rgba(56, 232, 255, 0.3);
      padding: 8px 24px;
      border-radius: 9999px;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--cyan);
      box-shadow: 0 0 20px rgba(56, 232, 255, 0.25);
      pointer-events: none;
      z-index: 5;
      white-space: nowrap;
    }

    /* Tela de Início / Fim de Jogo (Overlay) */
    .game-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(13, 18, 36, 0.92) 0%, rgba(7, 9, 20, 0.98) 100%);
      backdrop-filter: blur(14px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .game-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    h1 {
      font-size: clamp(32px, 8vw, 54px);
      font-weight: 800;
      background: linear-gradient(135deg, var(--cyan), var(--purple), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      filter: drop-shadow(0 0 20px rgba(139, 92, 246, 0.5));
    }

    p {
      font-size: clamp(14px, 4vw, 17px);
      color: var(--text-muted);
      max-width: 440px;
      line-height: 1.45;
      margin-bottom: 24px;
    }

    .stats-table {
      margin-bottom: 22px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 12px 28px;
      display: flex;
      gap: 32px;
    }

    .stats-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stats-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 0.06em;
    }

    .stats-val {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--cyan);
    }

    .btn-action {
      background: linear-gradient(135deg, #0284c7 0%, #8b5cff 100%);
      color: #fff;
      border: none;
      border-radius: 9999px;
      padding: 14px 44px;
      font-size: 1.2rem;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(56, 232, 255, 0.4);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .btn-action:hover {
      transform: scale(1.05);
      box-shadow: 0 0 35px rgba(139, 92, 246, 0.6);
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <!-- HUD Superior com Score e Recorde -->
  <div class="hud">
    <div class="hud-badge">SCORE: <span id="scoreVal">0</span></div>
    <div class="hud-badge" style="font-size: 0.95rem;">RECORDE: <span id="bestVal" style="color: var(--gold);">0</span></div>
  </div>

  <div class="hint-bar" id="hintBar">Pressione ESPAÇO ou Toque na tela para saltar!</div>

  <!-- Overlay de Início e Game Over -->
  <div class="game-overlay active" id="gameOverlay">
    <h1 id="ovTitle">KRUUJ ORBIT</h1>
    <p id="ovDesc">Salto Gravitacional: seu personagem gira pela órbita dos planetas. No momento certo, solte o estilingue tangencial para alcançar a próxima gravidade!</p>
    
    <div class="stats-table" id="ovStats" style="display: none;">
      <div class="stats-item">
        <span class="stats-label">Pontuação</span>
        <span class="stats-val" id="ovScore">0</span>
      </div>
      <div class="stats-item">
        <span class="stats-label">Melhor Score</span>
        <span class="stats-val" id="ovBest">0</span>
      </div>
    </div>

    <button class="btn-action" id="btnPlay" onclick="window.orbitGame.startGame()">JOGAR AGORA 🪐</button>
  </div>

  <!-- ================================================================= -->
  <!-- LÓGICA DO JOGO EM PROGRAMAÇÃO ORIENTADA A OBJETOS (POO)          -->
  <!-- ================================================================= -->
  <script>
    // ===== 1. GERENCIADOR DE ÁUDIO SINTÉTICO (WEBAUDIO) =====
    class SoundController {
      constructor() {
        this.ctx = null;
      }

      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      // Som de impulso do estilingue tangencial ao soltar
      playLaunch() {
        try {
          this.init();
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(740, now + 0.15);

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.15, now + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.18);
        } catch(e) {}
      }

      // Som de captura no campo gravitacional do novo planeta
      playOrbitCapture() {
        try {
          this.init();
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(580, now);
          osc.frequency.exponentialRampToValueAtTime(920, now + 0.12);

          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.16);
        } catch(e) {}
      }

      // Som de Game Over / Colisão
      playCrash() {
        try {
          this.init();
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, now);
          osc.frequency.exponentialRampToValueAtTime(35, now + 0.35);

          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.35);
        } catch(e) {}
      }
    }

    // ===== 2. SISTEMA DE PARTÍCULAS VISUAIS (RASTRO & EFEITOS) =====
    class Particle {
      constructor(x, y, color, vx, vy, life = 1.0, radius = 3) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.vx = vx;
        this.vy = vy;
        this.life = life;
        this.maxLife = life;
        this.radius = radius;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= 0.035;
      }

      render(ctx) {
        if (this.life <= 0) return;
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // ===== 3. PLANETA COM NÚCLEO E ANEL ORBITAL PONTILHADO =====
    class Planet {
      constructor(index, x, y, options = {}) {
        this.index = index;
        this.x = x;
        this.y = y;
        this.coreRadius = options.coreRadius || (36 + Math.random() * 16);
        this.gravityRadius = this.coreRadius + 44 + Math.random() * 12; // Campo gravitacional
        this.orbitSpeed = (Math.random() > 0.5 ? 1 : -1) * (0.034 + Math.random() * 0.012);
        this.visited = index === 0;

        // Paleta de cores cósmicas KRUUJ
        const palettes = [
          ['#38e8ff', '#0284c7'],
          ['#8b5cff', '#581c87'],
          ['#ffb020', '#b45309'],
          ['#ff5ca8', '#be185d'],
          ['#10b981', '#047857']
        ];
        const pal = palettes[index % palettes.length];
        this.color1 = pal[0];
        this.color2 = pal[1];
        this.hasRing = Math.random() > 0.65;
      }

      render(ctx) {
        ctx.save();

        // 1. Linha Pontilhada ao Redor (Campo Gravitacional / Anel Orbital)
        ctx.strokeStyle = this.visited ? 'rgba(56, 232, 255, 0.4)' : 'rgba(255, 255, 255, 0.2)';
        ctx.lineWidth = 1.6;
        ctx.setLineDash([6, 8]); // Linha pontilhada solicitada
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.gravityRadius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]); // Reseta linha sólida para os próximos desenhos

        // 2. Núcleo Visual do Planeta (Obstáculo) com Gradiente e Brilho
        ctx.shadowColor = this.color1;
        ctx.shadowBlur = 16;
        const grad = ctx.createRadialGradient(
          this.x - this.coreRadius * 0.3,
          this.y - this.coreRadius * 0.3,
          this.coreRadius * 0.1,
          this.x,
          this.y,
          this.coreRadius
        );
        grad.addColorStop(0, this.color1);
        grad.addColorStop(1, this.color2);

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.coreRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // 3. Anel Planetário Opcional
        if (this.hasRing) {
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.ellipse(this.x, this.y, this.coreRadius * 1.5, this.coreRadius * 0.35, 0.3, 0, Math.PI * 2);
          ctx.stroke();
        }

        ctx.restore();
      }
    }

    // ===== 4. PERSONAGEM (ESFERA / CÁPSULA COM FÍSICA VETORIAL) =====
    class Player {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.radius = 16;
        this.currentPlanet = null;
        this.lastPlanet = null;
        this.launchCooldown = 0;
        this.flightFrames = 0;
        this.angle = -Math.PI / 2;
        this.orbitRadius = 80;
        this.orbitSpeed = 0.038;
        this.trail = [];
      }

      // Conecta o personagem à órbita de um planeta
      enterOrbit(planet, interceptAngle) {
        this.currentPlanet = planet;
        this.lastPlanet = null;
        this.launchCooldown = 0;
        this.flightFrames = 0;
        this.orbitRadius = planet.gravityRadius;
        this.orbitSpeed = planet.orbitSpeed;
        this.angle = interceptAngle;
        this.vx = 0;
        this.vy = 0;
      }

      // Atualiza rotação orbital contínua usando trigonometria vetorial
      updateOrbit() {
        if (!this.currentPlanet) return;
        this.angle += this.orbitSpeed;
        this.x = this.currentPlanet.x + Math.cos(this.angle) * this.orbitRadius;
        this.y = this.currentPlanet.y + Math.sin(this.angle) * this.orbitRadius;
      }

      // Desprende da órbita: lançamento tangencial retilíneo uniforme (Estilingue)
      launch(launchSpeed) {
        if (!this.currentPlanet) return;

        this.lastPlanet = this.currentPlanet;
        this.launchCooldown = 18; // 18 frames de imunidade ao planeta anterior
        this.flightFrames = 0;

        // Vetor tangencial perpendicular ao raio orbital
        const dir = this.orbitSpeed > 0 ? 1 : -1;
        const tangentX = -Math.sin(this.angle) * dir;
        const tangentY = Math.cos(this.angle) * dir;

        this.vx = tangentX * launchSpeed;
        this.vy = tangentY * launchSpeed;
        this.currentPlanet = null;
      }

      // Movimento retilíneo uniforme após o lançamento
      updateFlight() {
        if (this.currentPlanet) return;
        this.x += this.vx;
        this.y += this.vy;
        this.flightFrames++;
        if (this.launchCooldown > 0) this.launchCooldown--;

        // Histórico do rastro de partículas
        this.trail.push({ x: this.x, y: this.y, alpha: 0.8 });
        if (this.trail.length > 20) this.trail.shift();
      }

      render(ctx) {
        ctx.save();

        // 1. Rastro de partículas da cápsula (Protegido contra IndexSizeError de raio negativo)
        for (let i = this.trail.length - 1; i >= 0; i--) {
          const t = this.trail[i];
          t.alpha -= 0.04;
          if (t.alpha <= 0.02) {
            this.trail.splice(i, 1);
            continue;
          }
          const r = Math.max(0.5, 6 * t.alpha);
          ctx.fillStyle = `rgba(56, 232, 255, ${Math.max(0, Math.min(1, t.alpha))})`;
          ctx.beginPath();
          ctx.arc(t.x, t.y, r, 0, Math.PI * 2);
          ctx.fill();
        }

        // 2. Renderização do Mascote Oficial KRUUJ (Coruja Cósmica com Penachos e Olhos)
        ctx.translate(this.x, this.y);

        // Se estiver em voo, orienta na direção do vetor velocidade
        const rot = this.currentPlanet ? (this.angle + Math.PI / 2) : Math.atan2(this.vy, this.vx);
        ctx.rotate(rot);

        // Aura de energia de propulsão cósmica
        ctx.fillStyle = 'rgba(56, 232, 255, 0.25)';
        ctx.beginPath();
        ctx.arc(0, 0, this.radius + 4, 0, Math.PI * 2);
        ctx.fill();

        // Corpo da Coruja KRUUJ (Roxo vibrante)
        ctx.fillStyle = '#8b5cff';
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();

        // Penachos de orelha da coruja (triângulos superiores)
        ctx.fillStyle = '#6d28d9';
        ctx.beginPath();
        ctx.moveTo(-9, -6);
        ctx.lineTo(-14, -18);
        ctx.lineTo(-3, -12);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(9, -6);
        ctx.lineTo(14, -18);
        ctx.lineTo(3, -12);
        ctx.closePath();
        ctx.fill();

        // Máscara / Olhos Brancos Grandes da Coruja KRUUJ
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-5, -2, 4.5, 0, Math.PI * 2);
        ctx.arc(5, -2, 4.5, 0, Math.PI * 2);
        ctx.fill();

        // Íris douradas / âmbar
        ctx.fillStyle = '#ffb020';
        ctx.beginPath();
        ctx.arc(-5, -2, 2.8, 0, Math.PI * 2);
        ctx.arc(5, -2, 2.8, 0, Math.PI * 2);
        ctx.fill();

        // Pupilas pretas
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.arc(-4.5, -2, 1.5, 0, Math.PI * 2);
        ctx.arc(5.5, -2, 1.5, 0, Math.PI * 2);
        ctx.fill();

        // Bico dourado triangular
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.moveTo(-2.5, 2);
        ctx.lineTo(2.5, 2);
        ctx.lineTo(0, 6);
        ctx.closePath();
        ctx.fill();

        // Viseira / Fone tecnológico neon KRUUJ
        ctx.strokeStyle = '#38e8ff';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.arc(0, -2, this.radius - 2, -Math.PI * 0.8, -Math.PI * 0.2);
        ctx.stroke();

        ctx.restore();
      }
    }

    // ===== 5. GERENCIADOR DA CÂMERA VERTICAL (SMOOTH SCROLL) =====
    class Camera {
      constructor() {
        this.y = 0;
        this.targetY = 0;
      }

      update(playerY, viewportHeight) {
        // Acompanha suavemente o progresso vertical da subida
        this.targetY = playerY - viewportHeight * 0.65;
        this.y += (this.targetY - this.y) * 0.1;
      }
    }

    // ===== 6. CLASSE PRINCIPAL DO MOTOR DO JOGO =====
    class Game {
      constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');

        this.sound = new SoundController();
        this.camera = new Camera();

        this.state = 'menu'; // 'menu', 'play', 'over'
        this.score = 0;
        this.bestScore = parseInt(localStorage.getItem('kruuj_orbit_best') || '0', 10);
        this.baseLaunchSpeed = 12.8;

        this.player = null;
        this.planets = [];
        this.particles = [];
        this.stars = [];

        this.init();
      }

      init() {
        this.resize();
        window.addEventListener('resize', () => this.resize());

        // Fundo estrelado infinito
        for (let i = 0; i < 180; i++) {
          this.stars.push({
            x: Math.random() * 2000 - 1000,
            y: Math.random() * 4000 - 2000,
            size: Math.random() * 2.2 + 0.5,
            alpha: Math.random() * 0.7 + 0.3
          });
        }

        // Input com Barra de Espaço e Toque / Clique na tela
        window.addEventListener('keydown', (e) => {
          if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
            e.preventDefault();
            this.handleAction();
          }
        });

        window.addEventListener('pointerdown', (e) => {
          if (e.target.closest('#gameOverlay') || e.target.closest('button')) return;
          this.handleAction();
        });

        // Atualiza recorde no HUD
        document.getElementById('bestVal').textContent = this.bestScore;

        // Loop principal a 60 FPS
        this.loop = this.loop.bind(this);
        requestAnimationFrame(this.loop);

        // Telemetria oficial da plataforma KRUUJ
        try {
          window.parent.postMessage({ type: 'game_loaded', gameSlug: 'kruuj-orbit' }, '*');
        } catch(e) {}
      }

      resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
      }

      handleAction() {
        if (this.state === 'play') {
          if (this.player && this.player.currentPlanet) {
            // Arremesso tangencial (Estilingue)
            const speed = this.baseLaunchSpeed + Math.min(4, this.score * 0.15);
            this.player.launch(speed);
            this.sound.playLaunch();
            this.spawnLaunchParticles();
          }
        } else if (this.state === 'over' || this.state === 'menu') {
          this.startGame();
        }
      }

      startGame() {
        this.sound.init();
        this.state = 'play';
        this.score = 0;
        this.particles = [];
        this.planets = [];
        this.camera.y = 0;

        document.getElementById('scoreVal').textContent = this.score;
        document.getElementById('gameOverlay').classList.remove('active');
        document.getElementById('hintBar').style.display = 'block';

        // 1. Gera o primeiro planeta na parte inferior
        let curY = this.canvas.height * 0.75;
        const initialPlanet = new Planet(0, this.canvas.width / 2, curY);
        this.planets.push(initialPlanet);

        // 2. Instancia o jogador orbitando o planeta inicial
        this.player = new Player(initialPlanet.x, initialPlanet.y);
        this.player.enterOrbit(initialPlanet, -Math.PI / 2);

        // 3. Gera os próximos 12 planetas em subida vertical
        for (let i = 1; i < 14; i++) {
          curY -= (185 + Math.random() * 60);
          const px = this.canvas.width / 2 + (Math.random() * 240 - 120);
          this.planets.push(new Planet(i, px, curY));
        }

        try {
          window.parent.postMessage({ type: 'game_start', gameSlug: 'kruuj-orbit' }, '*');
        } catch(e) {}
      }

      spawnLaunchParticles() {
        for (let i = 0; i < 12; i++) {
          const vx = (Math.random() - 0.5) * 5 - this.player.vx * 0.2;
          const vy = (Math.random() - 0.5) * 5 - this.player.vy * 0.2;
          this.particles.push(new Particle(this.player.x, this.player.y, '#ffb020', vx, vy, 0.8, 3.5));
        }
      }

      spawnCaptureParticles(x, y, color) {
        for (let i = 0; i < 16; i++) {
          const angle = Math.random() * Math.PI * 2;
          const spd = 2 + Math.random() * 4;
          this.particles.push(new Particle(x, y, color, Math.cos(angle) * spd, Math.sin(angle) * spd, 1.0, 3));
        }
      }

      gameOver() {
        this.state = 'over';
        this.sound.playCrash();

        // Atualiza recorde
        this.bestScore = Math.max(this.bestScore, this.score);
        localStorage.setItem('kruuj_orbit_best', String(this.bestScore));
        document.getElementById('bestVal').textContent = this.bestScore;

        // Atualiza UI do Modal
        document.getElementById('ovTitle').textContent = 'FIM DE VOO!';
        document.getElementById('ovDesc').textContent = 'Você errou a trajetória ou colidiu diretamente com o núcleo do planeta. Acerte o timing exato do estilingue!';
        document.getElementById('ovScore').textContent = this.score;
        document.getElementById('ovBest').textContent = this.bestScore;
        document.getElementById('ovStats').style.display = 'flex';
        document.getElementById('btnPlay').textContent = 'JOGAR NOVAMENTE 🪐';
        document.getElementById('gameOverlay').classList.add('active');
        document.getElementById('hintBar').style.display = 'none';

        // Telemetria e persistência em nuvem
        try {
          window.parent.postMessage({ type: 'game_over', gameSlug: 'kruuj-orbit', score: this.score, bestScore: this.bestScore }, '*');
          window.parent.postMessage({ type: 'game_save', gameSlug: 'kruuj-orbit', saveData: { bestScore: this.bestScore }, score: this.score }, '*');
        } catch(e) {}
      }

      // Loop de Física e Renderização
      loop() {
        requestAnimationFrame(this.loop);

        try {
          // 1. Limpa o Canvas
          this.ctx.fillStyle = '#070914';
          this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

          // 2. Atualização da Física
          if (this.state === 'play' && this.player) {
            if (this.player.currentPlanet) {
              this.player.updateOrbit();
            } else {
              this.player.updateFlight();

              // Checa colisão com planetas
              for (let planet of this.planets) {
                // Se acabou de decolar deste planeta, ignora enquanto estiver no cooldown de lançamento
                if (this.player.lastPlanet === planet && this.player.launchCooldown > 0) {
                  continue;
                }

                const dx = this.player.x - planet.x;
                const dy = this.player.y - planet.y;
                const dist = Math.hypot(dx, dy);

                // 2.1 Colisão com o núcleo do planeta (Obstáculo -> Game Over)
                if (dist <= planet.coreRadius + this.player.radius) {
                  this.gameOver();
                  break;
                }

                // 2.2 Interceptação da órbita gravitacional do próximo planeta
                if (dist <= planet.gravityRadius + 22 && dist >= planet.coreRadius + 6) {
                  const interceptAngle = Math.atan2(dy, dx);
                  this.player.enterOrbit(planet, interceptAngle);
                  this.sound.playOrbitCapture();
                  this.spawnCaptureParticles(this.player.x, this.player.y, planet.color1);

                  if (!planet.visited) {
                    planet.visited = true;
                    this.score++;
                    document.getElementById('scoreVal').textContent = this.score;

                    // Gera dinamicamente novos planetas no topo contínuo
                    const lastP = this.planets[this.planets.length - 1];
                    const nextY = lastP.y - (185 + Math.random() * 60);
                    const px = this.canvas.width / 2 + (Math.random() * 240 - 120);
                    this.planets.push(new Planet(this.planets.length, px, nextY));
                  }
                  break;
                }
              }

              // 2.3 Saiu dos limites da tela ou voou sem rumo por muito tempo -> Game Over
              if (
                this.state === 'play' && (
                  this.player.x < -140 || 
                  this.player.x > this.canvas.width + 140 || 
                  this.player.y > (this.camera.y + this.canvas.height + 150) ||
                  this.player.flightFrames > 200
                )
              ) {
                this.gameOver();
              }
            }

            // Câmera vertical fluida
            this.camera.update(this.player.y, this.canvas.height);
          }

          // 3. Renderização com Câmera (Scroll Vertical)
          this.ctx.save();
          this.ctx.translate(0, -this.camera.y);

          // Fundo estrelado com parallax
          this.stars.forEach(s => {
            this.ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
            this.ctx.beginPath();
            this.ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
            this.ctx.fill();
          });

          // Renderiza todos os planetas visíveis
          this.planets.forEach(p => {
            if (p.y >= this.camera.y - 200 && p.y <= this.camera.y + this.canvas.height + 200) {
              p.render(this.ctx);
            }
          });

          // Partículas
          for (let i = this.particles.length - 1; i >= 0; i--) {
            const pt = this.particles[i];
            pt.update();
            if (pt.life <= 0) {
              this.particles.splice(i, 1);
            } else {
              pt.render(this.ctx);
            }
          }

          // Renderiza o Jogador Mascote KRUUJ
          if (this.state === 'play' && this.player) {
            this.player.render(this.ctx);
          }

          this.ctx.restore();
        } catch(err) {
          console.error('KRUUJ Orbit render error:', err);
        }
      }
    }

    // Instanciação Global
    window.addEventListener('DOMContentLoaded', () => {
      window.orbitGame = new Game();
    });
  </script>
