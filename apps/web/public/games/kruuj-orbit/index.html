<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>KRUUJ ORBIT: Salto Gravitacional</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07061a;
      --cyan: #38e8ff;
      --purple: #8b5cff;
      --gold: #ffb020;
      --pink: #ff5ca8;
      --text: #f3f0ff;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Baloo 2', sans-serif;
    }
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .hud {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }
    .score-badge {
      background: rgba(13, 18, 36, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      border-radius: 9999px;
      padding: 6px 16px;
      font-size: 1rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }
    .score-badge span {
      color: var(--gold);
    }
    .overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(13, 18, 36, 0.88) 0%, rgba(7, 6, 26, 0.98) 100%);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    h1 {
      font-size: clamp(30px, 8vw, 52px);
      font-weight: 800;
      background: linear-gradient(135deg, var(--cyan), var(--purple), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
      filter: drop-shadow(0 0 20px rgba(139, 92, 246, 0.5));
    }
    p {
      font-size: clamp(14px, 4vw, 17px);
      color: #cbd5e1;
      max-width: 440px;
      line-height: 1.4;
      margin-bottom: 24px;
    }
    .btn-play {
      background: linear-gradient(135deg, #0284c7 0%, #8b5cff 100%);
      color: #fff;
      border: none;
      border-radius: 9999px;
      padding: 14px 44px;
      font-size: 1.2rem;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(56, 232, 255, 0.4);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .btn-play:hover {
      transform: scale(1.05);
      box-shadow: 0 0 35px rgba(139, 92, 246, 0.6);
    }
    .stats-table {
      margin-bottom: 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 12px 24px;
      display: flex;
      gap: 28px;
    }
    .stats-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .stats-label {
      font-size: 0.72rem;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 0.05em;
    }
    .stats-val {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--cyan);
    }
    .instructions-hint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(13, 18, 36, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 22px;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 700;
      color: #38e8ff;
      pointer-events: none;
      white-space: nowrap;
      z-index: 5;
      box-shadow: 0 0 15px rgba(56, 232, 255, 0.2);
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <div class="hud">
    <div class="score-badge">PENAS: <span id="scoreVal">0</span> 🪶</div>
    <div class="score-badge" style="font-size: 0.95rem;">RECORDE: <span id="bestVal" style="color: var(--cyan);">0</span></div>
  </div>

  <div class="instructions-hint" id="hint">Toque ou ESPAÇO para a Coruja voar para o próximo planeta!</div>

  <!-- Tela Inicial / Game Over -->
  <div class="overlay active" id="overlay">
    <h1 id="ovTitle">KRUUJ ORBIT</h1>
    <p id="ovDesc">Guie a Coruja Mascote do KRUUJ através das órbitas gravitacionais do cosmos! Salte no momento exato e resgate as penas estelares.</p>
    <div class="stats-table" id="ovStats" style="display: none;">
      <div class="stats-item">
        <span class="stats-label">Penas Coletadas</span>
        <span class="stats-val" id="ovScore">0</span>
      </div>
      <div class="stats-item">
        <span class="stats-label">Melhor Voo</span>
        <span class="stats-val" id="ovBest">0</span>
      </div>
    </div>
    <button class="btn-play" id="btnPlay" onclick="startGame()">DECOLAR 🦉</button>
  </div>

  <script>
    // ===== Telemetria e Sincronização em Nuvem KRUUJ =====
    function sendEvent(type, data = {}) {
      try {
        window.parent.postMessage({ type, gameSlug: 'kruuj-orbit', ...data }, '*');
      } catch (e) {}
    }
    sendEvent('game_loaded');

    let bestScore = parseInt(localStorage.getItem('kruuj_orbit_best') || '0', 10);
    document.getElementById('bestVal').textContent = bestScore;

    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'load_cloud_save' && e.data.saveData) {
        try {
          const d = typeof e.data.saveData === 'string' ? JSON.parse(e.data.saveData) : e.data.saveData;
          if (d && d.bestScore) {
            bestScore = Math.max(bestScore, d.bestScore);
            localStorage.setItem('kruuj_orbit_best', String(bestScore));
            document.getElementById('bestVal').textContent = bestScore;
          }
        } catch(err){}
      }
    });

    // ===== Som Temático Sintético de Coruja (WebAudio) =====
    let audioCtx = null;
    function getAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    // Piado autêntico de coruja ("Hoo-Hoo!")
    function playOwlHoot(isExcited = false) {
      try {
        const ctx = getAudio();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';

        const baseFreq = isExcited ? 520 : 380;
        osc.frequency.setValueAtTime(baseFreq, now);
        osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.15, now + 0.08);
        osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.9, now + 0.22);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.15, now + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.25);

        // Segundo "Hoo" do piado
        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(baseFreq * 1.1, now + 0.16);
        osc2.frequency.exponentialRampToValueAtTime(baseFreq * 0.85, now + 0.38);

        gain2.gain.setValueAtTime(0.001, now + 0.16);
        gain2.gain.linearRampToValueAtTime(0.18, now + 0.22);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.start(now + 0.16);
        osc2.stop(now + 0.4);
      } catch (e) {}
    }

    // Som de bater de asas aerodinâmico
    function playWingFlap() {
      try {
        const ctx = getAudio();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(320, now + 0.1);
        osc.frequency.exponentialRampToValueAtTime(90, now + 0.2);

        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
      } catch (e) {}
    }

    // Som de coleta de pena mágica (harpa + piadinho agudo)
    function playFeatherChime() {
      try {
        const ctx = getAudio();
        const now = ctx.currentTime;
        [880, 1100, 1320].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.04);

          gain.gain.setValueAtTime(0.08, now + idx * 0.04);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.04 + 0.18);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + idx * 0.04);
          osc.stop(now + idx * 0.04 + 0.18);
        });
      } catch(e) {}
    }

    // Piado triste de colisão
    function playSadHoot() {
      try {
        const ctx = getAudio();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(70, now + 0.4);

        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.4);
      } catch (e) {}
    }

    // ===== Engine do Jogo =====
    const cv = document.getElementById('c');
    const ctx = cv.getContext('2d');
    let W = cv.width = window.innerWidth;
    let H = cv.height = window.innerHeight;

    window.addEventListener('resize', () => {
      W = cv.width = window.innerWidth;
      H = cv.height = window.innerHeight;
    });

    let state = 'menu';
    let score = 0;
    let cameraY = 0;
    let wingFlapAnim = 0;
    let blinkTimer = 0;

    let owl = {
      x: 0, y: 0, vx: 0, vy: 0, r: 18,
      currentPlanet: null,
      angle: 0,
      orbitSpeed: 0.038,
      orbitRadius: 80,
      trail: [],
      isFlapping: false
    };

    let planets = [];
    let stars = [];
    let particles = [];
    let feathers = [];

    // Fundo de estrelas cintilantes
    for (let i = 0; i < 160; i++) {
      stars.push({
        x: Math.random() * 2000 - 1000,
        y: Math.random() * 4000 - 2000,
        s: Math.random() * 2.2 + 0.6,
        alpha: Math.random() * 0.7 + 0.3
      });
    }

    function createPlanet(index, y) {
      const colors = [
        ['#38e8ff', '#0284c7'],
        ['#8b5cff', '#581c87'],
        ['#ffb020', '#b45309'],
        ['#ff5ca8', '#be185d'],
        ['#10b981', '#047857']
      ];
      const pal = colors[index % colors.length];
      const r = 38 + Math.random() * 16;
      const x = (index === 0) ? W / 2 : W / 2 + (Math.random() * 240 - 120);
      return {
        x, y, r,
        orbitRadius: r + 42 + Math.random() * 12,
        orbitSpeed: (Math.random() > 0.5 ? 1 : -1) * (0.032 + Math.random() * 0.016),
        color1: pal[0],
        color2: pal[1],
        glow: pal[0],
        ring: Math.random() > 0.65,
        visited: index === 0
      };
    }

    function initWorld() {
      score = 0;
      cameraY = 0;
      particles = [];
      feathers = [];
      planets = [];
      document.getElementById('scoreVal').textContent = score;

      let currentY = H * 0.75;
      planets.push(createPlanet(0, currentY));

      for (let i = 1; i < 14; i++) {
        currentY -= (185 + Math.random() * 55);
        const p = createPlanet(i, currentY);
        planets.push(p);

        // Penas cósmicas no percurso
        if (Math.random() > 0.35) {
          feathers.push({
            x: p.x + (Math.random() * 100 - 50),
            y: p.y + 85,
            collected: false
          });
        }
      }

      owl.currentPlanet = planets[0];
      owl.angle = -Math.PI / 2;
      owl.orbitRadius = planets[0].orbitRadius;
      owl.orbitSpeed = planets[0].orbitSpeed;
      owl.vx = 0;
      owl.vy = 0;
      owl.trail = [];
    }

    function launchOwl() {
      if (state !== 'play') return;
      if (!owl.currentPlanet) return;

      playWingFlap();
      playOwlHoot(true);

      const speed = 12.8;
      owl.vx = -Math.sin(owl.angle) * speed * (owl.orbitSpeed > 0 ? 1 : -1);
      owl.vy = Math.cos(owl.angle) * speed * (owl.orbitSpeed > 0 ? 1 : -1);
      owl.currentPlanet = null;
      owl.isFlapping = true;

      // Rajada de penas e luz
      for (let i = 0; i < 14; i++) {
        particles.push({
          x: owl.x,
          y: owl.y,
          vx: (Math.random() - 0.5) * 6 - owl.vx * 0.25,
          vy: (Math.random() - 0.5) * 6 - owl.vy * 0.25,
          r: Math.random() * 4 + 2,
          c: Math.random() > 0.5 ? '#8b5cff' : '#38e8ff',
          life: 1
        });
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Enter') {
        e.preventDefault();
        if (state === 'play') launchOwl();
        else if (state === 'over' || state === 'menu') startGame();
      }
    });

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('#overlay') || e.target.closest('button')) return;
      if (state === 'play') launchOwl();
    });

    function startGame() {
      initWorld();
      state = 'play';
      sendEvent('game_start');
      document.getElementById('overlay').classList.remove('active');
      document.getElementById('hint').style.display = 'block';
    }

    function gameOver() {
      state = 'over';
      playSadHoot();
      bestScore = Math.max(bestScore, score);
      localStorage.setItem('kruuj_orbit_best', String(bestScore));
      document.getElementById('bestVal').textContent = bestScore;

      sendEvent('game_over', { score, bestScore });
      sendEvent('game_save', { saveData: { bestScore }, score });

      document.getElementById('ovTitle').textContent = 'FIM DE VOO!';
      document.getElementById('ovDesc').textContent = 'A corujinha se perdeu no espaço profundo. Mire na órbita do próximo planeta e pegue o impulso perfeito!';
      document.getElementById('ovScore').textContent = score;
      document.getElementById('ovBest').textContent = bestScore;
      document.getElementById('ovStats').style.display = 'flex';
      document.getElementById('btnPlay').textContent = 'VOAR DE NOVO 🦉';
      document.getElementById('overlay').classList.add('active');
      document.getElementById('hint').style.display = 'none';
    }

    // Desenha o Mascote KRUUJ animado (Coruja Oficial no Canvas)
    function drawOwlMascot(x, y, r, angle, isFlying) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle + Math.PI / 2);

      wingFlapAnim += 0.2;
      blinkTimer++;
      const isBlinking = (blinkTimer % 180) > 170;

      // Asas da Coruja (Batendo ativamente se estiver em voo livre)
      const wingSpread = isFlying ? Math.sin(wingFlapAnim) * 8 : 0;
      [-1, 1].forEach(side => {
        ctx.fillStyle = '#6d28d9';
        ctx.beginPath();
        ctx.ellipse(side * (r * 0.95 + wingSpread * 0.3), 2, 7 + Math.abs(wingSpread), 14, side * 0.3, 0, Math.PI * 2);
        ctx.fill();

        // Penas de destaque ciano na ponta das asas
        ctx.fillStyle = '#38e8ff';
        ctx.beginPath();
        ctx.ellipse(side * (r * 1.1 + wingSpread * 0.4), 6, 3, 6, side * 0.4, 0, Math.PI * 2);
        ctx.fill();
      });

      // Arco dos Fones de Ouvido Cibernéticos
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(0, 0, r + 2, Math.PI * 1.15, Math.PI * 1.85);
      ctx.stroke();

      // Almofadas dos Fones com LED Ciano Neon
      [-1, 1].forEach(side => {
        ctx.fillStyle = '#1e1b4b';
        ctx.strokeStyle = '#38e8ff';
        ctx.lineWidth = 2.5;
        ctx.shadowColor = '#38e8ff';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.ellipse(side * (r + 3), 0, 5, 9, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.shadowBlur = 0;
      });

      // Corpo da Coruja KRUUJ (Gradiente Roxo Cósmico)
      const grad = ctx.createRadialGradient(0, -4, 3, 0, 0, r);
      grad.addColorStop(0, '#8b5cff');
      grad.addColorStop(0.7, '#6d28d9');
      grad.addColorStop(1, '#3b0764');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fill();

      // Penas das Orelhinhas
      ctx.fillStyle = '#4c1d95';
      [-1, 1].forEach(side => {
        ctx.beginPath();
        ctx.moveTo(side * (r * 0.65), -r * 0.4);
        ctx.lineTo(side * (r * 0.75), -r * 1.35);
        ctx.lineTo(side * (r * 0.2), -r * 0.85);
        ctx.fill();
      });

      // Olhos Grandes e Expressivos
      if (!isBlinking) {
        [-1, 1].forEach(side => {
          // Esclera
          ctx.fillStyle = '#f8fafc';
          ctx.beginPath();
          ctx.arc(side * (r * 0.38), -r * 0.12, r * 0.36, 0, Math.PI * 2);
          ctx.fill();

          // Íris Âmbar Dourada KRUUJ
          ctx.fillStyle = '#ffb020';
          ctx.beginPath();
          ctx.arc(side * (r * 0.38), -r * 0.12, r * 0.25, 0, Math.PI * 2);
          ctx.fill();

          // Pupila
          ctx.fillStyle = '#0f172a';
          ctx.beginPath();
          ctx.arc(side * (r * 0.38), -r * 0.12, r * 0.14, 0, Math.PI * 2);
          ctx.fill();

          // Brilho Estelar no Olhar
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(side * (r * 0.38) - 2, -r * 0.12 - 2, r * 0.08, 0, Math.PI * 2);
          ctx.fill();
        });
      } else {
        // Olhinhos fechados fofos (Piscada)
        ctx.strokeStyle = '#ffb020';
        ctx.lineWidth = 2.5;
        [-1, 1].forEach(side => {
          ctx.beginPath();
          ctx.arc(side * (r * 0.38), -r * 0.08, r * 0.22, 0, Math.PI);
          ctx.stroke();
        });
      }

      // Bico Dourado Triangular
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.moveTo(-3, 2);
      ctx.lineTo(3, 2);
      ctx.lineTo(0, 9);
      ctx.fill();

      ctx.restore();
    }

    // Desenha a Pena Cósmica Coletável
    function drawGoldenFeather(x, y) {
      ctx.save();
      ctx.translate(x, y);
      ctx.shadowColor = '#ffb020';
      ctx.shadowBlur = 10;
      ctx.fillStyle = '#ffb020';
      ctx.beginPath();
      ctx.ellipse(0, 0, 5, 12, 0.3, 0, Math.PI * 2);
      ctx.fill();

      // Haste da pena
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(0, -10);
      ctx.lineTo(0, 10);
      ctx.stroke();
      ctx.restore();
    }

    // Loop
    function loop() {
      requestAnimationFrame(loop);

      ctx.fillStyle = '#07061a';
      ctx.fillRect(0, 0, W, H);

      // Atualização
      if (state === 'play') {
        if (owl.currentPlanet) {
          const p = owl.currentPlanet;
          owl.angle += owl.orbitSpeed;
          owl.x = p.x + Math.cos(owl.angle) * owl.orbitRadius;
          owl.y = p.y + Math.sin(owl.angle) * owl.orbitRadius;
        } else {
          owl.x += owl.vx;
          owl.y += owl.vy;

          owl.trail.push({ x: owl.x, y: owl.y, alpha: 0.8 });
          if (owl.trail.length > 20) owl.trail.shift();

          // Colisões e captura
          for (let p of planets) {
            const dx = owl.x - p.x;
            const dy = owl.y - p.y;
            const dist = Math.hypot(dx, dy);

            if (dist < p.r + owl.r) {
              gameOver();
              return;
            }

            if (dist <= p.orbitRadius + 20 && dist >= p.r + 10) {
              owl.currentPlanet = p;
              owl.orbitRadius = dist;
              owl.orbitSpeed = p.orbitSpeed;
              owl.angle = Math.atan2(dy, dx);
              owl.isFlapping = false;
              playOwlHoot(false);

              if (!p.visited) {
                p.visited = true;
                score += 10;
                document.getElementById('scoreVal').textContent = score;

                // Celebração
                for (let i = 0; i < 18; i++) {
                  particles.push({
                    x: owl.x, y: owl.y,
                    vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6,
                    r: Math.random() * 3 + 2, c: p.color1, life: 1
                  });
                }

                const lastP = planets[planets.length - 1];
                const nextY = lastP.y - (185 + Math.random() * 55);
                planets.push(createPlanet(planets.length, nextY));
              }
              break;
            }
          }

          // Coleta de penas
          for (let f of feathers) {
            if (!f.collected && Math.hypot(owl.x - f.x, owl.y - f.y) < owl.r + 14) {
              f.collected = true;
              score += 20;
              document.getElementById('scoreVal').textContent = score;
              playFeatherChime();
              for (let k = 0; k < 10; k++) {
                particles.push({
                  x: f.x, y: f.y,
                  vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.5) * 5,
                  r: 3, c: '#ffb020', life: 1
                });
              }
            }
          }

          if (owl.x < -120 || owl.x > W + 120 || owl.y > (cameraY + H + 120)) {
            gameOver();
            return;
          }
        }

        const targetCamY = owl.y - H * 0.65;
        cameraY += (targetCamY - cameraY) * 0.1;
      }

      // RENDERIZAÇÃO
      ctx.save();
      ctx.translate(0, -cameraY);

      // Estrelas de fundo
      stars.forEach(s => {
        ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.s, 0, Math.PI * 2);
        ctx.fill();
      });

      // Linha tracejada preditiva de mira quando está em órbita
      if (state === 'play' && owl.currentPlanet) {
        const tangentAngle = owl.angle + (owl.orbitSpeed > 0 ? Math.PI / 2 : -Math.PI / 2);
        ctx.strokeStyle = 'rgba(56, 232, 255, 0.4)';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 6]);
        ctx.beginPath();
        ctx.moveTo(owl.x, owl.y);
        ctx.lineTo(owl.x + Math.cos(tangentAngle) * 90, owl.y + Math.sin(tangentAngle) * 90);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // Planetas e seus anéis orbitais
      planets.forEach(p => {
        ctx.strokeStyle = p.visited ? 'rgba(56, 232, 255, 0.25)' : 'rgba(255, 255, 255, 0.12)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([6, 8]);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.orbitRadius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.shadowColor = p.glow;
        ctx.shadowBlur = 18;
        const g = ctx.createRadialGradient(p.x - p.r * 0.3, p.y - p.r * 0.3, p.r * 0.1, p.x, p.y, p.r);
        g.addColorStop(0, p.color1);
        g.addColorStop(1, p.color2);
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        if (p.ring) {
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.ellipse(p.x, p.y, p.r * 1.5, p.r * 0.35, 0.3, 0, Math.PI * 2);
          ctx.stroke();
        }
      });

      // Penas Cósmicas
      feathers.forEach(f => {
        if (!f.collected) drawGoldenFeather(f.x, f.y);
      });

      // Rastro da coruja
      owl.trail.forEach(t => {
        ctx.fillStyle = `rgba(56, 232, 255, ${t.alpha})`;
        ctx.beginPath();
        ctx.arc(t.x, t.y, 7 * t.alpha, 0, Math.PI * 2);
        ctx.fill();
        t.alpha -= 0.04;
      });

      // Partículas
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life -= 0.03;
        if (pt.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.fillStyle = pt.c;
        ctx.globalAlpha = pt.life;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.r * pt.life, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      // Mascote KRUUJ animado
      if (state === 'play') {
        const angle = owl.currentPlanet ? owl.angle : Math.atan2(owl.vy, owl.vx);
        drawOwlMascot(owl.x, owl.y, owl.r, angle, !owl.currentPlanet);
      }

      ctx.restore();
    }

    loop();
  </script>
</body>
